        resultsEl.innerHTML = `<div class="sub">You're already tracking ${TRACKED_TRAIN_MAX} trains — remove one from the list below before adding another.</div>`;
        return;
      }
      const fromLabel = fromPicker.getName() || fromCrs;
      resultsEl.innerHTML = `<div class="sub">Searching…</div>`;
      try{
        const services = await fetchDebugBoard(fromCrs, toCrs);
        if (services.length === 0){
          resultsEl.innerHTML = `<div class="sub">No live services found for that station right now.</div>`;
          return;
        }
        resultsEl.innerHTML = services.slice(0, 15).map(s => {
          // Darwin's board here is combined arrivals+departures: a result
          // can be a service that departs FROM the searched station
          // (has std), or one that only arrives there — e.g. terminates
          // there — which has no std at all, only sta. Treating the
          // searched station as "the origin" regardless produced results
          // like "Manchester Victoria → Manchester Victoria" for a train
          // actually arriving there from Clitheroe. origin/destination
          // are always both present on the service itself no matter
          // which kind of board entry this is, so those — not which
          // station was searched from — are what determine the label.
          const departsHere = !!s.std;
          const origin = departsHere ? fromLabel : ((s.origin && s.origin[0] && s.origin[0].locationName) || '?');
          const dest = departsHere ? ((s.destination && s.destination[0] && s.destination[0].locationName) || '?') : fromLabel;
          const time = departsHere ? (s.std || '?') : (s.sta || s.eta || '?');
          // For an arrival-only record, `time` is when it arrives at
          // `dest`, not when it departs `origin` — spelled out in full
          // now rather than the more compact arrow format used for a
          // genuine departure, so it can't be misread as one. (The title
          // shown after actually tapping into one of these no longer
          // reuses this text either way — it's rebuilt from the real
          // calling points once they're available — but this is still
          // what's visible here in the results list itself.)
          const descriptionText = departsHere
            ? `Departure from ${origin} to ${dest}`
            : `Arrival at ${dest} from ${origin}`;
          const displayText = `${time} ${descriptionText}`;
          const liveField = departsHere ? s.etd : (s.eta || s.ata);
          const statusText = (!liveField || liveField === 'On time') ? 'On time' : liveField;
          // Three columns (time / description / status) rather than the
          // usual two — this description is a full sentence and can run
          // to two lines on a narrow phone screen, and a plain two-column
          // flex row put the status off awkwardly to the side of the
          // wrapped text rather than pinned cleanly to the top. Grid with
          // top alignment keeps time and status both anchored to the
          // first line regardless of how many lines the description
          // itself wraps to.
          return `<div class="rail-detail-row" data-debug-service-id="${s.serviceID}" data-debug-label="${escapeHtml(displayText)}" data-debug-from="${fromCrs}" style="display:grid; grid-template-columns:44px 1fr auto; column-gap:8px; align-items:start; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">
            <span style="color:var(--ink-dim); white-space:nowrap;">${escapeHtml(time)}</span>
            <span>${escapeHtml(descriptionText)}</span>
            <span style="color:var(--ink-dim); text-align:right; white-space:nowrap;">${escapeHtml(statusText)} ›</span>
          </div>`;
        }).join('');
        wireAddFormResultRows();
      }catch(e){
        resultsEl.innerHTML = `<div class="sub" style="color:#ff8b7e;">Search failed: ${escapeHtml(e.message)}</div>`;
      }
    });
  }

  function switchTab(tab){
    activeSubTab = tab;
    styleTabs();
    if (tab === 'yours') renderYoursTab();
    else renderTrackedTab();
  }

  tabYoursBtn.addEventListener('click', () => switchTab('yours'));
  tabTrackedBtn.addEventListener('click', () => switchTab('tracked'));
  styleTabs();
  switchTab(activeSubTab);

  document.getElementById('live-screen-close-btn').addEventListener('click', () => {
    if (overlay.isConnected) overlay.remove();
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay && overlay.isConnected) overlay.remove(); });
}

// Builds the "where is this train now" timeline: every calling point in
// order, with a marker showing roughly where the train sits between the
// last-passed and next-due point, and any delay/cancellation reason
// shown alongside the relevant station. This is deliberately a simple
// ordered list, not a geographic map — no station coordinates needed
// beyond what Darwin already tells us about calling order and timing.
// Works out a plain-language status for one calling point, using
// whatever Darwin actually gave us — a literal status word ("On time",
// "Delayed", "Cancelled") or a specific time to compare against schedule.
function describePointStatus(schedTime, liveTime, isCancelled){
  if (isCancelled) return { text: 'Cancelled', color: '#ff8b7e', minutesLate: null, minutesEarly: 0, confirmed: true };
  // No live time at all, or it's identical to schedule because that's
  // literally what got used as the fallback — this is the one case where
  // we genuinely don't know anything, as opposed to every branch below,
  // where Darwin gave us something real (even if just a status word).
  if (!liveTime || liveTime === schedTime) return { text: 'On time', color: 'var(--good)', minutesLate: 0, minutesEarly: 0, confirmed: false };
  if (liveTime === 'On time') return { text: 'On time', color: 'var(--good)', minutesLate: 0, minutesEarly: 0, confirmed: true };
  if (liveTime === 'Delayed') return { text: 'Delayed', color: '#ff8b7e', minutesLate: null, minutesEarly: 0, confirmed: true };
  if (!liveTime.includes(':')) return { text: liveTime, color: 'var(--ink-dim)', minutesLate: null, minutesEarly: 0, confirmed: true };
  // A live time with no scheduled time to compare against — Darwin has
  // occasionally been seen to omit it on a given poll for a given point.
  // Show what we've got rather than crashing the whole refresh over it.
  if (!schedTime || !schedTime.includes(':')) return { text: liveTime, color: 'var(--ink-dim)', minutesLate: null, minutesEarly: 0, confirmed: true };

  const schedMins = parseInt(schedTime.slice(0,2),10)*60 + parseInt(schedTime.slice(3,5),10);
  const liveMins = parseInt(liveTime.slice(0,2),10)*60 + parseInt(liveTime.slice(3,5),10);
  let diff = liveMins - schedMins;
  // Both times are bare clock values with no date attached, so a point
  // that genuinely crosses midnight (scheduled 23:58, actual 00:01)
  // produces a huge, nonsensical raw difference. No real single-point
  // delay or early-running figure is ever going to be anywhere near 12
  // hours, so treat a difference bigger than that as a midnight wrap and
  // fold it back to the smallest equivalent difference instead.
  if (diff > 720) diff -= 1440;
  else if (diff < -720) diff += 1440;
  if (diff === 0) return { text: 'On time', color: 'var(--good)', minutesLate: 0, minutesEarly: 0, confirmed: true };
  if (diff < 0){
    // Genuinely left ahead of schedule — rare, but worth calling out
    // distinctly rather than folding into "on time", since an early
    // departure is the one case where that label could actively mislead
    // someone who isn't already on the platform.
    return { text: `${Math.abs(diff)} min early`, color: '#7fb8e0', minutesLate: 0, minutesEarly: Math.abs(diff), confirmed: true };
  }
  return { text: `${diff} min late`, color: '#ff8b7e', minutesLate: diff, minutesEarly: 0, confirmed: true };
}

// Remembers the last genuinely CONFIRMED status Darwin gave for a given
// point on a given service, and falls back to it whenever a later poll
// omits the live field entirely. Darwin doesn't reliably repeat a live
// time on every single poll for every point — without this, a point
// that's already been confirmed (delayed, early, or on time) could
// silently regress back to looking unconfirmed the moment one poll
// happens to leave the field blank, even though nothing about the
// train's actual status changed. Confirmed data always overwrites the
// cache immediately, so a genuine change (delay easing off, or getting
// worse) is never held back by this — only a gap in reporting is.
// In-memory only, for the lifetime of the page — same tradeoff already
// accepted for the weather cache further down. That also means it can't
// retroactively fix a point that's already regressed in an
// already-open session before this existed; it needs to observe one
// more real confirmation to start protecting a point from then on.
// Persisted (see loadData/saveConfirmedPointStatusCache below) so it
// survives the app actually being closed and reopened, not just staying
// alive within one page session. Lifetime is deliberately tied to
// trackedTrains' own lifecycle (pruned in saveTrackedTrains, right
// alongside the same 6-hour age-based expiry it already uses) rather
// than to the calendar day — trackedTrains itself has a separate
// day-boundary clear that runs at app-load time, which is a real,
// pre-existing gap for a train tracked before midnight and still
// genuinely running after it (flagged for the backlog, not fixed here).
// Piggybacking a fresh midnight check onto this cache would only
// reproduce that same problem a second time, so this deliberately
// doesn't add one — an entry lives exactly as long as its tracked train
// does, on elapsed time and explicit removal only.
let confirmedPointStatusCache = new Map(); // `${serviceId}|${pointKey}` -> last confirmed describePointStatus() result

// Discards any cached point statuses whose service is no longer in
// trackedTrains — called from saveTrackedTrains() so this always stays
// in step with however that list already decided to shrink, whether
// that's the explicit remove button, the 5-item cap evicting the
// oldest, or its own 6-hour age filter. Never adds its own expiry
// logic on top; it only ever mirrors trackedTrains' current contents.
function pruneConfirmedPointStatusCache(){
  const liveServiceIds = new Set(trackedTrains.map(t => t.serviceId));
  for (const cacheKey of Array.from(confirmedPointStatusCache.keys())){
    const serviceId = cacheKey.slice(0, cacheKey.indexOf('|'));
    if (!liveServiceIds.has(serviceId)) confirmedPointStatusCache.delete(cacheKey);
  }
}
async function saveConfirmedPointStatusCache(){
  try{ localStorage.setItem('confirmed-point-status-cache', JSON.stringify(Array.from(confirmedPointStatusCache.entries()))); }
  catch(e){ /* save failed silently; will retry next change */ }
}


function describePointStatusRemembered(serviceId, pointKey, schedTime, liveTime, isCancelled){
  const status = describePointStatus(schedTime, liveTime, isCancelled);
  if (isCancelled || !serviceId || !pointKey) return status; // cancellation is unambiguous either way; no key to remember against
  const cacheKey = `${serviceId}|${pointKey}`;
  if (status.confirmed){
    confirmedPointStatusCache.set(cacheKey, status);
    return status;
  }
  const remembered = confirmedPointStatusCache.get(cacheKey);
  return remembered || status;
}

// Adds a number of minutes to an "HH:MM" string, wrapping correctly
// across midnight — used to infer a real time for an already-passed
// point that Darwin only gave a generic "On time" word for, despite the
// service clearly running late overall.
function addMinutesToTime(hhmm, mins){
  if (!hhmm || !hhmm.includes(':')) return null;
  const [h, m] = hhmm.split(':').map(Number);
  const total = ((h * 60 + m + mins) % 1440 + 1440) % 1440;
  const nh = Math.floor(total / 60), nm = total % 60;
  return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
}

const TRAIN_PROGRESS_ROW_HEIGHT = 54; // px — a sensible minimum row height; actual positioning now measures real rendered rows, not this value

function buildTrainProgress(train, service, showRawDebug, showAllReasons){
  const now = new Date();

  function pointsFrom(arr){
    return (arr && arr[0] && arr[0].callingPoint) ? arr[0].callingPoint : [];
  }
  const before = pointsFrom(service.previousCallingPoints).map(cp => ({
    locationName: cp.locationName,
    schedTime: cp.st,
    liveTime: cp.at || cp.et || cp.st,
    isCancelled: !!cp.isCancelled,
    reason: cp.delayReason || cp.cancelReason || null,
    platform: cp.platform || null,
    crs: cp.crs || null,
    hasConfirmedActual: !!cp.at,
    raw: { st: cp.st, at: cp.at, et: cp.et },
  }));
  // Whichever side of this station is actually relevant to the wider
  // journey — departure if the service carries on from here (the usual
  // case for a station you're tracking from), arrival if this is
  // actually the far end of the service you searched for (the "?"
  // origin case fixed earlier, where the searched station turns out to
  // be someone's destination, not their origin). Checked the same way
  // as everywhere else: real confirmed time first (atd/ata), estimate
  // second, schedule last — this station previously only ever checked
  // the estimate, so a point that had already been genuinely confirmed
  // could still show as unconfirmed if Darwin stopped repeating the
  // estimate once the real time was known (a common Darwin pattern).
  // (A side-by-side arrival+departure display was tried here briefly,
  // but reverted — Darwin only ever gives one time per ordinary calling
  // point, departure-only or arrival-only depending on position, so
  // showing both would only ever be possible for this one row and
  // nowhere else in the list, which read as inconsistent rather than
  // useful. This single governing status remains correctly atd/ata-
  // aware either way.)
  const departsHere = !!(service.std || service.etd || service.atd);
  const hereSchedTime = departsHere ? service.std : service.sta;
  const hereLiveTime = departsHere ? (service.atd || service.etd || service.std) : (service.ata || service.eta || service.sta);
  const here = [{
    locationName: (STATION_COORDS[train.fromLoc] && STATION_COORDS[train.fromLoc].name) || stationNameForCrs(train.fromLoc) || train.fromLoc,
    schedTime: hereSchedTime,
    liveTime: hereLiveTime,
    isCancelled: !!service.isCancelled,
    reason: service.delayReason || service.cancelReason || null,
    isYourStation: true,
    platform: service.platform || null,
    crs: train.fromLoc || null,
    hasConfirmedActual: !!(departsHere ? service.atd : service.ata),
    raw: { std: service.std, sta: service.sta, etd: service.etd, eta: service.eta, atd: service.atd, ata: service.ata },
  }];
  const after = pointsFrom(service.subsequentCallingPoints).map(cp => ({
    locationName: cp.locationName,
    schedTime: cp.st,
    // Darwin's before/after split is fixed relative to the station you
    // queried from, not to real time — a point can sit in "subsequent"
    // and still be genuinely already passed once enough time's gone by,
    // so check for a real confirmed actual time first, same as "before".
    liveTime: cp.at || cp.et || cp.st,
    isCancelled: !!cp.isCancelled,
    reason: cp.delayReason || cp.cancelReason || null,
    platform: cp.platform || null,
    crs: cp.crs || null,
    hasConfirmedActual: !!cp.at,
    raw: { st: cp.st, at: cp.at, et: cp.et },
  }));
  const points = [...before, ...here, ...after];
  // Darwin attaches one reason to a service and doesn't seem to clear or
  // refresh it as the journey continues — a reason first seen on an
  // early cancelled point can still be sitting there hours and hundreds
  // of miles later, long after it's stopped being the genuine cause of
  // anything current. Track which reasons belong to cancelled points so
  // they can be recognised as inherited boilerplate rather than treated
  // as a fresh explanation for the service's current running status.
  // Darwin phrases the same underlying cause differently depending on
  // whether the specific point is cancelled ("cancelled because of X")
  // or merely delayed ("delayed by X") — comparing full sentences misses
  // the match entirely, so strip the standard prefixes down to just the
  // actual cause before comparing.
  function normalizeReason(reason){
    if (!reason) return null;
    return reason
      .replace(/^This service (has been|was)\s*(cancelled because of|delayed by|delayed because of|cancelled due to|delayed due to)\s*/i, '')
      .trim()
      .toLowerCase();
  }
  const inheritedReasons = new Set(points.filter(p => p.isCancelled && p.reason).map(p => normalizeReason(p.reason)));

  // The best available time for each point — a real timestamp if Darwin
  // gave us one, falling back to the scheduled time if it only gave a
  // status word ("On time"/"Delayed") rather than an actual time. Used
  // for display.
  function bestTime(p){
    return (p.liveTime && p.liveTime.includes(':')) ? p.liveTime : p.schedTime;
  }
  // For inferring which calendar day each point falls on, always use the
  // *scheduled* time rather than bestTime(). A live time reflects how
  // delayed a point is — but a cancelled point typically has no live
  // estimate at all and falls back to its own untouched scheduled time.
  // Comparing those two side by side (a delayed real point vs. a
  // cancelled point's un-delayed schedule time) can make the schedule
  // look like it's gone backwards even on an ordinary same-day service,
  // which the midnight-rollover logic below misreads as having crossed
  // into the next day. The timetable itself — not how late a train is
  // running — is what actually determines which calendar day a point
  // belongs to, so date inference is kept on a consistent basis.
  function scheduleTime(p){
    return p.schedTime || bestTime(p);
  }
  // A point showing a delay (a specific figure, or the literal "Delayed"
  // flag) that Darwin hasn't actually confirmed happened yet — no real
  // at/atd/ata behind it. Shared by the "not yet departed/arrived" pill,
  // the walkback that keeps the blob from advancing through such a
  // point, and the summary's "currently at" vs "currently between"
  // wording — one signal, not three separately-maintained copies of the
  // same condition drifting apart from each other over time. Deliberately
  // leaves a plain unconfirmed on-time point alone (liveTime falling
  // back to schedTime, or the literal "On time") — Darwin very often
  // never sends a real actual time even for a point that's clearly
  // already happened, and flagging every such point would be flagging
  // most of an ordinary journey.
  function isGenuinelyUnconfirmedDelay(p){
    return !p.hasConfirmedActual && !p.isCancelled && !!p.liveTime && p.liveTime !== p.schedTime && p.liveTime !== 'On time';
  }
  const pointDates = points.map(p => liveTimeToDate((scheduleTime(p) || '').replace(':', ''), now));
  // The very first point has no earlier point to roll forward from, so it
  // needs its own inference: a bare clock time could plausibly belong to
  // yesterday, today, or tomorrow relative to right now — pick whichever
  // is actually closest. Without this, viewing an overnight service
  // shortly after midnight would anchor its pre-midnight first point to
  // tonight (many hours in the future) instead of correctly recognising
  // it as last night (a few minutes in the past).
  if (pointDates[0]){
    const hhmm = (scheduleTime(points[0]) || '').replace(':', '');
    if (hhmm.length >= 4){
      const closest = closestDateForTime(hhmm, now);
      if (closest) pointDates[0] = closest;
    }
  }
  // A journey can cross midnight partway through (e.g. departs 23:58,
  // still calling at stations after 00:01 the next day). Every point is
  // otherwise built against the same calendar day as "now", so an
  // early-morning point would look like it already happened hours ago
  // today, rather than genuinely being later tonight — which is exactly
  // what made an unstarted journey look fully arrived. Points are always
  // in chronological order, so any date that's not genuinely later than
  // the one before it must actually belong to the next day.
  for (let i = 1; i < pointDates.length; i++){
    if (pointDates[i] && pointDates[i-1] && pointDates[i] <= pointDates[i-1]){
      pointDates[i] = new Date(pointDates[i].getTime() + 24*60*60*1000);
    }
  }

  let lastPassedIdx = -1;
  // A second set of dates, used only from here on for "has this point
  // actually been reached" — pointDates above stays exactly as it was,
  // schedule-only, since that's what correctly handles day inference
  // and the midnight-crossing fix. This one inherits each point's
  // already-correctly-inferred calendar day from pointDates (no new day
  // inference of its own — reusing that logic is exactly the risk this
  // was deferred twice to avoid), and swaps in each point's live time
  // of day (confirmed actual, then estimate, then schedule) in place of
  // the pure schedule time. A badly delayed point's *scheduled* time
  // can pass long before the train genuinely does — Preston scheduled
  // 17:18, only estimated for 17:23 with no confirmed departure at all,
  // is a real case this was checked against directly.
  const liveDates = points.map((p, i) => {
    if (!pointDates[i]) return null;
    const raw = (p.liveTime && p.liveTime.includes(':')) ? p.liveTime : scheduleTime(p);
    const hhmm = (raw || '').replace(':', '');
    if (hhmm.length < 4) return pointDates[i];
    const h = parseInt(hhmm.slice(0,2), 10), m = parseInt(hhmm.slice(2,4), 10);
    if (isNaN(h) || isNaN(m)) return pointDates[i];
    const d = new Date(pointDates[i]);
    d.setHours(h, m, 0, 0);
    return d;
  });
  liveDates.forEach((t, i) => { if (t && t <= now) lastPassedIdx = i; });
  // The comparison above has no concept of "cancelled", or of Darwin's
  // explicit "Delayed" flag — genuinely different from having no data at
  // all, since it means the departure/arrival time is actively unknown
  // rather than just running some estimatable number of minutes late.
  // Left to scheduled-time comparison alone:
  // - a cancelled point's own scheduled time is no longer meaningful
  //   once the service never actually reached it, but bestTime() still
  //   falls back to it when there's no real time to use instead — this
  //   would let lastPassedIdx keep advancing through every remaining
  //   cancelled point's original slot as real time passes them,
  //   eventually landing on the booked destination even though the
  //   train genuinely stopped much earlier.
  // - a "Delayed" point's schedule time having elapsed can't
  //   distinguish "left a minute late" from "still sitting at the
  //   platform 20 minutes on" — assuming the schedule still held would
  //   show the train partway to the next stop it may never have
  //   actually left for.
  // Both cases mean the same thing here: don't trust this point as
  // "reached", walk back to the true last point genuinely confirmed —
  // all the way to -1 (giving the correct "Not yet departed" state) if
  // every point up to and including the very first is affected.
  // Cancelled, or showing a delay Darwin hasn't actually confirmed yet
  // (no genuine at/atd/ata — the same signal the "not yet departed" pill
  // uses) — walked back past either way, since neither is safe to treat
  // as "this point has genuinely been reached". The old version of this
  // only caught the literal "Delayed" flag; a specific delayed estimate
  // like "et=10:17" is a real HH:MM value, not that literal string, so
  // it slipped through untouched — the point got counted as reached the
  // moment its *estimate* passed, even with nothing confirmed behind it.
  // A plain unconfirmed on-time point is deliberately left alone here —
  // Darwin very often never sends a real "at" even once a point has
  // clearly already happened, and treating every such point as unsafe
  // would stop the blob advancing through most of an ordinary journey.
  while (lastPassedIdx >= 0 && (
    points[lastPassedIdx].isCancelled || isGenuinelyUnconfirmedDelay(points[lastPassedIdx])
  )){
    lastPassedIdx--;
  }

  // How far between the last-passed and next-due point we are right now,
  // as a plain fraction of the scheduled gap between them — the same
  // "50% of the way there" maths regardless of how long that gap is.
  // Rows now vary in real rendered height (the delay-reason text can wrap
  // onto extra lines), so the actual pixel position is measured from the
  // real DOM after rendering rather than assumed from a fixed row height
  // — this fraction is just "how far between these two points", applied
  // to real measurements by positionBlobAndLine().
  let fraction = 0;
  if (lastPassedIdx >= 0 && lastPassedIdx < points.length - 1 && !points[lastPassedIdx + 1].isCancelled){
    const t1 = liveDates[lastPassedIdx], t2 = liveDates[lastPassedIdx + 1];
    if (t1 && t2 && t2 > t1){
      fraction = Math.max(0, Math.min(1, (now - t1) / (t2 - t1)));
    }
  }

  let summaryHtml = '';
  let primaryReason = null;
  let knownOverallDelay = 0; // the most reliable delay figure we have, in minutes — used both for the summary headline and to infer real times for passed points Darwin only gave a generic "On time" word for
  let anyReasonSuppressed = false; // true if a reason was hidden by the staleness heuristic or the repeat-dedup — drives the "Show all reasons" reveal link
  let journeyFinished = !!service.isCancelled; // true once there's genuinely nothing left to poll for — arrived at the booked destination, terminated early with everything remaining cancelled, or the whole service has been cancelled outright
  if (lastPassedIdx >= 0){
    const last = points[lastPassedIdx];
    const status = describePointStatusRemembered(service.serviceID, last.crs || `idx-${lastPassedIdx}`, last.schedTime, last.liveTime, last.isCancelled);
    const afterLast = points[lastPassedIdx + 1];
    const remaining = points.slice(lastPassedIdx + 1);
    // "Terminated early" — every remaining booked calling point has been
    // cancelled, meaning the train stops here and won't reach its real
    // destination (or the last-passed point itself was cancelled, an
    // edge case that amounts to the same thing).
    const terminatedEarly = (remaining.length > 0 && remaining.every(p => p.isCancelled)) || (!afterLast && last.isCancelled);

    if (terminatedEarly){
      journeyFinished = true;
      const finalPoint = points[points.length - 1];
      const locLine = `Terminated at ${last.locationName}`;
      const statusLine = (finalPoint && finalPoint.locationName !== last.locationName) ? `Did not continue to ${finalPoint.locationName}` : '';
      summaryHtml = `<div>${locLine}</div>${statusLine ? `<div style="font-size:12px; margin-top:4px; opacity:0.9;">${statusLine}</div>` : ''}`;
    } else if (!afterLast){
      journeyFinished = true;
      // Genuinely reached the final booked destination — no "running",
      // the journey's over.
      const arrivalText = status.minutesLate === null ? status.text : (status.minutesLate > 0 ? `${status.minutesLate} min late` : 'On time');
      summaryHtml = `<div>Arrived at ${last.locationName}</div><div style="font-size:12px; margin-top:4px; opacity:0.9;">${arrivalText}</div>`;
    } else {
      // Darwin sometimes only attaches a specific recalculated number to
      // some points and not others on a given poll, leaving nearby
      // points showing a generic "On time" word even when a delay
      // reason is clearly attached to them. Rather than trust whichever
      // point happens to be "last passed" (which might only have that
      // generic word) — or only check the far final destination, which
      // may not have a specific number yet either — scan forward through
      // every remaining point for the first one with a real confirmed
      // figure, since a nearby point is far more likely to have current
      // data than a still-distant one.
      // The next point ahead is Darwin's freshest, most current read on
      // how the service is running — the last-passed point's figure is
      // already history and won't be revised further once it's actually
      // happened. Prefer the next point's number when it has a real one,
      // rather than defaulting to whatever the passed point locked in.
      let overallStatus = status;
      const afterLastStatus = describePointStatus(afterLast.schedTime, afterLast.liveTime, afterLast.isCancelled);
      if (afterLastStatus.minutesLate !== null && afterLastStatus.minutesLate > 0){
        overallStatus = afterLastStatus;
      } else if (afterLastStatus.confirmed && afterLastStatus.text === 'Delayed'){
        // The current point can be genuinely, correctly confirmed "on
        // time" while the very next point has already been flagged
        // Delayed — that's new information the current point's own
        // status has no way to reflect yet, since it happened
        // afterward. "Delayed" carries no minutes-late number, so the
        // check above (which only reacts to a positive figure) was
        // silently ignoring it entirely — confirmed live against a real
        // Heathrow Express service showing "Running on time" while the
        // very next point was clearly Delayed.
        overallStatus = afterLastStatus;
      } else if (overallStatus.minutesLate === null || (overallStatus.minutesLate === 0 && !overallStatus.confirmed)){
        // Genuinely confirmed on time (or early) at the current point is
        // real, current information — not the same as having no data.
        // The scan below exists to find a usable figure when there's
        // truly nothing to go on (unconfirmed "Delayed", or no live time
        // at all yet), but it was also firing whenever the current point
        // had *resolved back* to on time, walking back through the
        // entire already-passed journey for the first old delay it could
        // find — e.g. reporting a 2-minute delay from Wigan as the
        // train's current status long after Preston, Lancaster and
        // Oxenholme had all confirmed it back on schedule. Only search
        // when there's actually nothing confirmed to trust instead.
        // Neither the passed point nor the very next one has a usable
        // figure — scan further ahead, then behind, for the first real
        // confirmed number anywhere in the journey.
        for (const candidate of points.slice(lastPassedIdx + 1)){
          const candidateStatus = describePointStatus(candidate.schedTime, candidate.liveTime, candidate.isCancelled);
          if (candidateStatus.minutesLate !== null && candidateStatus.minutesLate > 0){
            overallStatus = candidateStatus;
            break;
          }
        }
        if (overallStatus.minutesLate === null || overallStatus.minutesLate === 0){
          for (let j = lastPassedIdx - 1; j >= 0; j--){
            const candidateStatus = describePointStatus(points[j].schedTime, points[j].liveTime, points[j].isCancelled);
            if (candidateStatus.minutesLate !== null && candidateStatus.minutesLate > 0){
              overallStatus = candidateStatus;
              break;
            }
          }
        }
      }
      let runningText;
      if (overallStatus.minutesLate === null){
        runningText = overallStatus.text;
      } else if (overallStatus.minutesLate > 0){
        runningText = `Running ${overallStatus.minutesLate} min late`;
      } else if (overallStatus === status && status.minutesEarly > 0){
        runningText = `Running ${status.minutesEarly} min early`;
      } else {
        runningText = 'Running on time';
      }
      if (overallStatus.minutesLate > 0) knownOverallDelay = overallStatus.minutesLate;
      // Three separate lines — where it is, its status, and why (if
      // known) — rather than one long line that wraps awkwardly with
      // longer station names.
      const rawReason = last.reason || (afterLast && afterLast.reason) || null;
      // Only trust this as a genuine current explanation if it isn't
      // just carried-over text from an earlier cancellation elsewhere in
      // the journey — unless the current point is itself cancelled, in
      // which case it's directly relevant again. showAllReasons bypasses
      // this entirely as a manual override, since the heuristic can be
      // wrong on the rare service where the same cause genuinely never
      // stops being relevant.
      const wouldSuppress = rawReason && !last.isCancelled && !afterLast.isCancelled && inheritedReasons.has(normalizeReason(rawReason));
      if (wouldSuppress) anyReasonSuppressed = true;
      primaryReason = (rawReason && (showAllReasons || !wouldSuppress)) ? rawReason : null;
      summaryHtml = `<div>Currently between ${last.locationName} and ${afterLast.locationName}</div>` +
        `<div style="font-size:12px; margin-top:4px; opacity:0.9;">${runningText}</div>` +
        (primaryReason ? `<div style="font-size:12px; margin-top:4px; opacity:0.85;">${primaryReason}</div>` : '');
    }
  } else if (points.length){
    summaryHtml = `Not yet departed ${points[0].locationName}`;
  }

  // Tracks whichever reason was most recently actually shown, in row
  // order — starts as primaryReason (already shown once in the summary
  // box), then updates as we go, so a whole run of consecutively
  // cancelled points sharing the same reason collapses to showing it
  // only on the first one, not repeated down the entire list.
  let lastShownReason = primaryReason;

  // Indices for the two visual treatments below — computed once here
  // rather than re-derived per row. toLocIdx only ever resolves when
  // train.toLoc is genuinely set (a "My Trains" configured route) —
  // for anything else (a search-tracked or arrival-only entry), there's
  // no defined "my journey" segment to highlight at all, so both stay
  // switched off entirely rather than guessing at one.
  const hereIdx = points.findIndex(p => p.isYourStation);
  const toLocIdx = train.toLoc ? points.findIndex(p => p.crs === train.toLoc) : -1;
  const rowsHtml = points.map((p, i) => {
    try{
      const isToLocRow = toLocIdx !== -1 && i === toLocIdx;
      const inMyJourney = toLocIdx !== -1 && hereIdx !== -1 && i >= Math.min(hereIdx, toLocIdx) && i <= Math.max(hereIdx, toLocIdx);
      // A separator wherever the journey crosses into a new calendar
      // day — matches National Rail's own presentation. pointDates is
      // already correctly day-aware (built for the midnight-crossing
      // fix), so this is just comparing each point's real date to the
      // one before it; no new date logic needed.
      const daySeparator = (i > 0 && pointDates[i] && pointDates[i-1] && pointDates[i].toDateString() !== pointDates[i-1].toDateString())
        ? `<div style="text-align:center; font-size:11.5px; color:var(--amber); padding:8px 0; border-bottom:1px solid var(--line); margin-left:6px;">${pointDates[i].toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'})}</div>`
        : '';
      const status = describePointStatusRemembered(service.serviceID, p.crs || `idx-${i}`, p.schedTime, p.liveTime, p.isCancelled);
      const nameColor = (p.isYourStation || isToLocRow) ? 'var(--amber)' : 'var(--ink)';
      // The reason text often stays attached even once a point's own
      // status has recovered to genuinely on time — show it whenever
      // there's real uncertainty or an actual problem, but not once a
      // point has positively confirmed it's back on time. Also skip it
      // if it's the same reason already shown on the row immediately
      // before it (or in the summary box) — no need to repeat it over
      // and over down a whole run of affected stations. And skip it if
      // it's boilerplate inherited from an earlier cancellation rather
      // than a fresh explanation — unless this row is itself cancelled,
      // in which case it's directly relevant again.
      const isStaleReason = !p.isCancelled && inheritedReasons.has(normalizeReason(p.reason));
      const showReason = !!p.reason && status.minutesLate !== 0 && (showAllReasons || (p.reason !== lastShownReason && !isStaleReason));
      if (p.reason) lastShownReason = p.reason;
      const reasonHtml = showReason ? `<div style="font-size:11.5px; color:#ff8b7e; margin-top:1px;">${p.reason}</div>` : '';
      // Cross out the scheduled time and show the real one whenever
      // Darwin gave a genuine specific delayed time (not just a status
      // word) — same idea as Avanti's own calling-points view.
      const hasRealTime = p.liveTime && p.liveTime.includes(':') && p.liveTime !== p.schedTime;
      // For an already-passed point that Darwin only gave a generic "On
      // time" word for, despite the service clearly running late overall
      // — infer a rough real time from the known overall delay, clearly
      // marked as an estimate rather than presented as confirmed data.
      const isInferred = !hasRealTime && !status.confirmed && i <= lastPassedIdx && status.minutesLate === 0 && knownOverallDelay > 0 && !p.isCancelled;
      const inferredTime = isInferred ? addMinutesToTime(p.schedTime, knownOverallDelay) : null;
      // A passed point Darwin never gave real data for (the Crewe-origin
      // limitation), but with no known overall delay elsewhere to infer a
      // real time from — e.g. the rest of the journey has since recovered
      // to on time. Still genuinely unconfirmed, so it must not fall
      // through to look identical to a point Darwin actively confirmed —
      // that's the bug where Crewe silently flipped from "estimated" to
      // plain green "On time" once the later delay cleared, even though
      // Darwin's data for Crewe itself never changed.
      const isUnconfirmedOnTime = !hasRealTime && !isInferred && !status.confirmed && i <= lastPassedIdx && status.minutesLate === 0 && !p.isCancelled;

      let timeHtml, statusText, statusColor;
      if (hasRealTime){
        timeHtml = `<span style="text-decoration:line-through; color:var(--ink-dim); font-size:11.5px;">${p.schedTime || ''}</span><br/><span style="color:${status.color}; font-weight:600;">${p.liveTime}</span>`;
        statusText = status.text;
        statusColor = status.color;
      } else if (isInferred && inferredTime){
        timeHtml = `<span style="text-decoration:line-through; color:var(--ink-dim); font-size:11.5px;">${p.schedTime || ''}</span><br/><span style="color:#e8935f; font-style:italic;">~${inferredTime}</span>`;
        statusText = `~${knownOverallDelay} min late (estimated)`;
        statusColor = '#e8935f';
      } else if (isUnconfirmedOnTime){
        timeHtml = p.schedTime || '';
        statusText = 'On time (estimated)';
        statusColor = '#e8935f';
      } else {
        timeHtml = p.schedTime || '';
        statusText = status.text;
        statusColor = status.color;
      }
      const platformText = p.platform ? ` <span style="color:var(--ink-dim);">· Platform ${p.platform}</span>` : '';
      // A specific delay figure (or the literal "Delayed" flag) is
      // sometimes shown for a point whose actual departure/arrival
      // hasn't been confirmed by Darwin at all yet (raw at/atd/ata still
      // blank) — genuinely still just a live estimate, even once its own
      // due moment has passed, not a settled fact. Flagged explicitly
      // rather than left looking as definitive as a confirmed delay.
      // Deliberately narrow: only once the point's own due moment has
      // actually passed (liveDates, the same live time basis the blob
      // itself now uses) — and only when it's a genuinely unconfirmed
      // delay, not just an ordinary unconfirmed on-time point, which is
      // most of a journey and would otherwise be flagged almost everywhere.
      // The very last point in the whole list doesn't "depart" at all —
      // it's the final destination, so the same signal is worded as
      // "not yet arrived" there instead, rather than the departure
      // language that's meaningless for a terminus.
      const dueMomentPassed = liveDates[i] && now >= liveDates[i];
      const isFinalPoint = i === points.length - 1;
      const showNotYetPill = dueMomentPassed && isGenuinelyUnconfirmedDelay(p);
      const notYetDepartedPill = showNotYetPill
        ? ` <span style="background:#ff4d3d; color:#fff; font-weight:700; font-size:10px; letter-spacing:0.3px; padding:2px 7px; border-radius:10px; white-space:nowrap;">NOT YET ${isFinalPoint ? 'ARRIVED' : 'DEPARTED'}</span>`
        : '';
      const debugHtml = (showRawDebug && p.raw)
        ? `<div style="font-family:monospace; font-size:10px; color:#6a7a8a; margin-top:2px;">${Object.entries(p.raw).map(([k,v]) => `${k}=${v === undefined || v === null ? '·' : v}`).join('  ')}</div>`
        : '';
      return `
        ${daySeparator}
        <div class="rail-detail-row" data-idx="${i}" style="align-items:center; min-height:${TRAIN_PROGRESS_ROW_HEIGHT}px; padding-left:22px; position:relative;${inMyJourney ? ' background:color-mix(in srgb, var(--amber) 8%, transparent);' : ''}">
          <span style="position:absolute; left:2px; width:8px; height:8px; border-radius:50%; background:var(--line); top:50%; transform:translateY(-50%);"></span>
          <span style="min-width:56px;">${timeHtml}</span>
          <span style="flex:1; text-align:right;">
            <span class="wx-badge" data-wx-idx="${i}" style="margin-right:6px; font-size:12.5px; white-space:nowrap;"></span><span style="color:${nameColor}; font-weight:${(p.isYourStation||isToLocRow)?600:400};">${p.locationName || 'Unknown'}</span>
            <div style="color:${statusColor}; font-size:12.5px; margin-top:1px;">${statusText}${notYetDepartedPill}${platformText}</div>
            ${reasonHtml}
            ${debugHtml}
          </span>
        </div>`;
    }catch(e){
      // One malformed calling point shouldn't take the whole list down —
      // show what we can and keep going.
      return `<div class="rail-detail-row" data-idx="${i}"><span>${p.locationName || 'Unknown'}</span><span style="color:var(--ink-dim);">—</span></div>`;
    }
  }).join('');

  // Points worth fetching weather for: not already passed (a forecast for
  // a station the train left an hour ago is meaningless), not cancelled
  // (it's never actually going to stop there), and with a CRS code to
  // resolve coordinates from at all — Darwin doesn't always supply one.
  // dueAt is kept as a local wall-clock string (no timezone conversion)
  // to match Open-Meteo's own local-time response format one-for-one —
  // going via toISOString() here would silently shift by an hour
  // whenever BST is in effect, since that forces UTC.
  const weatherPoints = points
    .map((p, i) => ({ idx: i, crs: p.crs, dueAt: pointDates[i] ? localWallClockString(pointDates[i]) : null }))
    .filter(wp => wp.crs && wp.dueAt && !points[wp.idx].isCancelled && wp.idx > lastPassedIdx);

  // Persisted here (fire-and-forget, once per call — not from inside
  // describePointStatusRemembered itself, which runs once per point and
  // would otherwise trigger several redundant writes per single render)
  // so a freshly-confirmed status survives the app actually being killed
  // between polls, not just staying alive for the rest of this session.
  saveConfirmedPointStatusCache();

  return { summaryHtml, rowsHtml, lastPassedIdx, fraction, pointCount: points.length, anyReasonSuppressed, journeyFinished, weatherPoints, departsHere, firstPoint: points[0] || null, lastPoint: points[points.length - 1] || null };
}

const TRAIN_PROGRESS_REFRESH_MS = 60 * 1000;
// Polling cadence adapts to where the journey actually is, rather than a
// flat 60 seconds throughout regardless of relevance:
// - Before departure, there's normally nothing to poll for at all — the
//   scheduled time hasn't arrived yet, so nothing Darwin reports is
//   likely to change. Polling backs off the further away departure is,
//   down to a configurable minimum check-in interval, then resumes at
//   the normal cadence above once within pollBeforeDepartureMin of
//   scheduled departure (both settings live in the menu — see
//   pollBeforeDepartureMin/pollCheckInIntervalMin and
//   openPollingSettingsEditor).
// - On the final leg (heading to the last calling point before arrival)
//   polling speeds up, so arrival — and the stop-polling cleanup that
//   comes with it — is caught promptly rather than up to a minute late.
const FINAL_LEG_REFRESH_MS = 20 * 1000;

// ---- Weather badges (novelty, live-progress screen only) ----
// Open-Meteo — free, no API key, hourly forecast, good UK coverage via
// the Met Office model among others. Called directly from the client:
// no secret key involved (unlike Darwin), so there's nothing here that
// needs a Cloudflare Worker in front of it.
const WEATHER_API_URL = 'https://api.open-meteo.com/v1/forecast';
// Same station coordinates the picker resolves names from — one shared
// dataset rather than a second one that could disagree with it.
// A point's forecast doesn't meaningfully change minute to minute, and
// several calling points can round to the same hour — this just avoids
// re-fetching identical data on every 60-second Darwin refresh. Purely
// in-memory: no need for this to survive a page reload.
const weatherCache = new Map(); // `${crs}|${hourKey}` -> { code, temp }
const WEATHER_CACHE_TTL_MS = 20 * 60 * 1000;
const weatherCacheTimestamps = new Map(); // same key -> Date.now() when cached

// WMO weather codes (the standard Open-Meteo reports) collapsed down to
// the four categories asked for — sun, cloud, rain, snow — rather than
// trying to show a distinct icon per one of the ~30 real codes. isDay
// swaps a clear/mostly-clear reading to a moon rather than a sun once
// it's actually dark — Open-Meteo's own astronomical sunrise/sunset
// calculation, not just a guess from the clock. Only clear skies need
// this: cloud/rain/snow look the same regardless of time of day.
function weatherIconForCode(code, isDay){
  if (code === 0 || code === 1) return isDay ? '☀️' : '🌙';
  if ([2,3,45,48].includes(code)) return '☁️';
  if ([71,73,75,77,85,86].includes(code)) return '❄️';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) return '🌧️';
  return '☁️'; // unrecognised code — cloud is the safest generic fallback
}

// Formats a Date using its *local* wall-clock components (no timezone
// conversion) as "YYYY-MM-DDTHH:mm:ss" — deliberately not toISOString(),
// which forces UTC and would shift the hour whenever BST is in effect.
function localWallClockString(date){
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

function hourKeyFor(localWallClock){
  // Both this and Open-Meteo's own hourly.time entries (requested with
  // timezone=Europe/London) are local wall-clock strings in the same
  // "YYYY-MM-DDTHH..." shape — truncating to the hour is enough to match
  // them directly, with no Date parsing or timezone conversion involved
  // on either side.
  return localWallClock.slice(0, 13);
}

// Fetches (or reads from cache) weather for a batch of { idx, crs, dueAt }
// points, returning a Map of idx -> { icon, temp }. Never throws — a
// failure here should just mean no weather badges show up, not that the
// train-tracking screen around it breaks.
async function fetchWeatherForPoints(weatherPoints){
  const results = new Map();
  if (!weatherEnabled || !weatherPoints.length) return results;

  // Station coordinates come from the same cached list the picker uses —
  // but nothing else in the app guarantees it's actually been loaded this
  // session (previously it only got populated as a side effect of opening
  // the debug "Track any train" screen, which is exactly why this worked
  // sometimes and not others). Loading it here, keyed off its own cache,
  // makes weather self-sufficient: instant from localStorage after the
  // very first time ever, one real fetch before that.
  if (!stationIndexCache){
    try{ await loadStationIndex(false); }
    catch(e){ return results; } // no station data at all — nothing to show, fail quietly
  }

  const now = Date.now();
  const toFetch = []; // { idx, crs, lat, lon, hourKey }
  for (const wp of weatherPoints){
    const coords = stationCoordsForCrs(wp.crs);
    if (!coords) continue; // station not in the cached list yet — skip quietly
    const hourKey = hourKeyFor(wp.dueAt);
    const cacheKey = `${wp.crs}|${hourKey}`;
    const cached = weatherCache.get(cacheKey);
    const cachedAt = weatherCacheTimestamps.get(cacheKey);
    if (cached && cachedAt && (now - cachedAt) < WEATHER_CACHE_TTL_MS){
      results.set(wp.idx, cached);
    } else {
      toFetch.push({ idx: wp.idx, crs: wp.crs, lat: coords.lat, lon: coords.lon, hourKey });
    }
  }
  if (!toFetch.length) return results;

  // One request covers every still-uncached point at once — Open-Meteo
  // accepts comma-separated coordinate lists for exactly this. is_day is
  // Open-Meteo's own astronomical sunrise/sunset calculation per hour —
  // used to swap a clear-sky reading to a moon rather than a sun once
  // it's genuinely dark, instead of a sun icon showing up at 23:30.
  const lats = toFetch.map(f => f.lat).join(',');
  const lons = toFetch.map(f => f.lon).join(',');
  const url = `${WEATHER_API_URL}?latitude=${lats}&longitude=${lons}&hourly=temperature_2m,weather_code,is_day&timezone=Europe%2FLondon&forecast_days=2`;
  let data;
  try{
    const resp = await fetch(url);
    if (!resp.ok) return results; // fail quietly — see comment above
    data = await resp.json();
  }catch(e){ return results; }

  // A single-location request returns one object; multiple locations
  // return an array in the same order they were requested in.
  const perLocation = Array.isArray(data) ? data : [data];
  toFetch.forEach((f, i) => {
    const loc = perLocation[i];
    if (!loc || !loc.hourly || !Array.isArray(loc.hourly.time)) return;
    const hourIdx = loc.hourly.time.findIndex(t => t.startsWith(f.hourKey));
    if (hourIdx === -1) return; // requested time outside the 2-day window returned
    const code = loc.hourly.weather_code[hourIdx];
    const temp = loc.hourly.temperature_2m[hourIdx];
    const isDay = Array.isArray(loc.hourly.is_day) ? loc.hourly.is_day[hourIdx] === 1 : true;
    if (code === undefined || temp === undefined || temp === null) return;
    const entry = { icon: weatherIconForCode(code, isDay), temp: Math.round(temp) };
    const cacheKey = `${f.crs}|${f.hourKey}`;
    weatherCache.set(cacheKey, entry);
    weatherCacheTimestamps.set(cacheKey, now);
    results.set(f.idx, entry);
  });
  return results;
}

function openTrainProgress(train, service){
  // See activeTrainProgressCleanup above — never let two of these run
  // at once, since they share element IDs and each runs its own timer.
  if (activeTrainProgressCleanup){
    activeTrainProgressCleanup();
    activeTrainProgressCleanup = null;
  }
  let refreshTimer = null;
  let showRawDebug = false; // off by default — a temporary diagnostic toggle, not for normal use
  let showAllReasons = false; // manual override for the staleness-suppression heuristic, in case it's wrong on a given service
  let lastKnownService = service; // lets the debug toggle rebuild instantly without a fresh network call
  // Cleanup (below) clears the interval, but that alone can't cancel an
  // already-in-flight doRefresh() that's mid-await — without this flag,
  // that stale call could still resolve afterward and write into
  // whatever DOM now has these element IDs, which might belong to a
  // different train's screen by then. Every doRefresh() checks this
  // immediately after each await, before touching anything.
  let instanceActive = true;
  // A second, independent guard: an interval tick and a visibility-wake
  // tick can otherwise overlap and race each other, with whichever
  // network response arrives second silently overwriting the other,
  // regardless of which was actually more recent.
  let refreshInFlight = false;
  // Same idea, scoped to weather: applyWeather() fetches independently of
  // the Darwin refresh cycle above, so an older weather request can still
  // be in flight when a newer Darwin refresh rebuilds the rows. Each
  // render bumps this counter and hands its own value to applyWeather;
  // if the counter's moved on by the time that fetch resolves, its
  // result belongs to a row set (and a lastPassedIdx/fraction) that no
  // longer exists, and gets discarded rather than written in or used to
  // reposition the blob.
  let renderGeneration = 0;
  const serviceId = train.serviceId || service.serviceID || null;
  // Computed early (rather than at its previous spot, right before the
  // overlay markup) because the label below now needs to know whether
  // this station genuinely has its own departure, or whether the
  // tracked/searched station turned out to be an arrival-only point.
  const initial = buildTrainProgress(train, service, showRawDebug, showAllReasons);
  // A configured train's own .label is just its departure time (e.g.
  // "17:31") — fine for the compact board row it came from, but not
  // enough detail once it's the title of this screen, or sitting in the
  // tracked list alongside entries from elsewhere that already show a
  // full route. Computed once, here, and reused for both — previously
  // this only happened for the tracked-list save, leaving the title
  // itself showing just the bare time when opened from "My trains".
  let displayLabel;
  if (train.labelIsFinal){
    // Reopened from the Tracked list — its stored .label was already
    // fully computed (by one of the two branches below) the first time
    // this train was opened, whichever type it was. Reused as-is rather
    // than recomputed: for a configured route specifically, train.label
    // itself already contains the full enriched text at this point
    // (unlike a first-ever open, where it's still just the bare
    // configured time), so re-running that branch would double up into
    // something like "07:27 Crewe→Wigan North Western Crewe→Wigan
    // North Western" instead of leaving well alone.
    displayLabel = train.label;
  } else if (train.toLoc){
    // Manual override first (covers Crewe/Wigan, this app's actual
    // regular stations), then the full station dataset, then the bare
    // code as a last resort. This is your own configured route boundary
    // — kept exactly as configured even if the wider physical train
    // actually starts earlier or continues further, since that's the
    // segment that's actually meaningful to you day to day.
    displayLabel = `${train.label} ${(STATION_COORDS[train.fromLoc] && STATION_COORDS[train.fromLoc].name) || stationNameForCrs(train.fromLoc) || train.fromLoc}→${(STATION_COORDS[train.toLoc] && STATION_COORDS[train.toLoc].name) || stationNameForCrs(train.toLoc) || train.toLoc}`;
  } else if (initial.firstPoint && initial.lastPoint){
    // Any other tracked/searched train — built from the genuine calling
    // points (the same real data shown in the grid below) rather than
    // whatever label happened to be built at search time, which could
    // only ever describe the segment between the searched station and
    // one specific stop, and — for an arrival-only result — could
    // mislead by leading with an arrival time in the exact position
    // every other title uses for a departure time. This reads the same
    // way regardless of whether the search that found it was a genuine
    // departure or an arrival-only result.
    displayLabel = `${initial.firstPoint.schedTime || '?'} ${initial.firstPoint.locationName || '?'}→${initial.lastPoint.locationName || '?'}`;
  } else {
    displayLabel = train.label;
  }

  // Remember this journey so it can still be found and watched later,
  // even after it's rolled off the departure station's own board, or
  // after closing and reopening the app entirely.
  if (serviceId){
    const existing = trackedTrains.find(t => t.serviceId === serviceId);
    const addedAt = existing ? existing.addedAt : Date.now(); // preserve the original tracking time — reopening shouldn't reset how long it's been tracked
    trackedTrains = trackedTrains.filter(t => t.serviceId !== serviceId);
    // toLoc carried through too, not just fromLoc — without it, reopening
    // one of your own configured trains from the Tracked tab loses the
    // context that it's a configured route at all, and falls back to
    // treating it like any other tracked service: titled from the
    // train's genuine physical journey instead of your own configured
    // segment. A Crewe→Wigan commute train that happens to be part of a
    // much longer London Euston→Glasgow Central working would then
    // retitle itself as that wider journey the moment it's reopened from
    // Tracked, despite showing correctly the first time round from Your
    // trains.
    trackedTrains.unshift({ serviceId, label: displayLabel, fromLoc: train.fromLoc, toLoc: train.toLoc || null, addedAt });
    trackedTrains = trackedTrains.slice(0, TRACKED_TRAIN_MAX); // no need to keep more than a handful
    saveTrackedTrains();
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-overlay-full';
  overlay.innerHTML = `
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <div class="eyebrow">Live progress</div>
          <h3 style="margin-top:0;">${displayLabel}</h3>
        </div>
        ${train.toLoc ? `<span title="One of your configured trains — this shows your own route, not necessarily the train's full journey" style="color:var(--amber); font-size:22px; line-height:1; margin-top:2px;">★</span>` : ''}
      </div>
      <div id="train-progress-reverse-pill">${service.isReverseFormation ? `<span style="display:inline-block; background:var(--amber); color:#14161f; font-weight:700; font-size:11px; letter-spacing:0.5px; padding:4px 10px; border-radius:20px; margin-bottom:10px;">REVERSE FORMATION</span>` : ''}</div>
      <div class="sub">An estimate based on calling-point times.${debugModeEnabled ? ` <span id="raw-debug-toggle" style="text-decoration:underline; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">Show raw data</span>` : ''}</div>
      <div id="train-progress-refresh-bar-wrap" style="height:3px; background:var(--tile); border-radius:2px; overflow:hidden; margin-bottom:4px;">
        <div id="train-progress-refresh-fill" style="height:100%; width:0%; background:var(--amber);"></div>
      </div>
      <div id="train-progress-last-check" style="font-size:11px; color:var(--ink-dim); text-align:right; margin-bottom:10px;">Opened ${new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</div>
      <div id="train-progress-offline-banner" style="display:none; font-size:13px; color:#ff8b7e; background:rgba(224,90,78,0.12); border:1px solid rgba(224,90,78,0.4); border-radius:8px; padding:10px 12px; margin-bottom:10px;">Lost connection — showing estimated progress based on the last data received.</div>
      <div id="train-progress-summary" style="font-size:13.5px; color:var(--amber); background:rgba(242,169,59,0.1); border:1px solid rgba(242,169,59,0.3); border-radius:8px; padding:10px 12px; margin-bottom:10px;">${initial.summaryHtml}</div>
      <div id="train-progress-reason-toggle-wrap" style="margin-bottom:10px; ${initial.anyReasonSuppressed ? '' : 'display:none;'}">
        <span id="show-all-reasons-toggle" style="font-size:12px; text-decoration:underline; color:var(--ink-dim); cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">${showAllReasons ? 'Hide repeated reasons' : 'A reason was hidden as likely outdated — show it anyway'}</span>
      </div>
      <div id="train-progress-scroll" style="flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative; padding-right:14px;">
        <div style="position:relative; padding-left:6px;">
          <div id="train-progress-line" style="position:absolute; left:11px; top:0px; width:2px; height:0px; background:var(--line);"></div>
          <div id="train-progress-blob" style="position:absolute; left:6px; width:12px; height:12px; border-radius:50%; background:var(--amber); box-shadow:0 0 6px rgba(242,169,59,0.7); top:0px; transition:top 1.2s ease; z-index:2;"></div>
          <div id="train-progress-rows">${initial.rowsHtml}</div>
          <div id="train-progress-operator" style="font-size:12px; color:var(--ink-dim); margin-top:5px;">${service.operator ? `Operator: ${escapeHtml(service.operator)}` : ''}</div>
        </div>
      </div>
      <div class="modal-close" id="train-progress-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Positions the line and blob from the *real* rendered row heights,
  // measured from the DOM — not a fixed assumed row height. Rows can grow
  // taller than the base minimum when a delay-reason message wraps onto
  // extra lines, so a fixed-pixel-per-row calculation drifts further and
  // further off the true position the more affected rows there are.
  function positionBlobAndLine(lastPassedIdx, fraction, scrollBehavior){
    const rowsContainer = overlay.querySelector('#train-progress-rows');
    const lineEl = overlay.querySelector('#train-progress-line');
    const blobEl = overlay.querySelector('#train-progress-blob');
    if (!rowsContainer || !lineEl || !blobEl) return;
    const rows = rowsContainer.querySelectorAll('[data-idx]');
    if (!rows.length) return;
    const base = rowsContainer.offsetTop;
    const centerOf = (row) => base + row.offsetTop + row.offsetHeight / 2;

    const firstCenter = centerOf(rows[0]);
    const lastCenter = centerOf(rows[rows.length - 1]);
    lineEl.style.top = `${firstCenter}px`;
    lineEl.style.height = `${Math.max(0, lastCenter - firstCenter)}px`;

    let blobCenter;
    if (lastPassedIdx < 0){
      blobCenter = firstCenter;
    } else if (lastPassedIdx >= rows.length - 1){
      blobCenter = lastCenter;
    } else {
      const c1 = centerOf(rows[lastPassedIdx]);
      const c2 = centerOf(rows[lastPassedIdx + 1]);
      blobCenter = c1 + (c2 - c1) * fraction;
    }
    blobEl.style.top = `${blobCenter - 6}px`;

    // Keep the blob roughly centred in view as it moves, rather than
    // needing a manual scroll to find it — most noticeable once a train
    // reaches the very end of a long calling-point list. Clamped to the
    // container's real scrollable range, so it naturally does the best
    // it can near either end rather than trying to overscroll.
    const scrollContainer = overlay.querySelector('#train-progress-scroll');
    if (scrollContainer && scrollContainer.clientHeight > 0){
      const target = Math.max(0, Math.min(
        blobCenter - scrollContainer.clientHeight / 2,
        scrollContainer.scrollHeight - scrollContainer.clientHeight
      ));
      scrollContainer.scrollTo({ top: target, behavior: scrollBehavior || 'smooth' });
    }
  }
  positionBlobAndLine(initial.lastPassedIdx, initial.fraction);

  // Fetches and injects weather badges for the given points, entirely
  // after the fact — the rows themselves have already rendered and
  // positioned by the time this resolves, so a slow or failed weather
  // fetch can never hold up or affect the actual train-tracking display.
  // gen is this call's render-generation token (see renderGeneration
  // above) — if a newer render has happened by the time the fetch
  // resolves, this result is for rows that no longer exist and is
  // dropped rather than written into whatever's there now.
  async function applyWeather(weatherPoints, lastPassedIdx, fraction, gen){
    if (!weatherEnabled || !weatherPoints || !weatherPoints.length) return;
    const results = await fetchWeatherForPoints(weatherPoints);
    if (!instanceActive || !overlay.isConnected || !results.size) return;
    if (gen !== renderGeneration) return; // superseded by a newer render while this was in flight
    results.forEach((wx, idx) => {
      const badge = overlay.querySelector(`[data-wx-idx="${idx}"]`);
      if (badge) badge.textContent = `${wx.icon} ${wx.temp}° `;
    });
    // Badges add a little width/height to their row — re-measure so the
    // progress line and blob stay correctly aligned against the real
    // rendered layout rather than where it was before they appeared.
    positionBlobAndLine(lastPassedIdx, fraction, 'auto');
  }
  renderGeneration++;
  applyWeather(initial.weatherPoints, initial.lastPassedIdx, initial.fraction, renderGeneration);

  function rebuildDisplay(){
    const rebuilt = buildTrainProgress(train, lastKnownService, showRawDebug, showAllReasons);
    const rowsEl = overlay.querySelector('#train-progress-rows');
    const summaryEl = overlay.querySelector('#train-progress-summary');
    if (rowsEl) rowsEl.innerHTML = rebuilt.rowsHtml;
    if (summaryEl) summaryEl.innerHTML = rebuilt.summaryHtml;
    positionBlobAndLine(rebuilt.lastPassedIdx, rebuilt.fraction, 'auto');
    const reasonToggleWrap = overlay.querySelector('#train-progress-reason-toggle-wrap');
    const reasonToggle = document.getElementById('show-all-reasons-toggle');
    if (reasonToggleWrap) reasonToggleWrap.style.display = rebuilt.anyReasonSuppressed ? '' : 'none';
    if (reasonToggle) reasonToggle.textContent = showAllReasons ? 'Hide repeated reasons' : 'A reason was hidden as likely outdated — show it anyway';
    renderGeneration++;
    applyWeather(rebuilt.weatherPoints, rebuilt.lastPassedIdx, rebuilt.fraction, renderGeneration);
    return rebuilt;
  }

  const rawDebugToggle = document.getElementById('raw-debug-toggle');
  if (rawDebugToggle){
    rawDebugToggle.addEventListener('click', () => {
      showRawDebug = !showRawDebug;
      rawDebugToggle.textContent = showRawDebug ? 'Hide raw data' : 'Show raw data';
      rebuildDisplay();
    });
  }

  const showAllReasonsToggle = document.getElementById('show-all-reasons-toggle');
  if (showAllReasonsToggle){
    showAllReasonsToggle.addEventListener('click', () => {
      showAllReasons = !showAllReasons;
      rebuildDisplay();
    });
  }

  // Kicks off (or restarts) a smooth CSS fill from 0 to 100% over the
  // given duration — a pure visual indicator of "time until the next
  // check", not tied to a ticking JS interval of its own. Duration
  // varies with the adaptive cadence below, so this takes it as a
  // parameter rather than assuming the flat 60-second default.
  function resetRefreshBar(durationMs){
    const fill = overlay.querySelector('#train-progress-refresh-fill');
    if (!fill) return;
    fill.style.transition = 'none';
    fill.style.width = '0%';
    void fill.offsetWidth; // force reflow so the transition-removal above actually takes effect first
    fill.style.transition = `width ${durationMs}ms linear`;
    fill.style.width = '100%';
  }

  // Computes how long to wait before the next poll, given where the
  // journey currently is — see the cadence constants above for the
  // reasoning, and pollBeforeDepartureMin/pollCheckInIntervalMin (both
  // configurable from the menu) for the two numbers involved. Falls
  // back to the flat default whenever there isn't a usable scheduled
  // time to reason about, which is always at least as safe as the old
  // fixed cadence.
  function computeNextRefreshDelay(buildResult){
    if (buildResult.lastPassedIdx === -1){
      const schedStr = lastKnownService && (lastKnownService.std || lastKnownService.sta);
      if (schedStr && schedStr.includes(':')){
        // closestDateForTime, not a same-day-only liveTimeToDate — a
        // service due at 00:43 tracked at 22:48 the evening before needs
        // to resolve to tomorrow's 00:43, not today's (which would put
        // it hours in the past and silently fall through to the flat
        // cadence below instead of the intended long pre-departure
        // wait). Same reasoning already proven correct for the first
        // calling point above.
        const schedDate = closestDateForTime(schedStr.replace(':', ''), new Date());
        if (schedDate){
          const minutesToGo = (schedDate.getTime() - Date.now()) / 60000;
          if (minutesToGo > pollBeforeDepartureMin){
            // Don't wait all the way until the pre-departure window
            // opens in one go — cap it at the configured check-in
            // interval, so a cancellation that happens mid-wait (not
            // one that already existed when the screen was opened,
            // which the very first fetch already catches regardless)
            // is still noticed within a bounded time.
            const waitUntilWindow = minutesToGo - pollBeforeDepartureMin;
            return Math.min(waitUntilWindow, pollCheckInIntervalMin) * 60000;
          }
        }
      }
    } else if (buildResult.pointCount && buildResult.lastPassedIdx === buildResult.pointCount - 2){
      return FINAL_LEG_REFRESH_MS;
    }
    return TRAIN_PROGRESS_REFRESH_MS;
  }

  // Clears any pending poll and schedules the next one at the delay
  // computed above, restarting the visual countdown bar to match. A
  // self-rescheduling setTimeout rather than a single setInterval,
  // since the delay needs to change from one cycle to the next.
  function scheduleNextRefresh(buildResult){
    if (refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
    const delayMs = computeNextRefreshDelay(buildResult);
    resetRefreshBar(delayMs);
    refreshTimer = setTimeout(doRefresh, delayMs);
  }

  async function doRefresh(){
    // An interval tick and a visibility-wake tick can otherwise overlap;
    // if one's already running, just let it finish rather than starting
    // a second one that could resolve out of order.
    if (refreshInFlight) return;
    refreshInFlight = true;
    const stamp = () => new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const lastCheckEl = overlay.querySelector('#train-progress-last-check');
    try{
      let freshService = null;
      if (serviceId){
        // Preferred path: ask for this exact train directly, regardless
        // of whether it's still on any station's board.
        freshService = await fetchServiceDetails(serviceId);
      } else {
        // Fallback for the rare case a service had no ID at all — the
        // old, more fragile approach of re-matching against the board.
        const boards = await fetchLiveBoards();
        const board = boards[`${train.fromLoc}-${train.toLoc}`] || [];
        const wanted = `${train.time.slice(0,2)}:${train.time.slice(2,4)}`;
        freshService = board.find(s => s.std === wanted) || null;
      }
      // This screen may have been closed (or superseded by a different
      // train's screen reusing the same element IDs) while the request
      // above was in flight — clearing the interval doesn't cancel an
      // already-started await, so this is the check that actually
      // prevents a stale response from writing into the wrong screen.
      if (!instanceActive) return;
      if (freshService){
        lastKnownService = freshService;
        const fresh = buildTrainProgress(train, freshService, showRawDebug, showAllReasons);
        const rowsEl = overlay.querySelector('#train-progress-rows');
        const summaryEl = overlay.querySelector('#train-progress-summary');
        const pillEl = overlay.querySelector('#train-progress-reverse-pill');
        const operatorEl = overlay.querySelector('#train-progress-operator');
        const offlineBanner = overlay.querySelector('#train-progress-offline-banner');
        const blobEl = overlay.querySelector('#train-progress-blob');
        const reasonToggleWrap = overlay.querySelector('#train-progress-reason-toggle-wrap');
        if (rowsEl) rowsEl.innerHTML = fresh.rowsHtml;
        if (summaryEl) summaryEl.innerHTML = fresh.summaryHtml;
        positionBlobAndLine(fresh.lastPassedIdx, fresh.fraction);
        renderGeneration++;
        applyWeather(fresh.weatherPoints, fresh.lastPassedIdx, fresh.fraction, renderGeneration);
        if (pillEl) pillEl.innerHTML = freshService.isReverseFormation ? `<span style="display:inline-block; background:var(--amber); color:#14161f; font-weight:700; font-size:11px; letter-spacing:0.5px; padding:4px 10px; border-radius:20px; margin-bottom:10px;">REVERSE FORMATION</span>` : '';
        if (operatorEl) operatorEl.textContent = freshService.operator ? `Operator: ${freshService.operator}` : '';
        if (lastCheckEl) lastCheckEl.textContent = `Updated ${stamp()}`;
        if (reasonToggleWrap) reasonToggleWrap.style.display = fresh.anyReasonSuppressed ? '' : 'none';
        // Connection's back — drop out of the offline/estimated state.
        if (offlineBanner) offlineBanner.style.display = 'none';
        if (blobEl) blobEl.classList.remove('blob-pulsing');
        if (fresh.journeyFinished){
          // Arrived, or terminated early with nothing left ahead that
          // could ever change — polling further would just be repeatedly
          // asking Darwin about a service that's permanently done.
          if (refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
          document.removeEventListener('visibilitychange', onVisible);
          const barWrap = overlay.querySelector('#train-progress-refresh-bar-wrap');
          if (barWrap) barWrap.style.display = 'none';
          if (lastCheckEl) lastCheckEl.style.display = 'none';
        } else {
          scheduleNextRefresh(fresh);
        }
      } else if (lastCheckEl){
        lastCheckEl.textContent = `Checked ${stamp()} — no data returned`;
        scheduleNextRefresh({ lastPassedIdx: 0 }); // no usable result to reason from — just fall back to the flat default cadence
      }
    }catch(e){
      if (!instanceActive) return;
      // Leave the last-known view showing rather than clearing it, but
      // make the failure visible instead of silently doing nothing — a
      // silent failure here previously looked identical to "not
      // refreshed" with no way to tell the difference.
      if (lastCheckEl){
        const stackLine = (e.stack || '').split('\n')[1] || '';
        const location = stackLine.match(/(\d+:\d+)\)?$/);
        lastCheckEl.textContent = `Checked ${stamp()} — refresh failed (${e.message}${location ? ' @' + location[1] : ''})`;
      }
      // No fresh data, but the position math only ever needed calling-
      // point times compared against the real current clock — re-run it
      // against the last data we did get, so the blob keeps creeping
      // forward on a reasonable assumption rather than sitting frozen.
      const stale = buildTrainProgress(train, lastKnownService, showRawDebug, showAllReasons);
      const rowsEl = overlay.querySelector('#train-progress-rows');
      const summaryEl = overlay.querySelector('#train-progress-summary');
      const offlineBanner = overlay.querySelector('#train-progress-offline-banner');
      const blobEl = overlay.querySelector('#train-progress-blob');
      const reasonToggleWrap = overlay.querySelector('#train-progress-reason-toggle-wrap');
      if (rowsEl) rowsEl.innerHTML = stale.rowsHtml;
      if (summaryEl) summaryEl.innerHTML = stale.summaryHtml;
      positionBlobAndLine(stale.lastPassedIdx, stale.fraction);
      renderGeneration++;
      applyWeather(stale.weatherPoints, stale.lastPassedIdx, stale.fraction, renderGeneration);
      if (reasonToggleWrap) reasonToggleWrap.style.display = stale.anyReasonSuppressed ? '' : 'none';
      if (offlineBanner) offlineBanner.style.display = 'block';
      if (blobEl) blobEl.classList.add('blob-pulsing');
      if (stale.journeyFinished){
        // Even the last data we successfully got already showed this
        // journey was over — no point continuing to retry a connection
        // just to re-confirm something that was already permanent.
        if (refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
        document.removeEventListener('visibilitychange', onVisible);
        const barWrap = overlay.querySelector('#train-progress-refresh-bar-wrap');
        if (barWrap) barWrap.style.display = 'none';
        if (lastCheckEl) lastCheckEl.style.display = 'none';
      } else {
        scheduleNextRefresh(stale);
      }
    }finally{
      refreshInFlight = false;
    }
  }

  // Screen locks/backgrounding pause the pending timeout below without
  // "catching up" a missed check afterward — so on waking up, force an
  // immediate refresh rather than potentially waiting out however long
  // was left on it (which, during the pre-departure quiet period, could
  // be a long wait indeed).
  function onVisible(){
    if (document.visibilityState === 'visible') doRefresh();
  }

  if (initial.journeyFinished){
    const barWrap = overlay.querySelector('#train-progress-refresh-bar-wrap');
    if (barWrap) barWrap.style.display = 'none';
    const initialLastCheckEl = overlay.querySelector('#train-progress-last-check');
    if (initialLastCheckEl) initialLastCheckEl.style.display = 'none';
  } else {
    scheduleNextRefresh(initial);
    document.addEventListener('visibilitychange', onVisible);
  }

  function closeAndStopRefresh(silent){
    instanceActive = false;
    if (refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
    document.removeEventListener('visibilitychange', onVisible);
    if (overlay.isConnected) overlay.remove();
    if (activeTrainProgressCleanup === forceClose) activeTrainProgressCleanup = null;
    // If this was opened from the Tracked sub-tab (the only place that
    // passes a serviceId directly on the train object), closing should
    // return there rather than just dropping back to whatever was
    // underneath — but only on a real user-initiated close, not when
    // this instance is being silently torn down to make way for a
    // newly-opened one.
    if (!silent && train.serviceId) openLiveScreen('tracked');
  }
  function forceClose(){ closeAndStopRefresh(true); }
  activeTrainProgressCleanup = forceClose;
  overlay.querySelector('#train-progress-close-btn').addEventListener('click', () => closeAndStopRefresh(false));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeAndStopRefresh(false); });
}

function openRailConfig(cameFromSettings){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  // Edit a private copy. Add/remove/time changes should not affect the live
  // configuration until Save is pressed; Cancel must genuinely cancel.
  let draftTrains = railTrains.map(t => ({ ...t }));

  function buildSectionHtml(direction, title, fromLoc, toLoc){
    const trains = draftTrains.filter(t => t.direction === direction).sort((a, b) => a.time.localeCompare(b.time));
    const rows = trains.map(t => `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <input type="time" class="rail-time-input" data-key="${t.key}" value="${t.time.slice(0,2)}:${t.time.slice(2,4)}" style="flex:1;" />
