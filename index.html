    ${(!beforePeriod && !dismissedParkingSavingsPeriods[fmtKey(realCurrentPeriod.start)]) ? `
    <div class="holiday-card" id="parking-savings-card">
      <div class="holiday-info" style="width:100%;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div class="holiday-label">Parking savings${parkingSavingsOffset === 0 ? ' this period' : ''}</div>
          <span id="parking-savings-dismiss" style="cursor:pointer; color:var(--ink-dim); font-size:16px; line-height:1; padding:0 4px;">&times;</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
          <span class="cal-nav-btn" id="parking-savings-prev" style="width:24px; height:24px; font-size:13px;">&#8249;</span>
          <div class="holiday-label" style="margin:0; font-weight:600; color:var(--ink);">${parkingSavingsWindowLabel}</div>
          <span class="cal-nav-btn ${parkingSavingsOffset === 0 ? 'disabled' : ''}" id="parking-savings-next" style="width:24px; height:24px; font-size:13px; ${parkingSavingsOffset === 0 ? 'opacity:0.35; pointer-events:none;' : ''}">&#8250;</span>
        </div>
        <div class="holiday-date" style="font-size:22px; font-weight:600; color:${parkingSavingsCardValue >= 0 ? 'var(--good)' : '#ff8b7e'}; margin-top:8px;">${parkingSavingsCardValue >= 0 ? '£' + parkingSavingsCardValue.toFixed(2) + ' saved' : '£' + Math.abs(parkingSavingsCardValue).toFixed(2) + ' over budget'}</div>
      </div>
    </div>` : ''}


    ${!ticketsSpentCardDismissed ? `
    <div class="holiday-card" id="spending-card" style="cursor:pointer;">
      <div class="holiday-info" style="width:100%;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div class="holiday-label">Spent on tickets this year</div>
          <span id="spending-card-dismiss" style="cursor:pointer; color:var(--ink-dim); font-size:16px; line-height:1; padding:0 4px;">&times;</span>
        </div>
        <div class="holiday-date" style="font-size:22px; font-weight:600; color:var(--amber);">£${yearToDateTotal.toFixed(2)}</div>
        <div class="holiday-label" style="margin-top:2px;">${yearToDatePurchases.length} ticket${yearToDatePurchases.length===1?'':'s'} logged this year · tap to manage</div>
      </div>
    </div>` : ''}

    ${holidayHtml}

    ${todayIsWeekend ? '' : `
    <div class="section-label">Today's comment</div>
    <div class="comment-card" id="today-comment-card">
      <div class="chip-row" id="chip-row"></div>
      <input type="text" id="custom-comment" placeholder="Or type your own" value="${escapeHtml(todayComment && !PRESET_TAGS.includes(todayComment.toUpperCase()) ? todayComment : '')}" />
      <label style="display:flex; align-items:center; gap:8px; margin:10px 0 4px; font-size:14px; color:var(--ink-dim); cursor:pointer;">
        <input type="checkbox" id="today-override-checkbox" ${travelOverrides[todayKey] ? 'checked' : ''} style="width:16px; height:16px;" />
        I still used the ticket today
      </label>
      <button class="save-btn" id="save-today-btn">Save</button>
    </div>`}

    <div class="section-label">Upcoming &amp; recent days</div>
    ${railDaysBack < RAIL_MAX_DAYS_BACK ? `<div class="day-nav-btn" id="show-earlier-link"><span class="arrow-icon">&#8593;</span> Show earlier days</div>` : ''}
    <div class="day-list">${rows}</div>
    ${state.daysAhead < MAX_DAYS_AHEAD ? `<div class="day-nav-btn" id="show-more-link">Show more days <span class="arrow-icon">&#8595;</span></div>` : ''}

    <nav class="bottom-nav">
      <div class="bottom-nav-item ${state.activeTab==='today'?'active':''}" id="bottom-nav-today">${NAV_ICONS.today}<span class="bn-label">Home</span></div>
      <div class="bottom-nav-item ${state.activeTab==='live'?'active':''}" id="bottom-nav-live">${NAV_ICONS.live}<span class="bn-label">Live</span></div>
      <div class="bottom-nav-item ${state.activeTab==='buy'?'active':''}" id="bottom-nav-buy">${NAV_ICONS.buy}<span class="bn-label">Buy</span></div>
      <div class="bottom-nav-item ${state.activeTab==='calendar'?'active':''}" id="bottom-nav-calendar">${NAV_ICONS.calendar}<span class="bn-label">Calendar</span></div>
      <div class="bottom-nav-item ${menuOpen?'active':''}" id="bottom-nav-more">${NAV_ICONS.more}<span class="bn-label">More</span></div>
    </nav>
  `;

  // wire up chip row for today (only exists on non-weekend days)
  const chipRow = document.getElementById('chip-row');
  if (chipRow){
    let selectedPreset = PRESET_TAGS.includes(todayComment.toUpperCase()) ? todayComment.toUpperCase() : null;
    chipRow.innerHTML = PRESET_TAGS.map(tag => `<div class="chip ${selectedPreset===tag?'active':''}" data-tag="${tag}">${tag}</div>`).join('') +
      `<div class="chip ${!selectedPreset && !todayComment ? '' : (!selectedPreset && todayComment ? '' : '')}" data-tag="__clear">Clear</div>`;

    chipRow.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', async () => {
        const tag = chip.dataset.tag;
        const cb = document.getElementById('today-override-checkbox');
        if (tag === '__clear'){
          comments[todayKey] = '';
          delete travelOverrides[todayKey];
        } else {
          comments[todayKey] = tag;
          document.getElementById('custom-comment').value = '';
          if (cb && cb.checked) travelOverrides[todayKey] = true; else delete travelOverrides[todayKey];
        }
        await saveComments();
        await saveTravelOverrides();
        render();
      });
    });

    document.getElementById('save-today-btn').addEventListener('click', async () => {
      const val = document.getElementById('custom-comment').value.trim();
      const cb = document.getElementById('today-override-checkbox');
      if (val !== ''){
        comments[todayKey] = val;
        if (cb && cb.checked) travelOverrides[todayKey] = true; else delete travelOverrides[todayKey];
        await saveComments();
        await saveTravelOverrides();
        render();
      }
    });

    const todayOverrideCb = document.getElementById('today-override-checkbox');
    if (todayOverrideCb){
      todayOverrideCb.addEventListener('change', async () => {
        if (todayOverrideCb.checked) travelOverrides[todayKey] = true; else delete travelOverrides[todayKey];
        await saveTravelOverrides();
        render();
        if (todayOverrideCb.checked) railSyncMissingDates();
      });
    }
  }

  document.querySelectorAll('.day-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('rail-blob')){
        e.stopPropagation();
        openRailDetail(e.target.dataset.railKey);
      } else if (row.dataset.weekend === '1'){
        // weekends have nothing to tag — no editor to open
      } else {
        openDayEditor(row.dataset.key);
      }
    });
  });

  const delayRepayBadgeEl = document.getElementById('delay-repay-badge');
  if (delayRepayBadgeEl){
    delayRepayBadgeEl.addEventListener('click', async (e) => {
      e.stopPropagation();
      const mode = delayRepayBadgeEl.dataset.mode;
      const dateKey = delayRepayBadgeEl.dataset.dateKey;
      if (!mode) return; // preview badges have no mode/dateKey — nothing to do
      if (mode === 'expired'){
        for (const dir in (delayClaims[dateKey] || {})){
          const c = delayClaims[dateKey][dir];
          if (c && c.status === 'expired') c.expiredAcknowledged = true;
        }
        await saveDelayClaims();
        render();
      } else {
        openDayEditor(dateKey);
      }
    });
  }

  document.getElementById('bottom-nav-more').addEventListener('click', (e) => {
    e.stopPropagation();
    closeAllModals();
    menuOpen = !menuOpen;
    render();
  });
  if (menuOpen){
    // close the dropdown if the person taps anywhere outside it
    setTimeout(() => {
      document.addEventListener('click', function closeMenu(e){
        const dropdown = document.getElementById('menu-dropdown');
        const btn = document.getElementById('bottom-nav-more');
        if (!dropdown || (!dropdown.contains(e.target) && e.target !== btn && !btn.contains(e.target))){
          document.removeEventListener('click', closeMenu);
          if (menuOpen){ menuOpen = false; render(); }
        }
      });
    }, 0);
  }

  document.getElementById('bottom-nav-today').addEventListener('click', () => {
    closeAllModals();
    menuOpen = false;
    state.activeTab = 'today';
    render();
    const todayRow = document.querySelector('.day-row.is-today');
    if (todayRow) todayRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  const renewalBannerTap = document.getElementById('renewal-banner-tap');
  if (renewalBannerTap) renewalBannerTap.addEventListener('click', () => { openBuyScreen('season'); });

  document.getElementById('bottom-nav-live').addEventListener('click', () => {
    closeAllModals();
    menuOpen = false;
    state.activeTab = 'live';
    render();
    openLiveScreen();
  });
  document.getElementById('bottom-nav-buy').addEventListener('click', () => {
    closeAllModals();
    menuOpen = false;
    state.activeTab = 'buy';
    render();
    openBuyScreen();
  });
  document.getElementById('bottom-nav-calendar').addEventListener('click', () => {
    closeAllModals();
    menuOpen = false;
    state.activeTab = 'calendar';
    render();
    openCalendarView();
  });

  const importHistoryLink = document.getElementById('import-history-link');
  if (importHistoryLink) importHistoryLink.addEventListener('click', () => { menuOpen = false; render(); openImportHistory(); });

  const helpLink = document.getElementById('help-link');
  if (helpLink) helpLink.addEventListener('click', () => { menuOpen = false; render(); openHelpGuide(); });

  const backlogLink = document.getElementById('backlog-link');
  if (backlogLink) backlogLink.addEventListener('click', () => { menuOpen = false; render(); openBacklogView(); });

  const settingsLink = document.getElementById('settings-link');
  if (settingsLink) settingsLink.addEventListener('click', () => { menuOpen = false; render(); openSettingsMenu(); });

  const debugModeLink = document.getElementById('debug-mode-link');
  if (debugModeLink) debugModeLink.addEventListener('click', async () => {
    debugModeEnabled = !debugModeEnabled;
    await saveDebugMode();
    menuOpen = false;
    render();
  });
  const weatherToggleLink = document.getElementById('weather-toggle-link');
  if (weatherToggleLink) weatherToggleLink.addEventListener('click', async () => {
    weatherEnabled = !weatherEnabled;
    await saveWeatherEnabled();
    menuOpen = false;
    render();
  });
  const parkingCostLink = document.getElementById('parking-cost-link');
  if (parkingCostLink) parkingCostLink.addEventListener('click', () => { menuOpen = false; render(); openParkingCostEditor(); });

  const pollingSettingsLink = document.getElementById('polling-settings-link');
  if (pollingSettingsLink) pollingSettingsLink.addEventListener('click', () => { menuOpen = false; render(); openPollingSettingsEditor(); });

  const depboardLink = document.getElementById('depboard-link');
  if (depboardLink) depboardLink.addEventListener('click', () => { menuOpen = false; render(); openDepartureBoardView(); });

  const dayReturnPriceLink = document.getElementById('day-return-price-link');
  if (dayReturnPriceLink) dayReturnPriceLink.addEventListener('click', () => { menuOpen = false; render(); openDayReturnPriceEditor(); });

  const preferredGoogleLink = document.getElementById('preferred-google-link');
  if (preferredGoogleLink) preferredGoogleLink.addEventListener('click', () => { menuOpen = false; render(); openPreferredGoogleEditor(); });

  const backupRestoreLink = document.getElementById('backup-restore-link');
  if (backupRestoreLink) backupRestoreLink.addEventListener('click', () => { menuOpen = false; render(); openBackupRestore(); });

  const railConfigLink = document.getElementById('rail-config-link');
  if (railConfigLink) railConfigLink.addEventListener('click', () => { menuOpen = false; render(); openRailConfig(); });

  const confirmTrainLink = document.getElementById('confirm-train-link');
  if (confirmTrainLink) confirmTrainLink.addEventListener('click', () => { menuOpen = false; render(); openConfirmTrain(); });

  const statsLink = document.getElementById('stats-link');
  if (statsLink) statsLink.addEventListener('click', () => { menuOpen = false; render(); openStatsView(); });

  const perfHistoryLink = document.getElementById('perf-history-link');
  if (perfHistoryLink) perfHistoryLink.addEventListener('click', () => { menuOpen = false; render(); openPerformanceHistoryView(); });

  const delayClaimsLink = document.getElementById('delay-claims-link');
  if (delayClaimsLink) delayClaimsLink.addEventListener('click', () => { menuOpen = false; render(); openDelayClaimsManager(); });

  const passPhotoLink = document.getElementById('pass-photo-link');
  if (passPhotoLink) passPhotoLink.addEventListener('click', () => { menuOpen = false; render(); openPassPhotoManager(); });

  const enableNotificationsLink = document.getElementById('enable-notifications-link');
  if (enableNotificationsLink){
    enableNotificationsLink.addEventListener('click', () => {
      menuOpen = false;
      Notification.requestPermission().then(() => render());
    });
  }

  const connectGcalLink = document.getElementById('connect-gcal-link');
  if (connectGcalLink){
    connectGcalLink.addEventListener('click', async () => {
      menuOpen = false; render();
      if (GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')){
        alert('Google Calendar isn\'t set up yet. See the setup notes for what\'s needed.');
        return;
      }
      const token = await getGoogleAccessToken();
      if (token){
        gcalEnabled = true;
        await saveGcalEnabled();
        const nb = findNextBuyDateKey(today, todayKey);
        if (nb){ gcalPendingSync = true; await syncGoogleCalendarEvent(nb); }
        render();
      }
    });
  }
  const disconnectGcalLink = document.getElementById('disconnect-gcal-link');
  if (disconnectGcalLink){
    disconnectGcalLink.addEventListener('click', async () => {
      menuOpen = false;
      gcalEnabled = false;
      await saveGcalEnabled();
      await deleteGoogleCalendarEvent(); // otherwise the tracked reminder just sits on the real calendar forever, untouched by anything from this point on
      render();
    });
  }
  const calendarSyncPrompt = document.getElementById('calendar-sync-prompt');

  const likelyTrainYesBtn = document.getElementById('likely-train-yes-btn');
  if (likelyTrainYesBtn){
    likelyTrainYesBtn.addEventListener('click', async () => {
      const s = likelyTrainSuggestion;
      if (s){
        if (!confirmedTrains[s.dateKey]) confirmedTrains[s.dateKey] = {};
        confirmedTrains[s.dateKey][s.direction] = s.trainKey;
        await saveConfirmedTrains();
      }
      likelyTrainSuggestion = null;
      render();
    });
  }
  const likelyTrainNoBtn = document.getElementById('likely-train-no-btn');
  if (likelyTrainNoBtn){
    likelyTrainNoBtn.addEventListener('click', () => {
      if (likelyTrainSuggestion) dismissedLikelyTrainKeys.add(`${likelyTrainSuggestion.dateKey}-${likelyTrainSuggestion.direction}-${likelyTrainSuggestion.trainKey}`);
      likelyTrainSuggestion = null;
      render();
    });
  }

  if (calendarSyncPrompt){
    calendarSyncPrompt.addEventListener('click', async () => {
      let result;
      if (isCurrentlyInTicketGap(today, todayKey)){
        // Same reasoning as the automatic path — no active ticket right
        // now, so remove the tracked reminder rather than patch it
        // forward to a date nothing's actually confirmed yet.
        result = await deleteGoogleCalendarEvent();
      } else {
        const nb = findNextBuyDateKey(today, todayKey);
        result = nb ? await syncGoogleCalendarEvent(nb) : { ok: false, reason: 'no-buy-date-found' };
      }
      gcalLastSyncFailed = !result.ok;
      if (result.ok){
        alert(result.method === 'deleted' ? 'Calendar reminder removed — no active ticket to remind about.' : `Calendar ${result.method} for ${result.dateKey}\nEvent ID: ${result.eventId}`);
      } else {
        alert(`Calendar update failed: ${result.reason}${result.eventId ? `\nEvent ID used: ${result.eventId}` : ''}`);
      }
      render();
    });
  }

  const dismissBtn = document.getElementById('month-estimate-dismiss');
  if (dismissBtn){
    dismissBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      dismissedMonths[estMonthKey] = true;
      await saveDismissedMonths();
      render();
    });
  }
  const estimatePrevBtn = document.getElementById('estimate-prev');
  if (estimatePrevBtn){
    estimatePrevBtn.addEventListener('click', () => {
      estimateOffset = Math.max(0, estimateOffset - 1);
      render();
    });
  }
  const estimateNextBtn = document.getElementById('estimate-next');
  if (estimateNextBtn){
    estimateNextBtn.addEventListener('click', () => {
      estimateOffset = Math.min(24, estimateOffset + 1);
      render();
    });
  }
  const spendingCard = document.getElementById('spending-card');
  if (spendingCard){
    spendingCard.addEventListener('click', openManagePurchases);
  }
  const spendingCardDismiss = document.getElementById('spending-card-dismiss');
  if (spendingCardDismiss){
    spendingCardDismiss.addEventListener('click', async (e) => {
      e.stopPropagation(); // otherwise this bubbles up to the whole card's own click handler and opens Manage Purchases too
      ticketsSpentCardDismissed = true;
      await saveTicketsSpentCardDismissed();
      render();
    });
  }
  const parkingSavingsDismiss = document.getElementById('parking-savings-dismiss');
  if (parkingSavingsDismiss){
    parkingSavingsDismiss.addEventListener('click', async (e) => {
      e.stopPropagation();
      dismissedParkingSavingsPeriods[fmtKey(realCurrentPeriod.start)] = true;
      await saveDismissedParkingSavingsPeriods();
      render();
    });
  }
  const parkingSavingsPrevBtn = document.getElementById('parking-savings-prev');
  if (parkingSavingsPrevBtn){
    parkingSavingsPrevBtn.addEventListener('click', () => {
      parkingSavingsOffset -= 1;
      render();
    });
  }
  const parkingSavingsNextBtn = document.getElementById('parking-savings-next');
  if (parkingSavingsNextBtn){
    parkingSavingsNextBtn.addEventListener('click', () => {
      parkingSavingsOffset = Math.min(0, parkingSavingsOffset + 1); // never past the current period
      render();
    });
  }

  const showMoreBtn = document.getElementById('show-more-link');
  if (showMoreBtn){
    showMoreBtn.addEventListener('click', () => {
      state.daysAhead = Math.min(state.daysAhead + DAYS_AHEAD_STEP, MAX_DAYS_AHEAD);
      render();
    });
  }
  const showEarlierBtn = document.getElementById('show-earlier-link');
  if (showEarlierBtn){
    showEarlierBtn.addEventListener('click', () => {
      railDaysBack = Math.min(railDaysBack + RAIL_DAYS_BACK_STEP, RAIL_MAX_DAYS_BACK);
      render();
      railSyncMissingDates();
    });
  }
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function openDayEditor(key){
  const d = parseKey(key);
  const weekend = isWeekend(d);
  const current = comments[key] || '';
  const isTravelDay = !weekend && (current === '' || travelOverrides[key]);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${dateLabel(d)}</h3>
      <div class="sub">${weekend ? 'Weekend day — always skipped' : 'Add a reason this day doesn\'t count (or leave blank for a normal travel day)'}</div>
      <div class="chip-row" id="modal-chip-row">
        ${PRESET_TAGS.map(tag => `<div class="chip ${current.toUpperCase()===tag?'active':''}" data-tag="${tag}">${tag}</div>`).join('')}
        <div class="chip" data-tag="__clear">Clear</div>
      </div>
      <input type="text" id="modal-custom-comment" placeholder="Or type your own" value="${escapeHtml(current && !PRESET_TAGS.includes(current.toUpperCase()) ? current : '')}" />
      ${!weekend ? `
      <label style="display:flex; align-items:center; gap:8px; margin:12px 0 4px; font-size:14px; color:var(--ink-dim); cursor:pointer;">
        <input type="checkbox" id="modal-override-checkbox" ${travelOverrides[key] ? 'checked' : ''} style="width:16px; height:16px;" />
        I still used the ticket this day
      </label>` : ''}
      ${isTravelDay ? `
      <label style="display:flex; align-items:center; gap:8px; margin:12px 0 4px; font-size:14px; color:var(--ink-dim); cursor:pointer;">
        <input type="checkbox" id="modal-parked-checkbox" ${parkedDays[key] !== undefined ? 'checked' : ''} style="width:16px; height:16px;" />
        I parked today
      </label>
      <div id="modal-parked-cost-wrap" style="display:${parkedDays[key] !== undefined ? 'flex' : 'none'}; align-items:center; gap:8px; margin-bottom:8px;">
        <span style="font-size:13px; color:var(--ink-dim);">Cost (£)</span>
        <input type="number" id="modal-parked-cost-input" value="${(parkedDays[key] !== undefined ? parkedDays[key] : parkingCost).toFixed(2)}" step="0.01" min="0" style="width:100px;" />
      </div>` : ''}
      <button class="save-btn" id="modal-save-btn">Save</button>
      <div class="modal-close" id="modal-close-btn">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);

  function getOverrideChecked(){
    const cb = document.getElementById('modal-override-checkbox');
    return cb ? cb.checked : false;
  }

  const modalOverrideCb = document.getElementById('modal-override-checkbox');
  if (modalOverrideCb){
    modalOverrideCb.addEventListener('change', async () => {
      if (modalOverrideCb.checked) travelOverrides[key] = true; else delete travelOverrides[key];
      await saveTravelOverrides();
      render(); // safe: this overlay is attached to document.body, not #app, so it survives re-render
      if (modalOverrideCb.checked) railSyncMissingDates();
    });
  }

  const modalParkedCb = document.getElementById('modal-parked-checkbox');
  const modalParkedCostWrap = document.getElementById('modal-parked-cost-wrap');
  const modalParkedCostInput = document.getElementById('modal-parked-cost-input');
  if (modalParkedCb){
    modalParkedCb.addEventListener('change', async () => {
      if (modalParkedCb.checked){
        modalParkedCostWrap.style.display = 'flex';
        const val = parseFloat(modalParkedCostInput.value);
        parkedDays[key] = isNaN(val) ? parkingCost : val;
      } else {
        modalParkedCostWrap.style.display = 'none';
        delete parkedDays[key];
      }
      await saveParkedDays();
      render();
    });
  }
  if (modalParkedCostInput){
    // Editable per instance, not just at the moment of first marking —
    // the actual cost genuinely varies (a different car park, a
    // different rate), and this needs to be correctable any time the
    // day's revisited, not fixed at whatever was entered first.
    modalParkedCostInput.addEventListener('change', async () => {
      const val = parseFloat(modalParkedCostInput.value);
      if (!isNaN(val) && val >= 0 && parkedDays[key] !== undefined){
        parkedDays[key] = val;
        await saveParkedDays();
        render();
      }
    });
  }

  overlay.querySelectorAll('#modal-chip-row .chip').forEach(chip => {
    chip.addEventListener('click', async () => {
      const tag = chip.dataset.tag;
      if (tag === '__clear'){
        comments[key] = '';
        delete travelOverrides[key];
      } else {
        comments[key] = tag;
        document.getElementById('modal-custom-comment').value = '';
        if (getOverrideChecked()) travelOverrides[key] = true; else delete travelOverrides[key];
      }
      // If this day genuinely stopped being a travel day, any parking
      // record for it no longer makes sense — cleared alongside the tag
      // change rather than left as a stale, inconsistent leftover.
      const stillTravelDay = !weekend && (comments[key] === '' || travelOverrides[key]);
      if (!stillTravelDay) delete parkedDays[key];
      await saveComments();
      await saveTravelOverrides();
      await saveParkedDays();
      document.body.removeChild(overlay); render();
    });
  });
  document.getElementById('modal-save-btn').addEventListener('click', async () => {
    const val = document.getElementById('modal-custom-comment').value.trim();
    if (val !== ''){
      comments[key] = val;
      if (getOverrideChecked()) travelOverrides[key] = true; else delete travelOverrides[key];
      const stillTravelDay = !weekend && (comments[key] === '' || travelOverrides[key]);
      if (!stillTravelDay) delete parkedDays[key];
      await saveComments();
      await saveTravelOverrides();
      await saveParkedDays();
      document.body.removeChild(overlay); render();
    } else {
      document.body.removeChild(overlay);
    }
  });
  document.getElementById('modal-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

Welcome to your **8-Day Ticket Tracker**. This app tracks your Flexi Season Ticket usage, keeps an eye on live train journeys, checks historical performance for Delay Repay claims, syncs reminders to Google Calendar, and backs up your data automatically to Google Drive.

---

## 1. How Your Ticket Is Tracked

Your Flexi Season Ticket gives you **8 day-passes** to use within a **28-calendar-day window**.

* **Automatic Pass Allowance:** Every weekday (Monday to Thursday) automatically uses 1 pass from your 8-pass allowance unless you tag the day as a non-travel day.
* **Weekends:** Weekends are automatically skipped and never consume a pass.
* **The 28-Day Window:** Your 28-day validity period starts on the date you set when logging a new season ticket. The progress bar on the Home tab shows how many days have elapsed out of 28.
* **Ticket Expiry:** A ticket period finishes as soon as you either **use all 8 passes** OR **reach the 28th calendar day**, whichever happens first. Any unused passes remaining after 28 days expire and cannot be carried over.
* **Gap Days & Smart Renewal Prompts:** Once a ticket period ends, the app calculates when you next need to commute. It flags the evening before your next actual travel day as your "Buy Ticket" day — skipping non-working days or weekends in between so you never buy a ticket earlier than necessary.

---

## 2. Managing Your Daily Schedule

### Tagging Non-Travel Days
If you aren't commuting on a scheduled work day:
1. Tap any weekday on the Home tab or in the upcoming day list.
2. Choose a preset chip tag (**WFH**, **HOLIDAY**, **DENTIST**, **SICK**) or type a custom reason.
3. Tap **Save**. The pass allowance for that day is immediately restored, and your predicted renewal date adjusts automatically.

### Working Day Overrides
If you previously tagged a day as WFH or Holiday but ended up commuting anyway, tick the **"I still used the ticket today"** box on that day's editor. The app keeps your note on record while correctly deducting a pass.

### UK Bank Holidays
The app checks the official gov.uk bank holiday feed. Any public holiday falling on a weekday is automatically tagged as **BANK HOLIDAY** so you don't accidentally waste a pass on a public holiday.

---

## 3. Live Trains & Station Boards

The app connects directly to National Rail Darwin live feeds via a private proxy Worker.

### Live Trains Tab ("My Trains" & "Tracked")
Tap the **Live** tab on the bottom navigation bar to switch between two views:

1. **My Trains:** Displays real-time departure boards for your saved usual morning (Crewe to Wigan) and evening (Wigan to Crewe) commute times.
   * Shows departure times, platforms, delay minutes, and cancellation notices.
   * Tap any train row to open its full live journey timeline.

2. **Tracked Trains:** Shows up to 5 specific train services you are currently following.
   * Tap **Track a train** to search live departures or arrivals from any UK station by name or 3-letter station code (e.g. \`CRE\`, \`WGN\`, \`EUS\`).
   * Tap a train from the search results to start watching it. It remains in your Tracked list for up to 6 hours, allowing you to follow its progress long after it leaves your station.

### Real-Time Journey Progress
When you tap into any live train, the app opens a detailed timeline:
* **Live Progress Line & Blob:** An animated indicator moves down the station list based on real-time station departure reports.
* **Station Weather:** Real-time weather icons (sun, moon, clouds, rain, snow) and temperatures are fetched from Open-Meteo for upcoming stops. Clear sky icons switch to a moon at night using astronomical sunrise/sunset calculations.
* **Delay Explanations:** Real-time delay or cancellation reasons from National Rail are shown inline. The app filters out stale, repeated reasons from earlier stops, but you can tap *Show all reasons* to reveal everything.
* **Smart Adaptive Polling:** To save battery and data, the progress screen automatically slows its check-ins when departure is still far off, and speeds up polling when approaching the final destination. You can adjust these timing thresholds under **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Live progress polling**.

### Retro Station Board
For a full-screen, station-style departure and arrival display:
1. Tap **More** $\\rightarrow$ **Station board**.
2. Choose any UK station by name or 3-letter code.
3. The app renders a split-flap style board showing real-time departures and arrivals that automatically cycles through pages and updates every 30 seconds.

### Automatic Location Detection ("Is this your train?")
When you are within 500 metres of Crewe or Wigan station around your commute time, the app checks live departure boards:
* **Delayed / Unexpected Train (Mismatch Prompt):** If an earlier or delayed train is leaving right when you arrive, a banner asks: **"Is this your train?"** Tapping **"Yes, that's me"** updates your confirmed train record.
* **Automatic Silent Confirmation (Within 5 Minutes):** If you are at the station and your usual scheduled train is due to depart or arrive **within 5 minutes**, the app quietly confirms that train for you automatically — no manual tap required. A brief green banner appears at the top of the screen to let you know it has logged the journey. *(Note: If you arrive at the station more than 5 minutes before departure, the app holds off on auto-confirming until that 5-minute window opens, ensuring an early arrival doesn't lock in the wrong train prematurely).*

---

## 4. Delay Repay & Claims

The app automatically cross-references your past travel days against historical performance records via the Historical Service Performance (HSP) proxy Worker.

### Delay Indicators
* **Orange Dot:** Indicates that at least one of your configured usual trains suffered a delay of **15 minutes or more** on that date.
* **Red Dot:** Confirms a 15+ minute delay on a train you explicitly confirmed catching.

### Smartcard Pass (Photo and Number, for Delay Claims)
Avanti West Coast requires a photo of your ticket, and asks for your smartcard number, when submitting a Delay Repay claim.
1. Go to **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Smartcard pass**.
2. Upload a photo of your Flexi Season Ticket once. It is stored privately in your browser's IndexedDB storage.
3. Enter your smartcard number once — it's printed on the card itself.

### Submitting & Managing Claims
1. Tap a day with a delay indicator, or open **More** $\\rightarrow$ **Delay repay claims**.
2. Tap the highlighted red delay row. The app calculates your estimated payout based on standard Flexi 8 delay bands. (Note: Because a Flexi 8 ticket covers 16 individual single journeys, calculations are based on one-way leg values — so 15–29 mins pays 25%, 30–59 mins pays 50%, and 60+ mins pays 100% of a single leg's value).
3. Several things happen at once: Avanti's Delay Repay website opens in a new tab, your saved pass photo downloads to your device's Downloads folder, a **claim-details.txt** file also downloads there (train, delay, ticket price, and payout for whichever of your AM/PM journeys applied that day, plus your smartcard number) — and your smartcard number is copied straight to your clipboard, ready to paste into Avanti's form the moment its page loads.
4. A **Claim details** screen also appears in the app itself, showing the same information at a glance right away.
5. After submitting your claim on Avanti's site, check the **Confirmed** box in the app's Delay Repay manager to mark the claim as paid.

---

## 5. Logging Purchases & Ticket Advisor

### Logging Tickets
Open the **Buy** tab at the bottom of the screen:
* **Season Ticket:** Sets a new 8-use/28-day tracking cycle starting from your chosen date and records the cost.
* **Single Ticket:** Logs an individual day-return purchase without resetting or disturbing your main 8-pass cycle.

### Ticket Purchase Advisor
Before you buy a new season ticket, the advisor checks your upcoming calendar (accounting for WFH, holidays, and bank holidays). If you have fewer than 8 travel days planned in the next 28 days, it calculates whether buying individual day-return tickets would be cheaper than a full season ticket and gives you a clear recommendation.

---

## 6. Calendar Sync & Google Drive Backups

### Google Calendar Reminders
1. Tap **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Connect Google Calendar**.
2. The app syncs a single calendar event titled **"Buy train ticket"** set for 8:00 PM on the exact evening you need to buy your next pass.
3. If your predicted travel schedule shifts, the app automatically updates the event date.

### Automatic Google Drive Backups
1. Tap **More** $\\rightarrow$ **Backup & Restore**.
2. Enable **Automatically back up to Google Drive**.
3. Whenever you switch away from or close the app, it quietly checks if any data has changed. If changes were made and at least 30 minutes have passed since the last backup, it uploads a JSON file to a \`Ticket Tracker Backups\` folder in your Google Drive. It automatically keeps the 2 most recent backups and cleans up older ones.
4. You can also manually export or restore a backup \`.json\` file at any time.

---

## 7. Budgeting & Payday Planning

Under **Set aside on payday** on the Home tab:
* The app calculates your monthly pay period (taking the 28th of the month and adjusting backward for weekends or bank holidays).
* It counts how many season tickets and parking days fall within that pay window, multiplying them by your daily parking cost and ticket price.
* Use the **$\\langle$** and **$\\rangle$** arrows to preview future pay periods.
* You can update daily parking costs or day-return prices anytime under **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Costs**.

---

## Quick Reference Summary

| **Delay Repay Claims** | Log, manage, and confirm compensation claims for delayed journeys. |
| **Settings** | Configure usual train times, costs, polling frequency, pass photo, and Google sync. |

// Minimal, purpose-built Markdown renderer — covers exactly the subset
// HELP_GUIDE_MD actually uses (##/### headers, bold, bullet/numbered
// lists, tables, links, hr, inline code), not Markdown generally. Text
// content is escaped before any HTML is added, so the source can be
// trusted content (this app's own help text) without needing to treat
// it as arbitrary untrusted input.
function renderHelpMarkdown(md){
  const cleaned = md
    .replace(/\$\\rightarrow\$/g, '→')
    .replace(/\$\\langle\$/g, '‹')
    .replace(/\$\\rangle\$/g, '›');
  const lines = cleaned.split('\n');
  let html = '';
  let inList = null; // 'ul' | 'ol' | null
  function closeList(){ if (inList){ html += `</${inList}>`; inList = null; } }
  function inlineMd(text){
    let t = escapeHtml(text);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  let i = 0;
  while (i < lines.length){
    const trimmed = lines[i].trim();

    if (trimmed.startsWith('|') && lines[i+1] && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(lines[i+1].trim())){
      closeList();
      const splitRow = (row) => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const headerCells = splitRow(trimmed);
      html += '<table class="help-table"><thead><tr>' + headerCells.map(c => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith('|')){
        const rowCells = splitRow(lines[i]);
        html += '<tr>' + rowCells.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>';
        i++;
      }
      html += '</tbody></table>';
      continue;
    }

    if (trimmed === '---'){ closeList(); html += '<hr>'; i++; continue; }
    if (trimmed === ''){ closeList(); i++; continue; }

    let m;
    if ((m = trimmed.match(/^####\s+(.*)$/))){ closeList(); html += `<h4>${inlineMd(m[1])}</h4>`; i++; continue; }
    if ((m = trimmed.match(/^###\s+(.*)$/))){ closeList(); html += `<h4>${inlineMd(m[1])}</h4>`; i++; continue; }
    if ((m = trimmed.match(/^##\s+(.*)$/))){ closeList(); html += `<h3>${inlineMd(m[1])}</h3>`; i++; continue; }
    if ((m = trimmed.match(/^#\s+(.*)$/))){ closeList(); html += `<h2>${inlineMd(m[1])}</h2>`; i++; continue; }

    if ((m = trimmed.match(/^[*-]\s+(.*)$/))){
      if (inList !== 'ul'){ closeList(); html += '<ul>'; inList = 'ul'; }
      html += `<li>${inlineMd(m[1])}</li>`;
      i++; continue;
    }
    if ((m = trimmed.match(/^\d+\.\s+(.*)$/))){
      if (inList !== 'ol'){ closeList(); html += '<ol>'; inList = 'ol'; }
      html += `<li>${inlineMd(m[1])}</li>`;
      i++; continue;
    }

    closeList();
    html += `<p>${inlineMd(trimmed)}</p>`;
    i++;
  }
  closeList();
  return html;
}

function openGeofenceSettingsEditor(cameFromSettings){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Geofence radius</h3>
      <div class="sub">How close you need to be to a station before the app will silently confirm a train or suggest one. Tighter catches false positives (like a nearby office on your walk in), but too tight risks missing a real detection if GPS wanders once you're on the platform itself.</div>

      <div style="margin-top:14px; font-size:13px; color:var(--ink-dim);">Crewe radius (metres)</div>
      <input type="number" id="geofence-crewe-input" value="${geofenceRadiusCrewe}" step="10" min="${GEOFENCE_RADIUS_MIN_M}" max="${GEOFENCE_RADIUS_MAX_M}" style="margin-bottom:6px;" />
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim); margin-bottom:16px; cursor:pointer; -webkit-user-select:none; user-select:none;">
        <input type="checkbox" id="geofence-crewe-match" ${geofenceCreweMatchesWigan ? 'checked' : ''} /> Match Wigan
      </label>

      <div style="font-size:13px; color:var(--ink-dim);">Wigan radius (metres)</div>
      <input type="number" id="geofence-wigan-input" value="${geofenceRadiusWigan}" step="10" min="${GEOFENCE_RADIUS_MIN_M}" max="${GEOFENCE_RADIUS_MAX_M}" style="margin-bottom:6px;" />
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim); margin-bottom:12px; cursor:pointer; -webkit-user-select:none; user-select:none;">
        <input type="checkbox" id="geofence-wigan-match" ${geofenceWiganMatchesCrewe ? 'checked' : ''} /> Match Crewe
      </label>

      <button class="save-btn" id="geofence-settings-save">Save</button>
      <div class="modal-close" id="geofence-settings-close">${cameFromSettings ? '← Back to Settings' : 'Cancel'}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  const creweInput = document.getElementById('geofence-crewe-input');
  const wiganInput = document.getElementById('geofence-wigan-input');
  const creweMatch = document.getElementById('geofence-crewe-match');
  const wiganMatch = document.getElementById('geofence-wigan-match');

  // Reflects the active sync direction (if any) in the fields themselves —
  // the "driven" field is disabled and kept showing the other one's value,
  // so it's visually obvious which side is in control before Save is even
  // pressed.
  function applyMatchUI(){
    creweInput.disabled = creweMatch.checked;
    wiganInput.disabled = wiganMatch.checked;
    if (creweMatch.checked) creweInput.value = wiganInput.value;
    if (wiganMatch.checked) wiganInput.value = creweInput.value;
  }
  applyMatchUI();

  creweMatch.addEventListener('change', () => {
    // Mutually exclusive — at most one direction of sync active at a
    // time, or the two fields would each be trying to drive the other.
    if (creweMatch.checked) wiganMatch.checked = false;
    applyMatchUI();
  });
  wiganMatch.addEventListener('change', () => {
    if (wiganMatch.checked) creweMatch.checked = false;
    applyMatchUI();
  });
  creweInput.addEventListener('input', () => { if (wiganMatch.checked) wiganInput.value = creweInput.value; });
  wiganInput.addEventListener('input', () => { if (creweMatch.checked) creweInput.value = wiganInput.value; });

  document.getElementById('geofence-settings-save').addEventListener('click', async () => {
    const creweVal = parseInt(creweInput.value, 10);
    const wiganVal = parseInt(wiganInput.value, 10);
    if (isNaN(creweVal) || isNaN(wiganVal)) return;
    geofenceCreweMatchesWigan = creweMatch.checked;
    geofenceWiganMatchesCrewe = wiganMatch.checked;
    // Resolve to the actual effective numbers before storing — the
    // geofence check (and anything else reading these later, including a
    // future Wear OS companion) only ever needs two plain radii, not the
    // sync relationship that produced them.
    if (geofenceCreweMatchesWigan){
      geofenceRadiusWigan = clampGeofenceRadius(wiganVal);
      geofenceRadiusCrewe = geofenceRadiusWigan;
    } else if (geofenceWiganMatchesCrewe){
      geofenceRadiusCrewe = clampGeofenceRadius(creweVal);
      geofenceRadiusWigan = geofenceRadiusCrewe;
    } else {
      geofenceRadiusCrewe = clampGeofenceRadius(creweVal);
      geofenceRadiusWigan = clampGeofenceRadius(wiganVal);
    }
    await saveGeofenceSettings();
    document.body.removeChild(overlay);
    if (cameFromSettings) openSettingsMenu(); else render();
  });
  document.getElementById('geofence-settings-close').addEventListener('click', () => {
    document.body.removeChild(overlay);
    if (cameFromSettings) openSettingsMenu();
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay){
      document.body.removeChild(overlay);
      if (cameFromSettings) openSettingsMenu();
    }
  });
}

// Builds one row's worth of display data from a raw Darwin board entry,
// for the retro departure-board view. Shared between the departures and
// arrivals panels — isArrivals picks which time/place fields matter.
function depBoardRowData(s, isArrivals){
  const time = isArrivals ? (s.sta || '?') : (s.std || '?');
  // On a departures row, "via" (present on destination[0] whenever a
  // service's route needs disambiguating — confirmed against real
  // responses, e.g. "Cardiff Central via Shrewsbury") is exactly what a
  // real board shows alongside the destination. There's no equivalent
  // field for an arrival's origin side, so this only ever applies going
  // one way.
  let place;
  if (isArrivals){
    place = (s.origin && s.origin[0] && s.origin[0].locationName) || '?';
  } else {
    const dest = s.destination && s.destination[0];
    place = dest ? `${dest.locationName || '?'}${dest.via ? ` ${dest.via}` : ''}` : '?';
  }
  const platform = s.platform || '';
  let expected;
  if (s.isCancelled){
    expected = 'Cancelled';
  } else {
    const liveField = isArrivals ? s.eta : s.etd;
    expected = (!liveField || liveField === 'On time') ? 'On time' : liveField;
  }
  // The closest real equivalent to a classic board's occasional note row
  // (e.g. "Calls at Didcot Parkway") — Darwin doesn't give a curated list
  // of "principal" calling points to reproduce that specific convention
  // faithfully, but a genuine delay/cancellation reason is real data and
  // serves the same "extra line under this service" purpose.
  const note = s.isCancelled ? (s.cancelReason || '') : (s.delayReason || '');
  return { time, place, platform, expected, note, isCancelled: !!s.isCancelled };
}

  const SESSION_LENGTH_MS = 3 * 60 * 1000;
  const REFRESH_INTERVAL_MS = 30 * 1000;
  const PAGE_CYCLE_MS = 6 * 1000;

  let active = true;
  let depRows = [], arrRows = [];
  let depPage = 0, arrPage = 0;
  let dataTimer = null;
  let sessionTimeout = null;
  let pageCycleTimer = null;
  let clockTimer = null;
  let stationCrs = null, stationName = '';
  let depFetchError = null, arrFetchError = null;

  function stopPolling(){
    if (dataTimer){ clearInterval(dataTimer); dataTimer = null; }
    if (sessionTimeout){ clearTimeout(sessionTimeout); sessionTimeout = null; }
    if (pageCycleTimer){ clearInterval(pageCycleTimer); pageCycleTimer = null; }
    if (clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  }
  function teardown(){
    active = false;
    stopPolling();
    document.removeEventListener('visibilitychange', onVisibilityChange);
  }
  // Leaving the screen — closing it outright, or just switching away
  // from the tab/app — stops polling immediately, same discipline as
  // the train-progress screen. A board left open in the background has
  // no reason to keep refreshing twice a minute.
  function onVisibilityChange(){
    if (document.visibilityState === 'hidden') stopPolling();
    else if (active && overlay.isConnected && !dataTimer && !sessionTimeout) startSession();
  }
  document.addEventListener('visibilitychange', onVisibilityChange);
  document.getElementById('depboard-close-btn').addEventListener('click', () => {
    teardown();
    if (overlay.isConnected) document.body.removeChild(overlay);
  });

  function renderPanel(panelId, title, rows, page, isArrivals, fetchError){
    const panel = document.getElementById(panelId);
    if (!panel) return;
    const totalPages = Math.max(1, Math.ceil(rows.length / ROWS_PER_PAGE));
    const safePage = page % totalPages;
    const pageRows = rows.slice(safePage * ROWS_PER_PAGE, safePage * ROWS_PER_PAGE + ROWS_PER_PAGE);
    const clock = new Date().toLocaleTimeString('en-GB', { hour12: false });
    // A failed fetch is shown outright rather than quietly presented as
    // an empty board — this is the actual content of the screen, not a
    // decorative extra, so silently hiding *why* it's empty just hides
    // a real problem behind what looks like a legitimately quiet board.
    const rowsHtml = fetchError
      ? `<div style="padding:10px 0; color:#ff6a5a; font-size:12px;">Couldn't load: ${escapeHtml(fetchError)}</div>`
      : (pageRows.length ? pageRows.map(s => {
      const d = depBoardRowData(s, isArrivals);
      const noteHtml = d.note ? `<div class="depboard-note-row">${escapeHtml(d.note)}</div>` : '';
      return `<div class="depboard-row${d.isCancelled ? ' cancelled' : ''}">
        <span>${escapeHtml(d.time)}</span>
        <span>${escapeHtml(d.place)}</span>
        <span>${escapeHtml(d.platform)}</span>
        <span>${escapeHtml(d.expected)}</span>
      </div>${noteHtml}`;
    }).join('') : `<div style="padding:10px 0; opacity:0.7;">No services currently shown</div>`);
    panel.innerHTML = `
      <div class="depboard-title">${escapeHtml(stationName)} — ${title}</div>
      <div class="depboard-header-row">
        <span>Time</span><span>${isArrivals ? 'From' : 'Destination'}</span><span>Plat</span><span>Expected</span>
      </div>
      <div class="depboard-rows-wrap">${rowsHtml}</div>
      <div class="depboard-footer">
        <span>Page ${safePage + 1} of ${totalPages}</span>
        <span>${clock}</span>
      </div>
    `;
  }
  function renderBoth(){
    if (!active) return;
    renderPanel('depboard-dep-panel', 'Departures', depRows, depPage, false, depFetchError);
    renderPanel('depboard-arr-panel', 'Arrivals', arrRows, arrPage, true, arrFetchError);
  }

  async function fetchData(){
    if (!stationCrs) return;
    // Fetched independently (not a single combined try/catch) so one
    // board failing doesn't hide data the other genuinely got back —
    // and each panel gets its own specific error rather than one vague
    // failure blamed on both.
    const [depResult, arrResult] = await Promise.allSettled([
      fetchPureBoard(stationCrs, 'dep', 30),
      fetchPureBoard(stationCrs, 'arr', 30)
    ]);
    if (!active) return;
    if (depResult.status === 'fulfilled'){ depRows = depResult.value; depFetchError = null; }
    else { depFetchError = depResult.reason.message; }
    if (arrResult.status === 'fulfilled'){ arrRows = arrResult.value; arrFetchError = null; }
    else { arrFetchError = arrResult.reason.message; }
    // Only reset a page if the new row count actually makes the current
    // one invalid — not unconditionally on every 30-second poll. The
    // old version zeroed both every single fetch, fighting the separate
    // page-cycle timer so hard that a page only ever reached its true
    // maximum after the whole session had already ended.
    const depTotalPages = Math.max(1, Math.ceil(depRows.length / ROWS_PER_PAGE));
    const arrTotalPages = Math.max(1, Math.ceil(arrRows.length / ROWS_PER_PAGE));
    if (depPage >= depTotalPages) depPage = 0;
    if (arrPage >= arrTotalPages) arrPage = 0;
    renderBoth();
  }

  function showRefreshButton(){
    const wrap = document.getElementById('depboard-refresh-wrap');
    if (!wrap) return;
    // Same icon-based style already established for the Tracked list's
    // own refresh action, rather than the plain "↻ Refresh" text this
    // used before — one consistent look for "refresh this" across the
    // app instead of two different ones.
    wrap.innerHTML = `<span id="depboard-refresh-btn" style="display:inline-flex; align-items:center; gap:6px; color:var(--good); font-size:14px; font-weight:700; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">${REFRESH_ICON} Refresh</span>`;
    const btn = document.getElementById('depboard-refresh-btn');
    if (btn) btn.addEventListener('click', () => { if (active) startSession(); });
  }

  function startSession(){
    const wrap = document.getElementById('depboard-refresh-wrap');
    if (wrap) wrap.innerHTML = ''; // dropped while a session is live — reappears once it ends
    if (dataTimer){ clearInterval(dataTimer); dataTimer = null; }
    if (sessionTimeout){ clearTimeout(sessionTimeout); sessionTimeout = null; }
    fetchData();
    dataTimer = setInterval(fetchData, REFRESH_INTERVAL_MS);
    sessionTimeout = setTimeout(() => {
      if (dataTimer){ clearInterval(dataTimer); dataTimer = null; }
      sessionTimeout = null;
      showRefreshButton();
    }, SESSION_LENGTH_MS);
  }

  document.getElementById('depboard-show-btn').addEventListener('click', () => {
    stationCrs = picker.getCode();
    stationName = picker.getName() || stationCrs;
    if (!stationCrs) return;
    document.getElementById('depboard-picker-step').style.display = 'none';
    const displayStep = document.getElementById('depboard-display-step');
    displayStep.style.display = 'flex';
    // Ticks the visible clock every second, and separately advances
    // which page each panel is showing every few seconds if there's
    // more than one — independent of the 30-second data refresh, same
    // as a real board's clock keeps moving between actual data changes.
    clockTimer = setInterval(renderBoth, 1000);
    pageCycleTimer = setInterval(() => {
      const depTotalPages = Math.max(1, Math.ceil(depRows.length / ROWS_PER_PAGE));
      const arrTotalPages = Math.max(1, Math.ceil(arrRows.length / ROWS_PER_PAGE));
      depPage = (depPage + 1) % depTotalPages;
      arrPage = (arrPage + 1) % arrTotalPages;
    }, PAGE_CYCLE_MS);
    startSession();
  });
}

// Deliberately excludes: confirmed-point-status-cache, silent-confirm-banner
// (transient UI/derived state, not something a restore needs), and
// drive-backup-dirty/drive-backup-last-time (the backup mechanism's own
// internal bookkeeping, not app data). Also excludes reason-codes-cache,
// rail-synced-days, and rail-history-days-back — all genuinely
// disposable: reason-codes-cache re-fetches itself when stale; rail-
// synced-days is just "have we asked HSP about this date" bookkeeping,
// not a value in itself (losing it means some already-known weekdays get
// harmlessly re-queried once, nothing more); rail-history-days-back is
// just how far the Performance history page currently reaches, trivially
// regrown via its own "Load more history" button. rail-perf-cache itself
// DOES stay in the backup, unlike those — it's the actual historical
// values, and HSP's retention window means a badly-delayed restore could
// otherwise lose real history permanently, not just re-fetch it. Also
// excludes the smartcard pass photo entirely — that lives in IndexedDB,
// not localStorage, and isn't covered by this mechanism at all. If any
// of this ever needs to change, the messaging around what a backup
// contains needs updating alongside it, not just this list.
const BACKUP_KEYS = [
  'alternative-routes','bank-holidays-cache','confirmed-trains','debug-mode-enabled','delay-claims',
  'dismissed-parking-savings-periods','drive-backup-enabled','drive-backup-folder-id',
  'emergency-tab-visible',
  'gcal-enabled','gcal-event-id','gcal-pending-sync',
  'geofence-crewe-matches-wigan','geofence-radius-crewe','geofence-radius-wigan','geofence-wigan-matches-crewe',
  'parked-days','parking-savings-snapshots',
  'payday-estimate-snapshots','poll-before-departure-min','poll-check-in-interval-min','preferred-google-email',
  'produce-claim-details-file','rail-perf-cache','rail-trains','smartcard-number',
  'ticket-comments','ticket-day-return-price','ticket-dismissed-months',
  'ticket-last-notified-buy-key','ticket-last-price','ticket-parking-cost',
  'ticket-period-start','ticket-purchases','ticket-seed-imported','ticket-travel-overrides',
  'tickets-spent-card-dismissed','tracked-trains','weather-enabled'
];

function exportBackup(){
  const backup = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  BACKUP_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) backup.data[k] = v;
  });
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ticket-tracker-backup-${fmtKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    : 'Never yet';
  overlay.innerHTML = `

      <h3>Backup &amp; restore</h3>
      <div class="sub">Export everything the app knows to a file you can keep safe (e.g. before switching phones), or restore from a previous export. Restoring replaces all current data.</div>
      <button class="save-btn" id="backup-export-btn">Export backup</button>

      </label>
      <div class="sub" style="margin-bottom:10px;">Backs up whenever you leave the app, if something's changed and it's been at least 30 minutes since the last one. Keeps the 2 most recent backups in a "Ticket Tracker Backups" folder.</div>
      <div id="drive-backup-status" style="font-size:13px; color:var(--ink-dim); margin-bottom:10px;">Last backup: ${lastBackupLabel}</div>
      <button class="save-btn" id="drive-backup-now-btn" ${driveBackupEnabled ? '' : 'disabled'}>Back up now</button>

      <div class="modal-close" id="backup-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('backup-export-btn').addEventListener('click', exportBackup);

  const driveToggle = document.getElementById('drive-backup-toggle');
  const driveStatus = document.getElementById('drive-backup-status');
  const driveNowBtn = document.getElementById('drive-backup-now-btn');

  driveToggle.addEventListener('change', async () => {
    if (driveToggle.checked){
      driveStatus.textContent = 'Connecting…';
      const token = await getGoogleAccessToken();
      if (!token){
        driveStatus.textContent = 'Could not connect to Google Drive.';
        driveToggle.checked = false;
        return;
      }
      driveBackupEnabled = true;
      await saveDriveBackupEnabled();
      driveNowBtn.disabled = false;
      driveStatus.textContent = 'Connected — running first backup…';
      const result = await attemptDriveBackup(true);
      driveStatus.textContent = result.ok
        ? `Last backup: ${new Date(lastDriveBackupTime).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`
        : `First backup failed: ${result.reason}`;
    } else {
      driveBackupEnabled = false;
      await saveDriveBackupEnabled();
      driveNowBtn.disabled = true;
      driveStatus.textContent = 'Automatic backup turned off.';
    }
  });

  driveNowBtn.addEventListener('click', async () => {
    driveStatus.textContent = 'Backing up…';
    const result = await attemptDriveBackup(true);
    driveStatus.textContent = result.ok
      ? `Last backup: ${new Date(lastDriveBackupTime).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`
      : `Backup failed: ${result.reason}`;
  });

  document.getElementById('backup-import-btn').addEventListener('click', () => {
    const fileInput = document.getElementById('backup-import-input');
    const status = document.getElementById('backup-status');
    const file = fileInput.files[0];
    if (!file){ status.textContent = 'Choose a file first.'; return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ status.textContent = 'Could not read that file — is it a valid backup?'; return; }
      if (!parsed || typeof parsed.data !== 'object'){
        status.textContent = 'That doesn\'t look like a valid backup file.';
        return;
      }
      if (!confirm('This will replace all current app data with the contents of this backup. Continue?')){
        return;
      }
      // A restore is a replacement, not a merge. Clear known app data first
      // so keys that existed only in the current device cannot survive the restore.
      BACKUP_KEYS.forEach(key => {
        try{ localStorage.removeItem(key); }catch(err){ /* ignore individual key failures */ }
      });
      for (const key of BACKUP_KEYS){
        if (!Object.prototype.hasOwnProperty.call(parsed.data, key)) continue;
        try{ localStorage.setItem(key, parsed.data[key]); }catch(err){ /* ignore individual key failures */ }
      }
      status.textContent = 'Restored — reloading…';
      await loadData();
      document.body.removeChild(overlay);
      render();
    };
    reader.readAsText(file);
  });

  document.getElementById('backup-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}
