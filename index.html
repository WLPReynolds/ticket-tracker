const BACKUP_KEYS = [
  'bank-holidays-cache','confirmed-trains','debug-mode-enabled','delay-claims',
  'drive-backup-enabled','drive-backup-folder-id','gcal-enabled','gcal-event-id',
  'gcal-pending-sync','preferred-google-email','rail-perf-cache','rail-trains',
  'ticket-comments','ticket-day-return-price','ticket-dismissed-months',
  'ticket-last-notified-buy-key','ticket-last-price','ticket-parking-cost',
  'ticket-period-start','ticket-purchases','ticket-seed-imported','ticket-travel-overrides',
  'tracked-trains','tracked-trains-last-day'
];

function exportBackup(){
  const backup = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  BACKUP_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) backup.data[k] = v;
  });
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ticket-tracker-backup-${fmtKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        driveStatus.textContent = 'Could not connect to Google Drive.';
        driveToggle.checked = false;
        return;
      }
      driveBackupEnabled = true;
      await saveDriveBackupEnabled();
      driveNowBtn.disabled = false;
      driveStatus.textContent = 'Connected — running first backup…';
      const result = await attemptDriveBackup(true);
      driveStatus.textContent = result.ok
        ? `Last backup: ${new Date(lastDriveBackupTime).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`
        : `First backup failed: ${result.reason}`;
    } else {
      driveBackupEnabled = false;
      await saveDriveBackupEnabled();
      driveNowBtn.disabled = true;
      driveStatus.textContent = 'Automatic backup turned off.';
    }
  });

  driveNowBtn.addEventListener('click', async () => {
    driveStatus.textContent = 'Backing up…';
    const result = await attemptDriveBackup(true);
    driveStatus.textContent = result.ok
      ? `Last backup: ${new Date(lastDriveBackupTime).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`
      : `Backup failed: ${result.reason}`;
  });

  document.getElementById('backup-import-btn').addEventListener('click', () => {
    const fileInput = document.getElementById('backup-import-input');
    const status = document.getElementById('backup-status');
    const file = fileInput.files[0];
    if (!file){ status.textContent = 'Choose a file first.'; return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ status.textContent = 'Could not read that file — is it a valid backup?'; return; }
      if (!parsed || typeof parsed.data !== 'object'){
        status.textContent = 'That doesn\'t look like a valid backup file.';
        return;
      }
      if (!confirm('This will replace all current app data with the contents of this backup. Continue?')){
        return;
      }
      // A restore is a replacement, not a merge. Clear known app data first
      // so keys that existed only in the current device cannot survive the restore.
      BACKUP_KEYS.forEach(key => {
        try{ localStorage.removeItem(key); }catch(err){ /* ignore individual key failures */ }
      });
      for (const key of BACKUP_KEYS){
        if (!Object.prototype.hasOwnProperty.call(parsed.data, key)) continue;
        try{ localStorage.setItem(key, parsed.data[key]); }catch(err){ /* ignore individual key failures */ }
      }
      status.textContent = 'Restored — reloading…';
      await loadData();
      document.body.removeChild(overlay);
      render();
    };
    reader.readAsText(file);
  });

  document.getElementById('backup-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

async function fetchLiveBoards(){
  // Query each unique route (fromLoc/toLoc pair) once, rather than once
  // per configured train — several trains often share the same route.
  const uniquePairs = [];
  const seen = new Set();
  railTrains.forEach(t => {
    const key = `${t.fromLoc}-${t.toLoc}`;
    if (!seen.has(key)){ seen.add(key); uniquePairs.push({ fromLoc: t.fromLoc, toLoc: t.toLoc }); }
  });
  if (uniquePairs.length === 0) return {};

  const resp = await fetch(DARWIN_WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      queries: uniquePairs.map(p => ({ crs: p.fromLoc, filterCrs: p.toLoc, filterType: 'to' }))
    })
  });
  if (!resp.ok) throw new Error(`Darwin request failed: ${resp.status}`);
  const data = await resp.json();

  const boards = {}; // "FROM-TO" -> array of trainServices
  (data.results || []).forEach(r => {
    const key = `${r.query.crs}-${r.query.filterCrs}`;
    boards[key] = (r.ok && r.data && r.data.trainServices) || [];
  });
  return boards;
}

// Same idea as fetchLiveBoards, but for an arbitrary station pair rather
// than the ones in railTrains — used only by the debug "track any train"
// tool, so testing tracking/refresh behaviour isn't limited to whichever
// of the user's own routes happen to have a live service running.
async function fetchDebugBoard(fromCrs, toCrs){
  const query = toCrs ? { crs: fromCrs, filterCrs: toCrs, filterType: 'to' } : { crs: fromCrs };
  const resp = await fetch(DARWIN_WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ queries: [query] })
  });
  if (!resp.ok) throw new Error(`Darwin request failed: ${resp.status}`);
  const data = await resp.json();
  const r = (data.results || [])[0];
  if (!r || !r.ok) throw new Error((r && r.reason) || 'No board data returned');
  return (r.data && r.data.trainServices) || [];
}

// Tracks one specific train by its serviceID, independent of any
// station's rolling board window — works for as long as Darwin still
// has the service, regardless of how far past its departure station
// the train has travelled.
async function fetchServiceDetails(serviceId){
  let resp;
  try{
    resp = await fetch(DARWIN_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ queries: [{ type: 'serviceDetails', serviceId }] })
    });
  }catch(networkErr){
    // The fetch itself failed — no connectivity, DNS, Worker unreachable.
    // This says nothing about whether the service itself still exists,
    // so it's always transient.
    const err = new Error(`Network error contacting Darwin: ${networkErr.message}`);
    err.transient = true;
    throw err;
  }
  if (!resp.ok){
    // An HTTP-level failure from the Worker (rate limit, gateway error,
    // etc.) — a server-side hiccup, not evidence the service is gone.
    const err = new Error(`Darwin request failed: ${resp.status}`);
    err.transient = true;
    throw err;
  }
  const data = await resp.json();
  const r = (data.results || [])[0];
  if (!r || !r.ok || !r.data){
    // A specific reason from the Worker means Darwin was actually
    // reached and gave a definitive answer about this service — the one
    // case we can be reasonably confident means it's genuinely gone.
    // Anything else (empty/malformed response) is treated as transient,
    // since we can't actually tell what happened.
    const err = new Error((r && (r.reason || `status ${r.status}`)) || 'No service data returned — this train may no longer be tracked by Darwin');
    err.transient = !(r && r.reason);
    throw err;
  }
  return r.data;
}

// Gets a one-off position without prompting unnecessarily — only called
// when we're already inside a relevant time window, so the permission
// prompt (if it appears at all) shows up with context, not on every
// random app open.
function getCurrentPositionOnce(){
  return new Promise((resolve) => {
    if (!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos.coords),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

// Converts a train's live status (etd/eta, or "On time") for today into
// an actual Date object, so it can be compared against the current time.
function liveTimeToDate(hhmm, referenceDate){
  if (!hhmm || hhmm.length < 4) return null;
  const h = parseInt(hhmm.slice(0,2), 10), m = parseInt(hhmm.slice(2,4), 10);
  if (isNaN(h) || isNaN(m)) return null;
  const d = new Date(referenceDate);
  d.setHours(h, m, 0, 0);
  return d;
}

// The core check: are you plausibly at the station right now, and is an
// earlier (delayed) configured train about to leave in place of your
// nominally-expected one? Deliberately conservative — only fires when
// there's a genuine, geofenced, time-window-matched mismatch, not on
// every open.
async function checkLikelyTrain(){
  if (!railTrains || railTrains.length === 0) return;
  const now = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate(),
                        new Date().getHours(), new Date().getMinutes());
  const todayKeyLocal = fmtKey(now);
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  for (const direction of ['AM', 'PM']){
    const dirTrains = railTrains.filter(t => t.direction === direction).sort((a,b) => a.time.localeCompare(b.time));
    if (dirTrains.length === 0) continue;

    // Skip entirely if we're nowhere near any configured time for this
    // direction — avoids pointless API calls and geolocation prompts
    // outside commute hours.
    const inWindow = dirTrains.some(t => {
      const tMin = parseInt(t.time.slice(0,2),10)*60 + parseInt(t.time.slice(2,4),10);
      return Math.abs(nowMinutes - tMin) <= LIKELY_TRAIN_TIME_WINDOW_MIN;
    });
    if (!inWindow) continue;

    // Already confirmed for this direction today — nothing to detect.
    if (confirmedTrains[todayKeyLocal] && confirmedTrains[todayKeyLocal][direction] !== undefined) continue;

    const fromLoc = dirTrains[0].fromLoc;
    const stationCoord = STATION_COORDS[fromLoc];
    if (!stationCoord) continue;

    const pos = await getCurrentPositionOnce();
    if (!pos) continue; // no permission or unavailable — skip silently
    const distM = distanceKm(pos.latitude, pos.longitude, stationCoord.lat, stationCoord.lon) * 1000;
    if (distM > GEOFENCE_RADIUS_M) continue; // not plausibly at the station

    let boards;
    try{ boards = await fetchLiveBoards(); }catch(e){ continue; }
    const board = boards[`${dirTrains[0].fromLoc}-${dirTrains[0].toLoc}`] || [];

    // Which configured train is nominally "current" if everything ran on
    // schedule — the earliest one whose scheduled time hasn't yet passed
    // by more than a few minutes.
    const nominal = dirTrains.find(t => {
      const tMin = parseInt(t.time.slice(0,2),10)*60 + parseInt(t.time.slice(2,4),10);
      return tMin >= nowMinutes - 5;
    }) || dirTrains[dirTrains.length - 1];

    // Which configured train's live departure is actually closest to
    // happening right now — the one you're plausibly boarding.
    let closest = null, closestDiff = Infinity;
    dirTrains.forEach(t => {
      const wanted = `${t.time.slice(0,2)}:${t.time.slice(2,4)}`;
      const service = board.find(s => s.std === wanted);
      if (!service) return;
      const liveTime = liveTimeToDate(
        (service.etd && service.etd !== 'On time') ? service.etd.replace(':','') : t.time,
        now
      );
      if (!liveTime) return;
      const diffMin = Math.abs((liveTime - now) / 60000);
      if (diffMin <= 15 && diffMin < closestDiff){
        closest = t; closestDiff = diffMin;
      }
    });

    if (closest && closest.key !== nominal.key){
      // A genuine surprise — you appear to be catching a different train
      // than expected. This needs your confirmation, since it's a real
      // ambiguity we can't resolve on our own.
      const suggestionId = `${todayKeyLocal}-${direction}-${closest.key}`;
      if (dismissedLikelyTrainKeys.has(suggestionId)) continue;
      likelyTrainSuggestion = { dateKey: todayKeyLocal, direction, trainKey: closest.key, label: closest.label };
      showLocalNotification('Is this your train?', `Looks like you might be on the delayed ${closest.label} instead of your usual one — open the app to confirm.`);
      render();
      return; // one interactive suggestion at a time is plenty
    } else if (closest && closest.key === nominal.key){
      // No surprise — you're at the station, and the train that's actually
      // about to leave is the one you'd expect anyway. Nothing ambiguous
      // to ask about, so just quietly confirm it.
      if (!confirmedTrains[todayKeyLocal]) confirmedTrains[todayKeyLocal] = {};
      confirmedTrains[todayKeyLocal][direction] = closest.key;
      saveConfirmedTrains();
      render();
    }
  }
}

function startLikelyTrainChecks(){
  if (likelyTrainCheckTimer) return;
  checkLikelyTrain();
  likelyTrainCheckTimer = setInterval(checkLikelyTrain, LIKELY_TRAIN_CHECK_INTERVAL_MS);
}
function stopLikelyTrainChecks(){
  if (likelyTrainCheckTimer){ clearInterval(likelyTrainCheckTimer); likelyTrainCheckTimer = null; }
}

    trains.forEach(t => {

  });

    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openTrackedTrains(){
  const overlay = document.createElement('div');
  // Keep the bottom nav visible, but reserve its height inside this
  // bottom-sheet so the Close control cannot be covered by the nav.
  overlay.className = 'modal-overlay modal-overlay-nav-safe';

  function buildListHtml(){
    if (trackedTrains.length === 0){
      return `<div class="sub">Nothing being tracked right now. Tap a train from "Live trains" to start watching its progress — it'll keep working here even after it leaves the station.</div>`;
    }
    return trackedTrains.map(t => {
      const ageMin = Math.round((Date.now() - t.addedAt) / 60000);
      const ageLabel = ageMin < 60 ? `${ageMin} min ago` : `${Math.round(ageMin/60)} hr ago`;
      return `<div class="rail-detail-row" data-service-id="${t.serviceId}" style="cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">
        <span style="font-weight:600;">${t.label}</span>
        <span style="display:flex; align-items:center; gap:12px;">
          <span style="color:var(--ink-dim);">Added ${ageLabel} ›</span>
          <span class="tracked-remove-btn" data-remove-service-id="${t.serviceId}" style="color:#ff8b7e; font-size:12px; text-decoration:underline; padding:4px 2px; -webkit-user-select:none; user-select:none; touch-action:manipulation;">Remove</span>
        </span>
      </div>`;
    }).join('');
  }

  overlay.innerHTML = `
    <div class="modal">
      <h3>Tracked trains</h3>
      <div class="sub">Not showing up? You can remove any entry manually — no need to wait for it to sort itself out.</div>
      <div id="tracked-list">${buildListHtml()}</div>
      <div class="modal-close" id="tracked-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  function wireList(){
    document.querySelectorAll('#tracked-list [data-service-id]').forEach(row => {
      row.addEventListener('click', async () => {
        const serviceId = row.dataset.serviceId;
        const tracked = trackedTrains.find(t => t.serviceId === serviceId);
        if (!tracked) return;
        // Immediate visual feedback before the network call, so there's no
        // dead-time gap between the tap and something visibly happening —
        // a gap here was suspected of letting Android treat a normal tap
        // as a stuck/long press and trigger its own screen-search gesture.
        row.style.opacity = '0.5';
        row.style.pointerEvents = 'none';
        row.innerHTML = `<span style="font-weight:600;">${escapeHtml(tracked.label)}</span><span style="color:var(--ink-dim);">Loading…</span>`;
        try{
          const service = await fetchServiceDetails(serviceId);
          // The user may have already closed this screen while that
          // request was in flight — removeChild on an already-removed
          // node throws, which would otherwise fall into the catch below
          // and incorrectly treat a successful fetch as a failure,
          // deleting a perfectly valid tracked train in the process.
          if (!overlay.isConnected) return;
          overlay.remove();
          openTrainProgress({ label: tracked.label, fromLoc: tracked.fromLoc, serviceId }, service);
        }catch(e){
          if (e.transient){
            // A network or server hiccup tells us nothing about whether
            // this train is still genuinely trackable — keep it in the
            // list untouched and just let the row go back to being
            // tappable, so the user can simply try again. If it's
            // actually gone for good rather than a real blip, the
            // Remove link on the row is there so they're never stuck
            // waiting on a retry that will never succeed.
            if (!overlay.isConnected) return;
            row.style.opacity = '1';
            row.style.pointerEvents = '';
            row.innerHTML = `<span style="font-weight:600;">${escapeHtml(tracked.label)}</span><span style="display:flex; align-items:center; gap:12px;"><span style="color:#ff8b7e; font-size:12px;">Couldn't reach Darwin — tap to try again ›</span><span class="tracked-remove-btn" data-remove-service-id="${serviceId}" style="color:#ff8b7e; font-size:12px; text-decoration:underline; padding:4px 2px;">Remove</span></span>`;
            wireList();
            return;
          }
          // Darwin gave a definitive answer that this service is gone —
          // this part is real regardless of whether the user is still
          // looking at this screen, so it happens unconditionally.
          trackedTrains = trackedTrains.filter(t => t.serviceId !== serviceId);
          await saveTrackedTrains();
          // But showing a message and popping the list back open should
          // only happen if the user is still actually here to see it.
          if (!overlay.isConnected) return;
          // No blocking native alert, and no leaving a dead entry sitting
          // in the list — show a brief inline explanation in the app's own
          // style, then remove it and refresh the screen.
          row.style.opacity = '1';
          row.style.pointerEvents = 'none';
          row.innerHTML = `<span style="font-weight:600;">${escapeHtml(tracked.label)}</span><span style="color:#ff8b7e; font-size:12px;">Unavailable — removing…</span>`;
          setTimeout(() => {
            if (!overlay.isConnected) return; // user's moved on since — don't force this screen back open
            overlay.remove();
            openTrackedTrains();
          }, 1200);
        }
      });
    });
    document.querySelectorAll('#tracked-list [data-remove-service-id]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation(); // don't also trigger the row's own tap-to-view/retry
        const serviceId = btn.dataset.removeServiceId;
        trackedTrains = trackedTrains.filter(t => t.serviceId !== serviceId);
        await saveTrackedTrains();
        const listEl = document.getElementById('tracked-list');
        if (listEl) listEl.innerHTML = buildListHtml();
        wireList();
      });
    });
  }
  wireList();

  document.getElementById('tracked-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openLiveDepartureBoard(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Live trains</h3>
      <div class="sub" id="live-board-status">Loading…</div>
      <div id="live-board-content"></div>
      <div class="modal-close" id="live-board-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('live-board-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });

  function timeToHHMM(t){ return t.slice(0,2) + ':' + t.slice(2,4); }

  function rowFor(train, service){
    if (!service){
      return `<div class="rail-detail-row"><span>${train.label}</span><span style="color:var(--ink-dim);">No live data right now</span></div>`;
    }
    if (service.isCancelled){
      return `<div class="rail-detail-row"><span style="color:#ff8b7e; font-weight:600;">${train.label}</span><span style="color:#ff8b7e;">Cancelled${service.cancelReason ? ' — ' + service.cancelReason.replace(/^This service has been cancelled /,'') : ''}</span></div>`;
    }
    const onTime = !service.etd || service.etd === 'On time';
    const color = onTime ? 'var(--good)' : '#ff8b7e';
    const statusText = onTime ? 'On time' : `Now ${service.etd}${service.platform ? '' : ''}`;
    const platformText = service.platform ? ` · Plat ${service.platform}` : '';
    return `<div class="rail-detail-row" data-train-key="${train.key}" style="cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;"><span style="color:${color}; font-weight:600;">${train.label}</span><span style="color:${color};">${statusText}${platformText} ›</span></div>`;
  }

  fetchLiveBoards().then(boards => {
    const amTrains = railTrains.filter(t => t.direction === 'AM').sort((a,b) => a.time.localeCompare(b.time));
    const pmTrains = railTrains.filter(t => t.direction === 'PM').sort((a,b) => a.time.localeCompare(b.time));
    const matchedServices = {}; // trainKey -> { train, service }

    function sectionHtml(trains){
      return trains.map(t => {
        const board = boards[`${t.fromLoc}-${t.toLoc}`] || [];
        const wanted = timeToHHMM(t.time);
        const service = board.find(s => s.std === wanted);
        if (service && !service.isCancelled) matchedServices[t.key] = { train: t, service };
        return rowFor(t, service);
      }).join('');
    }

    document.getElementById('live-board-status').textContent = 'Live from National Rail — tap a train for its progress, or Close and reopen to refresh.';
    document.getElementById('live-board-content').innerHTML = `
      <div class="rail-col-header">Morning</div>
      ${amTrains.length ? sectionHtml(amTrains) : '<div class="rail-detail-row"><span style="color:var(--ink-dim);">None configured</span></div>'}
      <div class="rail-col-header">Evening</div>
      ${pmTrains.length ? sectionHtml(pmTrains) : '<div class="rail-detail-row"><span style="color:var(--ink-dim);">None configured</span></div>'}
    `;
    document.querySelectorAll('#live-board-content [data-train-key]').forEach(row => {
      row.addEventListener('click', () => {
        const m = matchedServices[row.dataset.trainKey];
        if (m) openTrainProgress(m.train, m.service);
      });
    });
  }).catch(err => {
    document.getElementById('live-board-status').textContent = `Couldn't load live data: ${err.message}`;
  });
}

// Builds the "where is this train now" timeline: every calling point in
// order, with a marker showing roughly where the train sits between the
// last-passed and next-due point, and any delay/cancellation reason
// shown alongside the relevant station. This is deliberately a simple
// ordered list, not a geographic map — no station coordinates needed
// beyond what Darwin already tells us about calling order and timing.
// Works out a plain-language status for one calling point, using
// whatever Darwin actually gave us — a literal status word ("On time",
// "Delayed", "Cancelled") or a specific time to compare against schedule.
function describePointStatus(schedTime, liveTime, isCancelled){
  if (isCancelled) return { text: 'Cancelled', color: '#ff8b7e', minutesLate: null, minutesEarly: 0 };
  if (!liveTime || liveTime === schedTime) return { text: 'On time', color: 'var(--good)', minutesLate: 0, minutesEarly: 0 };
  if (liveTime === 'On time') return { text: 'On time', color: 'var(--good)', minutesLate: 0, minutesEarly: 0 };
  if (liveTime === 'Delayed') return { text: 'Delayed', color: '#ff8b7e', minutesLate: null, minutesEarly: 0 };
  if (!liveTime.includes(':')) return { text: liveTime, color: 'var(--ink-dim)', minutesLate: null, minutesEarly: 0 };
  // A live time with no scheduled time to compare against — Darwin has
  // occasionally been seen to omit it on a given poll for a given point.
  // Show what we've got rather than crashing the whole refresh over it.
  if (!schedTime || !schedTime.includes(':')) return { text: liveTime, color: 'var(--ink-dim)', minutesLate: null, minutesEarly: 0 };

  const schedMins = parseInt(schedTime.slice(0,2),10)*60 + parseInt(schedTime.slice(3,5),10);
  const liveMins = parseInt(liveTime.slice(0,2),10)*60 + parseInt(liveTime.slice(3,5),10);
  const diff = liveMins - schedMins;
  if (diff === 0) return { text: 'On time', color: 'var(--good)', minutesLate: 0, minutesEarly: 0 };
  if (diff < 0){
    // Genuinely left ahead of schedule — rare, but worth calling out
    // distinctly rather than folding into "on time", since an early
    // departure is the one case where that label could actively mislead
    // someone who isn't already on the platform.
    return { text: `${Math.abs(diff)} min early`, color: '#7fb8e0', minutesLate: 0, minutesEarly: Math.abs(diff) };
  }
  return { text: `${diff} min late`, color: '#ff8b7e', minutesLate: diff, minutesEarly: 0 };
}

// Adds a number of minutes to an "HH:MM" string, wrapping correctly
// across midnight — used to infer a real time for an already-passed
// point that Darwin only gave a generic "On time" word for, despite the
// service clearly running late overall.
function addMinutesToTime(hhmm, mins){
  if (!hhmm || !hhmm.includes(':')) return null;
  const [h, m] = hhmm.split(':').map(Number);
  const total = ((h * 60 + m + mins) % 1440 + 1440) % 1440;
  const nh = Math.floor(total / 60), nm = total % 60;
  return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
}

const TRAIN_PROGRESS_ROW_HEIGHT = 54; // px — a sensible minimum row height; actual positioning now measures real rendered rows, not this value

function buildTrainProgress(train, service, showRawDebug, showAllReasons){
  const now = new Date();

  function pointsFrom(arr){
    return (arr && arr[0] && arr[0].callingPoint) ? arr[0].callingPoint : [];
  }
  const before = pointsFrom(service.previousCallingPoints).map(cp => ({
    locationName: cp.locationName,
    schedTime: cp.st,
    liveTime: cp.at || cp.et || cp.st,
    isCancelled: !!cp.isCancelled,
    reason: cp.delayReason || cp.cancelReason || null,
    platform: cp.platform || null,
    raw: { st: cp.st, at: cp.at, et: cp.et },
  }));
  const here = [{
    locationName: STATION_COORDS[train.fromLoc] ? STATION_COORDS[train.fromLoc].name : train.fromLoc,
    schedTime: service.std || service.sta,
    liveTime: service.etd || service.std || service.sta,
    isCancelled: !!service.isCancelled,
    reason: service.delayReason || service.cancelReason || null,
    isYourStation: true,
    platform: service.platform || null,
    raw: { std: service.std, sta: service.sta, etd: service.etd, eta: service.eta },
  }];
  const after = pointsFrom(service.subsequentCallingPoints).map(cp => ({
    locationName: cp.locationName,
    schedTime: cp.st,
    // Darwin's before/after split is fixed relative to the station you
    // queried from, not to real time — a point can sit in "subsequent"
    // and still be genuinely already passed once enough time's gone by,
    // so check for a real confirmed actual time first, same as "before".
    liveTime: cp.at || cp.et || cp.st,
    isCancelled: !!cp.isCancelled,
    reason: cp.delayReason || cp.cancelReason || null,
    platform: cp.platform || null,
    raw: { st: cp.st, at: cp.at, et: cp.et },
  }));
  const points = [...before, ...here, ...after];
  // Darwin attaches one reason to a service and doesn't seem to clear or
  // refresh it as the journey continues — a reason first seen on an
  // early cancelled point can still be sitting there hours and hundreds
  // of miles later, long after it's stopped being the genuine cause of
  // anything current. Track which reasons belong to cancelled points so
  // they can be recognised as inherited boilerplate rather than treated
  // as a fresh explanation for the service's current running status.
  // Darwin phrases the same underlying cause differently depending on
  // whether the specific point is cancelled ("cancelled because of X")
  // or merely delayed ("delayed by X") — comparing full sentences misses
  // the match entirely, so strip the standard prefixes down to just the
  // actual cause before comparing.
  function normalizeReason(reason){
    if (!reason) return null;
    return reason
      .replace(/^This service (has been|was)\s*(cancelled because of|delayed by|delayed because of|cancelled due to|delayed due to)\s*/i, '')
      .trim()
      .toLowerCase();
  }
  const inheritedReasons = new Set(points.filter(p => p.isCancelled && p.reason).map(p => normalizeReason(p.reason)));

  // The best available time for each point — a real timestamp if Darwin
  // gave us one, falling back to the scheduled time if it only gave a
  // status word ("On time"/"Delayed") rather than an actual time.
  function bestTime(p){
    return (p.liveTime && p.liveTime.includes(':')) ? p.liveTime : p.schedTime;
  }
  const pointDates = points.map(p => liveTimeToDate((bestTime(p) || '').replace(':', ''), now));

  let lastPassedIdx = -1;
  pointDates.forEach((t, i) => { if (t && t <= now) lastPassedIdx = i; });

  // How far between the last-passed and next-due point we are right now,
  // as a plain fraction of the scheduled gap between them — the same
  // "50% of the way there" maths regardless of how long that gap is.
  // Rows now vary in real rendered height (the delay-reason text can wrap
  // onto extra lines), so the actual pixel position is measured from the
  // real DOM after rendering rather than assumed from a fixed row height
  // — this fraction is just "how far between these two points", applied
  // to real measurements by positionBlobAndLine().
  let fraction = 0;
  if (lastPassedIdx >= 0 && lastPassedIdx < points.length - 1){
    const t1 = pointDates[lastPassedIdx], t2 = pointDates[lastPassedIdx + 1];
    if (t1 && t2 && t2 > t1){
      fraction = Math.max(0, Math.min(1, (now - t1) / (t2 - t1)));
    }
  }

  let summaryHtml = '';
  let primaryReason = null;
  let knownOverallDelay = 0; // the most reliable delay figure we have, in minutes — used both for the summary headline and to infer real times for passed points Darwin only gave a generic "On time" word for
  let anyReasonSuppressed = false; // true if a reason was hidden by the staleness heuristic or the repeat-dedup — drives the "Show all reasons" reveal link
  if (lastPassedIdx >= 0){
    const last = points[lastPassedIdx];
    const status = describePointStatus(last.schedTime, last.liveTime, last.isCancelled);
    const afterLast = points[lastPassedIdx + 1];
    const remaining = points.slice(lastPassedIdx + 1);
    // "Terminated early" — every remaining booked calling point has been
    // cancelled, meaning the train stops here and won't reach its real
    // destination (or the last-passed point itself was cancelled, an
    // edge case that amounts to the same thing).
    const terminatedEarly = (remaining.length > 0 && remaining.every(p => p.isCancelled)) || (!afterLast && last.isCancelled);

    if (terminatedEarly){
      const finalPoint = points[points.length - 1];
      const locLine = `Terminated at ${last.locationName}`;
      const statusLine = (finalPoint && finalPoint.locationName !== last.locationName) ? `Did not continue to ${finalPoint.locationName}` : '';
      summaryHtml = `<div>${locLine}</div>${statusLine ? `<div style="font-size:12px; margin-top:4px; opacity:0.9;">${statusLine}</div>` : ''}`;
    } else if (!afterLast){
      // Genuinely reached the final booked destination — no "running",
      // the journey's over.
      const arrivalText = status.minutesLate === null ? status.text : (status.minutesLate > 0 ? `${status.minutesLate} min late` : 'On time');
      summaryHtml = `<div>Arrived at ${last.locationName}</div><div style="font-size:12px; margin-top:4px; opacity:0.9;">${arrivalText}</div>`;
    } else {
      // Darwin sometimes only attaches a specific recalculated number to
      // some points and not others on a given poll, leaving nearby
      // points showing a generic "On time" word even when a delay
      // reason is clearly attached to them. Rather than trust whichever
      // point happens to be "last passed" (which might only have that
      // generic word) — or only check the far final destination, which
      // may not have a specific number yet either — scan forward through
      // every remaining point for the first one with a real confirmed
      // figure, since a nearby point is far more likely to have current
      // data than a still-distant one.
      // The next point ahead is Darwin's freshest, most current read on
      // how the service is running — the last-passed point's figure is
      // already history and won't be revised further once it's actually
      // happened. Prefer the next point's number when it has a real one,
      // rather than defaulting to whatever the passed point locked in.
      let overallStatus = status;
      const afterLastStatus = describePointStatus(afterLast.schedTime, afterLast.liveTime, afterLast.isCancelled);
      if (afterLastStatus.minutesLate !== null && afterLastStatus.minutesLate > 0){
        overallStatus = afterLastStatus;
      } else if (overallStatus.minutesLate === null || overallStatus.minutesLate === 0){
        // Neither the passed point nor the very next one has a usable
        // figure — scan further ahead, then behind, for the first real
        // confirmed number anywhere in the journey.
        for (const candidate of points.slice(lastPassedIdx + 1)){
          const candidateStatus = describePointStatus(candidate.schedTime, candidate.liveTime, candidate.isCancelled);
          if (candidateStatus.minutesLate !== null && candidateStatus.minutesLate > 0){
            overallStatus = candidateStatus;
            break;
          }
        }
        if (overallStatus.minutesLate === null || overallStatus.minutesLate === 0){
          for (let j = lastPassedIdx - 1; j >= 0; j--){
            const candidateStatus = describePointStatus(points[j].schedTime, points[j].liveTime, points[j].isCancelled);
            if (candidateStatus.minutesLate !== null && candidateStatus.minutesLate > 0){
              overallStatus = candidateStatus;
              break;
            }
          }
        }
      }
      let runningText;
      if (overallStatus.minutesLate === null){
        runningText = overallStatus.text;
      } else if (overallStatus.minutesLate > 0){
        runningText = `Running ${overallStatus.minutesLate} min late`;
      } else if (overallStatus === status && status.minutesEarly > 0){
        runningText = `Running ${status.minutesEarly} min early`;
      } else {
        runningText = 'Running on time';
      }
      if (overallStatus.minutesLate > 0) knownOverallDelay = overallStatus.minutesLate;
      // Three separate lines — where it is, its status, and why (if
      // known) — rather than one long line that wraps awkwardly with
      // longer station names.
      const rawReason = last.reason || (afterLast && afterLast.reason) || null;
      // Only trust this as a genuine current explanation if it isn't
      // just carried-over text from an earlier cancellation elsewhere in
      // the journey — unless the current point is itself cancelled, in
      // which case it's directly relevant again. showAllReasons bypasses
      // this entirely as a manual override, since the heuristic can be
      // wrong on the rare service where the same cause genuinely never
      // stops being relevant.
      const wouldSuppress = rawReason && !last.isCancelled && !afterLast.isCancelled && inheritedReasons.has(normalizeReason(rawReason));
      if (wouldSuppress) anyReasonSuppressed = true;
      primaryReason = (rawReason && (showAllReasons || !wouldSuppress)) ? rawReason : null;
      summaryHtml = `<div>Currently between ${last.locationName} and ${afterLast.locationName}</div>` +
        `<div style="font-size:12px; margin-top:4px; opacity:0.9;">${runningText}</div>` +
        (primaryReason ? `<div style="font-size:12px; margin-top:4px; opacity:0.85;">${primaryReason}</div>` : '');
    }
  } else if (points.length){
    summaryHtml = `Not yet departed ${points[0].locationName}`;
  }

  // Tracks whichever reason was most recently actually shown, in row
  // order — starts as primaryReason (already shown once in the summary
  // box), then updates as we go, so a whole run of consecutively
  // cancelled points sharing the same reason collapses to showing it
  // only on the first one, not repeated down the entire list.
  let lastShownReason = primaryReason;

  const rowsHtml = points.map((p, i) => {
    try{
      const status = describePointStatus(p.schedTime, p.liveTime, p.isCancelled);
      const nameColor = p.isYourStation ? 'var(--amber)' : 'var(--ink)';
      // The reason text often stays attached even once a point's own
      // status has recovered to genuinely on time — show it whenever
      // there's real uncertainty or an actual problem, but not once a
      // point has positively confirmed it's back on time. Also skip it
      // if it's the same reason already shown on the row immediately
      // before it (or in the summary box) — no need to repeat it over
      // and over down a whole run of affected stations. And skip it if
      // it's boilerplate inherited from an earlier cancellation rather
      // than a fresh explanation — unless this row is itself cancelled,
      // in which case it's directly relevant again.
      const isStaleReason = !p.isCancelled && inheritedReasons.has(normalizeReason(p.reason));
      const showReason = !!p.reason && status.minutesLate !== 0 && (showAllReasons || (p.reason !== lastShownReason && !isStaleReason));
      if (p.reason) lastShownReason = p.reason;
      const reasonHtml = showReason ? `<div style="font-size:11.5px; color:#ff8b7e; margin-top:1px;">${p.reason}</div>` : '';
      // Cross out the scheduled time and show the real one whenever
      // Darwin gave a genuine specific delayed time (not just a status
      // word) — same idea as Avanti's own calling-points view.
      const hasRealTime = p.liveTime && p.liveTime.includes(':') && p.liveTime !== p.schedTime;
      // For an already-passed point that Darwin only gave a generic "On
      // time" word for, despite the service clearly running late overall
      // — infer a rough real time from the known overall delay, clearly
      // marked as an estimate rather than presented as confirmed data.
      const isInferred = !hasRealTime && i <= lastPassedIdx && status.minutesLate === 0 && knownOverallDelay > 0 && !p.isCancelled;
      const inferredTime = isInferred ? addMinutesToTime(p.schedTime, knownOverallDelay) : null;

      let timeHtml, statusText, statusColor;
      if (hasRealTime){
        timeHtml = `<span style="text-decoration:line-through; color:var(--ink-dim); font-size:11.5px;">${p.schedTime || ''}</span><br/><span style="color:${status.color}; font-weight:600;">${p.liveTime}</span>`;
        statusText = status.text;
        statusColor = status.color;
      } else if (isInferred && inferredTime){
        timeHtml = `<span style="text-decoration:line-through; color:var(--ink-dim); font-size:11.5px;">${p.schedTime || ''}</span><br/><span style="color:#e8935f; font-style:italic;">~${inferredTime}</span>`;
        statusText = `~${knownOverallDelay} min late (estimated)`;
        statusColor = '#e8935f';
      } else {
        timeHtml = p.schedTime || '';
        statusText = status.text;
        statusColor = status.color;
      }
      const platformText = p.platform ? ` <span style="color:var(--ink-dim);">· Platform ${p.platform}</span>` : '';
      const debugHtml = (showRawDebug && p.raw)
        ? `<div style="font-family:monospace; font-size:10px; color:#6a7a8a; margin-top:2px;">${Object.entries(p.raw).map(([k,v]) => `${k}=${v === undefined || v === null ? '·' : v}`).join('  ')}</div>`
        : '';
      return `
        <div class="rail-detail-row" data-idx="${i}" style="align-items:center; min-height:${TRAIN_PROGRESS_ROW_HEIGHT}px; padding-left:22px; position:relative;">
          <span style="position:absolute; left:2px; width:8px; height:8px; border-radius:50%; background:var(--line); top:50%; transform:translateY(-50%);"></span>
          <span style="min-width:56px;">${timeHtml}</span>
          <span style="flex:1; text-align:right;">
            <span style="color:${nameColor}; font-weight:${p.isYourStation?600:400};">${p.locationName || 'Unknown'}</span>
            <div style="color:${statusColor}; font-size:12.5px; margin-top:1px;">${statusText}${platformText}</div>
            ${reasonHtml}
            ${debugHtml}
          </span>
        </div>`;
    }catch(e){
      // One malformed calling point shouldn't take the whole list down —
      // show what we can and keep going.
      return `<div class="rail-detail-row" data-idx="${i}"><span>${p.locationName || 'Unknown'}</span><span style="color:var(--ink-dim);">—</span></div>`;
    }
  }).join('');

  return { summaryHtml, rowsHtml, lastPassedIdx, fraction, pointCount: points.length, anyReasonSuppressed };
}

const TRAIN_PROGRESS_REFRESH_MS = 60 * 1000;

function openTrainProgress(train, service){
  // See activeTrainProgressCleanup above — never let two of these run
  // at once, since they share element IDs and each runs its own timer.
  if (activeTrainProgressCleanup){
    activeTrainProgressCleanup();
    activeTrainProgressCleanup = null;
  }
  let refreshTimer = null;
  let showRawDebug = false; // off by default — a temporary diagnostic toggle, not for normal use
  let showAllReasons = false; // manual override for the staleness-suppression heuristic, in case it's wrong on a given service
  let lastKnownService = service; // lets the debug toggle rebuild instantly without a fresh network call
  // Cleanup (below) clears the interval, but that alone can't cancel an
  // already-in-flight doRefresh() that's mid-await — without this flag,
  // that stale call could still resolve afterward and write into
  // whatever DOM now has these element IDs, which might belong to a
  // different train's screen by then. Every doRefresh() checks this
  // immediately after each await, before touching anything.
  let instanceActive = true;
  // A second, independent guard: an interval tick and a visibility-wake
  // tick can otherwise overlap and race each other, with whichever
  // network response arrives second silently overwriting the other,
  // regardless of which was actually more recent.
  let refreshInFlight = false;
  const serviceId = train.serviceId || service.serviceID || null;

  // Remember this journey so it can still be found and watched later,
  // even after it's rolled off the departure station's own board, or
  // after closing and reopening the app entirely.
  if (serviceId){
    const existing = trackedTrains.find(t => t.serviceId === serviceId);
    const addedAt = existing ? existing.addedAt : Date.now(); // preserve the original tracking time — reopening shouldn't reset how long it's been tracked
    trackedTrains = trackedTrains.filter(t => t.serviceId !== serviceId);
    trackedTrains.unshift({ serviceId, label: train.label, fromLoc: train.fromLoc, addedAt });
    trackedTrains = trackedTrains.slice(0, 5); // no need to keep more than a handful
    saveTrackedTrains();
  }

  const initial = buildTrainProgress(train, service, showRawDebug, showAllReasons);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-overlay-full';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${train.label} — live progress</h3>
      <div id="train-progress-reverse-pill">${service.isReverseFormation ? `<span style="display:inline-block; background:var(--amber); color:#14161f; font-weight:700; font-size:11px; letter-spacing:0.5px; padding:4px 10px; border-radius:20px; margin-bottom:10px;">REVERSE FORMATION</span>` : ''}</div>
      <div class="sub">An estimate based on calling-point times.${debugModeEnabled ? ` <span id="raw-debug-toggle" style="text-decoration:underline; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">Show raw data</span>` : ''}</div>
      <div style="height:3px; background:var(--tile); border-radius:2px; overflow:hidden; margin-bottom:4px;">
        <div id="train-progress-refresh-fill" style="height:100%; width:0%; background:var(--amber);"></div>
      </div>
      <div id="train-progress-last-check" style="font-size:11px; color:var(--ink-dim); text-align:right; margin-bottom:10px;">Opened ${new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</div>
      <div id="train-progress-offline-banner" style="display:none; font-size:13px; color:#ff8b7e; background:rgba(224,90,78,0.12); border:1px solid rgba(224,90,78,0.4); border-radius:8px; padding:10px 12px; margin-bottom:10px;">Lost connection — showing estimated progress based on the last data received.</div>
      <div id="train-progress-summary" style="font-size:13.5px; color:var(--amber); background:rgba(242,169,59,0.1); border:1px solid rgba(242,169,59,0.3); border-radius:8px; padding:10px 12px; margin-bottom:4px;">${initial.summaryHtml}</div>
      <div id="train-progress-reason-toggle-wrap" style="margin-bottom:10px; ${initial.anyReasonSuppressed ? '' : 'display:none;'}">
        <span id="show-all-reasons-toggle" style="font-size:12px; text-decoration:underline; color:var(--ink-dim); cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">${showAllReasons ? 'Hide repeated reasons' : 'A reason was hidden as likely outdated — show it anyway'}</span>
      </div>
      <div id="train-progress-scroll" style="flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative; padding-right:14px;">
        <div style="position:relative; padding-left:6px;">
          <div id="train-progress-line" style="position:absolute; left:11px; top:0px; width:2px; height:0px; background:var(--line);"></div>
          <div id="train-progress-blob" style="position:absolute; left:6px; width:12px; height:12px; border-radius:50%; background:var(--amber); box-shadow:0 0 6px rgba(242,169,59,0.7); top:0px; transition:top 1.2s ease; z-index:2;"></div>
          <div id="train-progress-rows">${initial.rowsHtml}</div>
        </div>
      </div>
      <div class="modal-close" id="train-progress-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Positions the line and blob from the *real* rendered row heights,
  // measured from the DOM — not a fixed assumed row height. Rows can grow
  // taller than the base minimum when a delay-reason message wraps onto
  // extra lines, so a fixed-pixel-per-row calculation drifts further and
  // further off the true position the more affected rows there are.
  function positionBlobAndLine(lastPassedIdx, fraction, scrollBehavior){
    const rowsContainer = overlay.querySelector('#train-progress-rows');
    const lineEl = overlay.querySelector('#train-progress-line');
    const blobEl = overlay.querySelector('#train-progress-blob');
    if (!rowsContainer || !lineEl || !blobEl) return;
    const rows = rowsContainer.querySelectorAll('[data-idx]');
    if (!rows.length) return;
    const base = rowsContainer.offsetTop;
    const centerOf = (row) => base + row.offsetTop + row.offsetHeight / 2;

    const firstCenter = centerOf(rows[0]);
    const lastCenter = centerOf(rows[rows.length - 1]);
    lineEl.style.top = `${firstCenter}px`;
    lineEl.style.height = `${Math.max(0, lastCenter - firstCenter)}px`;

    let blobCenter;
    if (lastPassedIdx < 0){
      blobCenter = firstCenter;
    } else if (lastPassedIdx >= rows.length - 1){
      blobCenter = lastCenter;
    } else {
      const c1 = centerOf(rows[lastPassedIdx]);
      const c2 = centerOf(rows[lastPassedIdx + 1]);
      blobCenter = c1 + (c2 - c1) * fraction;
    }
    blobEl.style.top = `${blobCenter - 6}px`;

    // Keep the blob roughly centred in view as it moves, rather than
    // needing a manual scroll to find it — most noticeable once a train
    // reaches the very end of a long calling-point list. Clamped to the
    // container's real scrollable range, so it naturally does the best
    // it can near either end rather than trying to overscroll.
    const scrollContainer = overlay.querySelector('#train-progress-scroll');
    if (scrollContainer && scrollContainer.clientHeight > 0){
      const target = Math.max(0, Math.min(
        blobCenter - scrollContainer.clientHeight / 2,
        scrollContainer.scrollHeight - scrollContainer.clientHeight
      ));
      scrollContainer.scrollTo({ top: target, behavior: scrollBehavior || 'smooth' });
    }
  }
  positionBlobAndLine(initial.lastPassedIdx, initial.fraction);

  function rebuildDisplay(){
    const rebuilt = buildTrainProgress(train, lastKnownService, showRawDebug, showAllReasons);
    const rowsEl = overlay.querySelector('#train-progress-rows');
    const summaryEl = overlay.querySelector('#train-progress-summary');
    if (rowsEl) rowsEl.innerHTML = rebuilt.rowsHtml;
    if (summaryEl) summaryEl.innerHTML = rebuilt.summaryHtml;
    positionBlobAndLine(rebuilt.lastPassedIdx, rebuilt.fraction, 'auto');
    const reasonToggleWrap = overlay.querySelector('#train-progress-reason-toggle-wrap');
    const reasonToggle = document.getElementById('show-all-reasons-toggle');
    if (reasonToggleWrap) reasonToggleWrap.style.display = rebuilt.anyReasonSuppressed ? '' : 'none';
    if (reasonToggle) reasonToggle.textContent = showAllReasons ? 'Hide repeated reasons' : 'A reason was hidden as likely outdated — show it anyway';
    return rebuilt;
  }

  const rawDebugToggle = document.getElementById('raw-debug-toggle');
  if (rawDebugToggle){
    rawDebugToggle.addEventListener('click', () => {
      showRawDebug = !showRawDebug;
      rawDebugToggle.textContent = showRawDebug ? 'Hide raw data' : 'Show raw data';
      rebuildDisplay();
    });
  }

  const showAllReasonsToggle = document.getElementById('show-all-reasons-toggle');
  if (showAllReasonsToggle){
    showAllReasonsToggle.addEventListener('click', () => {
      showAllReasons = !showAllReasons;
      rebuildDisplay();
    });
  }

  // Kicks off (or restarts) a smooth CSS fill from 0 to 100% over one
  // refresh interval — a pure visual indicator of "time until the next
  // check", not tied to a ticking JS interval of its own.
  function resetRefreshBar(){
    const fill = overlay.querySelector('#train-progress-refresh-fill');
    if (!fill) return;
    fill.style.transition = 'none';
    fill.style.width = '0%';
    void fill.offsetWidth; // force reflow so the transition-removal above actually takes effect first
    fill.style.transition = `width ${TRAIN_PROGRESS_REFRESH_MS}ms linear`;
    fill.style.width = '100%';
  }
  resetRefreshBar();

  async function doRefresh(){
    // An interval tick and a visibility-wake tick can otherwise overlap;
    // if one's already running, just let it finish rather than starting
    // a second one that could resolve out of order.
    if (refreshInFlight) return;
    refreshInFlight = true;
    resetRefreshBar();
    const stamp = () => new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const lastCheckEl = overlay.querySelector('#train-progress-last-check');
    try{
      let freshService = null;
      if (serviceId){
        // Preferred path: ask for this exact train directly, regardless
        // of whether it's still on any station's board.
        freshService = await fetchServiceDetails(serviceId);
      } else {
        // Fallback for the rare case a service had no ID at all — the
        // old, more fragile approach of re-matching against the board.
        const boards = await fetchLiveBoards();
        const board = boards[`${train.fromLoc}-${train.toLoc}`] || [];
        const wanted = `${train.time.slice(0,2)}:${train.time.slice(2,4)}`;
        freshService = board.find(s => s.std === wanted) || null;
      }
      // This screen may have been closed (or superseded by a different
      // train's screen reusing the same element IDs) while the request
      // above was in flight — clearing the interval doesn't cancel an
      // already-started await, so this is the check that actually
      // prevents a stale response from writing into the wrong screen.
      if (!instanceActive) return;
      if (freshService && !freshService.isCancelled){
        lastKnownService = freshService;
        const fresh = buildTrainProgress(train, freshService, showRawDebug, showAllReasons);
        const rowsEl = overlay.querySelector('#train-progress-rows');
        const summaryEl = overlay.querySelector('#train-progress-summary');
        const pillEl = overlay.querySelector('#train-progress-reverse-pill');
        const offlineBanner = overlay.querySelector('#train-progress-offline-banner');
        const blobEl = overlay.querySelector('#train-progress-blob');
        const reasonToggleWrap = overlay.querySelector('#train-progress-reason-toggle-wrap');
        if (rowsEl) rowsEl.innerHTML = fresh.rowsHtml;
        if (summaryEl) summaryEl.innerHTML = fresh.summaryHtml;
        positionBlobAndLine(fresh.lastPassedIdx, fresh.fraction);
        if (pillEl) pillEl.innerHTML = freshService.isReverseFormation ? `<span style="display:inline-block; background:var(--amber); color:#14161f; font-weight:700; font-size:11px; letter-spacing:0.5px; padding:4px 10px; border-radius:20px; margin-bottom:10px;">REVERSE FORMATION</span>` : '';
        if (lastCheckEl) lastCheckEl.textContent = `Updated ${stamp()}`;
        if (reasonToggleWrap) reasonToggleWrap.style.display = fresh.anyReasonSuppressed ? '' : 'none';
        // Connection's back — drop out of the offline/estimated state.
        if (offlineBanner) offlineBanner.style.display = 'none';
        if (blobEl) blobEl.classList.remove('blob-pulsing');
      } else if (lastCheckEl){
        lastCheckEl.textContent = `Checked ${stamp()} — no data returned`;
      }
    }catch(e){
      if (!instanceActive) return;
      // Leave the last-known view showing rather than clearing it, but
      // make the failure visible instead of silently doing nothing — a
      // silent failure here previously looked identical to "not
      // refreshed" with no way to tell the difference.
      if (lastCheckEl){
        const stackLine = (e.stack || '').split('\n')[1] || '';
        const location = stackLine.match(/(\d+:\d+)\)?$/);
        lastCheckEl.textContent = `Checked ${stamp()} — refresh failed (${e.message}${location ? ' @' + location[1] : ''})`;
      }
      // No fresh data, but the position math only ever needed calling-
      // point times compared against the real current clock — re-run it
      // against the last data we did get, so the blob keeps creeping
      // forward on a reasonable assumption rather than sitting frozen.
      const stale = buildTrainProgress(train, lastKnownService, showRawDebug, showAllReasons);
      const rowsEl = overlay.querySelector('#train-progress-rows');
      const summaryEl = overlay.querySelector('#train-progress-summary');
      const offlineBanner = overlay.querySelector('#train-progress-offline-banner');
      const blobEl = overlay.querySelector('#train-progress-blob');
      const reasonToggleWrap = overlay.querySelector('#train-progress-reason-toggle-wrap');
      if (rowsEl) rowsEl.innerHTML = stale.rowsHtml;
      if (summaryEl) summaryEl.innerHTML = stale.summaryHtml;
      positionBlobAndLine(stale.lastPassedIdx, stale.fraction);
      if (reasonToggleWrap) reasonToggleWrap.style.display = stale.anyReasonSuppressed ? '' : 'none';
      if (offlineBanner) offlineBanner.style.display = 'block';
      if (blobEl) blobEl.classList.add('blob-pulsing');
    }finally{
      refreshInFlight = false;
    }
  }

  refreshTimer = setInterval(doRefresh, TRAIN_PROGRESS_REFRESH_MS);

  // Screen locks/backgrounding pause the interval above without "catching
  // up" missed ticks afterward — so on waking up, force an immediate
  // refresh rather than potentially waiting up to another full minute.
  function onVisible(){
    if (document.visibilityState === 'visible') doRefresh();
  }
  document.addEventListener('visibilitychange', onVisible);

  function closeAndStopRefresh(silent){
    instanceActive = false;
    if (refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
    document.removeEventListener('visibilitychange', onVisible);
    if (overlay.isConnected) overlay.remove();
    if (activeTrainProgressCleanup === forceClose) activeTrainProgressCleanup = null;
    // If this was opened from Tracked Trains (the only place that passes
    // a serviceId directly on the train object), closing should return
    // there rather than just dropping back to whatever was underneath —
    // but only on a real user-initiated close, not when this instance is
    // being silently torn down to make way for a newly-opened one.
    if (!silent && train.serviceId) openTrackedTrains();
  }
  function forceClose(){ closeAndStopRefresh(true); }
  activeTrainProgressCleanup = forceClose;
  overlay.querySelector('#train-progress-close-btn').addEventListener('click', () => closeAndStopRefresh(false));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeAndStopRefresh(false); });
}

function openRailConfig(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  // Edit a private copy. Add/remove/time changes should not affect the live
  // configuration until Save is pressed; Cancel must genuinely cancel.
  let draftTrains = railTrains.map(t => ({ ...t }));

  function buildSectionHtml(direction, title, fromLoc, toLoc){
    const trains = draftTrains.filter(t => t.direction === direction).sort((a, b) => a.time.localeCompare(b.time));
    const rows = trains.map(t => `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <input type="time" class="rail-time-input" data-key="${t.key}" value="${t.time.slice(0,2)}:${t.time.slice(2,4)}" style="flex:1;" />
        <span class="modal-close" data-remove-key="${t.key}" style="margin:0; font-size:13px;">Remove</span>
      </div>`).join('');
    return `
      <div class="rail-col-header">${title} (${fromLoc} → ${toLoc})</div>
      <div id="rail-section-${direction}">${rows}</div>
      <div class="settings-link" id="rail-add-${direction}" style="margin-top:4px; margin-bottom:16px;">+ Add another time</div>
    `;
  }

  function renderConfig(){
    overlay.innerHTML = `
      <div class="modal">
        <h3>Usual trains</h3>
        <div class="sub">Used to check delay repay eligibility on your travel days. Add every time you sometimes catch, not just your default.</div>
        ${buildSectionHtml('AM', 'Morning', 'CRE', 'WGN')}
        ${buildSectionHtml('PM', 'Evening', 'WGN', 'CRE')}
        <button class="save-btn" id="rail-config-save">Save</button>
        <div class="modal-close" id="rail-config-close">Cancel</div>
      </div>
    `;

    overlay.querySelector('#rail-add-AM').addEventListener('click', () => addTrain('AM'));
    overlay.querySelector('#rail-add-PM').addEventListener('click', () => addTrain('PM'));

    overlay.querySelectorAll('[data-remove-key]').forEach(el => {
      el.addEventListener('click', () => {
        draftTrains = draftTrains.filter(t => t.key !== el.dataset.removeKey);
        renderConfig();
      });
    });

    overlay.querySelector('#rail-config-save').addEventListener('click', async () => {
      overlay.querySelectorAll('.rail-time-input').forEach(input => {
        const train = draftTrains.find(t => t.key === input.dataset.key);
        if (train && input.value){
          train.time = input.value.replace(':', '');
          train.label = input.value;
        }
      });

      // Invalidate cached performance for any train whose configuration
      // changed. The sync routine will then fetch the current time/route data.
      const oldByKey = Object.fromEntries(railTrains.map(t => [t.key, t]));
      const newByKey = Object.fromEntries(draftTrains.map(t => [t.key, t]));
      const changedKeys = new Set();
      for (const key of new Set([...Object.keys(oldByKey), ...Object.keys(newByKey)])){
        const oldTrain = oldByKey[key];
        const newTrain = newByKey[key];
        if (!oldTrain || !newTrain || oldTrain.time !== newTrain.time || oldTrain.fromLoc !== newTrain.fromLoc || oldTrain.toLoc !== newTrain.toLoc){
          changedKeys.add(key);
        }
      }
      if (changedKeys.size){
        for (const dateKey in railPerfCache){
          for (const key of changedKeys) delete railPerfCache[dateKey][key];
          if (Object.keys(railPerfCache[dateKey]).length === 0) delete railPerfCache[dateKey];
        }
        await saveRailPerfCache();
      }

      railTrains = draftTrains;
      await saveRailTrains();
      overlay.remove();
      railSyncMissingDates();
      render();
    });
    overlay.querySelector('#rail-config-close').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  }

  function addTrain(direction){
    const fromLoc = direction === 'AM' ? 'CRE' : 'WGN';
    const toLoc = direction === 'AM' ? 'WGN' : 'CRE';
    const key = `${direction.toLowerCase()}-${Date.now()}`;
    draftTrains.push({ key, direction, fromLoc, toLoc, time: direction === 'AM' ? '0800' : '1700', label: direction === 'AM' ? '08:00' : '17:00' });
    renderConfig();
  }

  document.body.appendChild(overlay);
  renderConfig();
}

function railDetailRows(trains, dayPerf){
  return trains.map(t => {
    const perf = dayPerf[t.key];
    if (!perf){
      return `<div class="rail-detail-row"><span>${t.label}</span><span style="color:var(--ink-dim);">No data</span></div>`;
    }
    const late = perf.delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES;
    const color = late ? '#ff8b7e' : 'var(--good)';
    const text = perf.delayMinutes <= 0 ? 'On time' : `${perf.delayMinutes} minute${perf.delayMinutes===1?'':'s'} delay`;
    return `<div class="rail-detail-row"><span style="color:${color}; font-weight:600;">${t.label}</span><span style="color:${color};">${text}</span></div>`;
  }).join('');
}

// Same as railDetailRows, but for the one train that was actually
// confirmed as ridden that day: if it was also delayed enough to claim
// and no claim has been started yet, it renders as a reversed, tappable
// pill. Once a claim exists (started or confirmed), it drops back to
// plain red text with a small checkmark — no longer tappable here, since
// the actual claimed/confirmed toggle now lives in its own menu screen
// rather than cluttering this view.
function railDetailRowsForClaim(trains, dayPerf, dateKey, direction){
  const confirmedKey = (confirmedTrains[dateKey] || {})[direction];
  return trains.map(t => {
    const perf = dayPerf[t.key];
    if (!perf){
      return `<div class="rail-detail-row"><span>${t.label}</span><span style="color:var(--ink-dim);">No data</span></div>`;
    }
    const late = perf.delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES;
    if (t.key === confirmedKey && late){
      const claim = (delayClaims[dateKey] || {})[direction];
      const status = claim ? claim.status : null;
      if (!status){
        const delayText = `${perf.delayMinutes} minute${perf.delayMinutes===1?'':'s'} delay`;
        return `<div class="rail-detail-row claimable-row" data-claim-date="${dateKey}" data-claim-direction="${direction}"
             style="cursor:pointer; margin:0 -10px; padding:8px 10px; background:#e05a4e; border-radius:8px; -webkit-user-select:none; user-select:none; touch-action:manipulation;">
          <span style="color:#14161f; font-weight:700;">${t.label}</span>
          <span style="color:#14161f;">${delayText}</span>
        </div>`;
      }
      const checkColor = status === 'confirmed' ? '#3fb950' : '#8b949e';
      const delayText = `${perf.delayMinutes} minute${perf.delayMinutes===1?'':'s'} delay`;
      return `<div class="rail-detail-row">
        <span style="color:#ff8b7e; font-weight:600;">${t.label} <span title="${status === 'confirmed' ? 'Claim confirmed' : 'Claim started'}">${checkCircleIcon(checkColor)}</span></span>
        <span style="color:#ff8b7e;">${delayText}</span>
      </div>`;
    }
    const color = late ? '#ff8b7e' : 'var(--good)';
    const text = perf.delayMinutes <= 0 ? 'On time' : `${perf.delayMinutes} minute${perf.delayMinutes===1?'':'s'} delay`;
    return `<div class="rail-detail-row"><span style="color:${color}; font-weight:600;">${t.label}</span><span style="color:${color};">${text}</span></div>`;
  }).join('');
}

// Wires up the claim pill inside a just-appended detail overlay. reopen()
// should close this overlay and re-show the same detail view fresh, so a
// tap is reflected immediately. Only fires for a train with no claim yet
// — once started/confirmed the row is plain text, not clickable.
function wireClaimHandlers(overlay, reopen){
  overlay.querySelectorAll('.claimable-row').forEach(row => {
    row.addEventListener('click', async () => {
      const dateKey = row.dataset.claimDate;
      // One tap covers the whole day — if both AM and PM had a confirmed
      // delay, both get marked 'started' together, since realistically
      // you'll be dealing with both while you're on Avanti's site anyway.
      if (!delayClaims[dateKey]) delayClaims[dateKey] = {};
      ['AM', 'PM'].forEach(dir => {
        const confirmedKey = (confirmedTrains[dateKey] || {})[dir];
        if (!confirmedKey) return;
        const perf = (railPerfCache[dateKey] || {})[confirmedKey];
        if (!perf || perf.delayMinutes < DELAY_REPAY_THRESHOLD_MINUTES) return;
        const existing = delayClaims[dateKey][dir];
        if (existing && existing.status === 'confirmed') return; // don't downgrade an already-confirmed claim
        delayClaims[dateKey][dir] = {
          status: 'started',
          minutesLate: perf.delayMinutes,
          amount: computeDelayRepayAmount(perf.delayMinutes, dateKey),
        };
      });
      await saveDelayClaims();
      window.open(AVANTI_CLAIM_URL, '_blank');
      reopen();
    });
  });
}

// Lists every day with a delay repay claim on record, most recent first,
// each with a checkbox to mark it as genuinely submitted/confirmed —
// separated out from the day-detail views so those stay simple and this
// stays a proper focused screen for managing claims.
function openDelayClaimsManager(){
  const entries = [];
  for (const dateKey in delayClaims){
    for (const dir in delayClaims[dateKey]){
      const claim = delayClaims[dateKey][dir];
      if (!claim) continue;
      const confirmedKey = (confirmedTrains[dateKey] || {})[dir];
      const train = railTrains.find(t => t.key === confirmedKey);
      entries.push({ dateKey, dir, claim, label: train ? train.label : dir });
    }
  }
  entries.sort((a, b) => b.dateKey < a.dateKey ? -1 : (b.dateKey > a.dateKey ? 1 : 0));

  const rowsHtml = entries.length ? entries.map(e => `
    <div class="rail-detail-row" style="align-items:flex-start; padding:10px 0;">
      <div>
        <div style="font-weight:600;">${dateLabel(parseKey(e.dateKey))}</div>
        <div style="font-size:12px; color:var(--ink-dim); margin-top:2px;">${e.label} (${e.dir}) — ${e.claim.minutesLate} min late — £${(e.claim.amount || 0).toFixed(2)}</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:${e.claim.status==='confirmed' ? 'var(--good)' : 'var(--ink-dim)'}; cursor:pointer; white-space:nowrap;">
          <input type="checkbox" class="claim-confirm-checkbox" data-claim-date="${e.dateKey}" data-claim-direction="${e.dir}" ${e.claim.status==='confirmed'?'checked':''} style="width:15px; height:15px;" />
          Confirmed
        </label>
        <span class="claim-undo-link" data-claim-date="${e.dateKey}" data-claim-direction="${e.dir}" style="font-size:11px; color:var(--ink-dim); text-decoration:underline; cursor:pointer;">Undo</span>
      </div>
    </div>
  `).join('') : `<div class="sub" style="margin-top:0;">No claims started yet — tap a red delay entry on any day to begin one.</div>`;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Delay repay claims</h3>
      <div class="sub">Tick a claim off once you've actually submitted and it's been accepted — not just when you've opened the link.</div>
      ${rowsHtml}
      <div class="modal-close" id="delay-claims-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.claim-confirm-checkbox').forEach(cb => {
    cb.addEventListener('change', async () => {
      const dateKey = cb.dataset.claimDate;
      const dir = cb.dataset.claimDirection;
      if (!delayClaims[dateKey] || !delayClaims[dateKey][dir]) return;
      delayClaims[dateKey][dir].status = cb.checked ? 'confirmed' : 'started';
      await saveDelayClaims();
      document.body.removeChild(overlay);
      openDelayClaimsManager();
    });
  });
  overlay.querySelectorAll('.claim-undo-link').forEach(link => {
    link.addEventListener('click', async () => {
      const dateKey = link.dataset.claimDate;
      const dir = link.dataset.claimDirection;
      if (delayClaims[dateKey]){
        delete delayClaims[dateKey][dir];
        if (Object.keys(delayClaims[dateKey]).length === 0) delete delayClaims[dateKey];
      }
      await saveDelayClaims();
      document.body.removeChild(overlay);
      openDelayClaimsManager();
    });
  });
  document.getElementById('delay-claims-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openCalendarDayDetail(key){

  const dayPerf = railPerfCache[key] || {};
  const eligible = isEligibleRailDay(d, todayKeyLocal);
  const hasDelayData = eligible && Object.keys(dayPerf).length > 0;

  const commentHtml = comment ? `
    <div class="rail-col-header">Logged</div>
    <div class="rail-detail-row"><span>${escapeHtml(comment)}</span>${travelOverrides[key] ? '<span style="color:var(--ink-dim);">counted anyway</span>' : ''}</div>

    const amTrains = railTrains.filter(t => t.direction === 'AM').sort((a, b) => a.time.localeCompare(b.time));

      <div style="display:flex; gap:24px;">
