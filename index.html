<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8-Day Ticket</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="8-Day Ticket">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --board: #14161f;
    --board-2: #1c1f2c;
    --tile: #23273a;
    --ink: #e9e6da;
    --ink-dim: #9a9db0;
    --amber: #f2a93b;
    --amber-dim: #8a6a30;
    --line: #33384d;
    --danger: #e05a4e;
    --good: #6fbf8a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--board);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height:100vh;
  }
  header.top{
    position: relative;
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--board-2), var(--board));
  }
  .delay-repay-badge-wrap{
    position: absolute;
    top: 14px;
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .delay-repay-badge{
    border-radius: 14px;
    padding: 10px 16px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    text-align: center;
    min-width: 92px;
  }
  .delay-repay-badge.normal{
    background: rgba(242,169,59,0.22);
    color: var(--amber);
  }
  .delay-repay-badge.expired{
    background: rgba(224,90,78,0.22);
    color: var(--danger);
  }
  .delay-repay-badge-caption{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.9;
    font-weight: 600;
  }
  .delay-repay-badge-line{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 19px;
    white-space: nowrap;
    font-weight: 700;
    margin-top: 3px;
  }
  .delay-repay-badge-line svg{
    width: 17px;
    height: 17px;
    flex-shrink: 0;
  }
  .delay-repay-badge-more{
    margin-top: 4px;
    font-size: 10px;
    color: var(--danger);
    opacity: 0.7;
    text-align: center;
    max-width: 140px;
  }
  .bunting-row{
    display: flex;
    justify-content: center;
    gap: 5px;
    padding-bottom: 10px;
  }
  .bunting-flag{
    width: 12px;
    height: 12px;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .menu-dropdown{
    position: fixed;
    bottom: calc(74px + env(safe-area-inset-bottom));
    right: 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 -6px 28px rgba(0,0,0,0.45);
    z-index: 65;
    min-width: 240px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .menu-dropdown .settings-link{
    margin: 0;
    padding: 13px 16px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    text-decoration: none;
    color: var(--ink);
  }
  .menu-dropdown .settings-link:active{
    background: rgba(255,255,255,0.06);
  }
  .menu-dropdown .settings-link:last-child{ border-bottom: none; }

  .bottom-nav{
    position: sticky;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: var(--board-2);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 55;
  }
  .bottom-nav-item{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 9px 4px 8px;
    color: var(--ink-dim);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-nav-item svg{
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }
  .bottom-nav-item .bn-label{
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .bottom-nav-item.active{
    color: var(--amber);
  }
  .bottom-nav-item:active{
    background: rgba(255,255,255,0.04);
  }

  .cal-nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav-btn{
    width: 34px; height: 34px;
    display: flex; align-items:center; justify-content:center;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--amber);
    font-size: 18px;
    cursor: pointer;
  }
  .cal-nav-title{
    font-size: 15px;
    font-weight: 700;
  }
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-weekday{
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding-bottom: 6px;
  }
  .cal-day{
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    color: var(--ink);
    background: var(--tile);
    position: relative;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .cal-day.weekend{ color: var(--ink-dim); background: transparent; }
  .cal-day.empty{ background: transparent; }
  .cal-day.today{ border: 1.5px solid var(--amber); font-weight: 700; }
  .cal-dot{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--amber);
    margin-top: 3px;
  }
  .cal-dot-row{
    display: flex;
    gap: 3px;
  }
  .cal-dot-delay{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: transparent;
    border: 1.3px solid #ff8b7e;
    margin-top: 3px;
    box-sizing: border-box;
  }
  .cal-dot-confirmed{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ff8b7e;
    margin-top: 3px;
  }
  .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 700;
    margin-bottom: 4px;
  }
  h1{
    font-size: 22px;
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .today-date{
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 2px;
  }

  .board-card{
    margin: 18px 16px 0;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  .board-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background: repeating-linear-gradient(90deg, var(--amber-dim) 0 10px, transparent 10px 20px);
    opacity: 0.6;
  }

  .ticket-summary-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin: 4px 0 10px;
  }
  .punch-row{
    display:flex;
    gap: 6px;
    flex-wrap: nowrap;
  }
  .punch{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size: 10px;
    color: var(--ink-dim);
    font-weight: 700;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .punch.done{
    background: var(--amber);
    border-color: var(--amber);
    color: #14161f;
  }
  .ticket-count-label{
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
  }
  .ticket-count-label .of8{
    color: var(--ink-dim);
    font-weight: 400;
  }

  .day-progress-track{
    height: 4px;
    background: var(--tile);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .day-progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
  }

  .status-banner{
    margin-top: 16px;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .status-banner.renew{
    background: rgba(224,90,78,0.15);
    color: #ff8b7e;
    border: 1px solid rgba(224,90,78,0.4);
  }
  .status-banner.ok{
    background: rgba(111,191,138,0.12);
    color: var(--good);
    border: 1px solid rgba(111,191,138,0.3);
  }
  .status-banner.skip{
    background: rgba(154,157,176,0.1);
    color: var(--ink-dim);
    border: 1px solid var(--line);
  }

  .next-buy-line{
    margin-top: 8px;
    text-align: center;
    font-size: 12.5px;
    color: var(--amber);
    letter-spacing: 0.2px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .section-label{
    margin: 26px 16px 10px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-weight: 700;
  }

  .holiday-card{
    margin: 18px 16px 0;
    background: linear-gradient(135deg, #2a3b4a, #1c2a35);
    border: 1px solid #3a5468;
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .holiday-count{
    font-size: 36px;
    font-weight: 800;
    color: #7fc9e8;
    font-family: 'Courier New', monospace;
    min-width: 50px;
  }
  .holiday-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-dim);
    font-weight: 700;
  }
  .holiday-date{
    font-size: 14px;
    color: var(--ink);
    margin-top: 2px;
  }

  .comment-card{
    margin: 0 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .chip-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chip{
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--tile);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background: var(--amber);
    color: #14161f;
    border-color: var(--amber);
  }
  input[type=text]{
    width: 100%;
    background: var(--tile);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-top: 4px;
  }
  input[type=text]::placeholder{ color: var(--ink-dim); }
  input[type=date]{
    width: 100%;
    background: var(--tile);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color-scheme: dark;
  }

  .day-list{
    margin: 0 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .day-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .day-row.no-click{
    cursor: default;
  }
  .day-row:last-child{ border-bottom:none; }
  .day-row.is-today{
    background: rgba(242,169,59,0.07);
  }
  .day-row .count-badge{
    width: 30px; height:30px;
    border-radius: 7px;
    background: var(--tile);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink-dim);
    flex-shrink:0;
  }
  .day-row .count-badge.eight{
    background: var(--amber);
    color: #14161f;
  }
  .day-row .count-badge.weekend{
    opacity: 0.4;
  }
  .day-row .info{ flex:1; min-width:0; }
  .day-row .dname{
    font-size: 14px;
    font-weight: 700;
  }
  .day-row .dname .sub{
    font-weight: 400;
    color: var(--ink-dim);
    font-size: 12px;
    margin-left: 6px;
  }
  .day-row .comment-tag{
    font-size: 12px;
    color: var(--amber);
    margin-top: 2px;
  }
  .day-row .arrow{
    color: var(--ink-dim);
    font-size: 18px;
  }
  .rail-blob{
    display: inline-block;
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--amber);
    margin-left: 8px;
    vertical-align: middle;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .rail-blob::after{
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 36px;
    height: 36px;
    transform: translate(-50%, -50%);
  }
  .rail-blob-confirmed{
    background: #ff8b7e;
  }
  .rail-detail-row{
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .rail-detail-row:last-child{ border-bottom: none; }
  /* Train-progress rows only (identified by data-idx) — the divider
     otherwise spans the row's full width, overhanging past the tracker
     line and dots on the left. Trimmed to start exactly where those
     sit instead, so it reads as meeting the timeline rather than
     floating past it. */
  .rail-detail-row[data-idx]{
    border-bottom: none;
  }
  .rail-detail-row[data-idx]::after{
    content: '';
    position: absolute;
    left: 6px;
    right: 0;
    bottom: 0;
    height: 1px;
    background: var(--line);
  }
  .rail-detail-row[data-idx]:last-child::after{
    display: none;
  }
  .rail-col-header{
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 14px 0 6px;
  }

  .save-btn{
    width:100%;
    margin-top: 10px;
    background: var(--amber);
    color: #14161f;
    border:none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor:pointer;
  }
  .save-btn:active{ transform: scale(0.98); }

  .settings-link{
    text-align:center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor:pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .settings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(78px, 1fr));
    gap:18px 4px;
    margin-top:16px;
  }
  .settings-grid-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .settings-grid-item svg{
    width:24px;
    height:24px;
    color:var(--ink-dim);
  }
  .settings-grid-item.active svg{
    color:var(--amber);
  }
  .settings-grid-item span.cat-label{
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
    line-height:1.2;
  }
  .settings-grid-item span.status-label{
    font-size:9px;
    color:var(--ink-dim);
    opacity:0.7;
    text-align:center;
    line-height:1.2;
  }
  .settings-grid-item.active span.status-label{
    color:var(--amber);
    opacity:1;
  }

  .day-nav-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 10px 16px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .day-nav-btn:active{
    background: rgba(255,255,255,0.06);
  }
  .day-nav-btn .arrow-icon{
    color: var(--amber);
    font-size: 14px;
  }

  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.6);
    display:flex; align-items:flex-end;
    z-index: 50;
  }
  .modal{
    background: var(--board-2);
    width:100%;
    border-radius: 16px 16px 0 0;
    padding: 20px 18px 28px;
    border-top: 1px solid var(--line);
    /* A generous fixed ceiling, not dependent on measuring the bottom
       bar's exact height — that measurement approach turned out to be
       unreliable (the same root cause behind the old "Show more days"
       bug). This guarantees any modal's own content, however long, can
       always be reached via its own internal scroll rather than
       potentially being trapped behind the bar with no way to reach it. */
    max-height: calc(100vh - 80px - env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .modal h3{ margin:0 0 4px; font-size:16px; }
  .modal .sub{ color: var(--ink-dim); font-size:13px; margin-bottom:14px; }

  .modal-overlay-full{
    align-items: stretch;
  }
  .modal-overlay-full .modal{
    border-radius: 0;
    height: 100dvh;
    max-height: 100dvh;
    display: flex;
    flex-direction: column;
    /* A generous fixed allowance for the bottom nav bar sitting on top of
       this modal (same reasoning as the base .modal fix) — this was
       previously only reserving 20px total, nowhere near enough, which
       is why Close ended up trapped underneath the bar. */
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }


  /* Bottom-sheet modals sit below the app's bottom nav in the stacking
     order. Reserve the nav's height inside the modal so its own controls
     (especially Close) cannot end up underneath the nav. This is the same
     safe-area principle used by the full-screen train-progress modal, but
     without making the bottom-sheet itself full-screen. */
  .modal-overlay-nav-safe .modal{
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }


  .cal-overlay{
    align-items: flex-start;
    padding-top: 60px;
  }
  .cal-modal{
    border-radius: 16px;
    border-top: 1px solid var(--line);
    margin: 0 12px;
  }
  .modal-close{
    text-align:center;
    margin-top: 14px;
    color: var(--ink-dim);
    font-size: 13px;
    cursor:pointer;
  }
  .loading{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-dim);
  }

  /* Transient toast — see showToast(). Sits above everything, including
     a full-screen modal, since it's meant to be readable regardless of
     what screen triggered it (e.g. tapping a delay cell inside the
     Performance history table). */
  .app-toast{
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(84px + env(safe-area-inset-bottom));
    z-index: 300;
    background: var(--tile);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.4;
    color: var(--ink);
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .app-toast.visible{
    opacity: 1;
    transform: translateY(0);
  }

  /* Performance history — a table wide/tall enough that it needs both
     scroll axes: sticky header row (usual trains) + sticky first column
     (dates), same "freeze panes" idea as a spreadsheet, so whichever
     direction you're scrolling in you can still see what row/column
     you're looking at. */
  .perf-history-scroll{
    flex: 1;
    min-height: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .perf-history-table{
    border-collapse: separate;
    border-spacing: 0;
    width: max-content;

<body>
<div id="app" class="loading">Loading your ticket…</div>

<script>
const PRESET_TAGS = ['WFH', 'HOLIDAY', 'DENTIST', 'SICK'];

// Simple line-style icons for the bottom nav bar — inherit colour via
// currentColor so active/inactive state is just a CSS colour change.
const NAV_ICONS = {
  today: '<svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5.5h4V20h3a1 1 0 0 0 1-1v-9"/></svg>',
  live: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="13" rx="4"/><path d="M5 12h14"/><circle cx="8.5" cy="20" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="20" r="1.3" fill="currentColor" stroke="none"/><path d="M8 17l-2 3M16 17l2 3"/></svg>',
  buy: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  calendar: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>',
  more: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
};

// A filled circle with a white checkmark, GitHub-style — used to show a
// delay repay claim's status inline. Green for confirmed, grey for
// started-but-not-yet-confirmed.
function checkCircleIcon(color){
  return `<svg viewBox="0 0 16 16" width="15" height="15" style="vertical-align:-2px;"><circle cx="8" cy="8" r="8" fill="${color}"/><path d="M4.3 8.3 L6.8 10.6 L11.6 5.3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
}

// Replace this with your own OAuth client ID from Google Cloud Console
// to enable the Google Calendar sync feature. Safe to be public — a
// client ID is not a secret, unlike an API key or password.
const GOOGLE_CLIENT_ID = '130585374763-he5hjhlgigril8otmlcalp4llonefl4e.apps.googleusercontent.com';
const APP_VERSION = 'v2026-08-28.19:06'; // bump this on every deploy — lets you confirm what's actually running vs what's on GitHub

let gcalEnabled = false; // whether the person has connected Google Calendar
let preferredGoogleEmail = ''; // used as a login hint to skip the account picker when multiple Google accounts exist
// Global debug mode — off by default. When on, debug hooks scattered
// around the app (starting with the raw-data toggle on train progress)
// become visible. Each hook's own info can look different; this is just
// the single switch that reveals/hides all of them consistently.
let debugModeEnabled = false;
// Weather badges on the live-progress screen — on by default, but a
// single toggle to switch off entirely if the extra fetches ever cause
// noticeable lag or just get annoying. Purely a novelty display; never
// blocks or slows the actual train-tracking data underneath it.
let weatherEnabled = true;
// Tracks the currently-open train progress screen's own teardown
// function, if any. Every such screen shares the same hardcoded element
// IDs (train-progress-rows, train-progress-blob, etc.) and runs its own
// 60-second refresh timer — if a second one opened while a first was
// still alive, both timers kept running and both wrote into whichever
// DOM elements getElementById happened to resolve to (the first match,
// not necessarily the one on screen), causing one train's data to
// silently overwrite another's. Forcing any previous instance to clean
// itself up before a new one opens makes that structurally impossible.
let activeTrainProgressCleanup = null;

// Drive auto-backup
let driveBackupEnabled = false;
let driveBackupDirty = false; // true whenever something's changed since the last successful backup
let lastDriveBackupTime = 0; // epoch ms
let driveBackupFolderId = null;
const DRIVE_BACKUP_THROTTLE_MS = 30 * 60 * 1000; // 30 minutes
const DRIVE_BACKUP_FOLDER_NAME = 'Ticket Tracker Backups';
const DRIVE_BACKUP_KEEP_COUNT = 2;
let gcalEventId = null; // the calendar event ID for the current buy-ticket reminder, if any
let gcalPendingSync = false; // true when the buy date changed since the calendar was last updated
let lastNotifiedBuyKey = null; // the buy date we last notified/synced for, to detect changes
let googleTokenClient = null; // lazily-initialized GIS token client
let cachedAccessToken = null;
let cachedTokenExpiry = 0;
let gcalLastSyncFailed = false; // transient, not persisted — just for this session's UI feedback
let scheduledBuyKey = null; // the buy-date candidate currently waiting out the debounce timer
let buyDateChangeTimer = null; // the pending debounce timeout handle

// Optional one-off import of past comments, e.g. from an old spreadsheet.
// Left empty here deliberately — this file is public. See import-seed-data.js
// (kept out of the GitHub repo) for how to load personal history in privately.
const SEED_COMMENTS = {};

function fmtKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseKey(k){
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isWeekend(d){
  const wd = d.getDay(); // 0 Sun, 6 Sat
  return wd === 0 || wd === 6;
}
function addDays(d, n){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+n);
  return nd;
}
// UK regulated fares changes have long landed on the first Sunday of
// March, but the exact date does occasionally shift and there's
// sometimes a gap between the January announcement and the March
// implementation — so this computes it fresh for whatever year is
// actually current rather than hard-coding a specific date.
function getFirstSundayOfMarch(year){
  const d = new Date(year, 2, 1); // 1 March
  const offsetToSunday = (7 - d.getDay()) % 7; // 0 if 1 March is itself a Sunday
  d.setDate(1 + offsetToSunday);
  return d;
}
// True only on/after this year's fare change AND only if this year
// hasn't already been checked — stays instant every other time the Buy
// screen opens, which is the whole point (see backlog discussion: the
// one-a-year network delay only matters right when it's worth paying
// for it).
function shouldFetchFreshFares(today){
  const year = today.getFullYear();
  const changeDate = getFirstSundayOfMarch(year);
  if (today < changeDate) return false;
  return fareCheckedYear !== year;
}
function dayNameShort(d){
  return d.toLocaleDateString('en-GB', { weekday: 'short' });
}
function dateLabel(d){
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
function dateLabelShort(d){
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

const PERIOD_LENGTH = 28; // ticket valid for 28 calendar days
const USES_PER_PERIOD = 8; // 8 day-passes within that window
const DEFAULT_PERIOD_START = '2026-07-29'; // ticket bought tonight, starts tomorrow

let comments = {}; // dateKey -> comment string
let travelOverrides = {}; // dateKey -> true, for days with a comment that were still travelled
let periodStart = DEFAULT_PERIOD_START; // date the current ticket window began
let purchases = []; // [{date: 'YYYY-MM-DD', cost: number}, ...] — one entry per ticket bought
let lastKnownPrice = 153.60; // prefilled into the recalibrate cost field
let parkingCost = 6.39; // default daily parking estimate
// 18 characters on the actual card artwork — capped at 20 rather than
// exactly 18, a small bit of headroom in case a future card format
// (or, if this app is ever published more widely, a different
// operator's card) runs longer.
let smartcardNumber = '';
const SMARTCARD_NUMBER_MAX_LENGTH = 20;
// Whether starting a claim also downloads a permanent claim-details.txt
// record — separate from the notification (a transient in-the-moment
// glance) and the clipboard (transient, just for pasting). Default on;
// toggleable since not everyone wants a growing pile of these in
// Downloads.
let produceClaimDetailsFile = true;
// Locked in the first time each pay period's own start date is genuinely
// reached — { "YYYY-MM-DD" (period start): { ticketCount, ticketCost,
// parkingDays, parkingCost, total } }. Once set for a given period, that
// period's "Set aside on payday" figure stays exactly what it was on
// payday, regardless of anything that happens afterward (a ticket
// bought, a day re-tagged) — the whole point of a payday budget is that
// it doesn't retroactively move once you've actually set the money aside.
let paydayEstimateSnapshots = {};
// { "YYYY-MM-DD": actualCostThatDay } — presence means "I parked this
// day"; absence (the default) means "I didn't". Default flipped this
// way deliberately: day-to-day, not parking is the normal case, so the
// tap-to-mark-the-exception model matches how every other per-day flag
// in this app already works, rather than asking for a daily
// confirmation on the common case.
let parkedDays = {};
// periodStartKey -> true, mirroring dismissedMonths exactly — the
// parking savings card is just as period-scoped as the payday estimate
// card, so dismissing it for one period and having it naturally
// reappear next period makes the same sense there too.
let dismissedParkingSavingsPeriods = {};
// periodStartKey -> saved/over-budget total (a plain number, can be
// negative), locked in the first time a period is seen to have already
// ended — mirrors paydayEstimateSnapshots' "lock it in and never
// recalculate" approach, so a comment edited or a parked-day re-tagged
// after the fact doesn't retroactively change what a past period showed.
let parkingSavingsSnapshots = {};
// 0 = the real current period; negative = that many periods back. Never
// positive — unlike the payday estimate's preview-ahead nav, there's no
// "future" parking savings to show, only periods that have actually
// happened, so forward browsing is capped at the current period. Not
// persisted, same as estimateOffset — always starts back at 0 on reload.
let parkingSavingsOffset = 0;
// A simple global flag, not period-scoped like the two above — "spent
// this year" has no natural per-period reset point the way a payday or
// parking figure does, so there's nothing sensible to key a dismissal
// against other than "on" or "off".
let ticketsSpentCardDismissed = false;

// Live-progress polling cadence, both configurable from the menu (see
// openPollingSettingsEditor) — how close to scheduled departure polling
// resumes at the normal cadence, and the longest it'll ever go between
// checks before that, so a mid-wait cancellation during a long
// unattended pre-departure gap still gets caught within a bounded time
// rather than only right at the window itself. A cancellation that
// already existed before the screen was even opened doesn't need this —
// that's always caught by the very first fetch regardless of cadence.
let pollBeforeDepartureMin = 5;
let pollCheckInIntervalMin = 15;
// Sanity caps for the two settings above, and a shared clamp used both
// when saving from the editor and when loading back from localStorage —
// previously only the editor's own minimum check existed (beforeVal>=0,
// checkInVal>=1), with no upper bound at all, and nothing revalidated a
// value already sitting in storage (which could in principle be
// corrupted, or edited directly via devtools) before trusting it.
const POLL_BEFORE_DEPARTURE_MIN_MAX = 60; // resuming full polling more than an hour before departure serves no real purpose
const POLL_CHECK_IN_INTERVAL_MIN_MAX = 120; // beyond this the "safety net" check-in stops meaningfully protecting against a mid-wait cancellation
function clampPollBeforeDepartureMin(v){
  const n = Number(v);
  if (!Number.isFinite(n) || n < 0) return 5;
  return Math.min(POLL_BEFORE_DEPARTURE_MIN_MAX, Math.round(n));
}
function clampPollCheckInIntervalMin(v){
  const n = Number(v);
  if (!Number.isFinite(n) || n < 1) return 15;
  return Math.min(POLL_CHECK_IN_INTERVAL_MIN_MAX, Math.round(n));
}
let dayReturnPrice = 21.00; // used by the ticket purchase advisor to compare against the season ticket
// Year (number) whose regulated fares change (first Sunday of March) has
// already been checked against the live Fares API — null if never
// checked. Compared against the current calendar year, not a date, so a
// gap of several buy-free months doesn't cause repeat checks once one
// has already succeeded for the year. See shouldFetchFreshFares().
let fareCheckedYear = null;
let dismissedMonths = {}; // monthKey ('YYYY-MM') -> true, for the monthly estimate card
let menuOpen = false; // whether the hamburger dropdown is currently open

// Rail performance / delay repay feature
const RAIL_WORKER_URL = 'https://rail-performance-proxy.wayne-lee-paul-reynolds.workers.dev';
const DARWIN_WORKER_URL = 'https://darwin-live-proxy.wayne-lee-paul-reynolds.workers.dev';

// Fares API (season ticket + day return price check) — see FARE_CHECK_ORIG/DEST
// below and openBuyScreen()'s once-a-year fresh-price check.
const FARES_WORKER_URL = 'https://fares-proxy.wayne-lee-paul-reynolds.workers.dev';
const FARE_CHECK_ORIG = 'CRE';
const FARE_CHECK_DEST = 'WGN';
const DELAY_REPAY_THRESHOLD_MINUTES = 15;
let railDaysBack = 3; // how far back the day list currently scrolls; grows via "Show earlier days"
const RAIL_DAYS_BACK_STEP = 7;
const RAIL_MAX_DAYS_BACK = 28; // matches Avanti's Delay Repay claim deadline
let railTrains = []; // [{ key, direction: 'AM'|'PM', fromLoc, toLoc, time, label }]
let railPerfCache = {}; // { "YYYY-MM-DD": { trainKey: { delayMinutes, onTime, cancelled, reason } } } — delayMinutes/onTime are null/false when cancelled is true

// Bookkeeping for which (date, train) combinations have actually been
// queried against HSP before — distinct from railPerfCache itself, which
// only ever holds a real result. A weekday can be fully queried and
// still have nothing to show (the service didn't run, or HSP just has
// no record), and without tracking that separately we'd keep re-querying
// the same gap forever. Kept as its own top-level cache rather than a
// sentinel key inside railPerfCache[date], since several places read
// Object.keys()/every key of a day's perf object and expect only real
// train results to be there.
// { "YYYY-MM-DD": ["trainKey1", "trainKey2", ...] }

// Marks the Drive backup as needing a fresh upload whenever any of the
// app's own data changes. Installed once, globally, so every save
// function already in the app (and any added later) is covered
// automatically — no need to remember to flag dirtiness by hand.
(function installDriveBackupDirtyTracker(){
  const originalSetItem = localStorage.setItem.bind(localStorage);
  // BACKUP_KEYS isn't declared yet at this point in the file (it's a
  // const further down), so the one exclusion that matters here is
  // duplicated rather than referenced — small and deliberate, not worth
  // restructuring load order over. reason-codes-cache is the only
  // regular data key excluded from the backup payload itself (see
  // BACKUP_KEYS's own comment — it's disposable, unlike rail-perf-cache,
  // which IS backed up), so writes to it shouldn't mark a backup as
  // needed when nothing backup-relevant actually changed.
  const NON_BACKUP_KEYS = new Set(['drive-backup-dirty', 'drive-backup-last-time', 'reason-codes-cache', 'rail-synced-days', 'rail-history-days-back', 'rail-synced-days-reset-v2']);
  localStorage.setItem = function(key, value){
    if (!NON_BACKUP_KEYS.has(key)){
      driveBackupDirty = true;
      try{ originalSetItem('drive-backup-dirty', JSON.stringify(true)); }catch(e){}
    }
    return originalSetItem(key, value);
  };
})();

// Haversine formula — great-circle distance between two lat/lon points, in km.
function distanceKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ---- Pass photo storage (IndexedDB) ----
// Delay repay claims almost always want a photo of your pass. Stored
// here as a Blob rather than in localStorage, which can only hold
// strings and has nowhere near enough quota for an image. A single
// fixed record ('current') — uploading a new photo replaces it, so
// there's never more than one to manage or clean up.
const PASS_PHOTO_DB_NAME = 'pass-photo-store';
const PASS_PHOTO_DB_VERSION = 1;
const PASS_PHOTO_STORE = 'photos';
const PASS_PHOTO_KEY = 'current';

function openPassPhotoDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PASS_PHOTO_DB_NAME, PASS_PHOTO_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(PASS_PHOTO_STORE)) db.createObjectStore(PASS_PHOTO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function savePassPhoto(blob){
  const db = await openPassPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PASS_PHOTO_STORE, 'readwrite');
    tx.objectStore(PASS_PHOTO_STORE).put({ blob, type: blob.type, uploadedAt: new Date().toISOString() }, PASS_PHOTO_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getPassPhoto(){
  const db = await openPassPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PASS_PHOTO_STORE, 'readonly');
    const req = tx.objectStore(PASS_PHOTO_STORE).get(PASS_PHOTO_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePassPhoto(){
  const db = await openPassPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PASS_PHOTO_STORE, 'readwrite');
    tx.objectStore(PASS_PHOTO_STORE).delete(PASS_PHOTO_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
// A real anchor-tag click, not window.open() — on a PWA running in
// standalone/installed mode, Android Chrome sometimes treats a
// JS-triggered window.open() as a transient in-app overlay (closing it
// destroys it entirely, with no way back), whereas a genuine link click
// is occasionally handled as a proper external navigation into the
// actual browser instead — independently switchable, the way opening a
// link normally works. Not guaranteed either way; this is a real
// platform behaviour outside what a web app can fully dictate, worth
// trying rather than promising it'll definitely change anything.
function openExternalLink(url){
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
// Silently puts the smartcard number on the clipboard the instant a
// claim starts — the actual fix for the window-switching problem, not
// a workaround for it. The number's ready to paste into Avanti's form
// the moment its page loads, with no need to ever switch back to this
// app for that specific step. Back to a single write, not a staged
// sequence — the earlier version also staged the ticket price as a
// second write, but that one was found to fail consistently in the
// real claim flow (two separate fix attempts didn't resolve it — see
// the backlog), while the smartcard number has always copied
// reliably. The claim notification shows the price now instead, so
// nothing's lost by dropping the attempt. Never throws: no number
// saved, or a denied/unavailable clipboard permission, just means the
// claim flow continues without it, same as every other best-effort
// step here.
async function copySmartcardToClipboard(){
  if (!smartcardNumber) return;
  try{ await navigator.clipboard.writeText(smartcardNumber); }
  catch(e){ /* clipboard unavailable or denied — nothing more to do */ }
}
// The exact wording Avanti's own claim form uses for its delay bands —
// reuses the same boundaries as the payout calculation itself, so the
// two can never quietly drift out of sync with each other.
function delayRepayBandLabel(minutes){
  if (minutes >= 60) return '60+ min';
  if (minutes >= 30) return '30-59 min';
  if (minutes >= 15) return '15-29 min';
  return `${minutes} min`; // claims are only ever created at/above the 15-min threshold — this is just a safe fallback, not expected in practice
}
// A plain, read-only notification — deliberately no action buttons, no
// attempt to copy anything from within it. Notification bodies aren't
// reliably text-selectable on Android, and a Service Worker (which is
// what would handle a tap on an action button) has no access to the
// clipboard at all — confirmed before building this, not assumed. This
// exists purely so the delay band(s) — the one thing you have to read
// and select rather than paste — stay glanceable from the notification
// shade while Avanti's page has the screen, covering whichever of
// AM/PM genuinely has a claim that day.
async function showClaimBandNotification(dateKey){
  try{
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (!('serviceWorker' in navigator)) return;
    const dayClaims = delayClaims[dateKey] || {};
    const lines = ['AM', 'PM']
      .map(dir => dayClaims[dir] ? `${dir}: ${delayRepayBandLabel(dayClaims[dir].minutesLate)}` : null)
      .filter(Boolean);
    if (!lines.length) return;
    // Ticket price added alongside the band(s) — genuinely redundant
    // with the clipboard copy most of the time, but a visible backup is
    // worth having given the clipboard write for exactly this value was
    // found to fail silently in one real case.
    lines.push(`Ticket: £${getSeasonPriceForDate(dateKey).toFixed(2)}`);
    const registration = await navigator.serviceWorker.ready;
    await registration.showNotification('Delay repay claim', {
      body: lines.join('\n'),
      tag: `claim-${dateKey}`, // replaces any earlier notification for the same date rather than stacking duplicates
      icon: 'icons/icon-192.png',
    });
  }catch(e){ /* best-effort — the claim flow continues regardless */ }
}
// Drops a plain-text summary of today's claim(s) straight into the
// downloads folder, the same reliable way the pass photo already does
// — train, delay, ticket price, and payout for whichever of AM/PM
// applied. This is what actually survives the fact that there's no way
// back to this app's own claim screen once Avanti's site has taken
// over the window — a screenshot would need remembering to take one in
// the moment; this just always happens.
function triggerClaimDetailsDownload(dateKey){
  try{
    const dayClaims = delayClaims[dateKey] || {};
    const price = getSeasonPriceForDate(dateKey);
    const lines = [`Delay repay claim — ${dateLabel(parseKey(dateKey))}`, ''];
    ['AM', 'PM'].forEach(dir => {
      const claim = dayClaims[dir];
      if (!claim) return;
      const confirmedKey = (confirmedTrains[dateKey] || {})[dir];
      const train = railTrains.find(t => t.key === confirmedKey);
      const trainLabel = train ? train.label : dir;
      lines.push(`${dir} — ${trainLabel}`);
      lines.push(`  Delay: ${claim.minutesLate} minute${claim.minutesLate === 1 ? '' : 's'}`);
      lines.push(`  Ticket price: £${price.toFixed(2)}`);
      lines.push(`  Estimated payout: £${claim.amount.toFixed(2)}`);
      lines.push('');
    });
    if (smartcardNumber) lines.push(`Smartcard number: ${smartcardNumber}`);
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `claim-details-${dateKey}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(e){ /* best-effort — the claim flow continues regardless */ }
}
// Runs the pass photo and claim-details downloads one after the other,
// clearly spaced apart, rather than firing both at once — Chrome tends
// to silently throttle multiple automatic downloads triggered in quick
// succession from the same interaction, and firing them close together
// once caused exactly that: the text file (a fully synchronous trigger)
// was completing before the photo download's own click ever fired,
// since that one has to wait on an IndexedDB read first. Photo goes
// first, since it's the one that actually needs attaching to Avanti's
// form — the text file is reference material, useful but not essential
// in the same way.
async function triggerAllClaimDownloads(dateKey){
  await triggerPassPhotoDownload();
  if (produceClaimDetailsFile){
    await new Promise(resolve => setTimeout(resolve, 600));
    triggerClaimDetailsDownload(dateKey);
  }
}
// Drops the saved pass photo straight into the downloads folder — named
// with today's date so repeat downloads stay distinguishable during an
// occasional manual tidy-up, with the extension matched to whatever was
// actually uploaded rather than assumed. Being the most recently
// downloaded file, it normally sorts first in a file/photo picker,
// without the app being able to pin it there directly. Silent in the
// sense of no extra tap or dialog — Android's own "file downloaded"
// notification is still outside any web app's control. Never throws:
// no photo saved (or a failed read) just means the claim flow continues
// without one, exactly as it always did before this existed.
async function triggerPassPhotoDownload(){
  let record;
  try{ record = await getPassPhoto(); }
  catch(e){ return; }
  if (!record || !record.blob) return;
  const ext = (record.type && record.type.includes('/')) ? record.type.split('/')[1].replace('jpeg', 'jpg') : 'jpg';
  const filename = `pass-photo-${fmtKey(new Date())}.${ext}`;
  const url = URL.createObjectURL(record.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Revoked shortly after rather than immediately — the object URL needs
  // to stay valid long enough for the download to actually complete.
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Confirmed against two real Avanti claims on the Flexi 8 ticket: a 15-29
// min delay paid £2.40 and a 30-59 min delay paid £4.80, both matching
// (ticket price ÷ 16) × band exactly at £153.60. Worth re-checking if the
// ticket type or price structure ever changes.
const DELAY_REPAY_DIVISOR = 16;

function delayRepayBandPercent(minutes){
  if (minutes >= 60) return 1.0;
  if (minutes >= 30) return 0.5;
  if (minutes >= 15) return 0.25;
  return 0;
}

// Finds the season ticket price that was actually valid on a given past
// date, rather than just using whatever the current price is — so a later
// price change doesn't retroactively distort an older claim's value.
function getSeasonPriceForDate(dateKey){
  const seasonPurchases = purchases.filter(p => (p.type || undefined) !== 'single' && p.date <= dateKey);
  if (seasonPurchases.length === 0) return lastKnownPrice;
  seasonPurchases.sort((a, b) => a.date < b.date ? -1 : 1);
  return seasonPurchases[seasonPurchases.length - 1].cost;
}

function computeDelayRepayAmount(minutes, dateKey){
  const price = getSeasonPriceForDate(dateKey);
  return (price / DELAY_REPAY_DIVISOR) * delayRepayBandPercent(minutes);
}

// "I think you're on this train" detection
const DEFAULT_GEOFENCE_RADIUS_M = 500; // original single value, informed by real field-test readings — now just the starting point for both stations, and a defensive fallback for an unrecognised station code
// Sane bounds for either station's radius, shared by the settings editor
// and by loading back from storage — a tight floor stops the boarding
// side from being tuned so small that ordinary GPS wobble on the
// platform itself starts causing missed detections; the ceiling is a
// sanity cap well beyond the original 500m already found too wide.
const GEOFENCE_RADIUS_MIN_M = 50;
const GEOFENCE_RADIUS_MAX_M = 1000;
function clampGeofenceRadius(v){
  const n = Number(v);
  if (!Number.isFinite(n) || n < GEOFENCE_RADIUS_MIN_M) return GEOFENCE_RADIUS_MIN_M;
  return Math.min(GEOFENCE_RADIUS_MAX_M, Math.round(n));
}
// Resolved, per-station values — always the actual effective radius in
// use right now, whether set independently or currently driven by the
// other station's "Match" tickbox in the settings editor. Deliberately
// the only thing the geofence check itself ever reads — anything reading
// these later (this app, or a future Wear OS companion) only ever needs
// two plain numbers, not the sync relationship that produced them.
let geofenceRadiusCrewe = DEFAULT_GEOFENCE_RADIUS_M;
let geofenceRadiusWigan = DEFAULT_GEOFENCE_RADIUS_M;
// UI memory only — which direction of sync (if any) the settings editor
// should show as ticked next time it's opened. At most one of these is
// ever true; the editor enforces that mutual exclusion on tick, not just
// on save. Not consulted by the geofence check itself.
let geofenceCreweMatchesWigan = false;
let geofenceWiganMatchesCrewe = false;
function geofenceRadiusForCrs(crs){
  if (crs === 'CRE') return geofenceRadiusCrewe;
  if (crs === 'WGN') return geofenceRadiusWigan;
  return DEFAULT_GEOFENCE_RADIUS_M; // defensive — shouldn't happen with the two configured stations
}

  try{
    const fcy = localStorage.getItem('ticket-fare-checked-year');
    fareCheckedYear = fcy ? JSON.parse(fcy) : null;
  }catch(e){ fareCheckedYear = null; }
  try{
    const dm = localStorage.getItem('ticket-dismissed-months');
    dismissedMonths = dm ? JSON.parse(dm) : {};
  }catch(e){ dismissedMonths = {}; }
  try{
    const ge = localStorage.getItem('gcal-enabled');
    gcalEnabled = ge ? JSON.parse(ge) : false;
  }catch(e){ gcalEnabled = false; }
  try{
    const pe = localStorage.getItem('preferred-google-email');
    preferredGoogleEmail = pe ? JSON.parse(pe) : '';
  }catch(e){ preferredGoogleEmail = ''; }
  try{
    const dm = localStorage.getItem('debug-mode-enabled');
    debugModeEnabled = dm ? JSON.parse(dm) : false;
  }catch(e){ debugModeEnabled = false; }
  try{
    const we = localStorage.getItem('weather-enabled');
    weatherEnabled = we ? JSON.parse(we) : true;
  }catch(e){ weatherEnabled = true; }
  try{
    const ar = localStorage.getItem('alternative-routes');
    alternativeRoutes = ar ? JSON.parse(ar) : [];
  }catch(e){ alternativeRoutes = []; }
  try{
    const etv = localStorage.getItem('emergency-tab-visible');
    emergencyTabVisible = etv ? JSON.parse(etv) : false;
  }catch(e){ emergencyTabVisible = false; }
  try{
    const dbe = localStorage.getItem('drive-backup-enabled');
    driveBackupEnabled = dbe ? JSON.parse(dbe) : false;
  }catch(e){ driveBackupEnabled = false; }
  try{
    const dbd = localStorage.getItem('drive-backup-dirty');
    driveBackupDirty = dbd ? JSON.parse(dbd) : false;
  }catch(e){ driveBackupDirty = false; }
  try{
    const dbt = localStorage.getItem('drive-backup-last-time');
    lastDriveBackupTime = dbt ? JSON.parse(dbt) : 0;
  }catch(e){ lastDriveBackupTime = 0; }
  try{
    const dbf = localStorage.getItem('drive-backup-folder-id');
    driveBackupFolderId = dbf ? JSON.parse(dbf) : null;
  }catch(e){ driveBackupFolderId = null; }
  try{
    const gi = localStorage.getItem('gcal-event-id');
    gcalEventId = gi ? JSON.parse(gi) : null;
  }catch(e){ gcalEventId = null; }
  try{
    const gp = localStorage.getItem('gcal-pending-sync');
    gcalPendingSync = gp ? JSON.parse(gp) : false;
  }catch(e){ gcalPendingSync = false; }
  try{
    const ln = localStorage.getItem('ticket-last-notified-buy-key');
    lastNotifiedBuyKey = ln ? JSON.parse(ln) : null;
  }catch(e){ lastNotifiedBuyKey = null; }
  try{
    const rt = localStorage.getItem('rail-trains');
    railTrains = rt ? JSON.parse(rt) : DEFAULT_RAIL_TRAINS.slice();
  }catch(e){ railTrains = DEFAULT_RAIL_TRAINS.slice(); }
  try{
    const rc = localStorage.getItem('rail-perf-cache');
    railPerfCache = rc ? JSON.parse(rc) : {};
  }catch(e){ railPerfCache = {}; }
  try{
    const rsd = localStorage.getItem('rail-synced-days');
    railSyncedDays = rsd ? JSON.parse(rsd) : {};
  }catch(e){ railSyncedDays = {}; }
  // One-time reset: an earlier version of railSyncedDays could mark a
  // train as "synced" for a date based on a DIFFERENT train's result for
  // that same date (a since-fixed proxy/client bug — see
  // rail-performance-proxy.js and railSyncDatesBatch's comments). Those
  // entries look identical to correct ones and can't be told apart after
  // the fact, so the only reliable fix is to clear the whole cache once
  // and let it rebuild accurately. Costs one extra full backfill pass;
  // real data in railPerfCache itself is untouched.
  try{
    if (!localStorage.getItem('rail-synced-days-reset-v2')){
      railSyncedDays = {};
      localStorage.setItem('rail-synced-days', '{}'); // persist the clear immediately — don't rely on the next sync to save it
      localStorage.setItem('rail-synced-days-reset-v2', '1');
    }
  }catch(e){ /* not critical if this flag can't be set — worst case it resets again next load */ }
  try{
    const rhd = localStorage.getItem('rail-history-days-back');
    railHistoryDaysBack = rhd ? JSON.parse(rhd) : 90;
  }catch(e){ railHistoryDaysBack = 90; }
  try{
    const rcc = localStorage.getItem('reason-codes-cache');
    reasonCodesCache = rcc ? JSON.parse(rcc) : { fetchedAt: 0, codes: {} };
  }catch(e){ reasonCodesCache = { fetchedAt: 0, codes: {} }; }
  try{
    const ct = localStorage.getItem('confirmed-trains');
    confirmedTrains = ct ? JSON.parse(ct) : {};
  }catch(e){ confirmedTrains = {}; }
  try{
    const scb = localStorage.getItem('silent-confirm-banner');
    const parsed = scb ? JSON.parse(scb) : null;
    // Only meaningful for today — a leftover banner from a previous day
    // (e.g. the app wasn't opened again before the day rolled over) has
    // nothing left to dismiss; it should just be gone, not show up
    // referencing yesterday's train.
    silentConfirmBanner = (parsed && parsed.dateKey === fmtKey(new Date())) ? parsed : null;
  }catch(e){ silentConfirmBanner = null; }
  try{
    const dc = localStorage.getItem('delay-claims');
    delayClaims = dc ? JSON.parse(dc) : {};
  }catch(e){ delayClaims = {}; }
  try{
    const tt = localStorage.getItem('tracked-trains');
    trackedTrains = tt ? JSON.parse(tt) : [];
    // Elapsed-time expiry only — deliberately not tied to the calendar
    // day. A previous version also cleared the whole list outright on
    // the first app open of a new day, on the reasoning that a train
    // tracked yesterday evening has no business surviving into this
    // morning's commute. But that only ever fired at app-load, so a
    // genuinely overnight service tracked at 23:00 and still running
    // when the app was reopened at 00:05 would be wiped outright, not
    // just stale-looking — the exact case this app's own midnight-aware
    // date logic elsewhere is built to handle correctly. Tracked-train
    // persistence should follow the journey's actual lifetime, which
    // this age check already does correctly across a midnight crossing,
    // not the calendar date.
    const now = Date.now();
    trackedTrains = trackedTrains.filter(t => (now - t.addedAt) < TRACKED_TRAIN_MAX_AGE_MS);
  }catch(e){ trackedTrains = []; }
  try{
    const cpsc = localStorage.getItem('confirmed-point-status-cache');
    confirmedPointStatusCache = cpsc ? new Map(JSON.parse(cpsc)) : new Map();
    pruneConfirmedPointStatusCache(); // trackedTrains is already fully loaded/filtered by this point above
  }catch(e){ confirmedPointStatusCache = new Map(); }
  try{
    const lsjs = localStorage.getItem('last-seen-journey-state');
    lastSeenJourneyState = lsjs ? new Map(JSON.parse(lsjs)) : new Map();
    pruneLastSeenJourneyState(); // trackedTrains is already fully loaded/filtered by this point above
  }catch(e){ lastSeenJourneyState = new Map(); }
  try{
    const lssm = localStorage.getItem('last-seen-staff-match');
    lastSeenStaffMatch = lssm ? new Map(JSON.parse(lssm)) : new Map();
    pruneLastSeenStaffMatch();
  }catch(e){ lastSeenStaffMatch = new Map(); }
  try{
    const p = localStorage.getItem('ticket-period-start');
    periodStart = p ? JSON.parse(p) : DEFAULT_PERIOD_START;
  }catch(e){ periodStart = DEFAULT_PERIOD_START; }

  // One-time import of the comments from the original spreadsheet.
  // Only fills in dates that don't already have a comment, and only runs once.
  let alreadySeeded = false;
  try{
    const s = localStorage.getItem('ticket-seed-imported');
    alreadySeeded = !!(s && JSON.parse(s));
  }catch(e){ alreadySeeded = false; /* key not found yet — expected on first run */ }

  if (!alreadySeeded){
    let changed = false;
    for (const key in SEED_COMMENTS){
      if (!comments[key]){
        comments[key] = SEED_COMMENTS[key];
        changed = true;
      }
    }
    if (changed) await saveComments();
    try{ localStorage.setItem('ticket-seed-imported', JSON.stringify(true)); }catch(e){}
  }

}
