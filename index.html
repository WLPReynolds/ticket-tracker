<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8-Day Ticket</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="8-Day Ticket">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --board: #14161f;
    --board-2: #1c1f2c;
    --tile: #23273a;
    --ink: #e9e6da;
    --ink-dim: #9a9db0;
    --amber: #f2a93b;
    --amber-dim: #8a6a30;
    --line: #33384d;
    --danger: #e05a4e;
    --good: #6fbf8a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--board);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height:100vh;
  }
  header.top{
    position: relative;
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--board-2), var(--board));
  }
  .bunting-row{
    display: flex;
    justify-content: center;
    gap: 5px;
    padding-bottom: 10px;
  }
  .bunting-flag{
    width: 12px;
    height: 12px;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .menu-dropdown{
    position: fixed;
    bottom: calc(74px + env(safe-area-inset-bottom));
    right: 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 -6px 28px rgba(0,0,0,0.45);
    z-index: 65;
    min-width: 240px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .menu-dropdown .settings-link{
    margin: 0;
    padding: 13px 16px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    text-decoration: none;
    color: var(--ink);
  }
  .menu-dropdown .settings-link:active{
    background: rgba(255,255,255,0.06);
  }
  .menu-dropdown .settings-link:last-child{ border-bottom: none; }

  .bottom-nav{
    position: sticky;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: var(--board-2);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 55;
  }
  .bottom-nav-item{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 9px 4px 8px;
    color: var(--ink-dim);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-nav-item svg{
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }
  .bottom-nav-item .bn-label{
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .bottom-nav-item.active{
    color: var(--amber);
  }
  .bottom-nav-item:active{
    background: rgba(255,255,255,0.04);
  }

  .cal-nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav-btn{
    width: 34px; height: 34px;
    display: flex; align-items:center; justify-content:center;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--amber);
    font-size: 18px;
    cursor: pointer;
  }
  .cal-nav-title{
    font-size: 15px;
    font-weight: 700;
  }
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-weekday{
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding-bottom: 6px;
  }
  .cal-day{
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    color: var(--ink);
    background: var(--tile);
    position: relative;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .cal-day.weekend{ color: var(--ink-dim); background: transparent; }
  .cal-day.empty{ background: transparent; }
  .cal-day.today{ border: 1.5px solid var(--amber); font-weight: 700; }
  .cal-dot{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--amber);
    margin-top: 3px;
  }
  .cal-dot-row{
    display: flex;
    gap: 3px;
  }
  .cal-dot-delay{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: transparent;
    border: 1.3px solid #ff8b7e;
    margin-top: 3px;
    box-sizing: border-box;
  }
  .cal-dot-confirmed{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ff8b7e;
    margin-top: 3px;
  }
  .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 700;
    margin-bottom: 4px;
  }
  h1{
    font-size: 22px;
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .today-date{
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 2px;
  }

  .board-card{
    margin: 18px 16px 0;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  .board-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background: repeating-linear-gradient(90deg, var(--amber-dim) 0 10px, transparent 10px 20px);
    opacity: 0.6;
  }

  .flip-row{
    display:flex;
    justify-content:center;
    align-items: baseline;
    gap: 10px;
    margin: 6px 0 18px;
  }
  .flip-tile{
    width: 74px;
    height: 96px;
    background: linear-gradient(180deg, #2c3146, #1c1f2c);
    border-radius: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 54px;
    font-weight: 800;
    color: var(--amber);
    box-shadow: inset 0 0 0 1px var(--line), 0 6px 14px rgba(0,0,0,0.4);
    position: relative;
  }
  .flip-tile::after{
    content:"";
    position:absolute; left:0; right:0; top:50%;
    height:1px;
    background: rgba(0,0,0,0.5);
  }
  .flip-of8{
    display:flex; flex-direction:column; align-items:center;
  }
  .flip-of8 .num{
    font-size: 40px;
    font-weight: 300;
    color: var(--ink-dim);
  }
  .flip-of8 .label{
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .punch-row{
    display:flex;
    justify-content:center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .punch{
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size: 11px;
    color: var(--ink-dim);
    font-weight: 700;
    transition: all 0.2s;
  }
  .punch.done{
    background: var(--amber);
    border-color: var(--amber);
    color: #14161f;
  }

  .day-progress-label{
    text-align:center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .day-progress-track{
    height: 5px;
    background: var(--tile);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .day-progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
  }

  .status-banner{
    margin-top: 16px;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .status-banner.renew{
    background: rgba(224,90,78,0.15);
    color: #ff8b7e;
    border: 1px solid rgba(224,90,78,0.4);
  }
  .status-banner.ok{
    background: rgba(111,191,138,0.12);
    color: var(--good);
    border: 1px solid rgba(111,191,138,0.3);
  }
  .status-banner.skip{
    background: rgba(154,157,176,0.1);
    color: var(--ink-dim);
    border: 1px solid var(--line);
  }

  .next-buy-line{
    margin-top: 8px;
    text-align: center;
    font-size: 12.5px;
    color: var(--amber);
    letter-spacing: 0.2px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .section-label{
    margin: 26px 16px 10px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-weight: 700;
  }

  .holiday-card{
    margin: 18px 16px 0;
    background: linear-gradient(135deg, #2a3b4a, #1c2a35);
    border: 1px solid #3a5468;
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .holiday-count{
    font-size: 36px;
    font-weight: 800;
    color: #7fc9e8;
    font-family: 'Courier New', monospace;
    min-width: 50px;
  }
  .holiday-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-dim);
    font-weight: 700;
  }
  .holiday-date{
    font-size: 14px;
    color: var(--ink);
    margin-top: 2px;
  }

  .comment-card{
    margin: 0 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .chip-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chip{
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--tile);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background: var(--amber);
    color: #14161f;
    border-color: var(--amber);
  }
  input[type=text]{
    width: 100%;
    background: var(--tile);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-top: 4px;
  }
  input[type=text]::placeholder{ color: var(--ink-dim); }
  input[type=date]{
    width: 100%;
    background: var(--tile);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color-scheme: dark;
  }

  .day-list{
    margin: 0 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .day-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .day-row.no-click{
    cursor: default;
  }
  .day-row:last-child{ border-bottom:none; }
  .day-row.is-today{
    background: rgba(242,169,59,0.07);
  }
  .day-row .count-badge{
    width: 30px; height:30px;
    border-radius: 7px;
    background: var(--tile);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink-dim);
    flex-shrink:0;
  }
  .day-row .count-badge.eight{
    background: var(--amber);
    color: #14161f;
  }
  .day-row .count-badge.weekend{
    opacity: 0.4;
  }
  .day-row .info{ flex:1; min-width:0; }
  .day-row .dname{
    font-size: 14px;
    font-weight: 700;
  }
  .day-row .dname .sub{
    font-weight: 400;
    color: var(--ink-dim);
    font-size: 12px;
    margin-left: 6px;
  }
  .day-row .comment-tag{
    font-size: 12px;
    color: var(--amber);
    margin-top: 2px;
  }
  .day-row .arrow{
    color: var(--ink-dim);
    font-size: 18px;
  }
  .rail-blob{
    display: inline-block;
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--amber);
    margin-left: 8px;
    vertical-align: middle;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .rail-blob::after{
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 36px;
    height: 36px;
    transform: translate(-50%, -50%);
  }
  .rail-blob-confirmed{
    background: #ff8b7e;
  }
  .rail-detail-row{
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .rail-detail-row:last-child{ border-bottom: none; }
  /* Train-progress rows only (identified by data-idx) — the divider
     otherwise spans the row's full width, overhanging past the tracker
     line and dots on the left. Trimmed to start exactly where those
     sit instead, so it reads as meeting the timeline rather than
     floating past it. */
  .rail-detail-row[data-idx]{
    border-bottom: none;
  }
  .rail-detail-row[data-idx]::after{
    content: '';
    position: absolute;
    left: 6px;
    right: 0;
    bottom: 0;
    height: 1px;
    background: var(--line);
  }
  .rail-detail-row[data-idx]:last-child::after{
    display: none;
  }
  .rail-col-header{
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 14px 0 6px;
  }

  .save-btn{
    width:100%;
    margin-top: 10px;
    background: var(--amber);
    color: #14161f;
    border:none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor:pointer;
  }
  .save-btn:active{ transform: scale(0.98); }

  .settings-link{
    text-align:center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor:pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .settings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(78px, 1fr));
    gap:18px 4px;
    margin-top:16px;
  }
  .settings-grid-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .settings-grid-item svg{
    width:24px;
    height:24px;
    color:var(--ink-dim);
  }
  .settings-grid-item.active svg{
    color:var(--amber);
  }
  .settings-grid-item span{
    font-size:11px;
    color:var(--ink-dim);
    text-align:center;
    line-height:1.2;
  }

  .day-nav-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 10px 16px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .day-nav-btn:active{
    background: rgba(255,255,255,0.06);
  }
  .day-nav-btn .arrow-icon{
    color: var(--amber);
    font-size: 14px;
  }

  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.6);
    display:flex; align-items:flex-end;
    z-index: 50;
  }
  .modal{
    background: var(--board-2);
    width:100%;
    border-radius: 16px 16px 0 0;
    padding: 20px 18px 28px;
    border-top: 1px solid var(--line);
    /* A generous fixed ceiling, not dependent on measuring the bottom
       bar's exact height — that measurement approach turned out to be
       unreliable (the same root cause behind the old "Show more days"
       bug). This guarantees any modal's own content, however long, can
       always be reached via its own internal scroll rather than
       potentially being trapped behind the bar with no way to reach it. */
    max-height: calc(100vh - 80px - env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .modal h3{ margin:0 0 4px; font-size:16px; }
  .modal .sub{ color: var(--ink-dim); font-size:13px; margin-bottom:14px; }

  .modal-overlay-full{
    align-items: stretch;
  }
  .modal-overlay-full .modal{
    border-radius: 0;
    height: 100dvh;
    max-height: 100dvh;
    display: flex;
    flex-direction: column;
    /* A generous fixed allowance for the bottom nav bar sitting on top of
       this modal (same reasoning as the base .modal fix) — this was
       previously only reserving 20px total, nowhere near enough, which
       is why Close ended up trapped underneath the bar. */
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }


  /* Bottom-sheet modals sit below the app's bottom nav in the stacking
     order. Reserve the nav's height inside the modal so its own controls
     (especially Close) cannot end up underneath the nav. This is the same
     safe-area principle used by the full-screen train-progress modal, but
     without making the bottom-sheet itself full-screen. */
  .modal-overlay-nav-safe .modal{
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }


  .cal-overlay{
    align-items: flex-start;
    padding-top: 60px;
  }
  .cal-modal{
    border-radius: 16px;
    border-top: 1px solid var(--line);
    margin: 0 12px;
  }
  .modal-close{
    text-align:center;
    margin-top: 14px;
    color: var(--ink-dim);
    font-size: 13px;
    cursor:pointer;
  }
  .loading{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-dim);
  }
  @keyframes blob-pulse{
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }
  .blob-pulsing{
    animation: blob-pulse 1.4s ease-in-out infinite;
  }

  /* Retro split-flap departure board — deliberately its own visual
     language (black background, amber monospace text) rather than the
     app's usual dark-navy/amber palette, since the whole point is to
     look like a real station board, not like the rest of this app. */
  .depboard-panel{
    background: #000;
    color: #ffb000;
    font-family: 'Courier New', monospace;
    padding: 8px 12px 4px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .depboard-title{
    text-align: center;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 2px;
    color: #fff;
    padding-bottom: 4px;
  }
  .depboard-header-row, .depboard-row{
    display: grid;
    grid-template-columns: 52px 1fr 40px 84px;
    column-gap: 6px;
  }
  .depboard-header-row{
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding-bottom: 4px;
    border-bottom: 1px solid #333;
    margin-bottom: 2px;
  }
  .depboard-rows-wrap{
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .depboard-row{
    font-size: 14px;
    padding: 3px 0;
    letter-spacing: 0.5px;
  }
  .depboard-row.cancelled{ color: #ff4d3d; }
  .depboard-note-row{
    font-size: 10.5px;
    color: #ffb000;
    opacity: 0.75;
    padding: 0 0 3px 58px;
  }
  .depboard-footer{
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #fff;
    padding: 4px 0 2px;
    border-top: 1px solid #333;
  }

  /* Help guide — rendered from Markdown, styled to match the rest of the
     app's dark theme rather than looking like a foreign document. */
  .help-content h2{
    font-size: 17px;
    color: var(--amber);
    margin: 22px 0 8px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .help-content h2:first-child{ margin-top: 0; }
  .help-content h3{

// Live-progress polling cadence, both configurable from the menu (see

  return Math.min(POLL_CHECK_IN_INTERVAL_MIN_MAX, Math.round(n));
}

const DARWIN_WORKER_URL = 'https://darwin-live-proxy.wayne-lee-paul-reynolds.workers.dev';

let railSyncInProgress = false;

];

// Crewe and Wigan North Western: manually verified, field-tested

// dataset below for these two stations specifically. Do not replace

const STATION_COORDS = {

};

// Haversine formula — great-circle distance between two lat/lon points, in km.
function distanceKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

let estimateOffset = 0; // 0 = current pay period, 1 = next, 2 = the one after, etc. (not persisted)
let confirmedTrains = {}; // "YYYY-MM-DD" -> { AM: trainKey, PM: trainKey } — which specific train you actually caught, manually confirmed for now

// Delay Repay claim tracking — dateKey -> { AM: {status, minutesLate, amount}, PM: {...} }
// status is 'started' (link tapped, submission not confirmed) or 'confirmed'
// (manually marked as actually submitted/completed). Only ever set for the
// CONFIRMED train on a given direction, never for other trains that also
// happened to be delayed that day but weren't the one actually ridden.
let delayClaims = {};
const AVANTI_CLAIM_URL = 'https://delayrepay.avantiwestcoast.co.uk/';

// ---- Pass photo storage (IndexedDB) ----
// Delay repay claims almost always want a photo of your pass. Stored
// here as a Blob rather than in localStorage, which can only hold
// strings and has nowhere near enough quota for an image. A single
// fixed record ('current') — uploading a new photo replaces it, so
// there's never more than one to manage or clean up.
const PASS_PHOTO_DB_NAME = 'pass-photo-store';
const PASS_PHOTO_DB_VERSION = 1;
const PASS_PHOTO_STORE = 'photos';
const PASS_PHOTO_KEY = 'current';

function openPassPhotoDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PASS_PHOTO_DB_NAME, PASS_PHOTO_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(PASS_PHOTO_STORE)) db.createObjectStore(PASS_PHOTO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function savePassPhoto(blob){
  const db = await openPassPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PASS_PHOTO_STORE, 'readwrite');
    tx.objectStore(PASS_PHOTO_STORE).put({ blob, type: blob.type, uploadedAt: new Date().toISOString() }, PASS_PHOTO_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getPassPhoto(){
  const db = await openPassPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PASS_PHOTO_STORE, 'readonly');
    const req = tx.objectStore(PASS_PHOTO_STORE).get(PASS_PHOTO_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePassPhoto(){
  const db = await openPassPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PASS_PHOTO_STORE, 'readwrite');
    tx.objectStore(PASS_PHOTO_STORE).delete(PASS_PHOTO_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
// A real anchor-tag click, not window.open() — on a PWA running in
// standalone/installed mode, Android Chrome sometimes treats a
// JS-triggered window.open() as a transient in-app overlay (closing it
// destroys it entirely, with no way back), whereas a genuine link click
// is occasionally handled as a proper external navigation into the
// actual browser instead — independently switchable, the way opening a
// link normally works. Not guaranteed either way; this is a real
// platform behaviour outside what a web app can fully dictate, worth
// trying rather than promising it'll definitely change anything.
function openExternalLink(url){
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
// Silently puts the smartcard number on the clipboard the instant a
// claim starts — the actual fix for the window-switching problem, not
// a workaround for it. The number's ready to paste into Avanti's form
// the moment its page loads, with no need to ever switch back to this
// app for that specific step. Back to a single write, not a staged
// sequence — the earlier version also staged the ticket price as a
// second write, but that one was found to fail consistently in the
// real claim flow (two separate fix attempts didn't resolve it — see
// the backlog), while the smartcard number has always copied
// reliably. The claim notification shows the price now instead, so
// nothing's lost by dropping the attempt. Never throws: no number
// saved, or a denied/unavailable clipboard permission, just means the
// claim flow continues without it, same as every other best-effort
// step here.
async function copySmartcardToClipboard(){
  if (!smartcardNumber) return;
  try{ await navigator.clipboard.writeText(smartcardNumber); }
  catch(e){ /* clipboard unavailable or denied — nothing more to do */ }
}
// The exact wording Avanti's own claim form uses for its delay bands —
// reuses the same boundaries as the payout calculation itself, so the
// two can never quietly drift out of sync with each other.
function delayRepayBandLabel(minutes){
  if (minutes >= 60) return '60+ min';
  if (minutes >= 30) return '30-59 min';
  if (minutes >= 15) return '15-29 min';
  return `${minutes} min`; // claims are only ever created at/above the 15-min threshold — this is just a safe fallback, not expected in practice
}
// A plain, read-only notification — deliberately no action buttons, no
// attempt to copy anything from within it. Notification bodies aren't
// reliably text-selectable on Android, and a Service Worker (which is
// what would handle a tap on an action button) has no access to the
// clipboard at all — confirmed before building this, not assumed. This
// exists purely so the delay band(s) — the one thing you have to read
// and select rather than paste — stay glanceable from the notification
// shade while Avanti's page has the screen, covering whichever of
// AM/PM genuinely has a claim that day.
async function showClaimBandNotification(dateKey){
  try{
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (!('serviceWorker' in navigator)) return;
    const dayClaims = delayClaims[dateKey] || {};
    const lines = ['AM', 'PM']
      .map(dir => dayClaims[dir] ? `${dir}: ${delayRepayBandLabel(dayClaims[dir].minutesLate)}` : null)
      .filter(Boolean);
    if (!lines.length) return;
    // Ticket price added alongside the band(s) — genuinely redundant
    // with the clipboard copy most of the time, but a visible backup is
    // worth having given the clipboard write for exactly this value was
    // found to fail silently in one real case.
    lines.push(`Ticket: £${getSeasonPriceForDate(dateKey).toFixed(2)}`);
    const registration = await navigator.serviceWorker.ready;
    await registration.showNotification('Delay repay claim', {
      body: lines.join('\n'),
      tag: `claim-${dateKey}`, // replaces any earlier notification for the same date rather than stacking duplicates
      icon: 'icons/icon-192.png',
    });
  }catch(e){ /* best-effort — the claim flow continues regardless */ }
}
// Drops a plain-text summary of today's claim(s) straight into the
// downloads folder, the same reliable way the pass photo already does
// — train, delay, ticket price, and payout for whichever of AM/PM
// applied. This is what actually survives the fact that there's no way
// back to this app's own claim screen once Avanti's site has taken
// over the window — a screenshot would need remembering to take one in
// the moment; this just always happens.
function triggerClaimDetailsDownload(dateKey){
  try{
    const dayClaims = delayClaims[dateKey] || {};
    const price = getSeasonPriceForDate(dateKey);
    const lines = [`Delay repay claim — ${dateLabel(parseKey(dateKey))}`, ''];
    ['AM', 'PM'].forEach(dir => {
      const claim = dayClaims[dir];
      if (!claim) return;
      const confirmedKey = (confirmedTrains[dateKey] || {})[dir];
      const train = railTrains.find(t => t.key === confirmedKey);
      const trainLabel = train ? train.label : dir;
      lines.push(`${dir} — ${trainLabel}`);
      lines.push(`  Delay: ${claim.minutesLate} minute${claim.minutesLate === 1 ? '' : 's'}`);
      lines.push(`  Ticket price: £${price.toFixed(2)}`);
      lines.push(`  Estimated payout: £${claim.amount.toFixed(2)}`);
      lines.push('');
    });
    if (smartcardNumber) lines.push(`Smartcard number: ${smartcardNumber}`);
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `claim-details-${dateKey}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(e){ /* best-effort — the claim flow continues regardless */ }
}
// Runs the pass photo and claim-details downloads one after the other,
// clearly spaced apart, rather than firing both at once — Chrome tends
// to silently throttle multiple automatic downloads triggered in quick
// succession from the same interaction, and firing them close together
// once caused exactly that: the text file (a fully synchronous trigger)
// was completing before the photo download's own click ever fired,
// since that one has to wait on an IndexedDB read first. Photo goes
// first, since it's the one that actually needs attaching to Avanti's
// form — the text file is reference material, useful but not essential
// in the same way.
async function triggerAllClaimDownloads(dateKey){
  await triggerPassPhotoDownload();
  if (produceClaimDetailsFile){
    await new Promise(resolve => setTimeout(resolve, 600));
    triggerClaimDetailsDownload(dateKey);
  }
}
// Drops the saved pass photo straight into the downloads folder — named
// with today's date so repeat downloads stay distinguishable during an
// occasional manual tidy-up, with the extension matched to whatever was
// actually uploaded rather than assumed. Being the most recently
// downloaded file, it normally sorts first in a file/photo picker,
// without the app being able to pin it there directly. Silent in the
// sense of no extra tap or dialog — Android's own "file downloaded"
// notification is still outside any web app's control. Never throws:
// no photo saved (or a failed read) just means the claim flow continues
// without one, exactly as it always did before this existed.
async function triggerPassPhotoDownload(){
  let record;
  try{ record = await getPassPhoto(); }
  catch(e){ return; }
  if (!record || !record.blob) return;
  const ext = (record.type && record.type.includes('/')) ? record.type.split('/')[1].replace('jpeg', 'jpg') : 'jpg';
  const filename = `pass-photo-${fmtKey(new Date())}.${ext}`;
  const url = URL.createObjectURL(record.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Revoked shortly after rather than immediately — the object URL needs
  // to stay valid long enough for the download to actually complete.
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Confirmed against two real Avanti claims on the Flexi 8 ticket: a 15-29
// min delay paid £2.40 and a 30-59 min delay paid £4.80, both matching
// (ticket price ÷ 16) × band exactly at £153.60. Worth re-checking if the
// ticket type or price structure ever changes.
const DELAY_REPAY_DIVISOR = 16;

function delayRepayBandPercent(minutes){
  if (minutes >= 60) return 1.0;
  if (minutes >= 30) return 0.5;
  if (minutes >= 15) return 0.25;
  return 0;
}

// Finds the season ticket price that was actually valid on a given past
// date, rather than just using whatever the current price is — so a later
// price change doesn't retroactively distort an older claim's value.
function getSeasonPriceForDate(dateKey){
  const seasonPurchases = purchases.filter(p => (p.type || undefined) !== 'single' && p.date <= dateKey);
  if (seasonPurchases.length === 0) return lastKnownPrice;
  seasonPurchases.sort((a, b) => a.date < b.date ? -1 : 1);
  return seasonPurchases[seasonPurchases.length - 1].cost;
}

function computeDelayRepayAmount(minutes, dateKey){
  const price = getSeasonPriceForDate(dateKey);
  return (price / DELAY_REPAY_DIVISOR) * delayRepayBandPercent(minutes);
}

// Trains being actively watched by serviceID, independent of any
// station's rolling board window — lets a journey be followed all the
// way to its destination, even after it's long departed the station you
// first spotted it from, and even across closing/reopening the app.
let trackedTrains = []; // [{ serviceId, label, fromLoc, addedAt }]
const TRACKED_TRAIN_MAX_AGE_MS = 6 * 60 * 60 * 1000; // stop tracking after 6 hours regardless — a journey this long has almost certainly finished
const TRACKED_TRAIN_MAX = 5; // matches the cap enforced when a train is opened (see openTrainProgress) — kept in one place so the "+ Track a train" flow can check it before adding, rather than only finding out after something's already been silently dropped

// "I think you're on this train" detection
const GEOFENCE_RADIUS_M = 500; // informed by real field-test readings — Crewe/Wigan both fall well inside this
const LIKELY_TRAIN_CHECK_INTERVAL_MS = 2 * 60 * 1000; // how often to check while the app is open
// Was 45 — wide enough that adjacent configured trains an hour apart
// (e.g. 16:31/17:31) had overlapping windows, so simply being near the
// station well before your actual train could bring an earlier one into
// scope at all. Tightened so neighbouring hourly-ish trains no longer
// overlap under normal circumstances.
const LIKELY_TRAIN_TIME_WINDOW_MIN = 20; // only bother checking within this many minutes either side of a configured train time
const LIKELY_ARRIVAL_WINDOW_FORWARD_MIN = 50; // arrival-side check: forward-only from departure time, wide enough for a real journey plus delay margin, narrow enough to stay under this app's own hourly train spacing
// How close a candidate's own live departure must be to right now before
// it's confident enough to silently confirm without asking. Separate from
// (and stricter than) the general 15-minute threshold below that decides
// which train even counts as "closest" in the first place — that wider
// threshold is still fine for deciding whether to show the ask-first
// banner on a genuine mismatch; it was only ever a problem when it also
// governed the *silent* write.
const SILENT_CONFIRM_MAX_DIFF_MIN = 5;
let likelyTrainSuggestion = null; // { dateKey, direction, trainKey, label } — transient, not persisted
let likelyTrainCheckTimer = null;
let dismissedLikelyTrainKeys = new Set(); // avoids re-suggesting the same match repeatedly in one session
// A passive, no-response-needed notice that the silent-confirm branch
// above actually fired — the "no surprise, just quietly confirm it" path
// otherwise leaves no trace anywhere the person would see it. Persisted
// (unlike likelyTrainSuggestion) so it survives a reload/backgrounding
// and genuinely stays up "until dismissed" rather than just for the
// session — but only ever needs writing once per direction per day,
// since confirmedTrains itself blocks the underlying check from firing
// again for that direction once it's set.
let silentConfirmBanner = null; // { dateKey, direction, trainKey, label } | null

// Runs on every app open. Fetches official UK bank holiday dates and fills
// them in as "BANK HOLIDAY" on any date that doesn't already have a comment.
// Never overwrites an existing entry. If offline, falls back to the last
// successful fetch (cached locally) so nothing breaks without a connection.
// Returns true if a date is one where a delay repay claim could plausibly
// apply: an actual past weekday travel day (not a weekend, not tagged
// WFH/HOLIDAY/etc unless overridden, and strictly before today).
function isEligibleRailDay(d, todayKeyParam){
  const key = fmtKey(d);
  if (key >= todayKeyParam) return false; // only completed past journeys
  if (isWeekend(d)) return false;
  const comment = (comments[key] || '').trim();
  return comment === '' || !!travelOverrides[key];
}

// Returns 'confirmed' if a specific confirmed train for this date is
// known to have breached the delay threshold — a near-certain claim.
// Returns 'maybe' if no confirmation exists but at least one configured
// train that day did breach it — the existing general indicator.
// Returns null if there's nothing to flag, including when every
// confirmed train for the day is known to have been on time (a
// confirmation should rule the day out, not just add to the guesswork).
function getDelayStatus(dateKey){
  const dayPerf = railPerfCache[dateKey];
  if (!dayPerf) return null;
  const confirmed = confirmedTrains[dateKey] || {};
  let anyConfirmedDelay = false;
  let anyUnconfirmedDirection = false;

  ['AM', 'PM'].forEach(direction => {
    const dirTrains = railTrains.filter(t => t.direction === direction);
    if (dirTrains.length === 0) return;
    const confirmedKey = confirmed[direction];
    if (confirmedKey !== undefined){
      if (confirmedKey === '') return; // explicitly didn't travel that leg — ignore
      const perf = dayPerf[confirmedKey];
      if (perf && perf.delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES) anyConfirmedDelay = true;
    } else {
      anyUnconfirmedDirection = true;
    }
  });

  if (anyConfirmedDelay) return 'confirmed';
  const anyDelayAtAll = railTrains.some(t => dayPerf[t.key] && dayPerf[t.key].delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES);
  if (anyUnconfirmedDirection && anyDelayAtAll) return 'maybe';
  return null;
}

// Checks the currently visible past-day window for any eligible travel
// days that don't yet have performance data cached, and fetches just
// those from the Worker. Loops to handle the Worker's own truncation
// (its 50-subrequest-per-call ceiling) until everything's covered or no
// further progress is being made.
async function railSyncMissingDates(){
  if (railSyncInProgress) return;
  if (!railTrains || railTrains.length === 0) return;
  if (RAIL_WORKER_URL.includes('YOUR-WORKER-NAME')) return; // not configured yet

  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const todayKeyLocal = fmtKey(today);
  const oldestVisible = addDays(today, -railDaysBack);

  const neededDates = [];
  for (let d = new Date(oldestVisible); d < today; d = addDays(d, 1)){
    if (!isEligibleRailDay(d, todayKeyLocal)) continue;
    const key = fmtKey(d);
    const cached = railPerfCache[key];
    const hasAllTrains = cached && railTrains.every(t => cached[t.key] !== undefined);
    if (!hasAllTrains) neededDates.push(key);
  }
  if (neededDates.length === 0) return;

  railSyncInProgress = true;
  try{
    let remaining = neededDates;
    let guard = 0;
    while (remaining.length > 0 && guard < 8){
      guard++;
      let response;
      try{
        const resp = await fetch(RAIL_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            trains: railTrains.map(t => ({ key: t.key, fromLoc: t.fromLoc, toLoc: t.toLoc, time: t.time })),
            dates: remaining
          })
        });
        if (!resp.ok) break;
        response = await resp.json();
      }catch(e){ break; }

      const trainResults = response.trainResults || {};
      for (const trainKey in trainResults){
        for (const date in trainResults[trainKey]){
          if (!railPerfCache[date]) railPerfCache[date] = {};
          railPerfCache[date][trainKey] = trainResults[trainKey][date];
        }
      }
      await saveRailPerfCache();
      render();

      const truncated = response.truncatedDates || [];
      if (truncated.length === remaining.length) break; // no progress — stop rather than loop forever
      remaining = truncated;
    }
  } finally {
    railSyncInProgress = false;
  }
}

async function syncBankHolidays(){
  let events = null;

  try{
    const resp = await fetch('https://www.gov.uk/bank-holidays.json');
    if (resp.ok){
      const data = await resp.json();
      events = (data['england-and-wales'] && data['england-and-wales'].events) || [];
      try{ localStorage.setItem('bank-holidays-cache', JSON.stringify(events)); }catch(e){}
    }
  }catch(e){ /* offline or blocked — fall back to cache below */ }

  if (!events){
    try{
      const cached = localStorage.getItem('bank-holidays-cache');
      events = cached ? JSON.parse(cached) : [];
    }catch(e){ events = []; }
  }

  let changed = false;
  for (const ev of events){
    if (ev && ev.date && !comments[ev.date]){
      comments[ev.date] = 'BANK HOLIDAY';
      changed = true;
    }
  }
  if (changed) await saveComments();
  return changed;
}

// Find the first date after 'afterDate' (exclusive) that actually needs a ticket
// (a weekday with no comment). Capped to avoid runaway loops.
function findNextTravelDay(afterDate){
  let d = addDays(afterDate, 1);
  let guard = 0;
  while (guard < 400){
    const key = fmtKey(d);
    const isTravel = (comments[key] || '').trim() === '' || travelOverrides[key];
    if (!isWeekend(d) && isTravel){
      return d;
    }
    d = addDays(d, 1);
    guard++;
  }
  return d;
}

// Compute per-day state from periodStart up to targetDate inclusive.
// Ticket periods run up to 28 calendar days OR 8 used days, whichever comes first.
// Once a period ends, the next one doesn't start until the next day actually
// needed (skipping weekends/comment days) — you buy the ticket the day before
// you next need it, not automatically the day after the old one runs out.
// Returns a map dateKey -> { usedCount, daysElapsed, periodEnded, lostDays,
//   unusedRemaining, inGap, buyFlag }
// Finds the actual pay date for a given month: the 28th, walked backward
// a day at a time over weekends and bank holidays until it lands on a
// working day.
function getPayDate(year, monthIndex){
  let d = new Date(year, monthIndex, 28);
  while (true){
    const key = fmtKey(d);
    const isBankHoliday = (comments[key] || '').trim().toUpperCase() === 'BANK HOLIDAY';
    if (!isWeekend(d) && !isBankHoliday) return d;
    d = addDays(d, -1);
  }
}

// Returns {start, end} for the pay period `offset` periods away from the one
// containing `baseDate`. offset 0 = the period baseDate currently falls in,
// 1 = the next period, 2 = the one after that, etc. Negative offsets look
// backward. A period runs from one payday up to (not including) the next.
function getPayPeriodByOffset(baseDate, offset){
  let year = baseDate.getFullYear(), month = baseDate.getMonth();
  const thisMonthPay = getPayDate(year, month);
  let currentPayDate, nextPayDate;
  if (fmtKey(baseDate) >= fmtKey(thisMonthPay)){
    currentPayDate = thisMonthPay;
    let nm = month + 1, ny = year; if (nm > 11){ nm = 0; ny++; }
    nextPayDate = getPayDate(ny, nm);
  } else {
    let pm = month - 1, py = year; if (pm < 0){ pm = 11; py--; }
    currentPayDate = getPayDate(py, pm);
    nextPayDate = thisMonthPay;
  }
  for (let i = 0; i < offset; i++){
    const nm = nextPayDate.getMonth() + 1, ny = nextPayDate.getFullYear();
    currentPayDate = nextPayDate;
    nextPayDate = getPayDate(nm > 11 ? ny + 1 : ny, nm > 11 ? 0 : nm);
  }
  for (let i = 0; i < -offset; i++){
    const pm = currentPayDate.getMonth() - 1, py = currentPayDate.getFullYear();
    nextPayDate = currentPayDate;
    currentPayDate = getPayDate(pm < 0 ? py - 1 : py, pm < 0 ? 11 : pm);
  }
  return { start: currentPayDate, end: addDays(nextPayDate, -1) };
}

// Finds the next date flagged as a ticket-buy day, searching well beyond
// the visible day list so it's accurate regardless of scroll position.
function findNextBuyDateKey(today, todayKeyParam){
  const buySearchStates = computeStates(addDays(today, Math.max(MAX_DAYS_AHEAD, PERIOD_LENGTH)));
  let nextBuyKey = null;
  for (const key in buySearchStates){
    if (key >= todayKeyParam && buySearchStates[key].buyFlag){
      if (!nextBuyKey || key < nextBuyKey) nextBuyKey = key;
    }
  }
  return nextBuyKey;
}

// Shows a local notification via the service worker, which is the more
// reliable path for installed PWAs on Android compared to the plain
// Notification constructor.
async function showLocalNotification(title, body){
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try{
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification(title, { body, icon: 'icons/icon-192.png' });
  }catch(e){ /* notification failed silently — not critical */ }
}

function ensureGoogleTokenClient(){
  if (!googleTokenClient && window.google && google.accounts && google.accounts.oauth2){
    const config = {
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.file',
      callback: () => {} // overridden per-request below
    };
    if (preferredGoogleEmail) config.login_hint = preferredGoogleEmail;
    googleTokenClient = google.accounts.oauth2.initTokenClient(config);
  }
  return googleTokenClient;
}

// Gets a valid Google access token, reusing a cached one if it hasn't
// expired yet. Must be called from within a genuine user gesture (a
// click handler) the first time, or the browser may block the consent
// popup — this is why calendar syncing happens via a tappable prompt
// rather than automatically in the background.
function getGoogleAccessToken(){
  return new Promise((resolve) => {
    if (cachedAccessToken && Date.now() < cachedTokenExpiry){
      resolve(cachedAccessToken);
      return;
    }
    const client = ensureGoogleTokenClient();
    if (!client){ resolve(null); return; }
    client.callback = (resp) => {
      if (resp && resp.access_token){
        cachedAccessToken = resp.access_token;
        cachedTokenExpiry = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3000000) - 60000;
        resolve(cachedAccessToken);
      } else {
        resolve(null);
      }
    };
    client.requestAccessToken({ prompt: '' });
  });
}

// Creates or updates the single "Buy train ticket" calendar event for the
// given date, at 8pm with an immediate popup reminder. Reuses the same
// event (updating its date) rather than creating a new one each time, so
// old reminders don't pile up. If the stored event was deleted manually,
// falls back to creating a fresh one rather than failing silently forever.
// Finds the app's backup folder in Drive, creating it if it doesn't exist
// yet. Caches the folder ID so this search only needs to happen once —
// but recovers gracefully if the folder was deleted manually since then.
async function ensureDriveBackupFolder(token){
  const headers = { 'Authorization': `Bearer ${token}` };

  if (driveBackupFolderId){
    // verify it still exists rather than trusting the cache blindly
    try{
      const check = await fetch(`https://www.googleapis.com/drive/v3/files/${driveBackupFolderId}?fields=id,trashed`, { headers });
      if (check.ok){
        const data = await check.json();
        if (!data.trashed) return driveBackupFolderId;
      }
    }catch(e){ /* fall through to search/create */ }
  }

  const query = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_BACKUP_FOLDER_NAME}' and trashed=false`);
  const searchResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)`, { headers });
  if (searchResp.ok){
    const searchData = await searchResp.json();
    if (searchData.files && searchData.files.length > 0){
      driveBackupFolderId = searchData.files[0].id;
      await saveDriveBackupFolderId();
      return driveBackupFolderId;
    }
  }

  const createResp = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_BACKUP_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if (!createResp.ok) throw new Error('Could not create Drive backup folder');
  const createData = await createResp.json();
  driveBackupFolderId = createData.id;
  await saveDriveBackupFolderId();
  return driveBackupFolderId;
}

function buildBackupPayload(){
  const backup = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  BACKUP_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) backup.data[k] = v;
  });
  return JSON.stringify(backup, null, 2);
}

async function uploadBackupToDrive(token, folderId){
  const filename = `ticket-tracker-backup-${fmtKey(new Date())}-${Date.now()}.json`;
  const metadata = { name: filename, parents: [folderId] };
  const boundary = 'ticketpwa-backup-boundary';
  const payload = buildBackupPayload();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n` +
    `--${boundary}--`;

  const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  if (!resp.ok) throw new Error(`Drive upload failed: ${resp.status}`);
  return resp.json();
}

// Keeps only the most recent DRIVE_BACKUP_KEEP_COUNT files in the backup
// folder, deleting anything older right after a new backup succeeds.
async function pruneOldDriveBackups(token, folderId){
  const headers = { 'Authorization': `Bearer ${token}` };
  const query = encodeURIComponent(`'${folderId}' in parents and trashed=false and name contains 'ticket-tracker-backup-'`);
  const listResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&orderBy=createdTime desc&fields=files(id,name,createdTime)`, { headers });
  if (!listResp.ok) return;
  const listData = await listResp.json();
  const files = listData.files || [];
  const toDelete = files.slice(DRIVE_BACKUP_KEEP_COUNT);
  for (const f of toDelete){
    try{ await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, { method: 'DELETE', headers }); }
    catch(e){ /* not critical — will be cleaned up next successful backup */ }
  }
}

// The main entry point: called whenever the app is backgrounded. Only
// actually uploads if something's changed since the last successful
// backup AND the throttle window has passed — otherwise does nothing.
let driveBackupInFlight = false; // guards against overlapping triggers — e.g. Google's own OAuth popup opening/closing can itself cause a visibility change, which could otherwise race with an explicit manual backup

async function attemptDriveBackup(force){
  if (driveBackupInFlight) return { ok: false, reason: 'already-in-progress' };
  if (!driveBackupEnabled) return { ok: false, reason: 'not-enabled' };
  if (!force){
    if (!driveBackupDirty) return { ok: false, reason: 'nothing-changed' };
    if (Date.now() - lastDriveBackupTime < DRIVE_BACKUP_THROTTLE_MS) return { ok: false, reason: 'throttled' };
  }
  driveBackupInFlight = true;

  try{
    const token = await getGoogleAccessToken();
    if (!token) return { ok: false, reason: 'no-token' };
    const folderId = await ensureDriveBackupFolder(token);
    await uploadBackupToDrive(token, folderId);
    await pruneOldDriveBackups(token, folderId);
    driveBackupDirty = false;
    lastDriveBackupTime = Date.now();
    localStorage.setItem('drive-backup-dirty', JSON.stringify(false));
    localStorage.setItem('drive-backup-last-time', JSON.stringify(lastDriveBackupTime));
    return { ok: true };
  }catch(e){
    return { ok: false, reason: e.message }; // dirty flag stays set — will retry next opportunity
  }finally{
    driveBackupInFlight = false;
  }
}

async function syncGoogleCalendarEvent(dateKey){
  const token = await getGoogleAccessToken();
  if (!token) return { ok: false, reason: 'no-token' };

  const eventBody = {
    summary: 'Buy train ticket',
    start: { dateTime: `${dateKey}T20:00:00`, timeZone: 'Europe/London' },
    end: { dateTime: `${dateKey}T20:15:00`, timeZone: 'Europe/London' },
    colorId: '10', // Google Calendar's "Basil" — appears as green, matching the user's usual task color
    reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 0 }] }
  };
  const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

  try{
    let method = null;
    const usedEventId = gcalEventId;
    if (gcalEventId){
      const resp = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${gcalEventId}`, {
        method: 'PATCH', headers, body: JSON.stringify(eventBody)
      });
      if (resp.status === 404){
        gcalEventId = null; // stale — someone deleted it manually; fall through to create fresh
      } else if (!resp.ok){
        return { ok: false, reason: `patch-failed-${resp.status}`, eventId: usedEventId, dateKey };
      } else {
        method = 'updated';
      }
    }
    if (!gcalEventId){
      const resp = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST', headers, body: JSON.stringify(eventBody)
      });
      if (!resp.ok) return { ok: false, reason: `create-failed-${resp.status}`, dateKey };
      const data = await resp.json();
      gcalEventId = data.id;
      await saveGcalEventId();
      method = 'created';
    }
    gcalPendingSync = false;
    gcalLastSyncFailed = false;
    await saveGcalPendingSync();
    return { ok: true, method, eventId: gcalEventId, dateKey };
  }catch(e){
    return { ok: false, reason: `exception: ${e.message}`, dateKey }; // left pending — will retry next time the prompt is tapped
  }
}

// Fires 10 seconds after the buy date last changed, not 10 seconds after
// it was first noticed — each further change resets the clock (see the
// scheduling logic in render()). Re-derives the buy date fresh at fire
// time rather than trusting the value from whenever it was scheduled,
// in case something shifted again in the meantime.
async function fireBuyDateChangeActions(){
  const freshToday = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const freshTodayKey = fmtKey(freshToday);
  const freshNext = findNextBuyDateKey(freshToday, freshTodayKey);
  if (freshNext && freshNext !== lastNotifiedBuyKey){
    if (lastNotifiedBuyKey !== null){ // don't notify on the very first-ever load
      showLocalNotification('Ticket buy date updated', `Now due ${dateLabelShort(parseKey(freshNext))}`);
    }
    if (gcalEnabled){
      gcalPendingSync = true; saveGcalPendingSync();
      syncGoogleCalendarEvent(freshNext).then((result) => { if (result.ok) render(); });
    }
    lastNotifiedBuyKey = freshNext;
    saveLastNotifiedBuyKey();
    render();
  }
  scheduledBuyKey = null;
  buyDateChangeTimer = null;
}

// Computes the end of the *actual* current ticket period only — no
// chaining into imagined future cycles. This is the real boundary of what
// you've actually paid for; anything past it needs either a logged single
// ticket for that specific day, or a fresh season ticket purchase.
function getRealPeriodEnd(){
  let cursor = parseKey(periodStart);
  let usedCount = 0, daysElapsed = 0;
  while (true){
    const key = fmtKey(cursor);
    daysElapsed += 1;
    const weekend = isWeekend(cursor);
    const comment = (comments[key] || '').trim();
    const isTravel = comment === '' || travelOverrides[key];
    if (!weekend && isTravel) usedCount += 1;
    const hitUses = usedCount >= USES_PER_PERIOD;
    const hitDays = daysElapsed >= PERIOD_LENGTH;
    if (hitUses || hitDays){
      return { endDate: new Date(cursor), lostDays: hitDays && !hitUses, unusedRemaining: USES_PER_PERIOD - usedCount };
    }
    cursor = addDays(cursor, 1);
  }
}

// Returns the single-ticket purchase record for an exact date, if any.
function getSingleTicketForDate(key){
  return purchases.find(p => p.date === key && p.type === 'single');
}

function computeStates(targetDate){
  const map = {};
  let segStart = parseKey(periodStart);
  if (fmtKey(segStart) > fmtKey(targetDate)) return map; // nothing to show yet

  while (fmtKey(segStart) <= fmtKey(targetDate)){
    let cursor = new Date(segStart);
    let usedCount = 0;
    let daysElapsed = 0;
    let periodEndDate = null;
    let finalLostDays = false;
    let finalUnusedRemaining = 0;

    while (true){
      const key = fmtKey(cursor);
      daysElapsed += 1;
      const weekend = isWeekend(cursor);
      const comment = (comments[key] || '').trim();
      const isTravel = comment === '' || travelOverrides[key];
      if (!weekend && isTravel){
        usedCount += 1;
      }
      const hitUses = usedCount >= USES_PER_PERIOD;
      const hitDays = daysElapsed >= PERIOD_LENGTH;
      const periodEnded = hitUses || hitDays;
      const lostDays = hitDays && !hitUses;

      if (fmtKey(cursor) <= fmtKey(targetDate)){
        map[key] = {
          usedCount, daysElapsed, periodEnded, lostDays,
          unusedRemaining: USES_PER_PERIOD - usedCount,
          inGap: false, buyFlag: false
        };
      }

      if (periodEnded){
        periodEndDate = new Date(cursor);
        finalLostDays = lostDays;
        finalUnusedRemaining = USES_PER_PERIOD - usedCount;
        break;
      }
      if (fmtKey(cursor) >= fmtKey(targetDate)){
        periodEndDate = null; // period still ongoing beyond our range — nothing more to compute
        break;
      }
      cursor = addDays(cursor, 1);
    }

    if (!periodEndDate) break;

    const nextTravel = findNextTravelDay(periodEndDate);
    const buyFlagDate = addDays(nextTravel, -1);

    // mark any days between the old period ending and the next ticket starting
    // as "gap" days — no active ticket needed
    let gcursor = addDays(periodEndDate, 1);
    while (fmtKey(gcursor) < fmtKey(nextTravel) && fmtKey(gcursor) <= fmtKey(targetDate)){
      const key = fmtKey(gcursor);
      map[key] = Object.assign({usedCount: 0, daysElapsed: 0, periodEnded: false, lostDays: false, unusedRemaining: 0}, map[key], {inGap: true});
      gcursor = addDays(gcursor, 1);
    }

    // flag the day before the next real travel day as the day to buy the ticket
    if (fmtKey(buyFlagDate) <= fmtKey(targetDate)){
      const bKey = fmtKey(buyFlagDate);
      map[bKey] = Object.assign({usedCount: 0, daysElapsed: 0, periodEnded: false, inGap: (fmtKey(buyFlagDate) > fmtKey(periodEndDate))}, map[bKey], {
        buyFlag: true,
        lostDays: finalLostDays,
        unusedRemaining: finalUnusedRemaining
      });
    }

    segStart = nextTravel;
  }
  return map;
}

function getRange(centerDate, before, after){
  const days = [];
  for (let i=-before; i<=after; i++){
    days.push(addDays(centerDate, i));
  }
  return days;
}

let state = {
  today: new Date(),
  daysAhead: 13,
  activeTab: 'today', // drives which bottom-nav icon is highlighted
};
const MAX_DAYS_AHEAD = 120;
const DAYS_AHEAD_STEP = 14;

// Closes any currently-open modal sheet — used so tapping a different
// bottom-nav tab swaps screens cleanly rather than stacking them.
function closeAllModals(){
  // A plain .remove() below would rip out train-progress's DOM node
  // without going through its own cleanup — leaving its refresh timer
  // and visibility listener running invisibly in the background. Give it
  // a chance to close itself properly first.
  if (activeTrainProgressCleanup){
    activeTrainProgressCleanup();
    activeTrainProgressCleanup = null;
  }

function findNextHoliday(todayKey){
  let best = null;
  for (const key in comments){
    if (key <= todayKey) continue;
    if ((comments[key] || '').trim().toUpperCase() === 'HOLIDAY'){
      if (!best || key < best) best = key;
    }
  }
  return best;
}

// Counts working days strictly between `from` and `to` (both exclusive) —
// i.e. the days you actually still have to work through before `to` arrives.
// Weekends and dates tagged BANK HOLIDAY don't count; everything else
// (including WFH days) still counts as a working day.
function countWorkingDaysUntil(from, to){
  let count = 0;
  let d = addDays(from, 1);
  while (d < to){
    if (!isWeekend(d)){
      const key = fmtKey(d);
      const tag = (comments[key] || '').trim().toUpperCase();
      if (tag !== 'BANK HOLIDAY') count++;
    }
    d = addDays(d, 1);
  }
  return count;
}

function render(){
  const app = document.getElementById('app');
  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const todayKey = fmtKey(today);
  const rangeEnd = addDays(today, state.daysAhead);
  const states = computeStates(rangeEnd);
  const todayState = states[todayKey];
  const todayComment = (comments[todayKey] || '').trim();
  const todayIsWeekend = isWeekend(today);

  // Purely for fun — gov.uk's bank holiday feed includes a genuine "bunting"
  // flag on celebratory dates (Christmas, Easter Monday, etc. get true;
  // Good Friday, for instance, gets false). No functional purpose, just a
  // small decorative flourish on days it applies.
  let isBuntingDay = false;
  try{
    const cachedHolidays = localStorage.getItem('bank-holidays-cache');
    if (cachedHolidays){
      const holidayEvents = JSON.parse(cachedHolidays);
      const todayEvent = holidayEvents.find(ev => ev.date === todayKey);
      isBuntingDay = !!(todayEvent && todayEvent.bunting);
    }
  }catch(e){ isBuntingDay = false; }
  const beforePeriod = !todayState;

  // Hamburger menu items, built as a weighted list so ordering is
  // controlled by 'weight' rather than by where an item happens to sit in
  // this template — new items default to the main group, and anything
  // given a high weight (like Bulk import comments) always sorts to
  // the bottom, however many other items get added later.
  const earlyDismissedCheck = !!dismissedMonths[fmtKey(getPayPeriodByOffset(today, 0).start)];
  const menuItems = [
    { id: 'settings-link', label: 'Settings', weight: 0 },
    { id: 'depboard-link', label: 'Station board', weight: 0 },
    { id: 'confirm-train-link', label: 'Confirm train used', weight: 0 },
    { id: 'stats-link', label: 'View stats', weight: 0 },
    { id: 'delay-claims-link', label: 'Delay repay claims', weight: 0 },
  ];
  if (typeof Notification !== 'undefined' && Notification.permission === 'default'){
    menuItems.push({ id: 'enable-notifications-link', label: 'Enable notifications', weight: 0 });
  }
  if (earlyDismissedCheck) menuItems.push({ id: 'restore-estimate-link', label: 'Show cost estimates again', weight: 0 });
  menuItems.push({ id: 'backup-restore-link', label: 'Backup & restore', weight: 50 });
  menuItems.push({ id: 'help-link', label: 'Help', weight: 55 });
  menuItems.push({ id: 'backlog-link', label: 'Backlog', weight: 56 });
  menuItems.push({ id: 'import-history-link', label: 'Bulk import comments', weight: 100 });
  menuItems.sort((a, b) => a.weight - b.weight);
  const menuItemsHtml = menuItems.map(item => `<div class="settings-link" id="${item.id}">${item.label}</div>`).join('');

  const nextHolidayKey = findNextHoliday(todayKey);
  let holidayHtml = '';
  if (nextHolidayKey){
    const hDate = parseKey(nextHolidayKey);
    const daysUntil = countWorkingDaysUntil(today, hDate);
    holidayHtml = `
      <div class="holiday-card">
        <div class="holiday-count">${daysUntil}</div>
        <div class="holiday-info">
          <div class="holiday-label">Working day${daysUntil===1?'':'s'} until your next holiday</div>
          <div class="holiday-date">${dateLabel(hDate)}</div>
        </div>
      </div>`;
  }

  const currentYear = today.getFullYear();
  const yearToDatePurchases = purchases.filter(p => parseKey(p.date).getFullYear() === currentYear);
  const yearToDateTotal = yearToDatePurchases.reduce((sum, p) => sum + p.cost, 0);

  const realPeriodEnd = beforePeriod ? null : getRealPeriodEnd();
  const isPhantomToday = !beforePeriod && fmtKey(today) > fmtKey(realPeriodEnd.endDate);

  let statusHtml = '';
  if (beforePeriod){
    statusHtml = `<div class="status-banner skip">This ticket starts ${dateLabel(parseKey(periodStart))}</div>`;
  } else if (isPhantomToday){
    const singleToday = getSingleTicketForDate(todayKey);
    if (todayIsWeekend){
      statusHtml = `<div class="status-banner skip">Weekend — no ticket needed</div>`;
    } else if (singleToday){
      statusHtml = `<div class="status-banner ok">Single ticket used today (£${singleToday.cost.toFixed(2)})</div>`;
    } else if (todayComment !== '' && !travelOverrides[todayKey]){
      statusHtml = `<div class="status-banner skip">Marked "${escapeHtml(todayComment)}" — not counted</div>`;
    } else {
      statusHtml = `<div class="status-banner renew" id="renewal-banner-tap" style="cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">No active season ticket — log a single ticket, or buy your next one ›</div>`;
    }
  } else if (todayState.buyFlag){
    const lostMsg = todayState.lostDays ? ` (${todayState.unusedRemaining} unused day${todayState.unusedRemaining===1?'':'s'} lost)` : '';
    statusHtml = `<div class="status-banner renew" id="renewal-banner-tap" style="cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">🚆 Buy your ticket tonight for tomorrow${lostMsg} ›</div>`;
  } else if (todayState.inGap){
    statusHtml = `<div class="status-banner skip">No ticket needed yet — nothing due until you next travel</div>`;
  } else if (todayIsWeekend){
    statusHtml = `<div class="status-banner skip">Weekend — no ticket needed &middot; day ${todayState.daysElapsed} of 28</div>`;
  } else if (todayComment !== '' && !travelOverrides[todayKey]){
    statusHtml = `<div class="status-banner skip">Marked "${escapeHtml(todayComment)}" — not counted &middot; day ${todayState.daysElapsed} of 28</div>`;
  } else {
    const overrideNote = (todayComment !== '' && travelOverrides[todayKey]) ? ` &middot; marked "${escapeHtml(todayComment)}" but counted` : '';
    statusHtml = `<div class="status-banner ok">${todayState.unusedRemaining} use${todayState.unusedRemaining===1?'':'s'} left &middot; day ${todayState.daysElapsed} of 28${overrideNote}</div>`;
  }

  const todayCountDisplay = (beforePeriod || todayState.inGap) ? '–' : String(todayState.usedCount);
  const punches = [];
  for (let i=1;i<=8;i++){
    punches.push(!beforePeriod && !todayState.inGap && i <= todayState.usedCount);
  }
  const dayProgressPct = (beforePeriod || todayState.inGap) ? 0 : Math.round((todayState.daysElapsed / PERIOD_LENGTH) * 100);

  // Next buy-ticket date, found independently of how far the visible day
  // list currently scrolls — so it's always accurate even before you've
  // tapped "Show more days". Not shown if today itself is the buy day,
  // since the status banner above already covers that case.
  let nextBuyHtml = '';
  let calendarPromptHtml = '';
  if (!beforePeriod){
    const nextBuyKey = findNextBuyDateKey(today, todayKey);
    if (nextBuyKey && nextBuyKey !== todayKey){
      nextBuyHtml = `<div class="next-buy-line">Next ticket due ${dateLabelShort(parseKey(nextBuyKey))}</div>`;
    }
    // If the predicted buy date has changed since we last checked, wait
    // 10 seconds before actually notifying/syncing — if another change
    // comes in before that (e.g. tagging several holiday days in a row),
    // the timer resets rather than firing once per edit.
    if (nextBuyKey && nextBuyKey !== lastNotifiedBuyKey){
      if (nextBuyKey !== scheduledBuyKey){
        scheduledBuyKey = nextBuyKey;
        if (buyDateChangeTimer) clearTimeout(buyDateChangeTimer);
        buyDateChangeTimer = setTimeout(fireBuyDateChangeActions, 10000);
      }
    } else if (buyDateChangeTimer){
      // the change was undone (e.g. tag removed again) before the timer
      // fired — cancel it rather than notifying about a non-change
      clearTimeout(buyDateChangeTimer);
      buyDateChangeTimer = null;
      scheduledBuyKey = null;
    }
    if (gcalEnabled && gcalPendingSync && nextBuyKey){
      const promptLabel = gcalLastSyncFailed ? 'Couldn\'t update Google Calendar — tap to retry' : 'Tap to update Google Calendar';
      calendarPromptHtml = `<div class="next-buy-line" id="calendar-sync-prompt" style="cursor:pointer; text-decoration:underline;">${promptLabel}</div>`;
    }
  }

  const days = getRange(today, railDaysBack, state.daysAhead);

  // Monthly cost estimate — how many tickets and parking days are likely
  // needed within the selected pay period. Offset 0 is the current period
  // (most recent payday up to, but not including, the next one); the
  // card's own nav arrows let you preview future periods without
  // affecting the automatic dismiss/reset behaviour of the current one.
  const estPeriod = getPayPeriodByOffset(today, estimateOffset);
  const estWindowStart = estPeriod.start;
  const estWindowEnd = estPeriod.end;
  const estMonthKey = fmtKey(getPayPeriodByOffset(today, 0).start); // dismiss/reset key always tracks the CURRENT period, regardless of what's being previewed
  const estMonthStates = computeStates(estWindowEnd);
  let estTicketCount = 0;
  let estParkingDays = 0;
  for (let d = new Date(estWindowStart); d <= estWindowEnd; d = addDays(d, 1)){
    const key = fmtKey(d);
    if (estMonthStates[key] && estMonthStates[key].buyFlag) estTicketCount++;
    const weekend = isWeekend(d);
    const comment = (comments[key] || '').trim();
    const isTravel = comment === '' || travelOverrides[key];
    if (!weekend && isTravel) estParkingDays++;
  }
  const estTicketCost = estTicketCount * lastKnownPrice;
  const estParkingCost = estParkingDays * parkingCost;
  const estTotal = estTicketCost + estParkingCost;
  const payWindowLabel = `${dateLabelShort(estWindowStart)} – ${dateLabelShort(estWindowEnd)}`;
  const monthEstimateDismissed = !!dismissedMonths[estMonthKey];
  const showEstimateCard = !monthEstimateDismissed;
  const rows = days.map(d => {
    const key = fmtKey(d);
    const s = states[key];
    const weekend = isWeekend(d);
    const comment = (comments[key] || '').trim();
    const isToday = key === todayKey;
    if (!s){
      return `
        <div class="day-row" data-key="${key}">
          <div class="count-badge">–</div>
          <div class="info">
            <div class="dname">${dayNameShort(d)} ${dateLabelShort(d)}</div>
            <div class="comment-tag" style="color:var(--ink-dim)">Before this ticket</div>
          </div>
          <div class="arrow">›</div>
        </div>`;
    }
    const isPastPhantom = !weekend && !beforePeriod && key <= todayKey && key > fmtKey(realPeriodEnd.endDate);
    const singleForDay = isPastPhantom ? getSingleTicketForDate(key) : null;

    let badgeClass, badgeText;

      else tag = 'No active ticket';

    else if (comment && s.buyFlag) tag = `${escapeHtml(comment)}${overridden ? ' &middot; counted' : ''} · Buy ticket${s.lostDays ? ` · ${s.unusedRemaining} lost` : ''}`;
    else if (comment) tag = escapeHtml(comment) + (overridden ? ' &middot; counted' : '');

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function openDayEditor(key){
  const d = parseKey(key);
  const weekend = isWeekend(d);
  const current = comments[key] || '';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${dateLabel(d)}</h3>
      <div class="sub">${weekend ? 'Weekend day — always skipped' : 'Add a reason this day doesn\'t count (or leave blank for a normal travel day)'}</div>
      <div class="chip-row" id="modal-chip-row">
        ${PRESET_TAGS.map(tag => `<div class="chip ${current.toUpperCase()===tag?'active':''}" data-tag="${tag}">${tag}</div>`).join('')}
        <div class="chip" data-tag="__clear">Clear</div>
      </div>
      <input type="text" id="modal-custom-comment" placeholder="Or type your own" value="${escapeHtml(current && !PRESET_TAGS.includes(current.toUpperCase()) ? current : '')}" />
      ${!weekend ? `
      <label style="display:flex; align-items:center; gap:8px; margin:12px 0 4px; font-size:14px; color:var(--ink-dim); cursor:pointer;">
        <input type="checkbox" id="modal-override-checkbox" ${travelOverrides[key] ? 'checked' : ''} style="width:16px; height:16px;" />
        I still used the ticket this day
      </label>` : ''}
      <button class="save-btn" id="modal-save-btn">Save</button>
      <div class="modal-close" id="modal-close-btn">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);

  function getOverrideChecked(){
    const cb = document.getElementById('modal-override-checkbox');
    return cb ? cb.checked : false;
  }

  const modalOverrideCb = document.getElementById('modal-override-checkbox');
  if (modalOverrideCb){
    modalOverrideCb.addEventListener('change', async () => {
      if (modalOverrideCb.checked) travelOverrides[key] = true; else delete travelOverrides[key];
      await saveTravelOverrides();
      render(); // safe: this overlay is attached to document.body, not #app, so it survives re-render
      if (modalOverrideCb.checked) railSyncMissingDates();
    });
  }

  overlay.querySelectorAll('#modal-chip-row .chip').forEach(chip => {
    chip.addEventListener('click', async () => {
      const tag = chip.dataset.tag;
      if (tag === '__clear'){
        comments[key] = '';
        delete travelOverrides[key];
      } else {
        comments[key] = tag;
        document.getElementById('modal-custom-comment').value = '';
        if (getOverrideChecked()) travelOverrides[key] = true; else delete travelOverrides[key];
      }
      await saveComments();
      await saveTravelOverrides();
      document.body.removeChild(overlay); render();
    });
  });
  document.getElementById('modal-save-btn').addEventListener('click', async () => {
    const val = document.getElementById('modal-custom-comment').value.trim();
    if (val !== ''){
      comments[key] = val;
      if (getOverrideChecked()) travelOverrides[key] = true; else delete travelOverrides[key];
      await saveComments();
      await saveTravelOverrides();
      document.body.removeChild(overlay); render();
    } else {
      document.body.removeChild(overlay);
    }
  });
  document.getElementById('modal-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}
