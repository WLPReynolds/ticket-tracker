<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8-Day Ticket</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="8-Day Ticket">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @font-face {
    font-family: 'DSDigital';
  }
  :root{
    --board: #14161f;
    --board-2: #1c1f2c;
    --tile: #23273a;
    --tile-punched: #f2a93b;
    --tile-punched-2: #ffcf7a;
    --ink: #e9e6da;
    --ink-dim: #9a9db0;
    --amber: #f2a93b;
    --amber-dim: #8a6a30;
    --line: #33384d;
    --danger: #e05a4e;
    --good: #6fbf8a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--board);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height:100vh;
    padding-bottom: 40px;
  }
  .mono{
    font-family: 'Courier New', 'Space Mono', monospace;
  }
  header.top{
    position: relative;
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--board-2), var(--board));
  }
  .menu-btn{
    position: absolute;
    top: 18px;
    right: 16px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink);
    z-index: 20;
  }
  .menu-dropdown{
    position: absolute;
    top: 60px;
    right: 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    z-index: 30;
    min-width: 240px;
    overflow: hidden;
  }
  .menu-dropdown .settings-link{
    margin: 0;
    padding: 13px 16px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    text-decoration: none;
    color: var(--ink);
  }
  .menu-dropdown .settings-link:active{
    background: rgba(255,255,255,0.06);
  }
  .menu-dropdown .settings-link:last-child{ border-bottom: none; }

  .cal-nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav-btn{
    width: 34px; height: 34px;
    display: flex; align-items:center; justify-content:center;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--amber);
    font-size: 18px;
    cursor: pointer;
  }
  .cal-nav-title{
    font-size: 15px;
    font-weight: 700;
  }
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-weekday{
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding-bottom: 6px;
  }
  .cal-day{
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    color: var(--ink);
    background: var(--tile);
    position: relative;
  }
  .cal-day.weekend{ color: var(--ink-dim); background: transparent; }
  .cal-day.empty{ background: transparent; }
  .cal-day.today{ border: 1.5px solid var(--amber); font-weight: 700; }
  .cal-dot{
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--amber);
    margin-top: 3px;
  }
  .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber);
    font-weight: 700;
    margin-bottom: 4px;
  }
  h1{
    font-size: 22px;
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .today-date{
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 2px;
  }

  .board-card{
    margin: 18px 16px 0;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  .board-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background: repeating-linear-gradient(90deg, var(--amber-dim) 0 10px, transparent 10px 20px);
    opacity: 0.6;
  }

  .flip-row{
    display:flex;
    justify-content:center;
    align-items: baseline;
    gap: 10px;
    margin: 6px 0 18px;
  }
  .flip-tile{
    width: 74px;
    height: 96px;
    background: linear-gradient(180deg, #2c3146, #1c1f2c);
    border-radius: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 54px;
    font-weight: 800;
    color: var(--amber);
    box-shadow: inset 0 0 0 1px var(--line), 0 6px 14px rgba(0,0,0,0.4);
    position: relative;
  }
  .flip-tile::after{
    content:"";
    position:absolute; left:0; right:0; top:50%;
    height:1px;
    background: rgba(0,0,0,0.5);
  }
  .flip-sep{
    font-size: 40px;
    color: var(--ink-dim);
    font-weight: 300;
  }
  .flip-of8{
    display:flex; flex-direction:column; align-items:center;
  }
  .flip-of8 .num{
    font-size: 40px;
    font-weight: 300;
    color: var(--ink-dim);
  }
  .flip-of8 .label{
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .punch-row{
    display:flex;
    justify-content:center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .punch{
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size: 11px;
    color: var(--ink-dim);
    font-weight: 700;
    transition: all 0.2s;
  }
  .punch.done{
    background: var(--amber);
    border-color: var(--amber);
    color: #14161f;
  }
  .punch.today-marker{
    box-shadow: 0 0 0 3px rgba(242,169,59,0.35);
  }

  .day-progress-label{
    text-align:center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .day-progress-track{
    height: 5px;
    background: var(--tile);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .day-progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
  }

  .status-banner{
    margin-top: 16px;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .status-banner.renew{
    background: rgba(224,90,78,0.15);
    color: #ff8b7e;
    border: 1px solid rgba(224,90,78,0.4);
  }
  .status-banner.ok{
    background: rgba(111,191,138,0.12);
    color: var(--good);
    border: 1px solid rgba(111,191,138,0.3);
  }
  .status-banner.skip{
    background: rgba(154,157,176,0.1);
    color: var(--ink-dim);
    border: 1px solid var(--line);
  }

  .next-buy-line{
    margin-top: 8px;
    text-align: center;
    font-size: 12.5px;
    color: var(--amber);
    letter-spacing: 0.2px;
  }

  .section-label{
    margin: 26px 16px 10px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-weight: 700;
  }

  .holiday-card{
    margin: 18px 16px 0;
    background: linear-gradient(135deg, #2a3b4a, #1c2a35);
    border: 1px solid #3a5468;
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .holiday-count{
    font-size: 36px;
    font-weight: 800;
    color: #7fc9e8;
    font-family: 'Courier New', monospace;
    min-width: 50px;
  }
  .holiday-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-dim);
    font-weight: 700;
  }
  .holiday-date{
    font-size: 14px;
    color: var(--ink);
    margin-top: 2px;
  }

  .comment-card{
    margin: 0 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .chip-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chip{
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--tile);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background: var(--amber);
    color: #14161f;
    border-color: var(--amber);
  }
  input[type=text]{
    width: 100%;
    background: var(--tile);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-top: 4px;
  }
  input[type=text]::placeholder{ color: var(--ink-dim); }
  input[type=date]{
    width: 100%;
    background: var(--tile);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color-scheme: dark;
  }

  .day-list{
    margin: 0 16px;
    background: var(--board-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .day-row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .day-row:last-child{ border-bottom:none; }
  .day-row.is-today{
    background: rgba(242,169,59,0.07);
  }
  .day-row .count-badge{
    width: 30px; height:30px;
    border-radius: 7px;
    background: var(--tile);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800;
    font-size: 14px;
    color: var(--ink-dim);
    flex-shrink:0;
  }
  .day-row .count-badge.eight{
    background: var(--amber);
    color: #14161f;
  }
  .day-row .count-badge.weekend{
    opacity: 0.4;
  }
  .day-row .info{ flex:1; min-width:0; }
  .day-row .dname{
    font-size: 14px;
    font-weight: 700;
  }
  .day-row .dname .sub{
    font-weight: 400;
    color: var(--ink-dim);
    font-size: 12px;
    margin-left: 6px;
  }
  .day-row .comment-tag{
    font-size: 12px;
    color: var(--amber);
    margin-top: 2px;
  }
  .day-row .arrow{
    color: var(--ink-dim);
    font-size: 18px;
  }

  .save-btn{
    width:100%;
    margin-top: 10px;
    background: var(--amber);
    color: #14161f;
    border:none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor:pointer;
  }
  .save-btn:active{ transform: scale(0.98); }

  .settings-link{
    text-align:center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor:pointer;
  }

  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.6);
    display:flex; align-items:flex-end;
    z-index: 50;
  }
  .modal{
    background: var(--board-2);
    width:100%;
    border-radius: 16px 16px 0 0;
    padding: 20px 18px 28px;
    border-top: 1px solid var(--line);
  }
  .modal h3{ margin:0 0 4px; font-size:16px; }
  .modal .sub{ color: var(--ink-dim); font-size:13px; margin-bottom:14px; }

  .cal-overlay{
    align-items: flex-start;
    padding-top: 60px;
  }
  .cal-modal{
    border-radius: 16px;
    border-top: 1px solid var(--line);
    margin: 0 12px;
  }
  .modal-close{
    text-align:center;
    margin-top: 14px;
    color: var(--ink-dim);
    font-size: 13px;
    cursor:pointer;
  }
  .loading{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-dim);
  }
</style>
</head>
<body>
<div id="app" class="loading">Loading your ticket…</div>

<script>
const PRESET_TAGS = ['WFH', 'HOLIDAY', 'DENTIST', 'SICK'];

// Optional one-off import of past comments, e.g. from an old spreadsheet.
// Left empty here deliberately — this file is public. See import-seed-data.js
// (kept out of the GitHub repo) for how to load personal history in privately.
const SEED_COMMENTS = {};

function fmtKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseKey(k){
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isWeekend(d){
  const wd = d.getDay(); // 0 Sun, 6 Sat
  return wd === 0 || wd === 6;
}
function addDays(d, n){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+n);
  return nd;
}
function dayNameShort(d){
  return d.toLocaleDateString('en-GB', { weekday: 'short' });
}
function dateLabel(d){
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
function dateLabelShort(d){
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

const PERIOD_LENGTH = 28; // ticket valid for 28 calendar days
const USES_PER_PERIOD = 8; // 8 day-passes within that window
const DEFAULT_PERIOD_START = '2026-07-29'; // ticket bought tonight, starts tomorrow

let comments = {}; // dateKey -> comment string
let travelOverrides = {}; // dateKey -> true, for days with a comment that were still travelled
let periodStart = DEFAULT_PERIOD_START; // date the current ticket window began
let purchases = []; // [{date: 'YYYY-MM-DD', cost: number}, ...] — one entry per ticket bought
let lastKnownPrice = 153.60; // prefilled into the recalibrate cost field
let parkingCost = 6.39; // default daily parking estimate
let dismissedMonths = {}; // monthKey ('YYYY-MM') -> true, for the monthly estimate card
let menuOpen = false; // whether the hamburger dropdown is currently open
let estimateOffset = 0; // 0 = current pay period, 1 = next, 2 = the one after, etc. (not persisted)
let loaded = false;

async function loadData(){
  try{
    const c = localStorage.getItem('ticket-comments');
    comments = c ? JSON.parse(c) : {};
  }catch(e){ comments = {}; }
  try{
    const o = localStorage.getItem('ticket-travel-overrides');
    travelOverrides = o ? JSON.parse(o) : {};
  }catch(e){ travelOverrides = {}; }
  try{
    const pu = localStorage.getItem('ticket-purchases');
    purchases = pu ? JSON.parse(pu) : [];
  }catch(e){ purchases = []; }
  try{
    const lp = localStorage.getItem('ticket-last-price');
    lastKnownPrice = lp ? JSON.parse(lp) : 153.60;
  }catch(e){ lastKnownPrice = 153.60; }
  try{
    const pc = localStorage.getItem('ticket-parking-cost');
    parkingCost = pc ? JSON.parse(pc) : 6.39;
  }catch(e){ parkingCost = 6.39; }
  try{
    const dm = localStorage.getItem('ticket-dismissed-months');
    dismissedMonths = dm ? JSON.parse(dm) : {};
  }catch(e){ dismissedMonths = {}; }
  try{
    const p = localStorage.getItem('ticket-period-start');
    periodStart = p ? JSON.parse(p) : DEFAULT_PERIOD_START;
  }catch(e){ periodStart = DEFAULT_PERIOD_START; }

  // One-time import of the comments from the original spreadsheet.
  // Only fills in dates that don't already have a comment, and only runs once.
  let alreadySeeded = false;
  try{
    const s = localStorage.getItem('ticket-seed-imported');
    alreadySeeded = !!(s && JSON.parse(s));
  }catch(e){ alreadySeeded = false; /* key not found yet — expected on first run */ }

  if (!alreadySeeded){
    let changed = false;
    for (const key in SEED_COMMENTS){
      if (!comments[key]){
        comments[key] = SEED_COMMENTS[key];
        changed = true;
      }
    }
    if (changed) await saveComments();
    try{ localStorage.setItem('ticket-seed-imported', JSON.stringify(true)); }catch(e){}
  }

  loaded = true;
}

async function saveComments(){
  try{ localStorage.setItem('ticket-comments', JSON.stringify(comments)); }
  catch(e){ /* save failed silently; will retry next change */ }
}
async function saveTravelOverrides(){
  try{ localStorage.setItem('ticket-travel-overrides', JSON.stringify(travelOverrides)); }
  catch(e){ /* save failed silently; will retry next change */ }
}
async function savePurchases(){
  try{ localStorage.setItem('ticket-purchases', JSON.stringify(purchases)); }
  catch(e){ /* save failed silently; will retry next change */ }
}
async function saveLastKnownPrice(){
  try{ localStorage.setItem('ticket-last-price', JSON.stringify(lastKnownPrice)); }
  catch(e){ /* save failed silently; will retry next change */ }
}
async function saveParkingCost(){
  try{ localStorage.setItem('ticket-parking-cost', JSON.stringify(parkingCost)); }
  catch(e){ /* save failed silently; will retry next change */ }
}
async function saveDismissedMonths(){
  try{ localStorage.setItem('ticket-dismissed-months', JSON.stringify(dismissedMonths)); }
  catch(e){ /* save failed silently; will retry next change */ }
}
async function savePeriodStart(){
  try{ localStorage.setItem('ticket-period-start', JSON.stringify(periodStart)); }
  catch(e){ /* save failed silently; will retry next change */ }
}

// Runs on every app open. Fetches official UK bank holiday dates and fills
// them in as "BANK HOLIDAY" on any date that doesn't already have a comment.
// Never overwrites an existing entry. If offline, falls back to the last
// successful fetch (cached locally) so nothing breaks without a connection.
async function syncBankHolidays(){
  let events = null;

  try{
    const resp = await fetch('https://www.gov.uk/bank-holidays.json');
    if (resp.ok){
      const data = await resp.json();
      events = (data['england-and-wales'] && data['england-and-wales'].events) || [];
      try{ localStorage.setItem('bank-holidays-cache', JSON.stringify(events)); }catch(e){}
    }
  }catch(e){ /* offline or blocked — fall back to cache below */ }

  if (!events){
    try{
      const cached = localStorage.getItem('bank-holidays-cache');
      events = cached ? JSON.parse(cached) : [];
    }catch(e){ events = []; }
  }

  let changed = false;
  for (const ev of events){
    if (ev && ev.date && !comments[ev.date]){
      comments[ev.date] = 'BANK HOLIDAY';
      changed = true;
    }
  }
  if (changed) await saveComments();
  return changed;
}

// Find the first date after 'afterDate' (exclusive) that actually needs a ticket
// (a weekday with no comment). Capped to avoid runaway loops.
function findNextTravelDay(afterDate){
  let d = addDays(afterDate, 1);
  let guard = 0;
  while (guard < 400){
    const key = fmtKey(d);
    const isTravel = (comments[key] || '').trim() === '' || travelOverrides[key];
    if (!isWeekend(d) && isTravel){
      return d;
    }
    d = addDays(d, 1);
    guard++;
  }
  return d;
}

// Compute per-day state from periodStart up to targetDate inclusive.
// Ticket periods run up to 28 calendar days OR 8 used days, whichever comes first.
// Once a period ends, the next one doesn't start until the next day actually
// needed (skipping weekends/comment days) — you buy the ticket the day before
// you next need it, not automatically the day after the old one runs out.
// Returns a map dateKey -> { usedCount, daysElapsed, periodEnded, lostDays,
//   unusedRemaining, inGap, buyFlag }
// Finds the actual pay date for a given month: the 28th, walked backward
// a day at a time over weekends and bank holidays until it lands on a
// working day.
function getPayDate(year, monthIndex){
  let d = new Date(year, monthIndex, 28);
  while (true){
    const key = fmtKey(d);
    const isBankHoliday = (comments[key] || '').trim().toUpperCase() === 'BANK HOLIDAY';
    if (!isWeekend(d) && !isBankHoliday) return d;
    d = addDays(d, -1);
  }
}

// Returns {start, end} for the pay period `offset` periods away from the one
// containing `baseDate`. offset 0 = the period baseDate currently falls in,
// 1 = the next period, 2 = the one after that, etc. Negative offsets look
// backward. A period runs from one payday up to (not including) the next.
function getPayPeriodByOffset(baseDate, offset){
  let year = baseDate.getFullYear(), month = baseDate.getMonth();
  const thisMonthPay = getPayDate(year, month);
  let currentPayDate, nextPayDate;
  if (fmtKey(baseDate) >= fmtKey(thisMonthPay)){
    currentPayDate = thisMonthPay;
    let nm = month + 1, ny = year; if (nm > 11){ nm = 0; ny++; }
    nextPayDate = getPayDate(ny, nm);
  } else {
    let pm = month - 1, py = year; if (pm < 0){ pm = 11; py--; }
    currentPayDate = getPayDate(py, pm);
    nextPayDate = thisMonthPay;
  }
  for (let i = 0; i < offset; i++){
    const nm = nextPayDate.getMonth() + 1, ny = nextPayDate.getFullYear();
    currentPayDate = nextPayDate;
    nextPayDate = getPayDate(nm > 11 ? ny + 1 : ny, nm > 11 ? 0 : nm);
  }
  for (let i = 0; i < -offset; i++){
    const pm = currentPayDate.getMonth() - 1, py = currentPayDate.getFullYear();
    nextPayDate = currentPayDate;
    currentPayDate = getPayDate(pm < 0 ? py - 1 : py, pm < 0 ? 11 : pm);
  }
  return { start: currentPayDate, end: addDays(nextPayDate, -1) };
}

function computeStates(targetDate){
  const map = {};
  let segStart = parseKey(periodStart);
  if (fmtKey(segStart) > fmtKey(targetDate)) return map; // nothing to show yet

  while (fmtKey(segStart) <= fmtKey(targetDate)){
    let cursor = new Date(segStart);
    let usedCount = 0;
    let daysElapsed = 0;
    let periodEndDate = null;
    let finalLostDays = false;
    let finalUnusedRemaining = 0;

    while (true){
      const key = fmtKey(cursor);
      daysElapsed += 1;
      const weekend = isWeekend(cursor);
      const comment = (comments[key] || '').trim();
      const isTravel = comment === '' || travelOverrides[key];
      if (!weekend && isTravel){
        usedCount += 1;
      }
      const hitUses = usedCount >= USES_PER_PERIOD;
      const hitDays = daysElapsed >= PERIOD_LENGTH;
      const periodEnded = hitUses || hitDays;
      const lostDays = hitDays && !hitUses;

      if (fmtKey(cursor) <= fmtKey(targetDate)){
        map[key] = {
          usedCount, daysElapsed, periodEnded, lostDays,
          unusedRemaining: USES_PER_PERIOD - usedCount,
          inGap: false, buyFlag: false
        };
      }

      if (periodEnded){
        periodEndDate = new Date(cursor);
        finalLostDays = lostDays;
        finalUnusedRemaining = USES_PER_PERIOD - usedCount;
        break;
      }
      if (fmtKey(cursor) >= fmtKey(targetDate)){
        periodEndDate = null; // period still ongoing beyond our range — nothing more to compute
        break;
      }
      cursor = addDays(cursor, 1);
    }

    if (!periodEndDate) break;

    const nextTravel = findNextTravelDay(periodEndDate);
    const buyFlagDate = addDays(nextTravel, -1);

    // mark any days between the old period ending and the next ticket starting
    // as "gap" days — no active ticket needed
    let gcursor = addDays(periodEndDate, 1);
    while (fmtKey(gcursor) < fmtKey(nextTravel) && fmtKey(gcursor) <= fmtKey(targetDate)){
      const key = fmtKey(gcursor);
      map[key] = Object.assign({usedCount: 0, daysElapsed: 0, periodEnded: false, lostDays: false, unusedRemaining: 0}, map[key], {inGap: true});
      gcursor = addDays(gcursor, 1);
    }

    // flag the day before the next real travel day as the day to buy the ticket
    if (fmtKey(buyFlagDate) <= fmtKey(targetDate)){
      const bKey = fmtKey(buyFlagDate);
      map[bKey] = Object.assign({usedCount: 0, daysElapsed: 0, periodEnded: false, inGap: (fmtKey(buyFlagDate) > fmtKey(periodEndDate))}, map[bKey], {
        buyFlag: true,
        lostDays: finalLostDays,
        unusedRemaining: finalUnusedRemaining
      });
    }

    segStart = nextTravel;
  }
  return map;
}

function getRange(centerDate, before, after){
  const days = [];
  for (let i=-before; i<=after; i++){
    days.push(addDays(centerDate, i));
  }
  return days;
}

let state = {
  today: new Date(),
  editingKey: null,
  showRecalibrate: false,
  daysAhead: 13,
};
const MAX_DAYS_AHEAD = 120;
const DAYS_AHEAD_STEP = 14;

function findNextHoliday(todayKey){
  let best = null;
  for (const key in comments){
    if (key <= todayKey) continue;
    if ((comments[key] || '').trim().toUpperCase() === 'HOLIDAY'){
      if (!best || key < best) best = key;
    }
  }
  return best;
}

// Counts working days strictly between `from` and `to` (both exclusive) —
// i.e. the days you actually still have to work through before `to` arrives.
// Weekends and dates tagged BANK HOLIDAY don't count; everything else
// (including WFH days) still counts as a working day.
function countWorkingDaysUntil(from, to){
  let count = 0;
  let d = addDays(from, 1);
  while (d < to){
    if (!isWeekend(d)){
      const key = fmtKey(d);
      const tag = (comments[key] || '').trim().toUpperCase();
      if (tag !== 'BANK HOLIDAY') count++;
    }
    d = addDays(d, 1);
  }
  return count;
}

function render(){
  const app = document.getElementById('app');
  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const todayKey = fmtKey(today);
  const rangeEnd = addDays(today, state.daysAhead);
  const states = computeStates(rangeEnd);
  const todayState = states[todayKey];
  const todayComment = (comments[todayKey] || '').trim();
  const todayIsWeekend = isWeekend(today);
  const beforePeriod = !todayState;

  const nextHolidayKey = findNextHoliday(todayKey);
  let holidayHtml = '';
  if (nextHolidayKey){
    const hDate = parseKey(nextHolidayKey);
    const daysUntil = countWorkingDaysUntil(today, hDate);
    holidayHtml = `
      <div class="holiday-card">
        <div class="holiday-count">${daysUntil}</div>
        <div class="holiday-info">
          <div class="holiday-label">Working day${daysUntil===1?'':'s'} until your next holiday</div>
          <div class="holiday-date">${dateLabel(hDate)}</div>
        </div>
      </div>`;
  }

  const currentYear = today.getFullYear();
  const yearToDatePurchases = purchases.filter(p => parseKey(p.date).getFullYear() === currentYear);
  const yearToDateTotal = yearToDatePurchases.reduce((sum, p) => sum + p.cost, 0);

  let statusHtml = '';
  if (beforePeriod){
    statusHtml = `<div class="status-banner skip">This ticket starts ${dateLabel(parseKey(periodStart))}</div>`;
  } else if (todayState.buyFlag){
    const lostMsg = todayState.lostDays ? ` (${todayState.unusedRemaining} unused day${todayState.unusedRemaining===1?'':'s'} lost)` : '';
    statusHtml = `<div class="status-banner renew">🚆 Buy your ticket tonight for tomorrow${lostMsg}</div>`;
  } else if (todayState.inGap){
    statusHtml = `<div class="status-banner skip">No ticket needed yet — nothing due until you next travel</div>`;
  } else if (todayIsWeekend){
    statusHtml = `<div class="status-banner skip">Weekend — no ticket needed &middot; day ${todayState.daysElapsed} of 28</div>`;
  } else if (todayComment !== '' && !travelOverrides[todayKey]){
    statusHtml = `<div class="status-banner skip">Marked "${escapeHtml(todayComment)}" — not counted &middot; day ${todayState.daysElapsed} of 28</div>`;
  } else {
    const overrideNote = (todayComment !== '' && travelOverrides[todayKey]) ? ` &middot; marked "${escapeHtml(todayComment)}" but counted` : '';
    statusHtml = `<div class="status-banner ok">${todayState.unusedRemaining} use${todayState.unusedRemaining===1?'':'s'} left &middot; day ${todayState.daysElapsed} of 28${overrideNote}</div>`;
  }

  const todayCountDisplay = (beforePeriod || todayState.inGap) ? '–' : String(todayState.usedCount);
  const punches = [];
  for (let i=1;i<=8;i++){
    punches.push(!beforePeriod && !todayState.inGap && i <= todayState.usedCount);
  }
  const dayProgressPct = (beforePeriod || todayState.inGap) ? 0 : Math.round((todayState.daysElapsed / PERIOD_LENGTH) * 100);

  // Next buy-ticket date, found independently of how far the visible day
  // list currently scrolls — so it's always accurate even before you've
  // tapped "Show more days". Not shown if today itself is the buy day,
  // since the status banner above already covers that case.
  let nextBuyHtml = '';
  if (!beforePeriod){
    const buySearchStates = computeStates(addDays(today, 40));
    let nextBuyKey = null;
    for (const key in buySearchStates){
      if (key >= todayKey && buySearchStates[key].buyFlag){
        if (!nextBuyKey || key < nextBuyKey) nextBuyKey = key;
      }
    }
    if (nextBuyKey && nextBuyKey !== todayKey){
      nextBuyHtml = `<div class="next-buy-line">Next ticket due ${dateLabelShort(parseKey(nextBuyKey))}</div>`;
    }
  }

  const days = getRange(today, 3, state.daysAhead);

  // Monthly cost estimate — how many tickets and parking days are likely
  // needed within the selected pay period. Offset 0 is the current period
  // (most recent payday up to, but not including, the next one); the
  // card's own nav arrows let you preview future periods without
  // affecting the automatic dismiss/reset behaviour of the current one.
  const estPeriod = getPayPeriodByOffset(today, estimateOffset);
  const estWindowStart = estPeriod.start;
  const estWindowEnd = estPeriod.end;
  const estMonthKey = fmtKey(getPayPeriodByOffset(today, 0).start); // dismiss/reset key always tracks the CURRENT period, regardless of what's being previewed
  const estMonthStates = computeStates(estWindowEnd);
  let estTicketCount = 0;
  let estParkingDays = 0;
  for (let d = new Date(estWindowStart); d <= estWindowEnd; d = addDays(d, 1)){
    const key = fmtKey(d);
    if (estMonthStates[key] && estMonthStates[key].buyFlag) estTicketCount++;
    const weekend = isWeekend(d);
    const comment = (comments[key] || '').trim();
    const isTravel = comment === '' || travelOverrides[key];
    if (!weekend && isTravel) estParkingDays++;
  }
  const estTicketCost = estTicketCount * lastKnownPrice;
  const estParkingCost = estParkingDays * parkingCost;
  const estTotal = estTicketCost + estParkingCost;
  const payWindowLabel = `${dateLabelShort(estWindowStart)} – ${dateLabelShort(estWindowEnd)}`;
  const currentPeriod = getPayPeriodByOffset(today, 0);
  const currentPeriodLabel = `${dateLabelShort(currentPeriod.start)} – ${dateLabelShort(currentPeriod.end)}`;
  const monthEstimateDismissed = !!dismissedMonths[estMonthKey];
  const showEstimateCard = !monthEstimateDismissed;
  const rows = days.map(d => {
    const key = fmtKey(d);
    const s = states[key];
    const weekend = isWeekend(d);
    const comment = (comments[key] || '').trim();
    const isToday = key === todayKey;
    if (!s){
      return `
        <div class="day-row" data-key="${key}">
          <div class="count-badge">–</div>
          <div class="info">
            <div class="dname">${dayNameShort(d)} ${dateLabelShort(d)}</div>
            <div class="comment-tag" style="color:var(--ink-dim)">Before this ticket</div>
          </div>
          <div class="arrow">›</div>
        </div>`;
    }
    const badgeClass = s.buyFlag ? 'eight' : ((weekend || s.inGap) ? 'weekend' : '');
    const badgeText = (weekend || s.inGap) ? '–' : s.usedCount;
    let tag = '';
    const overridden = comment !== '' && !!travelOverrides[key];
    if (comment && s.buyFlag) tag = `${escapeHtml(comment)}${overridden ? ' &middot; counted' : ''} · Buy ticket${s.lostDays ? ` · ${s.unusedRemaining} lost` : ''}`;
    else if (comment) tag = escapeHtml(comment) + (overridden ? ' &middot; counted' : '');
    else if (s.buyFlag) tag = s.lostDays ? `Buy ticket · ${s.unusedRemaining} lost` : 'Buy ticket';
    else if (weekend) tag = 'Weekend';
    return `
      <div class="day-row ${isToday?'is-today':''}" data-key="${key}">
        <div class="count-badge ${badgeClass}">${badgeText}</div>
        <div class="info">
          <div class="dname">${dayNameShort(d)} ${dateLabelShort(d)} ${isToday?'<span class="sub">Today</span>':''}</div>
          ${tag ? `<div class="comment-tag">${tag}</div>` : ''}
        </div>
        <div class="arrow">›</div>
      </div>
    `;
  }).join('');

  app.className = '';
  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">Season Ticket Tracker</div>
      <h1>8-Day Ticket</h1>
      <div class="today-date">${dateLabel(today)}</div>
      <div class="menu-btn" id="menu-btn">&#9776;</div>
      ${menuOpen ? `
      <div class="menu-dropdown" id="menu-dropdown">
        <div class="settings-link" id="calendar-view-link">Calendar view</div>
        <div class="settings-link" id="recalibrate-link">Just bought a new ticket? Set start date</div>
        <div class="settings-link" id="import-history-link">Import historical data</div>
        <div class="settings-link" id="parking-cost-link">Set daily parking cost (currently £${parkingCost.toFixed(2)})</div>
        ${monthEstimateDismissed ? `<div class="settings-link" id="restore-estimate-link">Show ${currentPeriodLabel} estimate again</div>` : ''}
      </div>` : ''}
    </header>

    <div class="board-card">
      <div class="flip-row">
        <div class="flip-tile">${todayCountDisplay}</div>
        <div class="flip-of8">
          <div class="num">/8</div>
        </div>
      </div>
      <div class="punch-row">
        ${punches.map((p,i)=>`<div class="punch ${p?'done':''}">${i+1}</div>`).join('')}
      </div>
      <div class="day-progress-label">Day ${beforePeriod ? 0 : todayState.daysElapsed} of 28</div>
      <div class="day-progress-track"><div class="day-progress-fill" style="width:${dayProgressPct}%"></div></div>
      ${statusHtml}
      ${nextBuyHtml}
    </div>

    ${!showEstimateCard ? '' : `
    <div class="holiday-card" id="month-estimate-card">
      <div class="holiday-info" style="width:100%;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div class="holiday-label">Set aside on payday</div>
          <span id="month-estimate-dismiss" style="cursor:pointer; color:var(--ink-dim); font-size:16px; line-height:1; padding:0 4px;">&times;</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
          <span class="cal-nav-btn" id="estimate-prev" style="width:24px; height:24px; font-size:13px;">&#8249;</span>
          <div class="holiday-label" style="margin:0; font-weight:600; color:var(--ink);">${payWindowLabel}</div>
          <span class="cal-nav-btn" id="estimate-next" style="width:24px; height:24px; font-size:13px;">&#8250;</span>
        </div>
        <div class="holiday-date" style="font-size:22px; font-weight:600; color:var(--amber); margin-top:8px;">£${estTotal.toFixed(2)}</div>
        <div class="holiday-label" style="margin-top:2px;">${estTicketCount} ticket${estTicketCount===1?'':'s'} (£${estTicketCost.toFixed(2)}) + ${estParkingDays} parking day${estParkingDays===1?'':'s'} (£${estParkingCost.toFixed(2)})</div>
      </div>
    </div>`}

    <div class="holiday-card" id="spending-card" style="cursor:pointer;">
      <div class="holiday-info" style="width:100%;">
        <div class="holiday-label">Spent on tickets this year</div>
        <div class="holiday-date" style="font-size:22px; font-weight:600; color:var(--amber);">£${yearToDateTotal.toFixed(2)}</div>
        <div class="holiday-label" style="margin-top:2px;">${yearToDatePurchases.length} ticket${yearToDatePurchases.length===1?'':'s'} logged this year · tap to manage</div>
      </div>
    </div>

    ${holidayHtml}

    <div class="section-label">Today's comment</div>
    <div class="comment-card" id="today-comment-card">
      <div class="chip-row" id="chip-row"></div>
      <input type="text" id="custom-comment" placeholder="Or type your own" value="${escapeHtml(todayComment && !PRESET_TAGS.includes(todayComment.toUpperCase()) ? todayComment : '')}" />
      ${!todayIsWeekend ? `
      <label style="display:flex; align-items:center; gap:8px; margin:10px 0 4px; font-size:14px; color:var(--ink-dim); cursor:pointer;">
        <input type="checkbox" id="today-override-checkbox" ${travelOverrides[todayKey] ? 'checked' : ''} style="width:16px; height:16px;" />
        I still used the ticket today
      </label>` : ''}
      <button class="save-btn" id="save-today-btn">Save</button>
    </div>

    <div class="section-label">Upcoming &amp; recent days</div>
    <div class="day-list">${rows}</div>
    ${state.daysAhead < MAX_DAYS_AHEAD ? `<div class="settings-link" id="show-more-link">Show more days</div>` : ''}
  `;

  // wire up chip row for today
  const chipRow = document.getElementById('chip-row');
  let selectedPreset = PRESET_TAGS.includes(todayComment.toUpperCase()) ? todayComment.toUpperCase() : null;
  chipRow.innerHTML = PRESET_TAGS.map(tag => `<div class="chip ${selectedPreset===tag?'active':''}" data-tag="${tag}">${tag}</div>`).join('') +
    `<div class="chip ${!selectedPreset && !todayComment ? '' : (!selectedPreset && todayComment ? '' : '')}" data-tag="__clear">Clear</div>`;

  chipRow.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', async () => {
      const tag = chip.dataset.tag;
      const cb = document.getElementById('today-override-checkbox');
      if (tag === '__clear'){
        comments[todayKey] = '';
        delete travelOverrides[todayKey];
      } else {
        comments[todayKey] = tag;
        document.getElementById('custom-comment').value = '';
        if (cb && cb.checked) travelOverrides[todayKey] = true; else delete travelOverrides[todayKey];
      }
      await saveComments();
      await saveTravelOverrides();
      render();
    });
  });

  document.getElementById('save-today-btn').addEventListener('click', async () => {
    const val = document.getElementById('custom-comment').value.trim();
    const cb = document.getElementById('today-override-checkbox');
    if (val !== ''){
      comments[todayKey] = val;
      if (cb && cb.checked) travelOverrides[todayKey] = true; else delete travelOverrides[todayKey];
      await saveComments();
      await saveTravelOverrides();
      render();
    }
  });

  const todayOverrideCb = document.getElementById('today-override-checkbox');
  if (todayOverrideCb){
    todayOverrideCb.addEventListener('change', async () => {
      if (todayOverrideCb.checked) travelOverrides[todayKey] = true; else delete travelOverrides[todayKey];
      await saveTravelOverrides();
      render();
    });
  }

  document.querySelectorAll('.day-row').forEach(row => {
    row.addEventListener('click', () => openDayEditor(row.dataset.key));
  });

  document.getElementById('menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    menuOpen = !menuOpen;
    render();
  });
  if (menuOpen){
    // close the dropdown if the person taps anywhere outside it
    setTimeout(() => {
      document.addEventListener('click', function closeMenu(e){
        const dropdown = document.getElementById('menu-dropdown');
        const btn = document.getElementById('menu-btn');
        if (!dropdown || (!dropdown.contains(e.target) && e.target !== btn)){
          document.removeEventListener('click', closeMenu);
          if (menuOpen){ menuOpen = false; render(); }
        }
      });
    }, 0);
  }

  const calendarViewLink = document.getElementById('calendar-view-link');
  if (calendarViewLink) calendarViewLink.addEventListener('click', () => { menuOpen = false; render(); openCalendarView(); });
  const recalibrateLink = document.getElementById('recalibrate-link');
  if (recalibrateLink) recalibrateLink.addEventListener('click', () => { menuOpen = false; render(); openRecalibrate(); });
  const importHistoryLink = document.getElementById('import-history-link');
  if (importHistoryLink) importHistoryLink.addEventListener('click', () => { menuOpen = false; render(); openImportHistory(); });
  const parkingCostLink = document.getElementById('parking-cost-link');
  if (parkingCostLink) parkingCostLink.addEventListener('click', () => { menuOpen = false; render(); openParkingCostEditor(); });

  const dismissBtn = document.getElementById('month-estimate-dismiss');
  if (dismissBtn){
    dismissBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      dismissedMonths[estMonthKey] = true;
      await saveDismissedMonths();
      render();
    });
  }
  const estimatePrevBtn = document.getElementById('estimate-prev');
  if (estimatePrevBtn){
    estimatePrevBtn.addEventListener('click', () => {
      estimateOffset = Math.max(0, estimateOffset - 1);
      render();
    });
  }
  const estimateNextBtn = document.getElementById('estimate-next');
  if (estimateNextBtn){
    estimateNextBtn.addEventListener('click', () => {
      estimateOffset = Math.min(24, estimateOffset + 1);
      render();
    });
  }
  const restoreLink = document.getElementById('restore-estimate-link');
  if (restoreLink){
    restoreLink.addEventListener('click', async () => {
      menuOpen = false;
      estimateOffset = 0;
      delete dismissedMonths[estMonthKey];
      await saveDismissedMonths();
      render();
    });
  }
  document.getElementById('spending-card').addEventListener('click', openManagePurchases);

  const showMoreBtn = document.getElementById('show-more-link');
  if (showMoreBtn){
    showMoreBtn.addEventListener('click', () => {
      state.daysAhead = Math.min(state.daysAhead + DAYS_AHEAD_STEP, MAX_DAYS_AHEAD);
      render();
    });
  }
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function openDayEditor(key){
  const d = parseKey(key);
  const weekend = isWeekend(d);
  const current = comments[key] || '';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${dateLabel(d)}</h3>
      <div class="sub">${weekend ? 'Weekend day — always skipped' : 'Add a reason this day doesn\'t count (or leave blank for a normal travel day)'}</div>
      <div class="chip-row" id="modal-chip-row">
        ${PRESET_TAGS.map(tag => `<div class="chip ${current.toUpperCase()===tag?'active':''}" data-tag="${tag}">${tag}</div>`).join('')}
        <div class="chip" data-tag="__clear">Clear</div>
      </div>
      <input type="text" id="modal-custom-comment" placeholder="Or type your own" value="${escapeHtml(current && !PRESET_TAGS.includes(current.toUpperCase()) ? current : '')}" />
      ${!weekend ? `
      <label style="display:flex; align-items:center; gap:8px; margin:12px 0 4px; font-size:14px; color:var(--ink-dim); cursor:pointer;">
        <input type="checkbox" id="modal-override-checkbox" ${travelOverrides[key] ? 'checked' : ''} style="width:16px; height:16px;" />
        I still used the ticket this day
      </label>` : ''}
      <button class="save-btn" id="modal-save-btn">Save</button>
      <div class="modal-close" id="modal-close-btn">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);

  function getOverrideChecked(){
    const cb = document.getElementById('modal-override-checkbox');
    return cb ? cb.checked : false;
  }

  const modalOverrideCb = document.getElementById('modal-override-checkbox');
  if (modalOverrideCb){
    modalOverrideCb.addEventListener('change', async () => {
      if (modalOverrideCb.checked) travelOverrides[key] = true; else delete travelOverrides[key];
      await saveTravelOverrides();
      render(); // safe: this overlay is attached to document.body, not #app, so it survives re-render
    });
  }

  overlay.querySelectorAll('#modal-chip-row .chip').forEach(chip => {
    chip.addEventListener('click', async () => {
      const tag = chip.dataset.tag;
      if (tag === '__clear'){
        comments[key] = '';
        delete travelOverrides[key];
      } else {
        comments[key] = tag;
        document.getElementById('modal-custom-comment').value = '';
        if (getOverrideChecked()) travelOverrides[key] = true; else delete travelOverrides[key];
      }
      await saveComments();
      await saveTravelOverrides();
      document.body.removeChild(overlay); render();
    });
  });
  document.getElementById('modal-save-btn').addEventListener('click', async () => {
    const val = document.getElementById('modal-custom-comment').value.trim();
    if (val !== ''){
      comments[key] = val;
      if (getOverrideChecked()) travelOverrides[key] = true; else delete travelOverrides[key];
      await saveComments();
      await saveTravelOverrides();
      document.body.removeChild(overlay); render();
    } else {
      document.body.removeChild(overlay);
    }
  });
  document.getElementById('modal-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openParkingCostEditor(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Daily parking cost</h3>
      <div class="sub">Used to estimate what to set aside each month, on days you might drive in.</div>
      <input type="number" id="parking-cost-input" value="${parkingCost.toFixed(2)}" step="0.01" min="0" style="margin-bottom:12px;" />
      <button class="save-btn" id="parking-cost-save">Save</button>
      <div class="modal-close" id="parking-cost-close">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('parking-cost-save').addEventListener('click', async () => {
    const val = parseFloat(document.getElementById('parking-cost-input').value);
    if (!isNaN(val) && val >= 0){
      parkingCost = val;
      await saveParkingCost();
      document.body.removeChild(overlay); render();
    }
  });
  document.getElementById('parking-cost-close').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openCalendarView(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay cal-overlay';
  overlay.innerHTML = `
    <div class="modal cal-modal">
      <div class="cal-nav">
        <div class="cal-nav-btn" id="cal-prev">&#8249;</div>
        <div class="cal-nav-title" id="cal-title"></div>
        <div class="cal-nav-btn" id="cal-next">&#8250;</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="modal-close" id="cal-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  const realToday = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const todayKeyLocal = fmtKey(realToday);
  let viewYear = realToday.getFullYear();
  let viewMonth = realToday.getMonth(); // 0-indexed

  const weekdayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function drawMonth(){
    const title = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    document.getElementById('cal-title').textContent = title;

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    // Monday-first offset: JS getDay() is 0=Sun..6=Sat, shift so Mon=0..Sun=6
    const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;

    let cells = weekdayLabels.map(w => `<div class="cal-weekday">${w}</div>`).join('');
    for (let i = 0; i < leadingBlanks; i++){
      cells += `<div class="cal-day empty"></div>`;
    }
    for (let day = 1; day <= daysInMonth; day++){
      const d = new Date(viewYear, viewMonth, day);
      const key = fmtKey(d);
      const weekend = isWeekend(d);
      const isToday = key === todayKeyLocal;
      const hasEntry = !!(comments[key] || '').trim();
      cells += `<div class="cal-day ${weekend ? 'weekend' : ''} ${isToday ? 'today' : ''}">
        <span>${day}</span>${hasEntry ? '<span class="cal-dot"></span>' : ''}
      </div>`;
    }
    document.getElementById('cal-grid').innerHTML = cells;
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    viewMonth -= 1;
    if (viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
    drawMonth();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    viewMonth += 1;
    if (viewMonth > 11){ viewMonth = 0; viewYear += 1; }
    drawMonth();
  });
  document.getElementById('cal-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });

  drawMonth();
}

function openManagePurchases(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  function buildListHtml(){
    const sorted = [...purchases].sort((a, b) => a.date < b.date ? 1 : -1); // newest first
    if (sorted.length === 0){
      return `<div class="sub">No purchases logged yet.</div>`;
    }
    return sorted.map(p => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);">
        <span>${dateLabelShort(parseKey(p.date))} — £${p.cost.toFixed(2)}</span>
        <span class="modal-close" data-del="${p.date}" style="margin:0; font-size:13px;">Remove</span>
      </div>`).join('');
  }

  overlay.innerHTML = `
    <div class="modal">
      <h3>Ticket purchases</h3>
      <div class="sub">Every ticket you buy via "Set ticket start date" is logged here automatically. Add past ones below to backfill this year's total.</div>
      <div id="purchases-list" style="margin:12px 0; max-height:220px; overflow-y:auto;">${buildListHtml()}</div>
      <label style="display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px;">Add a past purchase</label>
      <input type="date" id="backfill-date-input" style="margin-bottom:8px;" />
      <input type="number" id="backfill-cost-input" placeholder="Cost (£)" step="0.01" min="0" value="${lastKnownPrice.toFixed(2)}" style="margin-bottom:12px;" />
      <button class="save-btn" id="backfill-add-btn">Add purchase</button>

      <label style="display:block; font-size:13px; color:var(--ink-dim); margin:16px 0 6px;">Or bulk-import as JSON</label>
      <textarea id="purchases-import-textarea" rows="4" style="width:100%; background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:'Courier New',monospace; font-size:13px; margin-bottom:8px;" placeholder='[{"date":"2026-01-13","cost":153.60}, ...]'></textarea>
      <div id="purchases-import-status" style="font-size:13px; color:var(--ink-dim); margin-bottom:10px;"></div>
      <button class="save-btn" id="purchases-import-btn">Import list</button>

      <div class="modal-close" id="purchases-close-btn">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  function refreshList(){
    document.getElementById('purchases-list').innerHTML = buildListHtml();
    overlay.querySelectorAll('[data-del]').forEach(el => {
      el.addEventListener('click', async () => {
        purchases = purchases.filter(p => p.date !== el.dataset.del);
        await savePurchases();
        refreshList();
        render();
      });
    });
  }
  refreshList();

  document.getElementById('backfill-add-btn').addEventListener('click', async () => {
    const dateVal = document.getElementById('backfill-date-input').value;
    const costVal = parseFloat(document.getElementById('backfill-cost-input').value);
    if (dateVal && !isNaN(costVal) && costVal >= 0){
      purchases = purchases.filter(p => p.date !== dateVal);
      purchases.push({ date: dateVal, cost: costVal });
      purchases.sort((a, b) => a.date < b.date ? -1 : 1);
      await savePurchases();
      document.getElementById('backfill-date-input').value = '';
      refreshList();
      render();
    }
  });

  document.getElementById('purchases-import-btn').addEventListener('click', async () => {
    const raw = document.getElementById('purchases-import-textarea').value.trim();
    const status = document.getElementById('purchases-import-status');
    if (!raw){ status.textContent = 'Paste some JSON first.'; return; }
    let parsed;
    try{ parsed = JSON.parse(raw); }
    catch(e){ status.textContent = 'That is not valid JSON.'; return; }
    if (!Array.isArray(parsed)){ status.textContent = 'Expected a JSON array of {date, cost} entries.'; return; }
    let added = 0;
    for (const entry of parsed){
      if (entry && typeof entry.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(entry.date) && typeof entry.cost === 'number'){
        purchases = purchases.filter(p => p.date !== entry.date);
        purchases.push({ date: entry.date, cost: entry.cost });
        added++;
      }
    }
    purchases.sort((a, b) => a.date < b.date ? -1 : 1);
    if (added > 0){
      lastKnownPrice = purchases[purchases.length - 1].cost;
      await savePurchases();
      await saveLastKnownPrice();
    }
    status.textContent = `Imported ${added} purchase${added===1?'':'s'}.`;
    refreshList();
    render();
  });

  document.getElementById('purchases-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openRecalibrate(){
  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const suggested = fmtKey(addDays(today, 1));
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Set ticket start date</h3>
      <div class="sub">Every time you buy a new ticket, set the date it starts. Your 8 uses and 28-day window will be tracked fresh from that date.</div>
      <input type="date" id="period-start-input" value="${suggested}" style="margin-bottom:12px;" />
      <label style="display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px;">Cost of this ticket (£)</label>
      <input type="number" id="period-cost-input" value="${lastKnownPrice.toFixed(2)}" step="0.01" min="0" style="margin-bottom:12px;" />
      <button class="save-btn" id="period-start-save">Set as new ticket start</button>
      <div class="modal-close" id="recal-close-btn">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('period-start-save').addEventListener('click', async () => {
    const val = document.getElementById('period-start-input').value;
    const costVal = parseFloat(document.getElementById('period-cost-input').value);
    if (val){
      periodStart = val;
      await savePeriodStart();
      if (!isNaN(costVal) && costVal >= 0){
        purchases = purchases.filter(p => p.date !== val); // replace any existing entry for this date
        purchases.push({ date: val, cost: costVal });
        purchases.sort((a, b) => a.date < b.date ? -1 : 1);
        lastKnownPrice = costVal;
        await savePurchases();
        await saveLastKnownPrice();
      }
      document.body.removeChild(overlay); render();
    }
  });
  document.getElementById('recal-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openImportHistory(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Import historical data</h3>
      <div class="sub">Paste a JSON object of date → comment entries, e.g. from an old spreadsheet export. Existing entries for the same date are kept as-is; only blank dates get filled in.</div>
      <textarea id="import-textarea" rows="8" style="width:100%; background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:'Courier New',monospace; font-size:13px; margin-bottom:12px;" placeholder='{"2025-09-26": "WFH", "2025-11-10": "HOLIDAY"}'></textarea>
      <div id="import-status" style="font-size:13px; color:var(--ink-dim); margin-bottom:10px;"></div>
      <button class="save-btn" id="import-save-btn">Import</button>
      <div class="modal-close" id="import-close-btn">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('import-save-btn').addEventListener('click', async () => {
    const raw = document.getElementById('import-textarea').value.trim();
    const status = document.getElementById('import-status');
    if (!raw){
      status.textContent = 'Paste some JSON first.';
      status.style.color = 'var(--danger)';
      return;
    }
    let parsed;
    try{
      parsed = JSON.parse(raw);
    }catch(e){
      status.textContent = 'That is not valid JSON — check for missing quotes or commas.';
      status.style.color = 'var(--danger)';
      return;
    }
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)){
      status.textContent = 'Expected a JSON object of "YYYY-MM-DD": "comment" pairs.';
      status.style.color = 'var(--danger)';
      return;
    }
    let added = 0;
    for (const key in parsed){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
      if (!comments[key]){
        comments[key] = String(parsed[key]);
        added++;
      }
    }
    await saveComments();
    document.body.removeChild(overlay);
    render();
  });

  document.getElementById('import-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

(async function init(){
  await loadData();
  render();

  // Check for bank holidays after the initial render so startup isn't
  // delayed by a network call. Re-render only if new dates were filled in.
  syncBankHolidays().then((changed) => { if (changed) render(); });
})();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      /* offline support just won't be available; app still works online */
    });
  });
}
