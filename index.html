// Runs on every app open. Fetches official UK bank holiday dates and fills
// them in as "BANK HOLIDAY" on any date that doesn't already have a comment.
// Never overwrites an existing entry. If offline, falls back to the last
// successful fetch (cached locally) so nothing breaks without a connection.
// Returns true if a date is one where a delay repay claim could plausibly
// apply: an actual past weekday travel day (not a weekend, not tagged
// WFH/HOLIDAY/etc unless overridden, and strictly before today).
function isEligibleRailDay(d, todayKeyParam){
  const key = fmtKey(d);
  if (key >= todayKeyParam) return false; // only completed past journeys
  if (isWeekend(d)) return false;
  const comment = (comments[key] || '').trim();
  return comment === '' || !!travelOverrides[key];
}

// Returns 'confirmed' if a specific confirmed train for this date is
// known to have breached the delay threshold — a near-certain claim.
// Returns 'maybe' if no confirmation exists but at least one configured
// train that day did breach it — the existing general indicator.
// Returns null if there's nothing to flag, including when every
// confirmed train for the day is known to have been on time (a
// confirmation should rule the day out, not just add to the guesswork).
function getDelayStatus(dateKey){
  const dayPerf = railPerfCache[dateKey];
  if (!dayPerf) return null;
  const confirmed = confirmedTrains[dateKey] || {};
  let anyConfirmedDelay = false;
  let anyUnconfirmedDirection = false;

  ['AM', 'PM'].forEach(direction => {
    const dirTrains = railTrains.filter(t => t.direction === direction);
    if (dirTrains.length === 0) return;
    const confirmedKey = confirmed[direction];
    if (confirmedKey !== undefined){
      if (confirmedKey === '') return; // explicitly didn't travel that leg — ignore
      const perf = dayPerf[confirmedKey];
      if (perf && perf.delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES) anyConfirmedDelay = true;
    } else {
      anyUnconfirmedDirection = true;
    }
  });

  if (anyConfirmedDelay) return 'confirmed';
  const anyDelayAtAll = railTrains.some(t => dayPerf[t.key] && dayPerf[t.key].delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES);
  if (anyUnconfirmedDirection && anyDelayAtAll) return 'maybe';
  return null;
}

// True if HSP has never been asked about this date for one or more of
// the given trains — not whether railPerfCache has data for it, since
// "asked and got nothing back" (service didn't run, no HSP record) is a
// perfectly valid outcome that shouldn't be retried forever.
// Shared fetch loop used by both railSyncMissingDates (travel days only,
// for the delay-repay claims flow) and railSyncFullHistory (every
// weekday, for the Performance history page). Takes neededByTrain —
// { trainKey: [dates] } — rather than one date list shared across every
// train, and narrows each train's own list independently as rounds
// complete, so a retry only ever asks about the specific (train, date)
// gaps still outstanding. Sharing one list across all trains would mean
// a train that already had a complete answer gets needlessly resent (and
// reprocessed server-side, burning its subrequest budget) on every round
// just because some OTHER train in the batch still had gaps — starving
// whichever trains happen to sort last in the list, worse the longer the
// date range. Mutates neededByTrain in place; updates railPerfCache and
// railSyncedDays with whatever the Worker resolved, marking exactly
// which (date, train) pairs it actually answered — genuinely checked,
// whether or not it found anything — so a genuine gap doesn't get
// re-queried indefinitely.
async function railSyncDatesBatch(neededByTrain, trains){
  let guard = 0;
  while (guard < 8){
    guard++;
    const requestPayload = trains
      .map(t => ({ key: t.key, fromLoc: t.fromLoc, toLoc: t.toLoc, time: t.time, dates: neededByTrain[t.key] || [] }))
      .filter(r => r.dates.length > 0);
    if (requestPayload.length === 0) break;

    let response;
    try{
      const resp = await fetch(RAIL_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: requestPayload })
      });
      if (!resp.ok) break;
      response = await resp.json();
    }catch(e){ break; }

    const trainResults = response.trainResults || {};
    for (const trainKey in trainResults){
      for (const date in trainResults[trainKey]){
        if (!railPerfCache[date]) railPerfCache[date] = {};
        railPerfCache[date][trainKey] = trainResults[trainKey][date];
      }
    }

    const attemptedDates = response.attemptedDates || {};
    let anyProgress = false;
    for (const trainKey in neededByTrain){
      const attempted = new Set(attemptedDates[trainKey] || []);
      if (attempted.size > 0) anyProgress = true;
      neededByTrain[trainKey] = (neededByTrain[trainKey] || []).filter(d => !attempted.has(d));
      for (const d of attempted){
        const already = railSyncedDays[d] || [];
        if (!already.includes(trainKey)) railSyncedDays[d] = [...already, trainKey];
      }
    }

    await saveRailPerfCache();
    await saveRailSyncedDays();
    render();

    const remainingTotal = Object.values(neededByTrain).reduce((sum, arr) => sum + arr.length, 0);
    if (remainingTotal === 0 || !anyProgress) break; // done, or no progress — stop rather than loop forever
  }
}

// Checks the currently visible past-day window for any eligible travel
// days that don't yet have performance data cached, and fetches just
// those from the Worker. Stays scoped to actual travel days
// (isEligibleRailDay) since this feeds the delay-repay claims flow,
// where a day you didn't travel is simply irrelevant. For the broader
// "how punctual is this train generally" picture, see
// railSyncFullHistory below.
async function railSyncMissingDates(){
  if (railSyncInProgress) return;
  if (!railTrains || railTrains.length === 0) return;
  if (RAIL_WORKER_URL.includes('YOUR-WORKER-NAME')) return; // not configured yet

  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const todayKeyLocal = fmtKey(today);
  const oldestVisible = addDays(today, -railDaysBack);

  const neededByTrain = {};
  for (const t of railTrains) neededByTrain[t.key] = [];
  for (let d = new Date(oldestVisible); d < today; d = addDays(d, 1)){
    if (!isEligibleRailDay(d, todayKeyLocal)) continue;
    const key = fmtKey(d);
    const synced = railSyncedDays[key] || [];
    for (const t of railTrains){
      if (!synced.includes(t.key)) neededByTrain[t.key].push(key);
    }
  }
  const totalNeeded = Object.values(neededByTrain).reduce((sum, arr) => sum + arr.length, 0);
  if (totalNeeded === 0) return;

  railSyncInProgress = true;
  try{ await railSyncDatesBatch(neededByTrain, railTrains); }
  finally{ railSyncInProgress = false; }
}

// Backfills performance data for every weekday in the window,
// regardless of whether it was a day you actually travelled — unlike
// railSyncMissingDates above. This is what gives the Performance history
// page (and its averages) the full picture of how the trains actually
// run, not just the subset of days you happened to be on them. Safe to
// call often: dates already covered for every currently-configured
// train are skipped, so a repeat call is cheap — though the very first
// call after a usual train is added or changed will genuinely re-check
// the whole window for that train, which is the point (a newly added
// train should get its own backfilled history too).
async function railSyncFullHistory(){
  if (railSyncInProgress) return;
  if (!railTrains || railTrains.length === 0) return;
  if (RAIL_WORKER_URL.includes('YOUR-WORKER-NAME')) return;

  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const oldest = addDays(today, -railHistoryDaysBack);

  const neededByTrain = {};
  for (const t of railTrains) neededByTrain[t.key] = [];
  for (let d = new Date(oldest); d < today; d = addDays(d, 1)){
    if (isWeekend(d)) continue;
    const key = fmtKey(d);
    const synced = railSyncedDays[key] || [];
    for (const t of railTrains){
      if (!synced.includes(t.key)) neededByTrain[t.key].push(key);
    }
  }
  const totalNeeded = Object.values(neededByTrain).reduce((sum, arr) => sum + arr.length, 0);
  if (totalNeeded === 0) return;

  railSyncInProgress = true;
  try{ await railSyncDatesBatch(neededByTrain, railTrains); }
  finally{ railSyncInProgress = false; }
}

// Fetches and caches the reason-code → English text table (see
// darwin-live-worker.js's /reason-codes route) if the local copy is
// missing or older than REASON_CODES_MAX_AGE_MS. Safe to call often —
// it's a no-op whenever the cache is already fresh. Never throws; a
// failed fetch just leaves whatever was already cached (possibly
// nothing) in place, since a bare numeric code is still shown as a
// fallback rather than the toast being blocked entirely.
async function ensureReasonCodes(){
  const age = Date.now() - (reasonCodesCache.fetchedAt || 0);
  if (age < REASON_CODES_MAX_AGE_MS && Object.keys(reasonCodesCache.codes).length > 0) return;
  try{
    const resp = await fetch(`${DARWIN_WORKER_URL}/reason-codes`);
    if (!resp.ok){
      console.error(`reason-codes fetch failed: HTTP ${resp.status}`, await resp.text().catch(() => ''));
      return;
    }
    const list = await resp.json();
    if (!Array.isArray(list)){
      console.error('reason-codes response was not an array:', list);
      return;
    }
    const codes = {};
    for (const entry of list){
      if (entry && entry.code !== undefined && entry.code !== null){
        codes[String(entry.code)] = { late: entry.lateReason || null, canc: entry.cancReason || null };
      }
    }
    reasonCodesCache = { fetchedAt: Date.now(), codes };
    await saveReasonCodesCache();
  }catch(e){
    console.error('reason-codes fetch threw:', e);
    // Offline or the worker's unreachable — whatever was already cached
    // (even if that's nothing) is left as-is; nothing to surface here.
  }
}

// Looks up a raw reason code (as stored in railPerfCache[date][key].reason)
// against the cached table, returning the right text for whether the
// service was delayed or cancelled. Falls back to a plain "reason code
// N" string if the table hasn't loaded that code yet, rather than
// showing nothing at all.
function describeReasonCode(code, isCancelled){
  if (code === null || code === undefined || code === '') return null;
  const entry = reasonCodesCache.codes[String(code)];
  const text = entry ? (isCancelled ? entry.canc : entry.late) : null;
  return text || `Reason code ${code} — description not loaded yet`;
}

async function syncBankHolidays(){
  let events = null;

  try{
    const resp = await fetch('https://www.gov.uk/bank-holidays.json');
    if (resp.ok){
      const data = await resp.json();
      events = (data['england-and-wales'] && data['england-and-wales'].events) || [];
      try{ localStorage.setItem('bank-holidays-cache', JSON.stringify(events)); }catch(e){}
    }
  }catch(e){ /* offline or blocked — fall back to cache below */ }

  if (!events){
    try{
      const cached = localStorage.getItem('bank-holidays-cache');
      events = cached ? JSON.parse(cached) : [];
    }catch(e){ events = []; }
  }

  let changed = false;
  for (const ev of events){
    if (ev && ev.date && !comments[ev.date]){
      comments[ev.date] = 'BANK HOLIDAY';
      changed = true;
    }
  }
  if (changed) await saveComments();
  return changed;
}

// Find the first date after 'afterDate' (exclusive) that actually needs a ticket
// (a weekday with no comment). Capped to avoid runaway loops.
function findNextTravelDay(afterDate){
  let d = addDays(afterDate, 1);
  let guard = 0;
  while (guard < 400){
    const key = fmtKey(d);
    const isTravel = (comments[key] || '').trim() === '' || travelOverrides[key];
    if (!isWeekend(d) && isTravel){
      return d;
    }
    d = addDays(d, 1);
    guard++;
  }
  return d;
}

// Compute per-day state from periodStart up to targetDate inclusive.
// Ticket periods run up to 28 calendar days OR 8 used days, whichever comes first.
// Once a period ends, the next one doesn't start until the next day actually
// needed (skipping weekends/comment days) — you buy the ticket the day before
// you next need it, not automatically the day after the old one runs out.
// Returns a map dateKey -> { usedCount, daysElapsed, periodEnded, lostDays,
//   unusedRemaining, inGap, buyFlag }
// Finds the actual pay date for a given month: the 28th, walked backward
// a day at a time over weekends and bank holidays until it lands on a
// working day.
function getPayDate(year, monthIndex){
  let d = new Date(year, monthIndex, 28);
  while (true){
    const key = fmtKey(d);
    const isBankHoliday = (comments[key] || '').trim().toUpperCase() === 'BANK HOLIDAY';
    if (!isWeekend(d) && !isBankHoliday) return d;
    d = addDays(d, -1);
  }
}

// Returns {start, end} for the pay period `offset` periods away from the one
// containing `baseDate`. offset 0 = the period baseDate currently falls in,
// 1 = the next period, 2 = the one after that, etc. Negative offsets look
// backward. A period runs from one payday up to (not including) the next.
function getPayPeriodByOffset(baseDate, offset){
  let year = baseDate.getFullYear(), month = baseDate.getMonth();
  const thisMonthPay = getPayDate(year, month);
  let currentPayDate, nextPayDate;
  if (fmtKey(baseDate) >= fmtKey(thisMonthPay)){
    currentPayDate = thisMonthPay;
    let nm = month + 1, ny = year; if (nm > 11){ nm = 0; ny++; }
    nextPayDate = getPayDate(ny, nm);
  } else {
    let pm = month - 1, py = year; if (pm < 0){ pm = 11; py--; }
    currentPayDate = getPayDate(py, pm);
    nextPayDate = thisMonthPay;
  }
  for (let i = 0; i < offset; i++){
    const nm = nextPayDate.getMonth() + 1, ny = nextPayDate.getFullYear();
    currentPayDate = nextPayDate;
    nextPayDate = getPayDate(nm > 11 ? ny + 1 : ny, nm > 11 ? 0 : nm);
  }
  for (let i = 0; i < -offset; i++){
    const pm = currentPayDate.getMonth() - 1, py = currentPayDate.getFullYear();
    nextPayDate = currentPayDate;
    currentPayDate = getPayDate(pm < 0 ? py - 1 : py, pm < 0 ? 11 : pm);
  }
  return { start: currentPayDate, end: addDays(nextPayDate, -1) };
}

// Generic "money saved versus a per-day budgeted expense, for days that
// have already happened" — built once, parameterized by which tracked
// days map and default cost to use, rather than written specifically
// for parking. A possible future second daily expense (bus fares,
// whatever) could reuse this directly with its own tracked-days map and
// default cost, rather than needing its own copy of the same logic.
// Deliberately only sums days up to and including today, not the whole
// period — a day that hasn't happened yet has no real outcome either
// way, so this stays a running total of what's actually occurred, never
// needing the same kind of "lock it in" fix the payday estimate needed.
function computeExpenseSavingsForPeriod(periodStart, periodEnd, todayDate, trackedDays, defaultCost){
  let total = 0;
  const cutoff = todayDate < periodEnd ? todayDate : periodEnd;
  for (let d = new Date(periodStart); d <= cutoff; d = addDays(d, 1)){
    const key = fmtKey(d);
    if (isWeekend(d)) continue;
    const comment = (comments[key] || '').trim();
    const isTravel = comment === '' || travelOverrides[key];
    if (!isTravel) continue; // this expense doesn't apply on a non-travel day
    total += (trackedDays[key] !== undefined) ? (defaultCost - trackedDays[key]) : defaultCost;
  }
  return total;
}

// Finds the next date flagged as a ticket-buy day, searching well beyond
// the visible day list so it's accurate regardless of scroll position.
function findNextBuyDateKey(today, todayKeyParam){
  const buySearchStates = computeStates(addDays(today, Math.max(MAX_DAYS_AHEAD, PERIOD_LENGTH)));
  let nextBuyKey = null;
  for (const key in buySearchStates){
    if (key >= todayKeyParam && buySearchStates[key].buyFlag){
      if (!nextBuyKey || key < nextBuyKey) nextBuyKey = key;
    }
  }
  return nextBuyKey;
}

// Shows a local notification via the service worker, which is the more
// reliable path for installed PWAs on Android compared to the plain
// Notification constructor.
async function showLocalNotification(title, body){
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try{
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification(title, { body, icon: 'icons/icon-192.png' });
  }catch(e){ /* notification failed silently — not critical */ }
}

function ensureGoogleTokenClient(){
  if (!googleTokenClient && window.google && google.accounts && google.accounts.oauth2){
    const config = {
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.file',
      callback: () => {} // overridden per-request below
    };
    if (preferredGoogleEmail) config.login_hint = preferredGoogleEmail;
    googleTokenClient = google.accounts.oauth2.initTokenClient(config);
  }
  return googleTokenClient;
}

// Gets a valid Google access token, reusing a cached one if it hasn't
// expired yet. Must be called from within a genuine user gesture (a
// click handler) the first time, or the browser may block the consent
// popup — this is why calendar syncing happens via a tappable prompt
// rather than automatically in the background.
function getGoogleAccessToken(){
  return new Promise((resolve) => {
    if (cachedAccessToken && Date.now() < cachedTokenExpiry){
      resolve(cachedAccessToken);
      return;
    }
    const client = ensureGoogleTokenClient();
    if (!client){ resolve(null); return; }
    client.callback = (resp) => {
      if (resp && resp.access_token){
        cachedAccessToken = resp.access_token;
        cachedTokenExpiry = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3000000) - 60000;
        resolve(cachedAccessToken);
      } else {
        resolve(null);
      }
    };
    client.requestAccessToken({ prompt: '' });
  });
}

// Creates or updates the single "Buy train ticket" calendar event for the
// given date, at 8pm with an immediate popup reminder. Reuses the same
// event (updating its date) rather than creating a new one each time, so
// old reminders don't pile up. If the stored event was deleted manually,
// falls back to creating a fresh one rather than failing silently forever.
// Finds the app's backup folder in Drive, creating it if it doesn't exist
// yet. Caches the folder ID so this search only needs to happen once —
// but recovers gracefully if the folder was deleted manually since then.
async function ensureDriveBackupFolder(token){
  const headers = { 'Authorization': `Bearer ${token}` };

  if (driveBackupFolderId){
    // verify it still exists rather than trusting the cache blindly
    try{
      const check = await fetch(`https://www.googleapis.com/drive/v3/files/${driveBackupFolderId}?fields=id,trashed`, { headers });
      if (check.ok){
        const data = await check.json();
        if (!data.trashed) return driveBackupFolderId;
      }
    }catch(e){ /* fall through to search/create */ }
  }

  const query = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${DRIVE_BACKUP_FOLDER_NAME}' and trashed=false`);
  const searchResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)`, { headers });
  if (searchResp.ok){
    const searchData = await searchResp.json();
    if (searchData.files && searchData.files.length > 0){
      driveBackupFolderId = searchData.files[0].id;
      await saveDriveBackupFolderId();
      return driveBackupFolderId;
    }
  }

  const createResp = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_BACKUP_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if (!createResp.ok) throw new Error('Could not create Drive backup folder');
  const createData = await createResp.json();
  driveBackupFolderId = createData.id;
  await saveDriveBackupFolderId();
  return driveBackupFolderId;
}

function buildBackupPayload(){
  const backup = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  BACKUP_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) backup.data[k] = v;
  });
  return JSON.stringify(backup, null, 2);
}

async function uploadBackupToDrive(token, folderId){
  const filename = `ticket-tracker-backup-${fmtKey(new Date())}-${Date.now()}.json`;
  const metadata = { name: filename, parents: [folderId] };
  const boundary = 'ticketpwa-backup-boundary';
  const payload = buildBackupPayload();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n` +
    `--${boundary}--`;

  const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  if (!resp.ok) throw new Error(`Drive upload failed: ${resp.status}`);
  return resp.json();
}

// Keeps only the most recent DRIVE_BACKUP_KEEP_COUNT files in the backup
// folder, deleting anything older right after a new backup succeeds.
async function pruneOldDriveBackups(token, folderId){
  const headers = { 'Authorization': `Bearer ${token}` };
  const query = encodeURIComponent(`'${folderId}' in parents and trashed=false and name contains 'ticket-tracker-backup-'`);
  const listResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&orderBy=createdTime desc&fields=files(id,name,createdTime)`, { headers });
  if (!listResp.ok) return;
  const listData = await listResp.json();
  const files = listData.files || [];
  const toDelete = files.slice(DRIVE_BACKUP_KEEP_COUNT);
  for (const f of toDelete){
    try{ await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, { method: 'DELETE', headers }); }
    catch(e){ /* not critical — will be cleaned up next successful backup */ }
  }
}

// The main entry point: called whenever the app is backgrounded. Only
// actually uploads if something's changed since the last successful
// backup AND the throttle window has passed — otherwise does nothing.
let driveBackupInFlight = false; // guards against overlapping triggers — e.g. Google's own OAuth popup opening/closing can itself cause a visibility change, which could otherwise race with an explicit manual backup

async function attemptDriveBackup(force){
  if (driveBackupInFlight) return { ok: false, reason: 'already-in-progress' };
  if (!driveBackupEnabled) return { ok: false, reason: 'not-enabled' };
  if (!force){
    if (!driveBackupDirty) return { ok: false, reason: 'nothing-changed' };
    if (Date.now() - lastDriveBackupTime < DRIVE_BACKUP_THROTTLE_MS) return { ok: false, reason: 'throttled' };
  }
  driveBackupInFlight = true;

  try{
    const token = await getGoogleAccessToken();
    if (!token) return { ok: false, reason: 'no-token' };
    const folderId = await ensureDriveBackupFolder(token);
    await uploadBackupToDrive(token, folderId);
    await pruneOldDriveBackups(token, folderId);
    driveBackupDirty = false;
    lastDriveBackupTime = Date.now();
    localStorage.setItem('drive-backup-dirty', JSON.stringify(false));
    localStorage.setItem('drive-backup-last-time', JSON.stringify(lastDriveBackupTime));
    return { ok: true };
  }catch(e){
    return { ok: false, reason: e.message }; // dirty flag stays set — will retry next opportunity
  }finally{
    driveBackupInFlight = false;
  }
}

async function syncGoogleCalendarEvent(dateKey){
  const token = await getGoogleAccessToken();
  if (!token) return { ok: false, reason: 'no-token' };

  const eventBody = {
    summary: 'Buy train ticket',
    start: { dateTime: `${dateKey}T20:00:00`, timeZone: 'Europe/London' },
    end: { dateTime: `${dateKey}T20:15:00`, timeZone: 'Europe/London' },
    colorId: '10', // Google Calendar's "Basil" — appears as green, matching the user's usual task color
    reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 0 }] }
  };
  const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

  try{
    let method = null;
    const usedEventId = gcalEventId;
    if (gcalEventId){
      const resp = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${gcalEventId}`, {
        method: 'PATCH', headers, body: JSON.stringify(eventBody)
      });
      if (resp.status === 404){
        gcalEventId = null; // stale — someone deleted it manually; fall through to create fresh
      } else if (!resp.ok){
        return { ok: false, reason: `patch-failed-${resp.status}`, eventId: usedEventId, dateKey };
      } else {
        method = 'updated';
      }
    }
    if (!gcalEventId){
      const resp = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST', headers, body: JSON.stringify(eventBody)
      });
      if (!resp.ok) return { ok: false, reason: `create-failed-${resp.status}`, dateKey };
      const data = await resp.json();
      gcalEventId = data.id;
      await saveGcalEventId();
      method = 'created';
    }
    gcalPendingSync = false;
    gcalLastSyncFailed = false;
    await saveGcalPendingSync();
    return { ok: true, method, eventId: gcalEventId, dateKey };
  }catch(e){
    return { ok: false, reason: `exception: ${e.message}`, dateKey }; // left pending — will retry next time the prompt is tapped
  }
}

// Removes the tracked reminder entirely, rather than patching it
// forward to a hypothetical next buy date — used when there's currently
// no active ticket at all (a genuine gap). Patching forward in that
// state was the actual bug: the "next buy date" is still a reasonable
// projection to display, but automatically rolling a calendar reminder
// onto it while nothing's actually been bought yet doesn't reflect
// anything concrete. Once a new ticket is logged, normal syncing
// resumes and a fresh reminder gets created for whatever that ticket's
// own next buy date turns out to be.
async function deleteGoogleCalendarEvent(){
  if (!gcalEventId) return { ok: true, method: 'none' }; // nothing tracked — nothing to do
  const token = await getGoogleAccessToken();
  if (!token) return { ok: false, reason: 'no-token' };
  try{
    const resp = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${gcalEventId}`, {
      method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
    });
    // 404/410 means it's already gone (e.g. deleted manually elsewhere)
    // — a successful outcome from here regardless, not a failure.
    if (!resp.ok && resp.status !== 404 && resp.status !== 410){
      return { ok: false, reason: `delete-failed-${resp.status}` };
    }
    const deletedId = gcalEventId;
    gcalEventId = null;
    await saveGcalEventId();
    gcalPendingSync = false;
    gcalLastSyncFailed = false;
    await saveGcalPendingSync();
    return { ok: true, method: 'deleted', eventId: deletedId };
  }catch(e){
    return { ok: false, reason: `exception: ${e.message}` };
  }
}

// Fires 10 seconds after the buy date last changed, not 10 seconds after
// it was first noticed — each further change resets the clock (see the
// scheduling logic in render()). Re-derives the buy date fresh at fire
// time rather than trusting the value from whenever it was scheduled,
// in case something shifted again in the meantime.
async function fireBuyDateChangeActions(){
  const freshToday = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const freshTodayKey = fmtKey(freshToday);
  const freshNext = findNextBuyDateKey(freshToday, freshTodayKey);
  if (freshNext && freshNext !== lastNotifiedBuyKey){
    if (lastNotifiedBuyKey !== null){ // don't notify on the very first-ever load
      showLocalNotification('Ticket buy date updated', `Now due ${dateLabelShort(parseKey(freshNext))}`);
    }
    if (gcalEnabled){
      gcalPendingSync = true; saveGcalPendingSync();
      // No active ticket right now — delete the tracked reminder rather
      // than patch it forward to this hypothetical date. See
      // deleteGoogleCalendarEvent's own comment for the full reasoning;
      // this is the actual trigger point the original bug came from.
      if (isCurrentlyInTicketGap(freshToday, freshTodayKey)){
        deleteGoogleCalendarEvent().then((result) => { if (result.ok) render(); });
      } else {
        syncGoogleCalendarEvent(freshNext).then((result) => { if (result.ok) render(); });
      }
    }
    lastNotifiedBuyKey = freshNext;
    saveLastNotifiedBuyKey();
    render();
  }
  scheduledBuyKey = null;
  buyDateChangeTimer = null;
}

// Computes the end of the *actual* current ticket period only — no
// chaining into imagined future cycles. This is the real boundary of what
// you've actually paid for; anything past it needs either a logged single
// ticket for that specific day, or a fresh season ticket purchase.
function getRealPeriodEnd(){
  let cursor = parseKey(periodStart);
  let usedCount = 0, daysElapsed = 0;
  while (true){
    const key = fmtKey(cursor);
    daysElapsed += 1;
    const weekend = isWeekend(cursor);
    const comment = (comments[key] || '').trim();
    const isTravel = comment === '' || travelOverrides[key];
    if (!weekend && isTravel) usedCount += 1;
    const hitUses = usedCount >= USES_PER_PERIOD;
    const hitDays = daysElapsed >= PERIOD_LENGTH;
    if (hitUses || hitDays){
      return { endDate: new Date(cursor), lostDays: hitDays && !hitUses, unusedRemaining: USES_PER_PERIOD - usedCount };
    }
    cursor = addDays(cursor, 1);
  }
}

// Shared, single source of truth for "is today in a genuine gap" — no
// active season ticket (the real 28-day/8-use window has ended) and
// nothing bought to replace it yet. Used both by render() for what the
// card displays and by the Google Calendar sync logic below, so the two
// can't quietly drift apart the way they did before this existed —
// render() checked this inline, syncing didn't check it at all.
function isCurrentlyInTicketGap(dateObj, dateKeyParam){
  const dayStates = computeStates(dateObj);
  if (!dayStates[dateKeyParam]) return false; // hasn't started counting at all yet — that's "before period", not a gap
  const realPeriodEnd = getRealPeriodEnd();
  return dateKeyParam > fmtKey(realPeriodEnd.endDate);
}

// Returns the single-ticket purchase record for an exact date, if any.
function getSingleTicketForDate(key){
  return purchases.find(p => p.date === key && p.type === 'single');
}

function computeStates(targetDate){
  const map = {};
  let segStart = parseKey(periodStart);
  if (fmtKey(segStart) > fmtKey(targetDate)) return map; // nothing to show yet

  while (fmtKey(segStart) <= fmtKey(targetDate)){
    let cursor = new Date(segStart);
    let usedCount = 0;
    let daysElapsed = 0;
    let periodEndDate = null;
    let finalLostDays = false;
    let finalUnusedRemaining = 0;

    while (true){
      const key = fmtKey(cursor);
      daysElapsed += 1;
      const weekend = isWeekend(cursor);
      const comment = (comments[key] || '').trim();
      const isTravel = comment === '' || travelOverrides[key];
      if (!weekend && isTravel){
        usedCount += 1;
      }
      const hitUses = usedCount >= USES_PER_PERIOD;
      const hitDays = daysElapsed >= PERIOD_LENGTH;
      const periodEnded = hitUses || hitDays;
      const lostDays = hitDays && !hitUses;

      if (fmtKey(cursor) <= fmtKey(targetDate)){
        map[key] = {
          usedCount, daysElapsed, periodEnded, lostDays,
          unusedRemaining: USES_PER_PERIOD - usedCount,
          inGap: false, buyFlag: false
        };
      }

      if (periodEnded){
        periodEndDate = new Date(cursor);
        finalLostDays = lostDays;
        finalUnusedRemaining = USES_PER_PERIOD - usedCount;
        break;
      }
      if (fmtKey(cursor) >= fmtKey(targetDate)){
        periodEndDate = null; // period still ongoing beyond our range — nothing more to compute
        break;
      }
      cursor = addDays(cursor, 1);
    }

    if (!periodEndDate) break;

    const nextTravel = findNextTravelDay(periodEndDate);
    const buyFlagDate = addDays(nextTravel, -1);

    // mark any days between the old period ending and the next ticket starting
    // as "gap" days — no active ticket needed
    let gcursor = addDays(periodEndDate, 1);
    while (fmtKey(gcursor) < fmtKey(nextTravel) && fmtKey(gcursor) <= fmtKey(targetDate)){
      const key = fmtKey(gcursor);
      map[key] = Object.assign({usedCount: 0, daysElapsed: 0, periodEnded: false, lostDays: false, unusedRemaining: 0}, map[key], {inGap: true});
      gcursor = addDays(gcursor, 1);
    }

    // flag the day before the next real travel day as the day to buy the ticket
    if (fmtKey(buyFlagDate) <= fmtKey(targetDate)){
      const bKey = fmtKey(buyFlagDate);
      map[bKey] = Object.assign({usedCount: 0, daysElapsed: 0, periodEnded: false, inGap: (fmtKey(buyFlagDate) > fmtKey(periodEndDate))}, map[bKey], {
        buyFlag: true,
        lostDays: finalLostDays,
        unusedRemaining: finalUnusedRemaining
      });
    }

    segStart = nextTravel;
  }
  return map;
}

// Recovers what a day's state WOULD have shown, for a date that falls
// before the current global periodStart — a genuine gap in the normal
// computeStates(), which only ever looks forward from periodStart.
// Without this, buying a new ticket instantly blanks every earlier day
// in the list down to a bare "Before this ticket" placeholder, even
// though those days genuinely belonged to a real previous ticket with
// real detail (confirmed trains, delay claims) worth still being able
// to see.
//
// Deliberately NOT just calling computeStates() with an earlier
// periodStart — that function auto-advances into a fresh 8-use cycle
// the moment one segment ends, which is exactly right for forward
// projections (the payday estimate assumes tickets keep getting bought
// on schedule) but wrong here: caught this producing "day 1 of 8" for
// a day that was actually sitting in a genuine unbought gap, simply
// because the calendar's next plausible travel day happened to land
// there — regardless of whether a ticket was ever really purchased for
// it. So this only ever walks the ONE real ticket's own segment plus
// its immediate gap afterward, and stops — never speculating about a
// second, unconfirmed cycle the way computeStates itself would.
function findHistoricalStateForDate(key){
  const seasonPurchases = purchases.filter(p => (p.type || undefined) !== 'single').sort((a, b) => a.date.localeCompare(b.date));
  const historicalPurchase = seasonPurchases.filter(p => p.date <= key).slice(-1)[0];
  if (!historicalPurchase) return null;

  let cursor = parseKey(historicalPurchase.date);
  let usedCount = 0, daysElapsed = 0, periodEndDate = null;
  while (true){
    const cKey = fmtKey(cursor);
    daysElapsed += 1;
    const weekend = isWeekend(cursor);
    const comment = (comments[cKey] || '').trim();
    const isTravel = comment === '' || travelOverrides[cKey];
    if (!weekend && isTravel) usedCount += 1;
    const hitUses = usedCount >= USES_PER_PERIOD;
    const hitDays = daysElapsed >= PERIOD_LENGTH;
    if (cKey === key){
      return { usedCount, daysElapsed, periodEnded: hitUses || hitDays, lostDays: hitDays && !hitUses, unusedRemaining: USES_PER_PERIOD - usedCount, inGap: false, buyFlag: false };
    }
    if (hitUses || hitDays){ periodEndDate = new Date(cursor); break; }
    cursor = addDays(cursor, 1);
  }
  // Reached the real ticket's own end without finding key yet — it's
  // somewhere in the gap that followed. No "buy ticket" flag applied
  // here even on what would have been that day — this is a look back
  // at a settled day, not a live reminder about the future.
  let gcursor = addDays(periodEndDate, 1);
  while (fmtKey(gcursor) <= key){
    if (fmtKey(gcursor) === key){
      return { usedCount: 0, daysElapsed: 0, periodEnded: false, lostDays: false, unusedRemaining: 0, inGap: true, buyFlag: false };
    }
    gcursor = addDays(gcursor, 1);
  }
  return null; // shouldn't happen given the !s guard already bounds key before periodStart
}

function getRange(centerDate, before, after){
  const days = [];
  for (let i=-before; i<=after; i++){
    days.push(addDays(centerDate, i));
  }
  return days;
}

let state = {
  today: new Date(),
  daysAhead: 13,
  activeTab: 'today', // drives which bottom-nav icon is highlighted
};
const MAX_DAYS_AHEAD = 120;
const DAYS_AHEAD_STEP = 14;

// Closes any currently-open modal sheet — used so tapping a different
// bottom-nav tab swaps screens cleanly rather than stacking them.
function closeAllModals(){
  // A plain .remove() below would rip out train-progress's DOM node
  // without going through its own cleanup — leaving its refresh timer
  // and visibility listener running invisibly in the background. Give it
  // a chance to close itself properly first.
  if (activeTrainProgressCleanup){
    activeTrainProgressCleanup();
    activeTrainProgressCleanup = null;
  }
  document.querySelectorAll('.modal-overlay').forEach(o => o.remove());
}

function findNextHoliday(todayKey){
  let best = null;
  for (const key in comments){
    if (key <= todayKey) continue;
    if ((comments[key] || '').trim().toUpperCase() === 'HOLIDAY'){
      if (!best || key < best) best = key;
    }
  }
  return best;
}

// Counts working days strictly between `from` and `to` (both exclusive) —
// i.e. the days you actually still have to work through before `to` arrives.
// Weekends and dates tagged BANK HOLIDAY don't count; everything else
// (including WFH days) still counts as a working day.
function countWorkingDaysUntil(from, to){
  let count = 0;
  let d = addDays(from, 1);
  while (d < to){
    if (!isWeekend(d)){
      const key = fmtKey(d);
      const tag = (comments[key] || '').trim().toUpperCase();
      if (tag !== 'BANK HOLIDAY') count++;
    }
    d = addDays(d, 1);
  }
  return count;
}

// Small line-style SVG icons for the delay repay badge — kept inline rather
// than pulling in an icon font, since the app otherwise relies on emoji and
// these two need to look crisp at ~17px against a tinted background.
const DELAY_REPAY_ICON_RECEIPT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18l-2.5-1.5L14 21l-2.5-1.5L9 21l-2.5-1.5L4 21V3a1 1 0 0 1 1-1z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>';
const DELAY_REPAY_ICON_WARNING = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><line x1="12" y1="10" x2="12" y2="14.5"/><line x1="12" y1="17" x2="12" y2="17"/></svg>';

function render(){
  const app = document.getElementById('app');
  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const todayKey = fmtKey(today);

  // Delay repay claim expiry — Avanti's 28-day window from date of travel.
  // Stamped here (evaluated on every render) rather than on a timer, since
  // the app has no background process; the next time Wayne opens it after
  // the window lapses is when it flips to 'expired'. Fire-and-forget save —
  // render() isn't async and this is low-stakes enough not to need to be.
  let anyClaimJustExpired = false;
  for (const dKey in delayClaims){
    for (const dir in delayClaims[dKey]){
      const c = delayClaims[dKey][dir];
      if (c && c.status === 'started'){
        const daysSinceTravel = Math.floor((today - parseKey(dKey)) / 86400000);
        if (daysSinceTravel >= 28){
          c.status = 'expired';
          if (typeof c.expiredAcknowledged !== 'boolean') c.expiredAcknowledged = false;
          anyClaimJustExpired = true;
        }
      }
    }
  }
  if (anyClaimJustExpired) saveDelayClaims();

  // Delay repay badge — see delay-repay-expiry-badge-spec.md. Expired mode
  // (unacknowledged) always wins over normal mode; within a mode, AM+PM
  // claims on the same date count as one entry, since openDayEditor opens
  // by date, not by direction.
  let delayRepayBadgeHtml = '';
  {
    const expiredByDate = new Map(); // dateKey -> true if any unacknowledged expired claim
    const startedByDate = new Map(); // dateKey -> min days remaining across AM/PM
    for (const dKey in delayClaims){
      for (const dir in delayClaims[dKey]){
        const c = delayClaims[dKey][dir];
        if (!c) continue;
        if (c.status === 'expired' && !c.expiredAcknowledged){
          expiredByDate.set(dKey, true);
        } else if (c.status === 'started'){
          const daysRemaining = 28 - Math.floor((today - parseKey(dKey)) / 86400000);
          const prev = startedByDate.has(dKey) ? startedByDate.get(dKey) : Infinity;
          startedByDate.set(dKey, Math.min(prev, daysRemaining));
        }
      }
    }

    const expiredDates = Array.from(expiredByDate.keys());
    const startedEntries = Array.from(startedByDate.entries()); // [dateKey, daysRemaining]

    if (expiredDates.length > 0){
      const remainingCount = expiredDates.length - 1 + startedEntries.length;
      delayRepayBadgeHtml = `
        <div class="delay-repay-badge-wrap">
          <div class="delay-repay-badge expired" id="delay-repay-badge" data-mode="expired" data-date-key="${expiredDates[0]}">
            <div class="delay-repay-badge-caption">Delay repay</div>
            <div class="delay-repay-badge-line">${DELAY_REPAY_ICON_WARNING} Expired</div>
          </div>
          ${remainingCount > 0 ? `<div class="delay-repay-badge-more">${remainingCount} more claim${remainingCount === 1 ? '' : 's'} waiting</div>` : ''}
        </div>`;
    } else if (startedEntries.length > 0){
      startedEntries.sort((a, b) => a[1] - b[1]);
      const [soonestDateKey, daysRemaining] = startedEntries[0];
      delayRepayBadgeHtml = `
        <div class="delay-repay-badge-wrap">
          <div class="delay-repay-badge normal" id="delay-repay-badge" data-mode="normal" data-date-key="${soonestDateKey}">
            <div class="delay-repay-badge-caption">Delay repay</div>
            <div class="delay-repay-badge-line">${DELAY_REPAY_ICON_RECEIPT} ${daysRemaining} Day${daysRemaining === 1 ? '' : 's'}</div>
          </div>
        </div>`;
    }
  }
  const rangeEnd = addDays(today, state.daysAhead);
  const states = computeStates(rangeEnd);
  const todayState = states[todayKey];
  const todayComment = (comments[todayKey] || '').trim();
  const todayIsWeekend = isWeekend(today);

  // Purely for fun — gov.uk's bank holiday feed includes a genuine "bunting"
  // flag on celebratory dates (Christmas, Easter Monday, etc. get true;
  // Good Friday, for instance, gets false). No functional purpose, just a
  // small decorative flourish on days it applies.
  let isBuntingDay = false;
  try{
    const cachedHolidays = localStorage.getItem('bank-holidays-cache');
    if (cachedHolidays){
      const holidayEvents = JSON.parse(cachedHolidays);
      const todayEvent = holidayEvents.find(ev => ev.date === todayKey);
      isBuntingDay = !!(todayEvent && todayEvent.bunting);
    }
  }catch(e){ isBuntingDay = false; }
  const beforePeriod = !todayState;

  // Hamburger menu items, built as a weighted list so ordering is
  // controlled by 'weight' rather than by where an item happens to sit in
  // this template — new items default to the main group, and anything
  // given a high weight (like Bulk import comments) always sorts to
  // the bottom, however many other items get added later.
  const menuItems = [
    { id: 'settings-link', label: 'Settings', weight: 0 },
    { id: 'depboard-link', label: 'Station board', weight: 0 },
    { id: 'confirm-train-link', label: 'Confirm train used', weight: 0 },
    { id: 'stats-link', label: 'View stats', weight: 0 },
    { id: 'perf-history-link', label: 'Performance history', weight: 0 },
    { id: 'delay-claims-link', label: 'Delay repay claims', weight: 0 },
  ];
  if (typeof Notification !== 'undefined' && Notification.permission === 'default'){
    menuItems.push({ id: 'enable-notifications-link', label: 'Enable notifications', weight: 0 });
  }
  menuItems.push({ id: 'backup-restore-link', label: 'Backup & restore', weight: 50 });
  menuItems.push({ id: 'help-link', label: 'Help', weight: 55 });
  menuItems.push({ id: 'backlog-link', label: 'Backlog', weight: 56 });
  menuItems.push({ id: 'import-history-link', label: 'Bulk import comments', weight: 100 });
  menuItems.sort((a, b) => a.weight - b.weight);
  const menuItemsHtml = menuItems.map(item => `<div class="settings-link" id="${item.id}">${item.label}</div>`).join('');

  const nextHolidayKey = findNextHoliday(todayKey);
  let holidayHtml = '';
  if (nextHolidayKey){
    const hDate = parseKey(nextHolidayKey);
    const daysUntil = countWorkingDaysUntil(today, hDate);
    holidayHtml = `
      <div class="holiday-card">
        <div class="holiday-count">${daysUntil}</div>
        <div class="holiday-info">
          <div class="holiday-label">Working day${daysUntil===1?'':'s'} until your next holiday</div>
          <div class="holiday-date">${dateLabel(hDate)}</div>
        </div>
      </div>`;
  }

  const currentYear = today.getFullYear();
  const yearToDatePurchases = purchases.filter(p => parseKey(p.date).getFullYear() === currentYear);
  const yearToDateTotal = yearToDatePurchases.reduce((sum, p) => sum + p.cost, 0);

  const realPeriodEnd = beforePeriod ? null : getRealPeriodEnd();
  // Same underlying check as isCurrentlyInTicketGap (shared helper, used
  // by the calendar sync logic too) — kept as a direct computation here
  // rather than calling that helper again, since realPeriodEnd is
  // already available and needed separately just below for isPastPhantom.
  const isPhantomToday = !beforePeriod && fmtKey(today) > fmtKey(realPeriodEnd.endDate);

  let statusHtml = '';
  if (beforePeriod){
    statusHtml = `<div class="status-banner skip">This ticket starts ${dateLabel(parseKey(periodStart))}</div>`;
  } else if (isPhantomToday){
    const singleToday = getSingleTicketForDate(todayKey);
    if (todayIsWeekend){
      statusHtml = `<div class="status-banner skip">Weekend — no ticket needed</div>`;
    } else if (singleToday){
      statusHtml = `<div class="status-banner ok">Single ticket used today (£${singleToday.cost.toFixed(2)})</div>`;
    } else if (todayComment !== '' && !travelOverrides[todayKey]){
      statusHtml = `<div class="status-banner skip">Marked "${escapeHtml(todayComment)}" — not counted</div>`;
    } else {
      statusHtml = `<div class="status-banner renew" id="renewal-banner-tap" style="cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">No active season ticket — log a single ticket, or buy your next one ›</div>`;
    }
  } else if (todayState.buyFlag){
    const lostMsg = todayState.lostDays ? ` (${todayState.unusedRemaining} unused day${todayState.unusedRemaining===1?'':'s'} lost)` : '';
    statusHtml = `<div class="status-banner renew" id="renewal-banner-tap" style="cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">🚆 Buy your ticket tonight for tomorrow${lostMsg} ›</div>`;
  } else if (todayState.inGap){
    statusHtml = `<div class="status-banner skip">No ticket needed yet — nothing due until you next travel</div>`;
  } else if (todayIsWeekend){
    statusHtml = `<div class="status-banner skip">Weekend — no ticket needed &middot; day ${todayState.daysElapsed} of 28</div>`;
  } else if (todayComment !== '' && !travelOverrides[todayKey]){
    statusHtml = `<div class="status-banner skip">Marked "${escapeHtml(todayComment)}" — not counted &middot; day ${todayState.daysElapsed} of 28</div>`;
  } else {
    const overrideNote = (todayComment !== '' && travelOverrides[todayKey]) ? ` &middot; marked "${escapeHtml(todayComment)}" but counted` : '';
    statusHtml = `<div class="status-banner ok">${todayState.unusedRemaining} use${todayState.unusedRemaining===1?'':'s'} left &middot; day ${todayState.daysElapsed} of 28${overrideNote}</div>`;
  }

  const todayCountDisplay = (beforePeriod || todayState.inGap) ? '–' : String(todayState.usedCount);
  const punches = [];
  for (let i=1;i<=8;i++){
    punches.push(!beforePeriod && !todayState.inGap && i <= todayState.usedCount);
  }
  const dayProgressPct = (beforePeriod || todayState.inGap) ? 0 : Math.round((todayState.daysElapsed / PERIOD_LENGTH) * 100);

  // Next buy-ticket date, found independently of how far the visible day
  // list currently scrolls — so it's always accurate even before you've
  // tapped "Show more days". Not shown if today itself is the buy day,
  // since the status banner above already covers that case.
  let nextBuyHtml = '';
  let calendarPromptHtml = '';
  if (!beforePeriod){
    const nextBuyKey = findNextBuyDateKey(today, todayKey);
    if (nextBuyKey && nextBuyKey !== todayKey){
      nextBuyHtml = `<div class="next-buy-line">Next ticket due ${dateLabelShort(parseKey(nextBuyKey))}</div>`;
    }
    // If the predicted buy date has changed since we last checked, wait
    // 10 seconds before actually notifying/syncing — if another change
    // comes in before that (e.g. tagging several holiday days in a row),
    // the timer resets rather than firing once per edit.
    if (nextBuyKey && nextBuyKey !== lastNotifiedBuyKey){
      if (nextBuyKey !== scheduledBuyKey){
        scheduledBuyKey = nextBuyKey;
        if (buyDateChangeTimer) clearTimeout(buyDateChangeTimer);
        buyDateChangeTimer = setTimeout(fireBuyDateChangeActions, 10000);
      }
    } else if (buyDateChangeTimer){
      // the change was undone (e.g. tag removed again) before the timer
      // fired — cancel it rather than notifying about a non-change
      clearTimeout(buyDateChangeTimer);
      buyDateChangeTimer = null;
      scheduledBuyKey = null;
    }
    if (gcalEnabled && gcalPendingSync && nextBuyKey){
      const promptLabel = gcalLastSyncFailed ? 'Couldn\'t update Google Calendar — tap to retry' : 'Tap to update Google Calendar';
      calendarPromptHtml = `<div class="next-buy-line" id="calendar-sync-prompt" style="cursor:pointer; text-decoration:underline;">${promptLabel}</div>`;
    }
  }

  const days = getRange(today, railDaysBack, state.daysAhead);

  // Monthly cost estimate — how many tickets and parking days are likely
  // needed within the selected pay period. Offset 0 is the current period
  // (most recent payday up to, but not including, the next one); the
  // card's own nav arrows let you preview future periods without
  // affecting the automatic dismiss/reset behaviour of the current one.
  const estPeriod = getPayPeriodByOffset(today, estimateOffset);
  const estWindowStart = estPeriod.start;
  const estWindowEnd = estPeriod.end;
  const estMonthKey = fmtKey(getPayPeriodByOffset(today, 0).start); // dismiss/reset key always tracks the CURRENT period, regardless of what's being previewed
  const estPeriodStartKey = fmtKey(estWindowStart);

  let estTicketCount, estParkingDays, estTicketCost, estParkingCost, estTotal;
  if (paydayEstimateSnapshots[estPeriodStartKey]){
    // Already locked in for this period — use exactly what was budgeted
    // on payday, not a fresh recalculation. A ticket purchase logged
    // partway through the period, or a day re-tagged since, would
    // otherwise change a projected figure into a different number — the
    // actual bug this was built to fix, since the whole point of a
    // payday budget is that it doesn't retroactively move once the
    // money's already been mentally (or actually) set aside.
    const snap = paydayEstimateSnapshots[estPeriodStartKey];
    estTicketCount = snap.ticketCount;
    estParkingDays = snap.parkingDays;
    estTicketCost = snap.ticketCost;
    estParkingCost = snap.parkingCost;
    estTotal = snap.total;
  } else {
    const estMonthStates = computeStates(estWindowEnd);
    estTicketCount = 0;
    estParkingDays = 0;
    for (let d = new Date(estWindowStart); d <= estWindowEnd; d = addDays(d, 1)){
      const key = fmtKey(d);
      if (estMonthStates[key] && estMonthStates[key].buyFlag) estTicketCount++;
      const weekend = isWeekend(d);
      const comment = (comments[key] || '').trim();
      const isTravel = comment === '' || travelOverrides[key];
      if (!weekend && isTravel) estParkingDays++;
    }
    estTicketCost = estTicketCount * lastKnownPrice;
    estParkingCost = estParkingDays * parkingCost;
    estTotal = estTicketCost + estParkingCost;

    // Locked the moment this period's own start date has genuinely been
    // reached — not before. A future period still being previewed via
    // the nav arrows hasn't had its own "payday" yet, so it correctly
    // stays a live, evolving projection until it actually arrives.
    if (fmtKey(today) >= estPeriodStartKey){
      paydayEstimateSnapshots[estPeriodStartKey] = {
        ticketCount: estTicketCount, parkingDays: estParkingDays,
        ticketCost: estTicketCost, parkingCost: estParkingCost, total: estTotal
      };
      savePaydayEstimateSnapshots();
    }
  }
  const payWindowLabel = `${dateLabelShort(estWindowStart)} – ${dateLabelShort(estWindowEnd)}`;
  const monthEstimateDismissed = !!dismissedMonths[estMonthKey];
  const showEstimateCard = !monthEstimateDismissed;

  // Always the REAL current period, independent of whatever the
  // estimate card above might be previewing via its own nav arrows —
  // this is about what's actually happened so far, not a projection.
  const realCurrentPeriod = getPayPeriodByOffset(today, 0);
  const parkingSavedThisPeriod = computeExpenseSavingsForPeriod(realCurrentPeriod.start, realCurrentPeriod.end, today, parkedDays, parkingCost);

  // Lock in the immediately preceding period's figure the first time
  // it's seen after ticking over, same reasoning as the payday
  // snapshot — once a period is done, its "saved" total shouldn't keep
  // drifting if a comment or parked-day gets edited afterwards. This
  // only catches the period right before the current one on each
  // render; older, skipped-over periods still get locked in (with the
  // same live-computed value they'd have had at rollover, since past
  // days don't change) the first time they're actually viewed below.
  const prevParkingPeriod = getPayPeriodByOffset(today, -1);
  const prevParkingPeriodStartKey = fmtKey(prevParkingPeriod.start);
  if (parkingSavingsSnapshots[prevParkingPeriodStartKey] === undefined){
    parkingSavingsSnapshots[prevParkingPeriodStartKey] = computeExpenseSavingsForPeriod(prevParkingPeriod.start, prevParkingPeriod.end, today, parkedDays, parkingCost);
    saveParkingSavingsSnapshots();
  }

  // The period actually being displayed on the card, per its own nav
  // arrows — offset 0 is always the real current period (live, never
  // snapshotted, since it's still evolving); anything further back
  // reads from the locked-in snapshot, computing and locking it on the
  // spot if this is the first time it's being viewed.
  const psPeriod = parkingSavingsOffset === 0 ? realCurrentPeriod : getPayPeriodByOffset(today, parkingSavingsOffset);
  const psPeriodStartKey = fmtKey(psPeriod.start);
  let parkingSavingsCardValue;
  if (parkingSavingsOffset === 0){
    parkingSavingsCardValue = parkingSavedThisPeriod;
  } else if (parkingSavingsSnapshots[psPeriodStartKey] !== undefined){
    parkingSavingsCardValue = parkingSavingsSnapshots[psPeriodStartKey];
  } else {
    parkingSavingsCardValue = computeExpenseSavingsForPeriod(psPeriod.start, psPeriod.end, today, parkedDays, parkingCost);
    parkingSavingsSnapshots[psPeriodStartKey] = parkingSavingsCardValue;
    saveParkingSavingsSnapshots();
  }
  const parkingSavingsWindowLabel = `${dateLabelShort(psPeriod.start)} – ${dateLabelShort(psPeriod.end)}`;

  const rows = days.map(d => {
    const key = fmtKey(d);
    let s = states[key];
    const weekend = isWeekend(d);
    const comment = (comments[key] || '').trim();
    const isToday = key === todayKey;
    let isHistorical = false;
    if (!s){
      // Not this ticket's own range — but a real, earlier ticket may
      // still have genuinely covered this day. Recovered here rather
      // than shown as a bare placeholder, so the day keeps its actual
      // detail (badge, confirmed trains, delay claim status) exactly as
      // it looked before a new ticket got bought, not just "Before this
      // ticket" with nothing else.
      s = findHistoricalStateForDate(key);
      isHistorical = !!s;
    }
    if (!s){
      return `
        <div class="day-row" data-key="${key}">
          <div class="count-badge">–</div>
          <div class="info">
            <div class="dname">${dayNameShort(d)} ${dateLabelShort(d)}</div>
            <div class="comment-tag" style="color:var(--ink-dim)">Before this ticket</div>
          </div>
          <div class="arrow">›</div>
        </div>`;
    }
    const isPastPhantom = !weekend && !beforePeriod && key <= todayKey && key > fmtKey(realPeriodEnd.endDate);
    const singleForDay = isPastPhantom ? getSingleTicketForDate(key) : null;

    let badgeClass, badgeText;
    if (isPastPhantom){
      badgeClass = singleForDay ? 'eight' : 'weekend';
      badgeText = singleForDay ? 'S' : '–';
    } else {
      badgeClass = s.buyFlag ? 'eight' : ((weekend || s.inGap) ? 'weekend' : '');
      badgeText = (weekend || s.inGap) ? '–' : s.usedCount;
    }

    let tag = '';
    const overridden = comment !== '' && !!travelOverrides[key];
    if (isPastPhantom){
      if (comment && singleForDay) tag = `${escapeHtml(comment)} &middot; Single ticket (£${singleForDay.cost.toFixed(2)})`;
      else if (singleForDay) tag = `Single ticket (£${singleForDay.cost.toFixed(2)})`;
      else if (comment) tag = escapeHtml(comment) + (overridden ? ' &middot; counted' : '');
      else tag = 'No active ticket';
    }
    else if (comment && s.buyFlag) tag = `${escapeHtml(comment)}${overridden ? ' &middot; counted' : ''} · Buy ticket${s.lostDays ? ` · ${s.unusedRemaining} lost` : ''}`;
    else if (comment) tag = escapeHtml(comment) + (overridden ? ' &middot; counted' : '');
    else if (s.buyFlag) tag = s.lostDays ? `Buy ticket · ${s.unusedRemaining} lost` : 'Buy ticket';
    else if (weekend) tag = 'Weekend';

    let railBlobHtml = '';
    if (isEligibleRailDay(d, todayKey)){
      const status = getDelayStatus(key);
      if (status === 'confirmed'){
        railBlobHtml = `<span class="rail-blob rail-blob-confirmed" data-rail-key="${key}" title="Confirmed delay repay claim"></span>`;
      } else if (status === 'maybe'){
        railBlobHtml = `<span class="rail-blob" data-rail-key="${key}" title="Possible delay repay claim"></span>`;
      }
    }

    return `
      <div class="day-row ${isToday?'is-today':''} ${weekend?'no-click':''}" data-key="${key}" data-weekend="${weekend ? '1' : '0'}">
        <div class="count-badge ${badgeClass}">${badgeText}</div>
        <div class="info">
          <div class="dname">${dayNameShort(d)} ${dateLabelShort(d)} ${isToday?'<span class="sub">Today</span>':''}${railBlobHtml}</div>
          ${tag ? `<div class="comment-tag">${tag}</div>` : ''}
        </div>
        ${weekend ? '' : '<div class="arrow">›</div>'}
      </div>
    `;
  }).join('');

  app.className = '';
  app.innerHTML = `
    <header class="top">
      ${delayRepayBadgeHtml}
      ${isBuntingDay ? `
      <div class="bunting-row" title="Official bunting day, per gov.uk">
        <span class="bunting-flag" style="background:var(--amber);"></span>
        <span class="bunting-flag" style="background:#7fc9e8;"></span>
        <span class="bunting-flag" style="background:var(--good);"></span>
        <span class="bunting-flag" style="background:var(--amber);"></span>
        <span class="bunting-flag" style="background:#7fc9e8;"></span>
        <span class="bunting-flag" style="background:var(--good);"></span>
        <span class="bunting-flag" style="background:var(--amber);"></span>
      </div>` : ''}
      <div class="eyebrow">Season Ticket Tracker</div>
      <h1>8-Day Ticket</h1>
      <div class="today-date">${dateLabel(today)}</div>
      <div style="font-size:10px; color:var(--ink-dim); opacity:0.6; margin-top:2px;">${APP_VERSION}</div>
      ${menuOpen ? `

        <div class="holiday-label" style="margin-top:2px;">${estTicketCount} ticket${estTicketCount===1?'':'s'} (£${estTicketCost.toFixed(2)}) + ${estParkingDays} parking day${estParkingDays===1?'':'s'} (£${estParkingCost.toFixed(2)})</div>
      </div>
