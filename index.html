const HELP_GUIDE_MD = `
Welcome to your **8-Day Ticket Tracker**. This app tracks your Flexi Season Ticket usage, keeps an eye on live train journeys, checks historical performance for Delay Repay claims, syncs reminders to Google Calendar, and backs up your data automatically to Google Drive.

---

## 1. How Your Ticket Is Tracked

Your Flexi Season Ticket gives you **8 day-passes** to use within a **28-calendar-day window**.

* **Automatic Pass Allowance:** Every weekday (Monday to Thursday) automatically uses 1 pass from your 8-pass allowance unless you tag the day as a non-travel day.
* **Weekends:** Weekends are automatically skipped and never consume a pass.
* **The 28-Day Window:** Your 28-day validity period starts on the date you set when logging a new season ticket. The progress bar on the Home tab shows how many days have elapsed out of 28.
* **Ticket Expiry:** A ticket period finishes as soon as you either **use all 8 passes** OR **reach the 28th calendar day**, whichever happens first. Any unused passes remaining after 28 days expire and cannot be carried over.
* **Gap Days & Smart Renewal Prompts:** Once a ticket period ends, the app calculates when you next need to commute. It flags the evening before your next actual travel day as your "Buy Ticket" day — skipping non-working days or weekends in between so you never buy a ticket earlier than necessary.

---

## 2. Managing Your Daily Schedule

### Tagging Non-Travel Days
If you aren't commuting on a scheduled work day:
1. Tap any weekday on the Home tab or in the upcoming day list.
2. Choose a preset chip tag (**WFH**, **HOLIDAY**, **DENTIST**, **SICK**) or type a custom reason.
3. Tap **Save**. The pass allowance for that day is immediately restored, and your predicted renewal date adjusts automatically.

### Working Day Overrides
If you previously tagged a day as WFH or Holiday but ended up commuting anyway, tick the **"I still used the ticket today"** box on that day's editor. The app keeps your note on record while correctly deducting a pass.

### UK Bank Holidays
The app checks the official gov.uk bank holiday feed. Any public holiday falling on a weekday is automatically tagged as **BANK HOLIDAY** so you don't accidentally waste a pass on a public holiday.

---

## 3. Live Trains & Station Boards

The app connects directly to National Rail Darwin live feeds via a private proxy Worker.

### Live Trains Tab ("My Trains" & "Tracked")
Tap the **Live** tab on the bottom navigation bar to switch between two views:

1. **My Trains:** Displays real-time departure boards for your saved usual morning (Crewe to Wigan) and evening (Wigan to Crewe) commute times.
   * Shows departure times, platforms, delay minutes, and cancellation notices.
   * Tap any train row to open its full live journey timeline.

2. **Tracked Trains:** Shows up to 5 specific train services you are currently following.
   * Tap **+ Track a train** to search live departures or arrivals from any UK station by name or 3-letter station code (e.g. \`CRE\`, \`WGN\`, \`EUS\`).
   * Tap a train from the search results to start watching it. It remains in your Tracked list for up to 6 hours, allowing you to follow its progress long after it leaves your station.

### Real-Time Journey Progress
When you tap into any live train, the app opens a detailed timeline:
* **Live Progress Line & Blob:** An animated indicator moves down the station list based on real-time station departure reports.
* **Station Weather:** Real-time weather icons (sun, moon, clouds, rain, snow) and temperatures are fetched from Open-Meteo for upcoming stops. Clear sky icons switch to a moon at night using astronomical sunrise/sunset calculations.
* **Delay Explanations:** Real-time delay or cancellation reasons from National Rail are shown inline. The app filters out stale, repeated reasons from earlier stops, but you can tap *Show all reasons* to reveal everything.
* **Smart Adaptive Polling:** To save battery and data, the progress screen automatically slows its check-ins when departure is still far off, and speeds up polling when approaching the final destination. You can adjust these timing thresholds under **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Live progress polling**.

### Retro Station Board
For a full-screen, station-style departure and arrival display:
1. Tap **More** $\\rightarrow$ **Station board**.
2. Choose any UK station by name or 3-letter code.
3. The app renders a split-flap style board showing real-time departures and arrivals that automatically cycles through pages and updates every 30 seconds.

### Automatic Location Detection ("Is this your train?")
When you are within 500 metres of Crewe or Wigan station around your commute time, the app checks live departure boards:
* **Delayed / Unexpected Train (Mismatch Prompt):** If an earlier or delayed train is leaving right when you arrive, a banner asks: **"Is this your train?"** Tapping **"Yes, that's me"** updates your confirmed train record.
* **Automatic Silent Confirmation (Within 5 Minutes):** If you are at the station and your usual scheduled train is due to depart or arrive **within 5 minutes**, the app quietly confirms that train for you automatically — no manual tap required. A brief green banner appears at the top of the screen to let you know it has logged the journey. *(Note: If you arrive at the station more than 5 minutes before departure, the app holds off on auto-confirming until that 5-minute window opens, ensuring an early arrival doesn't lock in the wrong train prematurely).*

---

## 4. Delay Repay & Claims

The app automatically cross-references your past travel days against historical performance records via the Historical Service Performance (HSP) proxy Worker.

### Delay Indicators
* **Orange Dot:** Indicates that at least one of your configured usual trains suffered a delay of **15 minutes or more** on that date.
* **Red Dot:** Confirms a 15+ minute delay on a train you explicitly confirmed catching.

### Smartcard Pass (Photo and Number, for Delay Claims)
Avanti West Coast requires a photo of your ticket, and asks for your smartcard number, when submitting a Delay Repay claim.
1. Go to **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Smartcard pass**.
2. Upload a photo of your Flexi Season Ticket once. It is stored privately in your browser's IndexedDB storage.
3. Enter your smartcard number once — it's printed on the card itself.

### Submitting & Managing Claims
1. Tap a day with a delay indicator, or open **More** $\\rightarrow$ **Delay repay claims**.
2. Tap the highlighted red delay row. The app calculates your estimated payout based on standard Flexi 8 delay bands. (Note: Because a Flexi 8 ticket covers 16 individual single journeys, calculations are based on one-way leg values — so 15–29 mins pays 25%, 30–59 mins pays 50%, and 60+ mins pays 100% of a single leg's value).
3. Several things happen at once: Avanti's Delay Repay website opens in a new tab, your saved pass photo downloads to your device's Downloads folder, a **claim-details.txt** file also downloads there (train, delay, ticket price, and payout for whichever of your AM/PM journeys applied that day, plus your smartcard number) — and your smartcard number is copied straight to your clipboard, ready to paste into Avanti's form the moment its page loads.
4. A **Claim details** screen also appears in the app itself, showing the same information at a glance right away.
5. After submitting your claim on Avanti's site, check the **Confirmed** box in the app's Delay Repay manager to mark the claim as paid.

---

## 5. Logging Purchases & Ticket Advisor

### Logging Tickets
Open the **Buy** tab at the bottom of the screen:
* **Season Ticket:** Sets a new 8-use/28-day tracking cycle starting from your chosen date and records the cost.
* **Single Ticket:** Logs an individual day-return purchase without resetting or disturbing your main 8-pass cycle.

### Ticket Purchase Advisor
Before you buy a new season ticket, the advisor checks your upcoming calendar (accounting for WFH, holidays, and bank holidays). If you have fewer than 8 travel days planned in the next 28 days, it calculates whether buying individual day-return tickets would be cheaper than a full season ticket and gives you a clear recommendation.

---

## 6. Calendar Sync & Google Drive Backups

### Google Calendar Reminders
1. Tap **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Connect Google Calendar**.
2. The app syncs a single calendar event titled **"Buy train ticket"** set for 8:00 PM on the exact evening you need to buy your next pass.
3. If your predicted travel schedule shifts, the app automatically updates the event date.

### Automatic Google Drive Backups
1. Tap **More** $\\rightarrow$ **Backup & Restore**.
2. Enable **Automatically back up to Google Drive**.
3. Whenever you switch away from or close the app, it quietly checks if any data has changed. If changes were made and at least 30 minutes have passed since the last backup, it uploads a JSON file to a \`Ticket Tracker Backups\` folder in your Google Drive. It automatically keeps the 2 most recent backups and cleans up older ones.
4. You can also manually export or restore a backup \`.json\` file at any time.

---

## 7. Budgeting & Payday Planning

Under **Set aside on payday** on the Home tab:
* The app calculates your monthly pay period (taking the 28th of the month and adjusting backward for weekends or bank holidays).
* It counts how many season tickets and parking days fall within that pay window, multiplying them by your daily parking cost and ticket price.
* Use the **$\\langle$** and **$\\rangle$** arrows to preview future pay periods.
* You can update daily parking costs or day-return prices anytime under **More** $\\rightarrow$ **Settings** $\\rightarrow$ **Costs**.

// Minimal, purpose-built Markdown renderer — covers exactly the subset
// HELP_GUIDE_MD actually uses (##/### headers, bold, bullet/numbered
// lists, tables, links, hr, inline code), not Markdown generally. Text
// content is escaped before any HTML is added, so the source can be
// trusted content (this app's own help text) without needing to treat
// it as arbitrary untrusted input.
function renderHelpMarkdown(md){
  const cleaned = md
    .replace(/\$\\rightarrow\$/g, '→')
    .replace(/\$\\langle\$/g, '‹')
    .replace(/\$\\rangle\$/g, '›');
  const lines = cleaned.split('\n');
  let html = '';
  let inList = null; // 'ul' | 'ol' | null
  function closeList(){ if (inList){ html += `</${inList}>`; inList = null; } }
  function inlineMd(text){
    let t = escapeHtml(text);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  let i = 0;
  while (i < lines.length){
    const trimmed = lines[i].trim();

    if (trimmed.startsWith('|') && lines[i+1] && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(lines[i+1].trim())){
      closeList();
      const splitRow = (row) => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const headerCells = splitRow(trimmed);
      html += '<table class="help-table"><thead><tr>' + headerCells.map(c => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith('|')){
        const rowCells = splitRow(lines[i]);
        html += '<tr>' + rowCells.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>';
        i++;
      }
      html += '</tbody></table>';
      continue;
    }

    if (trimmed === '---'){ closeList(); html += '<hr>'; i++; continue; }
    if (trimmed === ''){ closeList(); i++; continue; }

    let m;
    if ((m = trimmed.match(/^####\s+(.*)$/))){ closeList(); html += `<h4>${inlineMd(m[1])}</h4>`; i++; continue; }
    if ((m = trimmed.match(/^###\s+(.*)$/))){ closeList(); html += `<h4>${inlineMd(m[1])}</h4>`; i++; continue; }
    if ((m = trimmed.match(/^##\s+(.*)$/))){ closeList(); html += `<h3>${inlineMd(m[1])}</h3>`; i++; continue; }
    if ((m = trimmed.match(/^#\s+(.*)$/))){ closeList(); html += `<h2>${inlineMd(m[1])}</h2>`; i++; continue; }

    if ((m = trimmed.match(/^[*-]\s+(.*)$/))){
      if (inList !== 'ul'){ closeList(); html += '<ul>'; inList = 'ul'; }
      html += `<li>${inlineMd(m[1])}</li>`;
      i++; continue;
    }
    if ((m = trimmed.match(/^\d+\.\s+(.*)$/))){
      if (inList !== 'ol'){ closeList(); html += '<ol>'; inList = 'ol'; }
      html += `<li>${inlineMd(m[1])}</li>`;
      i++; continue;
    }

    closeList();
    html += `<p>${inlineMd(trimmed)}</p>`;
    i++;
  }
  closeList();
  return html;
}

**Watch item, not a confirmed bug:** the season ticket card displaying alongside "No active season ticket" — still only reproduced in an empty-data preview, never seen on the real phone.

// Builds one row's worth of display data from a raw Darwin board entry,
// for the retro departure-board view. Shared between the departures and
// arrivals panels — isArrivals picks which time/place fields matter.
function depBoardRowData(s, isArrivals){
  const time = isArrivals ? (s.sta || '?') : (s.std || '?');
  // On a departures row, "via" (present on destination[0] whenever a
  // service's route needs disambiguating — confirmed against real
  // responses, e.g. "Cardiff Central via Shrewsbury") is exactly what a
  // real board shows alongside the destination. There's no equivalent
  // field for an arrival's origin side, so this only ever applies going
  // one way.
  let place;
  if (isArrivals){
    place = (s.origin && s.origin[0] && s.origin[0].locationName) || '?';
  } else {
    const dest = s.destination && s.destination[0];
    place = dest ? `${dest.locationName || '?'}${dest.via ? ` ${dest.via}` : ''}` : '?';
  }
  const platform = s.platform || '';
  let expected;
  if (s.isCancelled){
    expected = 'Cancelled';
  } else {
    const liveField = isArrivals ? s.eta : s.etd;
    expected = (!liveField || liveField === 'On time') ? 'On time' : liveField;
  }
  // The closest real equivalent to a classic board's occasional note row
  // (e.g. "Calls at Didcot Parkway") — Darwin doesn't give a curated list
  // of "principal" calling points to reproduce that specific convention
  // faithfully, but a genuine delay/cancellation reason is real data and
  // serves the same "extra line under this service" purpose.
  const note = s.isCancelled ? (s.cancelReason || '') : (s.delayReason || '');
  return { time, place, platform, expected, note, isCancelled: !!s.isCancelled };
}

function openDepartureBoardView(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-overlay-full';
  overlay.style.alignItems = 'stretch';
  overlay.innerHTML = `
    <div class="modal" style="display:flex; flex-direction:column; padding:0 0 calc(72px + env(safe-area-inset-bottom)) 0; border-radius:0; overflow:hidden;">
      <!-- Height comes from .modal-overlay-full .modal's own 100dvh rule
           now, not a bespoke calc here — that's the same rule Train
           Progress already relies on with no reported bleed-through, so
           matching it directly rather than maintaining a second,
           separately-tuned height formula that turned out to leave a
           gap at the bottom where the backdrop (and the page underneath
           it) showed through. Bottom padding explicitly matches that
           same class's own nav-bar-safe reservation — zeroing all
           padding here (as the previous version did) would have quietly
           thrown that away too, trapping Close underneath the nav bar
           instead of leaving a visible gap, a related but different
           problem this needs to avoid re-introducing. -->
      <div id="depboard-picker-step" style="flex:1; display:flex; flex-direction:column; padding:20px 18px; overflow-y:auto;">
        <h3>Station board</h3>
        <div class="sub">A retro-style live departures and arrivals board for any station — refreshes every 30 seconds for 3 minutes, then waits for you to ask for more.</div>
        <div id="depboard-picker-row" style="margin:14px 0;"></div>
        <button class="save-btn" id="depboard-show-btn">Show board</button>
        <div class="modal-close" id="depboard-picker-close-btn" style="margin-top:16px;">Close</div>
      </div>
      <div id="depboard-display-step" style="display:none; flex-direction:column; flex:1; min-height:0;">
        <div id="depboard-dep-panel" class="depboard-panel" style="flex:1;"></div>
        <div id="depboard-arr-panel" class="depboard-panel" style="flex:1; border-top:2px solid #333;"></div>
        <div id="depboard-refresh-wrap" style="text-align:center; padding:10px 14px 0; background:var(--board-2);"></div>
        <div class="modal-close" id="depboard-close-btn" style="margin-top:8px; margin-bottom:8px; background:var(--board-2);">Close</div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const picker = createStationPicker({ placeholder: 'Station name or code' });
  document.getElementById('depboard-picker-row').appendChild(picker.el);
  // Warms the shared station-name cache — without this, typing a name
  // (rather than a bare code) has nothing to match against yet, since
  // this is a fresh screen that's never triggered the load the way the
  // Tracked tab's own search does.
  loadStationIndex(false);
  document.getElementById('depboard-picker-close-btn').addEventListener('click', () => {
    teardown();
    if (overlay.isConnected) document.body.removeChild(overlay);
  });

  const ROWS_PER_PAGE = 5;
  const SESSION_LENGTH_MS = 3 * 60 * 1000;
  const REFRESH_INTERVAL_MS = 30 * 1000;
  const PAGE_CYCLE_MS = 6 * 1000;

  let active = true;
  let depRows = [], arrRows = [];
  let depPage = 0, arrPage = 0;
  let dataTimer = null;
  let sessionTimeout = null;
  let pageCycleTimer = null;
  let clockTimer = null;
  let stationCrs = null, stationName = '';
  let depFetchError = null, arrFetchError = null;

  function stopPolling(){
    if (dataTimer){ clearInterval(dataTimer); dataTimer = null; }
    if (sessionTimeout){ clearTimeout(sessionTimeout); sessionTimeout = null; }
    if (pageCycleTimer){ clearInterval(pageCycleTimer); pageCycleTimer = null; }
    if (clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  }
  function teardown(){
    active = false;
    stopPolling();
    document.removeEventListener('visibilitychange', onVisibilityChange);
  }
  // Leaving the screen — closing it outright, or just switching away
  // from the tab/app — stops polling immediately, same discipline as
  // the train-progress screen. A board left open in the background has
  // no reason to keep refreshing twice a minute.
  function onVisibilityChange(){
    if (document.visibilityState === 'hidden') stopPolling();
    else if (active && overlay.isConnected && !dataTimer && !sessionTimeout) startSession();
  }
  document.addEventListener('visibilitychange', onVisibilityChange);
  document.getElementById('depboard-close-btn').addEventListener('click', () => {
    teardown();
    if (overlay.isConnected) document.body.removeChild(overlay);
  });

  function renderPanel(panelId, title, rows, page, isArrivals, fetchError){
    const panel = document.getElementById(panelId);
    if (!panel) return;
    const totalPages = Math.max(1, Math.ceil(rows.length / ROWS_PER_PAGE));
    const safePage = page % totalPages;
    const pageRows = rows.slice(safePage * ROWS_PER_PAGE, safePage * ROWS_PER_PAGE + ROWS_PER_PAGE);
    const clock = new Date().toLocaleTimeString('en-GB', { hour12: false });
    // A failed fetch is shown outright rather than quietly presented as
    // an empty board — this is the actual content of the screen, not a
    // decorative extra, so silently hiding *why* it's empty just hides
    // a real problem behind what looks like a legitimately quiet board.
    const rowsHtml = fetchError
      ? `<div style="padding:10px 0; color:#ff6a5a; font-size:12px;">Couldn't load: ${escapeHtml(fetchError)}</div>`
      : (pageRows.length ? pageRows.map(s => {
      const d = depBoardRowData(s, isArrivals);
      const noteHtml = d.note ? `<div class="depboard-note-row">${escapeHtml(d.note)}</div>` : '';
      return `<div class="depboard-row${d.isCancelled ? ' cancelled' : ''}">
        <span>${escapeHtml(d.time)}</span>
        <span>${escapeHtml(d.place)}</span>
        <span>${escapeHtml(d.platform)}</span>
        <span>${escapeHtml(d.expected)}</span>
      </div>${noteHtml}`;
    }).join('') : `<div style="padding:10px 0; opacity:0.7;">No services currently shown</div>`);
    panel.innerHTML = `
      <div class="depboard-title">${escapeHtml(stationName)} — ${title}</div>
      <div class="depboard-header-row">
        <span>Time</span><span>${isArrivals ? 'From' : 'Destination'}</span><span>Plat</span><span>Expected</span>
      </div>
      <div class="depboard-rows-wrap">${rowsHtml}</div>
      <div class="depboard-footer">
        <span>Page ${safePage + 1} of ${totalPages}</span>
        <span>${clock}</span>
      </div>
    `;
  }
  function renderBoth(){
    if (!active) return;
    renderPanel('depboard-dep-panel', 'Departures', depRows, depPage, false, depFetchError);
    renderPanel('depboard-arr-panel', 'Arrivals', arrRows, arrPage, true, arrFetchError);
  }

  async function fetchData(){
    if (!stationCrs) return;
    // Fetched independently (not a single combined try/catch) so one
    // board failing doesn't hide data the other genuinely got back —
    // and each panel gets its own specific error rather than one vague
    // failure blamed on both.
    const [depResult, arrResult] = await Promise.allSettled([
      fetchPureBoard(stationCrs, 'dep', 30),
      fetchPureBoard(stationCrs, 'arr', 30)
    ]);
    if (!active) return;
    if (depResult.status === 'fulfilled'){ depRows = depResult.value; depFetchError = null; }
    else { depFetchError = depResult.reason.message; }
    if (arrResult.status === 'fulfilled'){ arrRows = arrResult.value; arrFetchError = null; }
    else { arrFetchError = arrResult.reason.message; }
    // Only reset a page if the new row count actually makes the current
    // one invalid — not unconditionally on every 30-second poll. The
    // old version zeroed both every single fetch, fighting the separate
    // page-cycle timer so hard that a page only ever reached its true
    // maximum after the whole session had already ended.
    const depTotalPages = Math.max(1, Math.ceil(depRows.length / ROWS_PER_PAGE));
    const arrTotalPages = Math.max(1, Math.ceil(arrRows.length / ROWS_PER_PAGE));
    if (depPage >= depTotalPages) depPage = 0;
    if (arrPage >= arrTotalPages) arrPage = 0;
    renderBoth();
  }

  function showRefreshButton(){
    const wrap = document.getElementById('depboard-refresh-wrap');
    if (!wrap) return;
    // Same icon-based style already established for the Tracked list's
    // own refresh action, rather than the plain "↻ Refresh" text this
    // used before — one consistent look for "refresh this" across the
    // app instead of two different ones.
    wrap.innerHTML = `<span id="depboard-refresh-btn" style="display:inline-flex; align-items:center; gap:6px; color:var(--good); font-size:14px; font-weight:700; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">${REFRESH_ICON} Refresh</span>`;
    const btn = document.getElementById('depboard-refresh-btn');
    if (btn) btn.addEventListener('click', () => { if (active) startSession(); });
  }

  function startSession(){
    const wrap = document.getElementById('depboard-refresh-wrap');
    if (wrap) wrap.innerHTML = ''; // dropped while a session is live — reappears once it ends
    if (dataTimer){ clearInterval(dataTimer); dataTimer = null; }
    if (sessionTimeout){ clearTimeout(sessionTimeout); sessionTimeout = null; }
    fetchData();
    dataTimer = setInterval(fetchData, REFRESH_INTERVAL_MS);
    sessionTimeout = setTimeout(() => {
      if (dataTimer){ clearInterval(dataTimer); dataTimer = null; }
      sessionTimeout = null;
      showRefreshButton();
    }, SESSION_LENGTH_MS);
  }

  document.getElementById('depboard-show-btn').addEventListener('click', () => {
    stationCrs = picker.getCode();
    stationName = picker.getName() || stationCrs;
    if (!stationCrs) return;
    document.getElementById('depboard-picker-step').style.display = 'none';
    const displayStep = document.getElementById('depboard-display-step');
    displayStep.style.display = 'flex';
    // Ticks the visible clock every second, and separately advances
    // which page each panel is showing every few seconds if there's
    // more than one — independent of the 30-second data refresh, same
    // as a real board's clock keeps moving between actual data changes.
    clockTimer = setInterval(renderBoth, 1000);
    pageCycleTimer = setInterval(() => {
      const depTotalPages = Math.max(1, Math.ceil(depRows.length / ROWS_PER_PAGE));
      const arrTotalPages = Math.max(1, Math.ceil(arrRows.length / ROWS_PER_PAGE));
      depPage = (depPage + 1) % depTotalPages;
      arrPage = (arrPage + 1) % arrTotalPages;
    }, PAGE_CYCLE_MS);
    startSession();
  });
}

const BACKUP_KEYS = [
  'bank-holidays-cache','confirmed-trains','debug-mode-enabled','delay-claims',
  'drive-backup-enabled','drive-backup-folder-id','gcal-enabled','gcal-event-id',
  'gcal-pending-sync','preferred-google-email','rail-perf-cache','rail-trains',
  'ticket-comments','ticket-day-return-price','ticket-dismissed-months',
  'ticket-last-notified-buy-key','ticket-last-price','ticket-parking-cost',
  'ticket-period-start','ticket-purchases','ticket-seed-imported','ticket-travel-overrides',
  'tracked-trains'
];

function exportBackup(){
  const backup = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  BACKUP_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) backup.data[k] = v;
  });
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ticket-tracker-backup-${fmtKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      <button class="save-btn" id="drive-backup-now-btn" ${driveBackupEnabled ? '' : 'disabled'}>Back up now</button>

      const token = await getGoogleAccessToken();
      if (!token){
        driveStatus.textContent = 'Could not connect to Google Drive.';
        driveToggle.checked = false;
        return;
      }
      driveBackupEnabled = true;
      await saveDriveBackupEnabled();
      driveNowBtn.disabled = false;
      driveStatus.textContent = 'Connected — running first backup…';
      const result = await attemptDriveBackup(true);
      driveStatus.textContent = result.ok
        ? `Last backup: ${new Date(lastDriveBackupTime).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`
        : `First backup failed: ${result.reason}`;
    } else {
      driveBackupEnabled = false;
      await saveDriveBackupEnabled();
      driveNowBtn.disabled = true;
      driveStatus.textContent = 'Automatic backup turned off.';
    }
  });

  driveNowBtn.addEventListener('click', async () => {
    driveStatus.textContent = 'Backing up…';
    const result = await attemptDriveBackup(true);
    driveStatus.textContent = result.ok
      ? `Last backup: ${new Date(lastDriveBackupTime).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`
      : `Backup failed: ${result.reason}`;
  });

  document.getElementById('backup-import-btn').addEventListener('click', () => {
    const fileInput = document.getElementById('backup-import-input');
    const status = document.getElementById('backup-status');
    const file = fileInput.files[0];
    if (!file){ status.textContent = 'Choose a file first.'; return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ status.textContent = 'Could not read that file — is it a valid backup?'; return; }
      if (!parsed || typeof parsed.data !== 'object'){
        status.textContent = 'That doesn\'t look like a valid backup file.';
        return;
      }
      if (!confirm('This will replace all current app data with the contents of this backup. Continue?')){
        return;
      }
      // A restore is a replacement, not a merge. Clear known app data first
      // so keys that existed only in the current device cannot survive the restore.
      BACKUP_KEYS.forEach(key => {
        try{ localStorage.removeItem(key); }catch(err){ /* ignore individual key failures */ }
      });
      for (const key of BACKUP_KEYS){
        if (!Object.prototype.hasOwnProperty.call(parsed.data, key)) continue;
        try{ localStorage.setItem(key, parsed.data[key]); }catch(err){ /* ignore individual key failures */ }
      }
      status.textContent = 'Restored — reloading…';
      await loadData();
      document.body.removeChild(overlay);
      render();
    };
    reader.readAsText(file);
  });

  document.getElementById('backup-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

async function fetchLiveBoards(){
  // Query each unique route (fromLoc/toLoc pair) once, rather than once
  // per configured train — several trains often share the same route.
  const uniquePairs = [];
  const seen = new Set();
  railTrains.forEach(t => {
    const key = `${t.fromLoc}-${t.toLoc}`;
    if (!seen.has(key)){ seen.add(key); uniquePairs.push({ fromLoc: t.fromLoc, toLoc: t.toLoc }); }
  });
  if (uniquePairs.length === 0) return {};

  const resp = await fetch(DARWIN_WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      queries: uniquePairs.map(p => ({ crs: p.fromLoc, filterCrs: p.toLoc, filterType: 'to' }))
    })
  });
  if (!resp.ok) throw new Error(`Darwin request failed: ${resp.status}`);
  const data = await resp.json();

  const boards = {}; // "FROM-TO" -> array of trainServices
  (data.results || []).forEach(r => {
    const key = `${r.query.crs}-${r.query.filterCrs}`;
    boards[key] = (r.ok && r.data && r.data.trainServices) || [];
  });
  return boards;
}

// Same idea as fetchLiveBoards, but for an arbitrary station pair rather
// than the ones in railTrains — used only by the debug "track any train"
// tool, so testing tracking/refresh behaviour isn't limited to whichever
// of the user's own routes happen to have a live service running.
// Pure departures-only or arrivals-only board (boardType 'dep'/'arr'),
// for the retro departure-board feature — unlike fetchDebugBoard, which
// always uses the combined arr+dep method used everywhere else in the
// app, this asks Darwin for a genuine single-purpose board matching
// what a real physical board at that station would actually show.
async function fetchPureBoard(crs, boardType, numRows){
  const resp = await fetch(DARWIN_WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ queries: [{ crs, boardType, numRows: numRows || 30 }] })
  });
  if (!resp.ok) throw new Error(`Darwin request failed: ${resp.status}`);
  const data = await resp.json();
  const r = (data.results || [])[0];
  if (!r || !r.ok){
    // The worker deliberately no longer echoes Darwin's raw upstream
    // error body back to the browser (a security hardening pass) — full
    // detail is logged server-side in the Worker's own logs instead, so
    // this can only ever show the status code and a short controlled
    // reason now. Genuinely useful for spotting *that* something failed
    // and roughly what kind of failure; checking Cloudflare's Worker
    // logs is the way to see exactly *why* if this ever needs debugging
    // again the way the original routing-error diagnosis did.
    const detail = r
      ? `${r.reason || 'request failed'}${r.status ? ` (status ${r.status})` : ''}`
      : 'no response from worker';
    throw new Error(detail);
  }
  return (r.data && r.data.trainServices) || [];
}


async function fetchDebugBoard(fromCrs, toCrs){
  const query = toCrs ? { crs: fromCrs, filterCrs: toCrs, filterType: 'to' } : { crs: fromCrs };
  const resp = await fetch(DARWIN_WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ queries: [query] })
  });
  if (!resp.ok) throw new Error(`Darwin request failed: ${resp.status}`);
  const data = await resp.json();
  const r = (data.results || [])[0];
  if (!r || !r.ok) throw new Error((r && r.reason) || 'No board data returned');
  return (r.data && r.data.trainServices) || [];
}

// Tracks one specific train by its serviceID, independent of any
// station's rolling board window — works for as long as Darwin still
// has the service, regardless of how far past its departure station
// the train has travelled.
async function fetchServiceDetails(serviceId){
  let resp;
  try{
    resp = await fetch(DARWIN_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ queries: [{ type: 'serviceDetails', serviceId }] })
    });
  }catch(networkErr){
    // The fetch itself failed — no connectivity, DNS, Worker unreachable.
    // This says nothing about whether the service itself still exists,
    // so it's always transient.
    const err = new Error(`Network error contacting Darwin: ${networkErr.message}`);
    err.transient = true;
    throw err;
  }
  if (!resp.ok){
    // An HTTP-level failure from the Worker (rate limit, gateway error,
    // etc.) — a server-side hiccup, not evidence the service is gone.
    const err = new Error(`Darwin request failed: ${resp.status}`);
    err.transient = true;
    throw err;
  }
  const data = await resp.json();
  const r = (data.results || [])[0];
  if (!r || !r.ok || !r.data){
    // A specific reason from the Worker means Darwin was actually
    // reached and gave a definitive answer about this service — the one
    // case we can be reasonably confident means it's genuinely gone.
    // Anything else (empty/malformed response) is treated as transient,
    // since we can't actually tell what happened.
    const err = new Error((r && (r.reason || `status ${r.status}`)) || 'No service data returned — this train may no longer be tracked by Darwin');
    err.transient = !(r && r.reason);
    throw err;
  }
  return r.data;
}

// Gets a one-off position without prompting unnecessarily — only called
// when we're already inside a relevant time window, so the permission
// prompt (if it appears at all) shows up with context, not on every
// random app open.
function getCurrentPositionOnce(){
  return new Promise((resolve) => {
    if (!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos.coords),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

// Converts a train's live status (etd/eta, or "On time") for today into
// an actual Date object, so it can be compared against the current time.
function liveTimeToDate(hhmm, referenceDate){
  if (!hhmm || hhmm.length < 4) return null;
  const h = parseInt(hhmm.slice(0,2), 10), m = parseInt(hhmm.slice(2,4), 10);
  if (isNaN(h) || isNaN(m)) return null;
  const d = new Date(referenceDate);
  d.setHours(h, m, 0, 0);
  return d;
}

// A bare "HH:MM" could plausibly belong to yesterday, today, or tomorrow
// relative to referenceDate — this picks whichever is actually closest.
// Extracted from the midnight-crossing fix in buildTrainProgress (still
// used there for the first calling point) so the same reasoning can be
// reused anywhere else a scheduled time needs to be compared against
// "now" — e.g. the polling cadence, which had its own, simpler
// same-day-only version of this that broke for a service due just after
// midnight.
function closestDateForTime(hhmm, referenceDate){
  const base = liveTimeToDate(hhmm, referenceDate);
  if (!base) return null;
  let best = base, bestDiff = Math.abs(best.getTime() - referenceDate.getTime());
  const h = parseInt(hhmm.slice(0,2), 10), m = parseInt(hhmm.slice(2,4), 10);
  for (const dayOffset of [-1, 1]){
    const candidate = new Date(referenceDate);
    candidate.setDate(candidate.getDate() + dayOffset);
    candidate.setHours(h, m, 0, 0);
    const diff = Math.abs(candidate.getTime() - referenceDate.getTime());
    if (diff < bestDiff){ bestDiff = diff; best = candidate; }
  }
  return best;
}

// The core check: are you plausibly at the station right now, and is an
// earlier (delayed) configured train about to leave in place of your
// nominally-expected one? Deliberately conservative — only fires when
// there's a genuine, geofenced, time-window-matched mismatch, not on
// every open.
async function checkLikelyTrain(){
  if (!railTrains || railTrains.length === 0) return;
  const now = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate(),
                        new Date().getHours(), new Date().getMinutes());
  const todayKeyLocal = fmtKey(now);
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  for (const direction of ['AM', 'PM']){
    const dirTrains = railTrains.filter(t => t.direction === direction).sort((a,b) => a.time.localeCompare(b.time));
    if (dirTrains.length === 0) continue;

    // Skip entirely if we're nowhere near any configured time for this
    // direction — avoids pointless API calls and geolocation prompts
    // outside commute hours.
    const inWindow = dirTrains.some(t => {
      const tMin = parseInt(t.time.slice(0,2),10)*60 + parseInt(t.time.slice(2,4),10);
      return Math.abs(nowMinutes - tMin) <= LIKELY_TRAIN_TIME_WINDOW_MIN;
    });
    if (!inWindow) continue;

    // Already confirmed for this direction today — nothing to detect.
    if (confirmedTrains[todayKeyLocal] && confirmedTrains[todayKeyLocal][direction] !== undefined) continue;

    const fromLoc = dirTrains[0].fromLoc;
    const stationCoord = STATION_COORDS[fromLoc];
    if (!stationCoord) continue;

    const pos = await getCurrentPositionOnce();
    if (!pos) continue; // no permission or unavailable — skip silently
    const distM = distanceKm(pos.latitude, pos.longitude, stationCoord.lat, stationCoord.lon) * 1000;
    if (distM > GEOFENCE_RADIUS_M) continue; // not plausibly at the station

    let boards;
    try{ boards = await fetchLiveBoards(); }catch(e){ continue; }
    const board = boards[`${dirTrains[0].fromLoc}-${dirTrains[0].toLoc}`] || [];

    // Which configured train is nominally "current" if everything ran on
    // schedule — the earliest one whose scheduled time hasn't yet passed
    // by more than a few minutes.
    const nominal = dirTrains.find(t => {
      const tMin = parseInt(t.time.slice(0,2),10)*60 + parseInt(t.time.slice(2,4),10);
      return tMin >= nowMinutes - 5;
    }) || dirTrains[dirTrains.length - 1];

    // Which configured train's live departure is actually closest to
    // happening right now — the one you're plausibly boarding.
    let closest = null, closestDiff = Infinity;
    dirTrains.forEach(t => {
      const wanted = `${t.time.slice(0,2)}:${t.time.slice(2,4)}`;
      const service = board.find(s => s.std === wanted);
      if (!service) return;
      const liveTime = liveTimeToDate(
        (service.etd && service.etd !== 'On time') ? service.etd.replace(':','') : t.time,
        now
      );
      if (!liveTime) return;
      const diffMin = Math.abs((liveTime - now) / 60000);
      if (diffMin <= 15 && diffMin < closestDiff){
        closest = t; closestDiff = diffMin;
      }
    });

    if (closest && closest.key !== nominal.key){
      // A genuine surprise — you appear to be catching a different train
      // than expected. This needs your confirmation, since it's a real
      // ambiguity we can't resolve on our own.
      const suggestionId = `${todayKeyLocal}-${direction}-${closest.key}`;
      if (dismissedLikelyTrainKeys.has(suggestionId)) continue;
      likelyTrainSuggestion = { dateKey: todayKeyLocal, direction, trainKey: closest.key, label: closest.label };
      showLocalNotification('Is this your train?', `Looks like you might be on the delayed ${closest.label} instead of your usual one — open the app to confirm.`);
      render();
      return; // one interactive suggestion at a time is plenty
    } else if (closest && closest.key === nominal.key && closestDiff <= SILENT_CONFIRM_MAX_DIFF_MIN){
      // No surprise — you're at the station, and the train that's actually
      // about to leave is the one you'd expect anyway. Nothing ambiguous
      // to ask about, so just quietly confirm it. Only once its own live
      // departure is genuinely imminent, though — being merely "in range"
      // isn't enough to commit a silent, un-askable write for the rest of
      // the day; it previously used the same loose 15-minute threshold as
      // candidate selection above, which let an early false match lock in
      // hours before you'd actually left for the station.
      if (!confirmedTrains[todayKeyLocal]) confirmedTrains[todayKeyLocal] = {};
      confirmedTrains[todayKeyLocal][direction] = closest.key;
      saveConfirmedTrains();
      // A passive notice that this just happened — otherwise the silent
      // path lives up to its name a little too well, and the only way to
      // know it fired at all is to go check "Confirm train used" and
      // look for yourself.
      silentConfirmBanner = { dateKey: todayKeyLocal, direction, trainKey: closest.key, label: closest.label };
      saveSilentConfirmBanner();
      renderSilentConfirmBanner();
      render();
    }
  }
}

// Arrival-side fallback for checkLikelyTrain above — only ever gets a
// chance to run at all once departure-side detection has already had
// its shot and missed for that direction (same "already confirmed?"
// guard as the departure side, reused directly). Geofences the
// destination (toLoc) instead of the origin, and uses the arrivals
// board only to answer "has a train genuinely arrived here around now"
// — not "which one, specifically". Identity comes from the same
// schedule-based "nominal" reasoning already trusted on the departure
// side: with only one plausible configured train per direction inside
// a 20-minute window, and you genuinely standing at the right station,
// there's little real ambiguity left to resolve — unlike the departure
// side, which actively has to watch for a *different* train being
// caught instead of the expected one. Honest limitation: if another,
// unrelated service happened to arrive at the same station within the
// same few minutes, this could plausibly latch onto that instead —
// low-probability given the geofence and time-window already narrow
// things down heavily, but worth knowing rather than pretending this
// is as precisely matched as the departure side's own logic.
async function checkLikelyArrival(){
  if (!railTrains || railTrains.length === 0) return;
  const now = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate(),
                        new Date().getHours(), new Date().getMinutes());
  const todayKeyLocal = fmtKey(now);
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  for (const direction of ['AM', 'PM']){
    const dirTrains = railTrains.filter(t => t.direction === direction).sort((a,b) => a.time.localeCompare(b.time));
    if (dirTrains.length === 0) continue;

    if (confirmedTrains[todayKeyLocal] && confirmedTrains[todayKeyLocal][direction] !== undefined) continue;

    // Forward-only window from each departure time, not the departure
    // side's own symmetric ±20 minutes — that check made sense for
    // "am I roughly near my departure time", but by the time you've
    // genuinely arrived at the destination, a real journey (Wigan→Crewe
    // is ~29 minutes) already puts you well outside a 20-minute window
    // centred on departure. Confirmed this would have made the whole
    // function silently never fire on a real journey before catching it.
    // 50 minutes covers a normal journey plus a generous delay margin,
    // while staying under the ~60-minute gap between this app's own
    // hourly-spaced trains.
    const inWindow = dirTrains.some(t => {
      const tMin = parseInt(t.time.slice(0,2),10)*60 + parseInt(t.time.slice(2,4),10);
      return nowMinutes >= tMin && nowMinutes <= tMin + LIKELY_ARRIVAL_WINDOW_FORWARD_MIN;
    });
    if (!inWindow) continue;

    const toLoc = dirTrains[0].toLoc;
    const fromLoc = dirTrains[0].fromLoc;
    const stationCoord = STATION_COORDS[toLoc];
    if (!stationCoord) continue;

    const pos = await getCurrentPositionOnce();
    if (!pos) continue;
    const distM = distanceKm(pos.latitude, pos.longitude, stationCoord.lat, stationCoord.lon) * 1000;
    if (distM > GEOFENCE_RADIUS_M) continue;

    let arrivals;
    try{ arrivals = await fetchPureBoard(toLoc, 'arr', 20); }catch(e){ continue; }

    // Identity now comes from genuinely verified data, not a schedule
    // guess — GetArrBoardWithDetails (what fetchPureBoard already calls
    // for 'arr') includes each service's previousCallingPoints, so this
    // checks whether the arriving service actually called at our origin
    // station at all, and if so, which configured train its real
    // departure time from there actually matches. Checked via calling
    // points rather than the service's own top-level origin field,
    // since many of these services are part of a much longer working
    // (e.g. continuing from Glasgow through Wigan to Crewe and beyond)
    // — the true physical origin often isn't Wigan/Crewe at all, even
    // though it's a real calling point along the way. This is what
    // actually answers "is this genuinely my train", rather than just
    // "did something arrive around the right time" — a real, different
    // train arriving at a similar moment is now correctly ruled out
    // rather than risked.
    let closestDiff = Infinity;
    let matchedTrain = null;
    arrivals.forEach(s => {
      const liveTime = liveTimeToDate(
        (s.eta && s.eta !== 'On time') ? s.eta.replace(':','') : (s.sta || '').replace(':',''),
        now
      );
      if (!liveTime) return;
      const diffMin = Math.abs((liveTime - now) / 60000);
      if (diffMin > SILENT_CONFIRM_MAX_DIFF_MIN) return; // not close enough to be worth checking further

      const prevPoints = (s.previousCallingPoints && s.previousCallingPoints[0] && s.previousCallingPoints[0].callingPoint) || [];
      const calledAtOrigin = prevPoints.find(cp => cp.crs === fromLoc);
      if (!calledAtOrigin) return; // never called at our origin at all — definitely not this journey

      // Matched against the SCHEDULED departure from our origin, not the
      // live one — schedule is the stable, fixed reference that both
      // this calling point and each configured train's own `time`
      // ultimately share, while live time is precisely what drifts with
      // delay. Using live time here was a real bug: a severely delayed
      // earlier train (e.g. the 16:31 running ~64 minutes late,
      // genuinely departing Wigan around 17:35) would end up closer in
      // raw value to the *next* configured train's scheduled slot than
      // to its own, and get silently misidentified as that later train
      // instead — confirmed reproducing exactly that before fixing it.
      const rawTime = calledAtOrigin.st;
      if (!rawTime || !rawTime.includes(':')) return;
      const originDepMin = parseInt(rawTime.slice(0,2),10)*60 + parseInt(rawTime.slice(3,5),10);

      // Which configured train does the scheduled departure from our
      // origin actually match? Tight bound now (schedule-to-schedule
      // should be an exact or near-exact match for a genuine configured
      // train) — the old 15-minute allowance made sense for the
      // delay-sensitive live-time comparison this replaces, not for a
      // comparison that shouldn't drift at all.
      let best = null;
      dirTrains.forEach(t => {
        const tMin = parseInt(t.time.slice(0,2),10)*60 + parseInt(t.time.slice(2,4),10);
        const diff = Math.abs(tMin - originDepMin);
        if (!best || diff < best.diff) best = { train: t, diff };
      });
      if (!best || best.diff > 2) return;

      if (diffMin < closestDiff){ closestDiff = diffMin; matchedTrain = best.train; }
    });

    if (matchedTrain && closestDiff <= SILENT_CONFIRM_MAX_DIFF_MIN){
      if (!confirmedTrains[todayKeyLocal]) confirmedTrains[todayKeyLocal] = {};
      confirmedTrains[todayKeyLocal][direction] = matchedTrain.key;
      saveConfirmedTrains();
      silentConfirmBanner = { dateKey: todayKeyLocal, direction, trainKey: matchedTrain.key, label: matchedTrain.label };
      saveSilentConfirmBanner();
      renderSilentConfirmBanner();
      render();
    }
  }
}

function startLikelyTrainChecks(){
  if (likelyTrainCheckTimer) return;
  checkLikelyTrain();
  checkLikelyArrival();
  likelyTrainCheckTimer = setInterval(() => { checkLikelyTrain(); checkLikelyArrival(); }, LIKELY_TRAIN_CHECK_INTERVAL_MS);
}
function stopLikelyTrainChecks(){
  if (likelyTrainCheckTimer){ clearInterval(likelyTrainCheckTimer); likelyTrainCheckTimer = null; }
}

function openConfirmTrain(){
  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const suggested = fmtKey(today);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  function optionsFor(direction, existingKey){
    const trains = railTrains.filter(t => t.direction === direction).sort((a,b) => a.time.localeCompare(b.time));
    let opts = `<option value="">— None / didn't travel —</option>`;
    trains.forEach(t => {
      opts += `<option value="${t.key}" ${existingKey === t.key ? 'selected' : ''}>${t.label}</option>`;
    });
    return opts;
  }

  function renderForDate(dateKey){
    const existing = confirmedTrains[dateKey] || {};
    document.getElementById('confirm-train-fields').innerHTML = `
      <label style="display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px;">Morning train actually caught</label>
      <select id="confirm-am-select" style="margin-bottom:12px;">${optionsFor('AM', existing.AM)}</select>
      <label style="display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px;">Evening train actually caught</label>
      <select id="confirm-pm-select" style="margin-bottom:12px;">${optionsFor('PM', existing.PM)}</select>
    `;
  }

  overlay.innerHTML = `
    <div class="modal">
      <h3>Confirm train used</h3>
      <div class="sub">Records which specific train you actually caught, in case it wasn't your usual one (e.g. you caught an earlier delayed service instead). This doesn't affect your ticket usage tracking — it's just for more accurate delay repay matching.</div>
      <input type="date" id="confirm-date-input" value="${suggested}" style="margin-bottom:12px;" />
      <div id="confirm-train-fields"></div>
      <button class="save-btn" id="confirm-train-save">Save</button>
      <div class="modal-close" id="confirm-train-close">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);
  renderForDate(suggested);

  document.getElementById('confirm-date-input').addEventListener('change', (e) => {
    renderForDate(e.target.value);
  });

  document.getElementById('confirm-train-save').addEventListener('click', async () => {
    const dateKey = document.getElementById('confirm-date-input').value;
    const amKey = document.getElementById('confirm-am-select').value;
    const pmKey = document.getElementById('confirm-pm-select').value;
    if (!dateKey) return;
    const entry = {};
    if (amKey) entry.AM = amKey;
    if (pmKey) entry.PM = pmKey;
    if (Object.keys(entry).length === 0){
      delete confirmedTrains[dateKey];
    } else {
      confirmedTrains[dateKey] = entry;
    }
    await saveConfirmedTrains();
    document.body.removeChild(overlay);
    render();
  });
  document.getElementById('confirm-train-close').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}


// ---- Station reference data (name, CRS code, coordinates) ----
// Station names, codes, and locations change almost never, so rather
// than asking for this on every visit, it's fetched once from a public
// dataset and cached in localStorage indefinitely. "Refresh" (in the
// station picker UI below) re-pulls it on demand, for the rare case a
// brand new station doesn't resolve yet. Served via jsDelivr rather
// than hitting the source GitHub repo directly — jsDelivr keeps a
// permanent cached copy of whatever it's first served, so this keeps
// working even if that small repo is ever renamed or taken down.
//
// v2 swaps in a richer dataset (adds lat/lon alongside name+CRS, in a
// single CSV) so the same lookup that powers the station picker can
// also drive the live-progress weather feature below, rather than
// maintaining two separate station lists that both need to agree on
// CRS codes.
const STATION_LIST_KEY = 'station-list-v2';
const STATION_LIST_URL = 'https://cdn.jsdelivr.net/gh/ellcom/UK-Train-Station-Locations@master/uk-train-stations.csv';

let stationIndexCache = null; // { byCrs: Map, list: [{name,crs,lat,lon}], fetchedAt } — built once per page load

function getCachedStationList(){
  try{
    const raw = localStorage.getItem(STATION_LIST_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

// Minimal RFC4180-ish CSV line parser — just enough to handle the
// quoted-name, bare-number shape this particular file uses (no
// multi-line quoted fields, which this dataset doesn't have).
function parseCsvLine(line){
  const fields = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++){
    const ch = line[i];
    if (inQuotes){
      if (ch === '"'){
        if (line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ','){ fields.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  fields.push(cur);
  return fields;
}

function parseStationCsv(text){
  const lines = text.split('\n').filter(l => l.trim().length);
  const entries = [];
  // First line is the header ("3alpha","station_name","latitude","longitude") — skip it.
  for (let i = 1; i < lines.length; i++){
    const [crs, rawName, lat, lon] = parseCsvLine(lines[i]);
    const latNum = parseFloat(lat), lonNum = parseFloat(lon);
    if (!crs || !rawName || isNaN(latNum) || isNaN(lonNum)) continue;
    // This dataset suffixes every entry with "Rail Station" (e.g. "Wigan
    // North Western Rail Station") — stripped here to match the plain
    // names already shown throughout the app (station boards, calling
    // points, the picker itself).
    const name = rawName.replace(/\s+Rail Station$/i, '').trim();
    entries.push({ crs, name, lat: latNum, lon: lonNum });
  }
  return entries;
}

function buildStationIndex(entries, fetchedAt){
  const byCrs = new Map();
  const list = [];
  entries.forEach(e => {
    const name = e.name, crs = (e.crs || '').toUpperCase();
    if (!name || crs.length !== 3) return;
    const record = { name, crs, lat: e.lat, lon: e.lon };
    byCrs.set(crs, record);
    list.push(record);
  });
  list.sort((a,b) => a.name.localeCompare(b.name));
  return { byCrs, list, fetchedAt };
}

// Instant from localStorage once cached; only hits the network the
// first time ever, or when force is true (the manual refresh control).
async function loadStationIndex(force){
  if (!force && stationIndexCache) return stationIndexCache;
  if (!force){
    const cached = getCachedStationList();
    if (cached && Array.isArray(cached.entries) && cached.entries.length){
      stationIndexCache = buildStationIndex(cached.entries, cached.fetchedAt);
      return stationIndexCache;
    }
  }
  const resp = await fetch(STATION_LIST_URL);
  if (!resp.ok) throw new Error(`fetch failed (${resp.status})`);
  const text = await resp.text();
  const entries = parseStationCsv(text);
  if (!entries.length) throw new Error('came back empty');
  const fetchedAt = new Date().toISOString();
  try{ localStorage.setItem(STATION_LIST_KEY, JSON.stringify({ entries, fetchedAt })); }
  catch(e){ /* storage full — still usable for this session */ }
  stationIndexCache = buildStationIndex(entries, fetchedAt);
  return stationIndexCache;
}

function stationNameForCrs(crs){
  const c = (crs || '').toUpperCase();
  const rec = stationIndexCache && stationIndexCache.byCrs.get(c);
  return rec ? rec.name : null;
}

function stationCoordsForCrs(crs){
  const c = (crs || '').toUpperCase();
  const rec = stationIndexCache && stationIndexCache.byCrs.get(c);
  return rec ? { lat: rec.lat, lon: rec.lon } : null;
}

// A text input that accepts either a station name or a 3-letter CRS
// code, with a live filtered dropdown, and always resolves to a
// { code, name } pair. Falls back to a bare code (name left
// unresolved) for a station not yet in the cached list — e.g. a
// genuinely brand-new one — rather than blocking the search.
function createStationPicker(opts){
  const onChange = (opts && opts.onChange) || function(){};
  const placeholder = (opts && opts.placeholder) || 'Station name or code';
  const initialCode = opts && opts.initialCode;
  const initialName = opts && opts.initialName;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; flex:1;';
  const initialValue = initialCode ? (initialName ? `${initialName} (${initialCode})` : initialCode) : '';
  wrap.innerHTML = `
    <input type="text" class="station-picker-input" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(initialValue)}"
      style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--tile); color:var(--ink); box-sizing:border-box;" />
    <div class="station-picker-dropdown" style="display:none; position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--board-2); border:1px solid var(--line); border-radius:8px; max-height:220px; overflow-y:auto; z-index:20;"></div>
  `;
  const input = wrap.querySelector('.station-picker-input');
  const dropdown = wrap.querySelector('.station-picker-dropdown');
  let selected = initialCode ? { code: initialCode.toUpperCase(), name: initialName || null } : { code: null, name: null };

  function closeDropdown(){ dropdown.style.display = 'none'; dropdown.innerHTML = ''; }

  function pick(entry){
    selected = { code: entry.crs, name: entry.name };
    input.value = `${entry.name} (${entry.crs})`;
    closeDropdown();
    onChange(selected.code, selected.name);
  }

  function renderMatches(q){
    const idx = stationIndexCache;
    const query = (q || '').trim();
    if (!idx || !query){ closeDropdown(); return; }
    const lowerQ = query.toLowerCase();
    const upperQ = query.toUpperCase();
    let matches = idx.list.filter(e => e.name.toLowerCase().includes(lowerQ) || e.crs === upperQ);
    matches.sort((a,b) => {
      const aExact = a.crs === upperQ ? 0 : 1, bExact = b.crs === upperQ ? 0 : 1;
      if (aExact !== bExact) return aExact - bExact;
      const aStarts = a.name.toLowerCase().startsWith(lowerQ) ? 0 : 1;
      const bStarts = b.name.toLowerCase().startsWith(lowerQ) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return a.name.localeCompare(b.name);
    });
    matches = matches.slice(0, 8);
    if (!matches.length){
      if (/^[A-Z]{3}$/.test(upperQ)){
        dropdown.innerHTML = `<div style="padding:10px 12px; font-size:12.5px; color:var(--ink-dim);">Not in the station list — will be used as typed: <strong style="color:var(--ink);">${escapeHtml(upperQ)}</strong></div>`;
        dropdown.style.display = 'block';
      } else {
        closeDropdown();
      }
      return;
    }
    dropdown.innerHTML = matches.map(m => `
      <div class="station-picker-option" data-crs="${m.crs}" style="padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line); -webkit-user-select:none; user-select:none;">
        <span style="color:var(--ink);">${escapeHtml(m.name)}</span>
        <span style="color:var(--ink-dim); float:right;">${m.crs}</span>
      </div>
    `).join('');
    dropdown.style.display = 'block';
    dropdown.querySelectorAll('.station-picker-option').forEach(el => {
      // mousedown, not click — fires before the input's own blur handler
      // would otherwise close the dropdown first and swallow the tap.
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const entry = matches.find(m => m.crs === el.dataset.crs);
        if (entry) pick(entry);
      });
    });
  }

  input.addEventListener('input', () => {
    selected = { code: null, name: null }; // typing invalidates the old selection until re-confirmed
    renderMatches(input.value);
  });
  input.addEventListener('focus', () => { if (input.value) renderMatches(input.value); });
  input.addEventListener('blur', () => {
    setTimeout(() => {
      closeDropdown();
      if (selected.code) return; // already resolved via a dropdown pick
      const raw = input.value.trim().toUpperCase();
      if (/^[A-Z]{3}$/.test(raw)){
        const name = stationNameForCrs(raw);
        selected = { code: raw, name };
        input.value = name ? `${name} (${raw})` : raw;
        onChange(raw, name);
      } else if (raw === ''){
        selected = { code: null, name: null };
        onChange(null, null);
      }
      // else: unresolved free text left as typed — no valid selection
      // until it's fixed, same as leaving a required field blank.
    }, 150);
  });

  return {
    el: wrap,
    getCode: () => selected.code,
    getName: () => selected.name
  };
}

// Single "Live" screen combining your usual AM/PM trains, everything
// currently tracked, and the ability to track any other train — three
// things that used to live in separate places (the Live nav tab, a
// menu-only "Tracked trains" screen, and a debug-gated search tool).
// initialSubTab lets a caller land directly on 'tracked' (e.g. closing a
// train that was opened from this list should return to this list, not
// to whichever sub-tab happened to be active before).
// Shared refresh icon — used wherever a manual refresh action needs an
// icon rather than plain text, so every instance stays visually
// identical and only ever needs updating in one place.
const REFRESH_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.5L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.5L3 16"/><path d="M3 21v-5h5"/></svg>';

function openLiveScreen(initialSubTab){
  let activeSubTab = initialSubTab === 'tracked' ? 'tracked' : 'yours';
  let showAddForm = false;
  // Session-only, same reasoning as the old Tracked Trains screen: this
  // is "what happened last time we checked", not data worth persisting.
  const trackedErrors = {}; // serviceId -> error message string
  // The Live board doesn't auto-refresh once open (same as before — the
  // status line says as much), but switching between sub-tabs shouldn't
  // force a re-fetch every time either. Cached for this screen's
  // lifetime; a fresh fetch only happens on a genuine reopen.
  let yoursBoardsPromise = null;

  const REMOVE_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  const overlay = document.createElement('div');
  // nav-safe: without this, the Close button can end up hidden behind
  // the bottom nav bar — this screen replaces the old Live board, which
  // was missing this class (Tracked Trains and the debug search both
  // already had it, which is why only Live was affected).
  overlay.className = 'modal-overlay modal-overlay-nav-safe';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Live trains</h3>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="save-btn" id="live-subtab-yours" style="flex:1; margin:0;">My trains</button>
        <button class="save-btn" id="live-subtab-tracked" style="flex:1; margin:0;">Tracked</button>
      </div>
      <div id="live-screen-body"></div>
      <div class="modal-close" id="live-screen-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  const bodyEl = document.getElementById('live-screen-body');
  const tabYoursBtn = document.getElementById('live-subtab-yours');
  const tabTrackedBtn = document.getElementById('live-subtab-tracked');

  function styleTabs(){
    tabYoursBtn.style.background = activeSubTab === 'yours' ? 'var(--amber)' : 'var(--tile)';
    tabYoursBtn.style.color = activeSubTab === 'yours' ? '#14161f' : 'var(--ink-dim)';
    tabTrackedBtn.style.background = activeSubTab === 'tracked' ? 'var(--amber)' : 'var(--tile)';
    tabTrackedBtn.style.color = activeSubTab === 'tracked' ? '#14161f' : 'var(--ink-dim)';
    tabTrackedBtn.textContent = trackedTrains.length ? `Tracked (${trackedTrains.length})` : 'Tracked';
  }

  // ---- "My trains" tab (your configured AM/PM services) ----
  function timeToHHMM(t){ return t.slice(0,2) + ':' + t.slice(2,4); }

  function rowForConfigured(train, service){
    if (!service){
      return `<div class="rail-detail-row"><span>${train.label}</span><span style="color:var(--ink-dim);">No live data right now</span></div>`;
    }
    if (service.isCancelled){
      return `<div class="rail-detail-row"><span style="color:#ff8b7e; font-weight:600;">${train.label}</span><span style="color:#ff8b7e;">Cancelled${service.cancelReason ? ' — ' + service.cancelReason.replace(/^This service has been cancelled /,'') : ''}</span></div>`;
    }
    const onTime = !service.etd || service.etd === 'On time';
    const color = onTime ? 'var(--good)' : '#ff8b7e';
    const statusText = onTime ? 'On time' : `Now ${service.etd}`;
    const platformText = service.platform ? ` · Plat ${service.platform}` : '';
    return `<div class="rail-detail-row" data-train-key="${train.key}" style="cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;"><span style="color:${color}; font-weight:600;">${train.label}</span><span style="color:${color};">${statusText}${platformText} ›</span></div>`;
  }

  function renderYoursTab(){
    bodyEl.innerHTML = `<div class="sub" id="live-board-status">Loading…</div><div id="live-board-content"></div>`;
    if (!yoursBoardsPromise) yoursBoardsPromise = fetchLiveBoards();
    yoursBoardsPromise.then(boards => {
      // The person may have switched to the other sub-tab, or closed the
      // screen entirely, while this was in flight.
      if (activeSubTab !== 'yours' || !overlay.isConnected) return;
      const amTrains = railTrains.filter(t => t.direction === 'AM').sort((a,b) => a.time.localeCompare(b.time));
      const pmTrains = railTrains.filter(t => t.direction === 'PM').sort((a,b) => a.time.localeCompare(b.time));
      const matchedServices = {}; // trainKey -> { train, service }

      function sectionHtml(trains){
        return trains.map(t => {
          const board = boards[`${t.fromLoc}-${t.toLoc}`] || [];
          const wanted = timeToHHMM(t.time);
          const service = board.find(s => s.std === wanted);
          if (service && !service.isCancelled) matchedServices[t.key] = { train: t, service };
          return rowForConfigured(t, service);
        }).join('');
      }

      const statusEl = document.getElementById('live-board-status');
      if (statusEl) statusEl.textContent = 'Live from National Rail — tap a train for its progress, or Close and reopen to refresh.';
      const contentEl = document.getElementById('live-board-content');
      if (contentEl) contentEl.innerHTML = `
        <div class="rail-col-header">Morning</div>
        ${amTrains.length ? sectionHtml(amTrains) : '<div class="rail-detail-row"><span style="color:var(--ink-dim);">None configured</span></div>'}
        <div class="rail-col-header">Evening</div>
        ${pmTrains.length ? sectionHtml(pmTrains) : '<div class="rail-detail-row"><span style="color:var(--ink-dim);">None configured</span></div>'}
      `;
      document.querySelectorAll('#live-board-content [data-train-key]').forEach(row => {
        row.addEventListener('click', () => {
          const m = matchedServices[row.dataset.trainKey];
          if (m) openTrainProgress(m.train, m.service);
        });
      });
    }).catch(err => {
      if (activeSubTab !== 'yours' || !overlay.isConnected) return;
      const statusEl = document.getElementById('live-board-status');
      if (statusEl) statusEl.textContent = `Couldn't load live data: ${err.message}`;
    });
  }

  // ---- "Tracked" tab (everything tracked, plus adding a new one) ----
  function buildTrackedListHtml(){
    if (trackedTrains.length === 0){
      return `<div class="sub">Nothing being tracked right now. Use "+ Track a train" above, or tap one of your usual trains — it'll keep working here even after it leaves the station.</div>`;
    }
    return trackedTrains.map(t => {
      const ageMin = Math.round((Date.now() - t.addedAt) / 60000);
      const ageLabel = ageMin < 60 ? `${ageMin} min ago` : `${Math.round(ageMin/60)} hr ago`;
      const errorMsg = trackedErrors[t.serviceId];
      const subLine = errorMsg
        ? `<span style="color:#ff8b7e; font-size:12px;">${escapeHtml(errorMsg)}</span>`
        : `<span style="color:var(--ink-dim); font-size:12px;">Added ${ageLabel}</span>`;
      const refreshBtn = errorMsg
        ? `<span class="tracked-refresh-btn" data-refresh-service-id="${t.serviceId}" title="Refresh" style="display:flex; padding:9px; margin:-9px; color:var(--good); cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">${REFRESH_ICON}</span>`
        : '';
      return `<div class="rail-detail-row" data-tracked-row="${t.serviceId}" style="flex-direction:column; align-items:stretch; gap:2px; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:600;">${t.toLoc ? '<span style="color:var(--amber);">★</span> ' : ''}${t.label}</span>
          <span style="display:flex; align-items:center; gap:28px;">
            ${refreshBtn}
            <span class="tracked-remove-btn" data-remove-service-id="${t.serviceId}" title="Remove" style="display:flex; padding:9px; margin:-9px; color:#ff8b7e; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">${REMOVE_ICON}</span>
          </span>
        </div>
        <div>${subLine}</div>
      </div>`;
    }).join('');
  }

  function wireTrackedList(){
    async function attemptOpen(serviceId){
      const tracked = trackedTrains.find(t => t.serviceId === serviceId);
      if (!tracked) return;
      const row = overlay.querySelector(`[data-tracked-row="${serviceId}"]`);
      if (row) row.style.opacity = '0.5';
      delete trackedErrors[serviceId];
      try{
        const service = await fetchServiceDetails(serviceId);
        if (!overlay.isConnected) return;
        overlay.remove();
        openTrainProgress({ label: tracked.label, fromLoc: tracked.fromLoc, toLoc: tracked.toLoc || null, serviceId, labelIsFinal: true }, service);
      }catch(e){
        if (!overlay.isConnected) return;
        if (e.transient){
          trackedErrors[serviceId] = `Couldn't reach Darwin — ${e.message}`;
          const listEl = document.getElementById('tracked-list');
          if (listEl) listEl.innerHTML = buildTrackedListHtml();
          wireTrackedList();
          return;
        }
        trackedTrains = trackedTrains.filter(t => t.serviceId !== serviceId);
        delete trackedErrors[serviceId];
        await saveTrackedTrains();
        const listEl = document.getElementById('tracked-list');
        if (listEl) listEl.innerHTML = buildTrackedListHtml();
        wireTrackedList();
        styleTabs();
      }
    }
    overlay.querySelectorAll('#tracked-list [data-tracked-row]').forEach(row => {
      row.addEventListener('click', () => attemptOpen(row.dataset.trackedRow));
    });
    overlay.querySelectorAll('#tracked-list [data-refresh-service-id]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); attemptOpen(btn.dataset.refreshServiceId); });
    });
    overlay.querySelectorAll('#tracked-list [data-remove-service-id]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const serviceId = btn.dataset.removeServiceId;
        trackedTrains = trackedTrains.filter(t => t.serviceId !== serviceId);
        delete trackedErrors[serviceId];
        await saveTrackedTrains();
        const listEl = document.getElementById('tracked-list');
        if (listEl) listEl.innerHTML = buildTrackedListHtml();
        wireTrackedList();
        styleTabs();
      });
    });
  }

  function wireAddFormResultRows(){
    overlay.querySelectorAll('[data-debug-service-id]').forEach(row => {
      row.addEventListener('click', async () => {
        const serviceId = row.dataset.debugServiceId;
        const label = row.dataset.debugLabel;
        const fromLoc = row.dataset.debugFrom;
        // Opening a train you've already got tracked just refreshes its
        // position — no new slot needed. Only a genuinely new one needs
        // checking against the cap, and needs checking *before* it's
        // added — the cap inside openTrainProgress enforces the limit
        // either way, but silently, by dropping whichever tracked train
        // is oldest. That's the right fallback for it being hit some
        // other way, but here, where the person's deliberately choosing
        // to track something new, they should find out and get the
        // choice, not lose an existing one without being told.
        const alreadyTracked = trackedTrains.some(t => t.serviceId === serviceId);
        if (!alreadyTracked && trackedTrains.length >= TRACKED_TRAIN_MAX){
          row.innerHTML = `<span style="color:#ff8b7e; font-size:12px;">You're tracking ${TRACKED_TRAIN_MAX} already — remove one from the list below first.</span>`;
          return;
        }
        row.style.opacity = '0.5';
        row.style.pointerEvents = 'none';
        try{
          const service = await fetchServiceDetails(serviceId);
          if (!overlay.isConnected) return;
          overlay.remove();
          openTrainProgress({ label, fromLoc, serviceId }, service);
        }catch(e){
          if (!overlay.isConnected) return;
          row.style.opacity = '1';
          row.style.pointerEvents = '';
          row.innerHTML = `<span style="color:#ff8b7e; font-size:12px;">Couldn't load that one (${escapeHtml(e.message)}) — tap another</span>`;
        }
      });
    });
  }

  function renderTrackedTab(){
    bodyEl.innerHTML = `
      ${showAddForm ? '' : `<div id="tracked-add-toggle" style="text-align:center; padding:10px; border:1px dashed var(--line); border-radius:8px; margin-bottom:12px; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation; color:var(--amber); font-weight:600;">+ Track a train</div>`}
      <div id="tracked-add-form" style="display:${showAddForm ? 'block' : 'none'}; margin-bottom:16px;">
        <div id="tracked-picker-row" style="display:flex; gap:8px; margin-bottom:10px;"></div>
        <div id="tracked-add-cancel" style="text-align:center; padding:10px; border:1px dashed var(--line); border-radius:8px; margin-bottom:10px; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation; color:var(--amber); font-weight:600;">Cancel</div>
        <div id="tracked-station-list-status" style="font-size:11.5px; color:var(--ink-dim); margin-bottom:10px;">Loading station list…</div>
        <button class="save-btn" id="tracked-search-btn">Search</button>
        <div id="tracked-search-results" style="margin-top:14px;"></div>
      </div>
      <div id="tracked-list">${buildTrackedListHtml()}</div>
    `;
    wireTrackedList();

    const addToggle = document.getElementById('tracked-add-toggle');
    if (addToggle) addToggle.addEventListener('click', () => {
      showAddForm = true;
      renderTrackedTab();
    });
    const addCancel = document.getElementById('tracked-add-cancel');
    if (addCancel) addCancel.addEventListener('click', () => {
      showAddForm = false;
      renderTrackedTab();
    });

    if (!showAddForm) return;

    const resultsEl = document.getElementById('tracked-search-results');
    const fromPicker = createStationPicker({ placeholder: 'From: name or code' });
    const toPicker = createStationPicker({ placeholder: 'To (optional)' });
    document.getElementById('tracked-picker-row').appendChild(fromPicker.el);
    document.getElementById('tracked-picker-row').appendChild(toPicker.el);

    const stationStatusEl = document.getElementById('tracked-station-list-status');
    function stationListSummary(idx){
      const date = idx.fetchedAt ? new Date(idx.fetchedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : 'unknown date';
      return `${idx.list.length.toLocaleString()} stations · updated ${date}`;
    }
    function wireStationRefreshLink(){
      const el = document.getElementById('tracked-station-refresh-link');
      if (el) el.addEventListener('click', () => refreshStationList(true));
    }
    async function refreshStationList(force){
      if (!stationStatusEl.isConnected) return;
      stationStatusEl.textContent = force ? 'Refreshing station list…' : 'Loading station list…';
      try{
        const idx = await loadStationIndex(force);
        if (!stationStatusEl.isConnected) return;
        stationStatusEl.innerHTML = `${stationListSummary(idx)} — <span id="tracked-station-refresh-link" style="text-decoration:underline; cursor:pointer;">Refresh</span>`;
        wireStationRefreshLink();
      }catch(e){
        if (!stationStatusEl.isConnected) return;
        stationStatusEl.innerHTML = `Couldn't load the station list (${escapeHtml(e.message)}) — codes still work, just no name lookup yet. <span id="tracked-station-refresh-link" style="text-decoration:underline; cursor:pointer;">Try again</span>`;
        wireStationRefreshLink();
      }
    }
    refreshStationList(false);

    document.getElementById('tracked-search-btn').addEventListener('click', async () => {
      const fromCrs = fromPicker.getCode();
      const toCrs = toPicker.getCode();
      if (!fromCrs){
        resultsEl.innerHTML = `<div class="sub">Pick a station to search from — type a name or a 3-letter code (e.g. EUS, BHM, GLC).</div>`;
        return;
      }
      if (trackedTrains.length >= TRACKED_TRAIN_MAX){
