    return `<div class="rail-detail-row"><span style="color:${color}; font-weight:600;">${t.label}</span><span style="color:${color};">${text}</span></div>`;
  }).join('');
}

// Same as railDetailRows, but for the one train that was actually
// confirmed as ridden that day: if it was also delayed enough to claim
// and no claim has been started yet, it renders as a reversed, tappable
// pill. Once a claim exists (started or confirmed), it drops back to
// plain red text with a small checkmark — no longer tappable here, since
// the actual claimed/confirmed toggle now lives in its own menu screen
// rather than cluttering this view.
function railDetailRowsForClaim(trains, dayPerf, dateKey, direction){
  const confirmedKey = (confirmedTrains[dateKey] || {})[direction];
  return trains.map(t => {
    const perf = dayPerf[t.key];
    if (!perf){
      return `<div class="rail-detail-row"><span>${t.label}</span><span style="color:var(--ink-dim);">No data</span></div>`;
    }
    const late = perf.delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES;
    if (t.key === confirmedKey && late){
      const claim = (delayClaims[dateKey] || {})[direction];
      const status = claim ? claim.status : null;
      if (!status){
        const delayText = `${perf.delayMinutes} minute${perf.delayMinutes===1?'':'s'} delay`;
        return `<div class="rail-detail-row claimable-row" data-claim-date="${dateKey}" data-claim-direction="${direction}"
             style="cursor:pointer; margin:0 -10px; padding:8px 10px; background:#e05a4e; border-radius:8px; -webkit-user-select:none; user-select:none; touch-action:manipulation;">
          <span style="color:#14161f; font-weight:700;">${t.label}</span>
          <span style="color:#14161f;">${delayText}</span>
        </div>`;
      }
      const checkColor = status === 'confirmed' ? '#3fb950' : '#8b949e';
      const delayText = `${perf.delayMinutes} minute${perf.delayMinutes===1?'':'s'} delay`;
      return `<div class="rail-detail-row">
        <span style="color:#ff8b7e; font-weight:600;">${t.label} <span title="${status === 'confirmed' ? 'Claim confirmed' : 'Claim started'}">${checkCircleIcon(checkColor)}</span></span>
        <span style="color:#ff8b7e;">${delayText}</span>
      </div>`;
    }
    const color = late ? '#ff8b7e' : 'var(--good)';
    const text = perf.delayMinutes <= 0 ? 'On time' : `${perf.delayMinutes} minute${perf.delayMinutes===1?'':'s'} delay`;
    return `<div class="rail-detail-row"><span style="color:${color}; font-weight:600;">${t.label}</span><span style="color:${color};">${text}</span></div>`;
  }).join('');
}

// Wires up the claim pill inside a just-appended detail overlay. reopen()
// should close this overlay and re-show the same detail view fresh, so a
// tap is reflected immediately. Only fires for a train with no claim yet
// — once started/confirmed the row is plain text, not clickable.
function wireClaimHandlers(overlay, reopen){
  overlay.querySelectorAll('.claimable-row').forEach(row => {
    row.addEventListener('click', async () => {
      const dateKey = row.dataset.claimDate;
      // Clipboard write kicked off first, immediately — before anything
      // else (saveDelayClaims's own await, opening the external link)
      // gets a chance to erode the trusted-gesture window it needs.
      copySmartcardToClipboard();
      // One tap covers the whole day — if both AM and PM had a confirmed
      // delay, both get marked 'started' together, since realistically
      // you'll be dealing with both while you're on Avanti's site anyway.
      if (!delayClaims[dateKey]) delayClaims[dateKey] = {};
      ['AM', 'PM'].forEach(dir => {
        const confirmedKey = (confirmedTrains[dateKey] || {})[dir];
        if (!confirmedKey) return;
        const perf = (railPerfCache[dateKey] || {})[confirmedKey];
        if (!perf || perf.delayMinutes < DELAY_REPAY_THRESHOLD_MINUTES) return;
        const existing = delayClaims[dateKey][dir];
        if (existing && existing.status === 'confirmed') return; // don't downgrade an already-confirmed claim
        delayClaims[dateKey][dir] = {
          status: 'started',
          minutesLate: perf.delayMinutes,
          amount: computeDelayRepayAmount(perf.delayMinutes, dateKey),
          expiredAcknowledged: false,
        };
      });
      await saveDelayClaims();
      openExternalLink(AVANTI_CLAIM_URL);
      // After opening the claim site, not before — this needs to stay as
      // close to the original tap as possible to avoid the popup blocker
      // treating it as unrelated to a user gesture. Everything below
      // isn't nearly as timing-sensitive, so it's safe to let those run
      // right after instead.
      triggerAllClaimDownloads(dateKey);
      showClaimBandNotification(dateKey);
      reopen();
    });
  });
}

// Author pre-defined fallback routes for the "Emergency" Live sub-tab
// (see emergency-routes-spec.md). Edits a private draft — Save/Cancel
// work the same way as openRailConfig above, so nothing here touches
// the live alternativeRoutes list until Save is actually pressed.
// Both from/to code AND name are captured at authoring time via
// createStationPicker, so display never depends on stationIndexCache
// being loaded later.
function openAlternativeRoutesManager(cameFromSettings){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  let draftRoutes = alternativeRoutes.map(r => ({ ...r, legs: r.legs.map(l => ({ ...l })) }));
  // Station pickers are live components with their own internal state,
  // not plain inputs — re-created on every render() call, so their
  // onChange handlers always close over the current draftRoutes/render
  // rather than a stale copy from an earlier render.
  function renderRoute(route, ri){
    const legRows = route.legs.map((leg, li) => `
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
        <span style="color:var(--ink-dim); font-size:12px; width:14px;">${li + 1}</span>
        <div id="ar-${ri}-${li}-from" style="flex:1;"></div>
        <span style="color:var(--ink-dim);">→</span>
        <div id="ar-${ri}-${li}-to" style="flex:1;"></div>
        <span class="modal-close" data-remove-leg data-ri="${ri}" data-li="${li}" style="margin:0; font-size:12px;">✕</span>
      </div>`).join('');
    return `
      <div class="rail-detail-row" style="display:block; padding:12px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <input type="text" class="ar-label-input" data-ri="${ri}" value="${escapeHtml(route.label || '')}" placeholder="Route label (e.g. Via Liverpool)"
            style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--tile); color:var(--ink); box-sizing:border-box;" />
          <span class="modal-close" data-remove-route data-ri="${ri}" style="margin:0; font-size:13px;">Remove route</span>
        </div>
        ${route.legs.length ? legRows : '<div class="sub" style="margin-bottom:8px;">No legs yet — add at least one.</div>'}
        <div class="settings-link" data-add-leg data-ri="${ri}" style="margin-top:2px;">+ Add leg</div>
      </div>`;
  }

  function stationStatusHtml(){
    // renderMatches (inside createStationPicker) reads stationIndexCache
    // live on every keystroke, not just at picker construction — so this
    // status line is informational rather than gating anything, but
    // without ever calling loadStationIndex() at all, the cache would
    // simply never populate and typed station names would never resolve
    // to anything (only an exact 3-letter code, committed on blur, would
    // work at all).
    if (stationIndexCache){
      const date = stationIndexCache.fetchedAt ? new Date(stationIndexCache.fetchedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : 'unknown date';
      return `${stationIndexCache.list.length.toLocaleString()} stations · updated ${date} — <span id="ar-station-refresh-link" style="text-decoration:underline; cursor:pointer;">Refresh</span>`;
    }
    return `Loading station list… codes still work meanwhile (e.g. CRE, WGN).`;
  }

  function render(){
    overlay.innerHTML = `
      <div class="modal">
        <h3>Emergency routes</h3>
        <div class="sub">Pre-define fallback journeys now, when calm, so the Emergency tab can check them live when disruption actually hits.</div>
        <div class="sub" id="ar-station-status" style="font-size:11.5px; margin-bottom:12px;">${stationStatusHtml()}</div>
        <div id="ar-list">${draftRoutes.map((r, ri) => renderRoute(r, ri)).join('') || '<div class="sub">No routes yet.</div>'}</div>
        <div class="settings-link" id="ar-add-route" style="margin-top:6px; margin-bottom:16px;">+ Add route</div>
        <button class="save-btn" id="ar-save">Save</button>
        <div class="modal-close" id="ar-close">${cameFromSettings ? '← Back to Settings' : 'Cancel'}</div>
      </div>
    `;

    const refreshLink = document.getElementById('ar-station-refresh-link');
    if (refreshLink) refreshLink.addEventListener('click', () => {
      loadStationIndex(true).then(() => { if (overlay.isConnected) render(); }).catch(() => { if (overlay.isConnected) render(); });
    });

    // Wire a station picker into every leg's from/to placeholder.
    draftRoutes.forEach((route, ri) => {
      route.legs.forEach((leg, li) => {
        const fromPicker = createStationPicker({
          placeholder: 'From',
          initialCode: leg.from,
          initialName: leg.fromName,
          onChange: (code, name) => { leg.from = code; leg.fromName = name; }
        });
        const toPicker = createStationPicker({
          placeholder: 'To',
          initialCode: leg.to,
          initialName: leg.toName,
          onChange: (code, name) => { leg.to = code; leg.toName = name; }
        });
        document.getElementById(`ar-${ri}-${li}-from`).appendChild(fromPicker.el);
        document.getElementById(`ar-${ri}-${li}-to`).appendChild(toPicker.el);
      });
    });

    overlay.querySelectorAll('[data-add-leg]').forEach(el => {
      el.addEventListener('click', () => {
        const ri = Number(el.dataset.ri);
        draftRoutes[ri].legs.push({ from: null, fromName: null, to: null, toName: null });
        render();
      });
    });
    overlay.querySelectorAll('[data-remove-leg]').forEach(el => {
      el.addEventListener('click', () => {
        const ri = Number(el.dataset.ri), li = Number(el.dataset.li);
        draftRoutes[ri].legs.splice(li, 1);
        render();
      });
    });
    overlay.querySelectorAll('[data-remove-route]').forEach(el => {
      el.addEventListener('click', () => {
        // Read every label field back into the draft before the row
        // that's about to disappear takes its sibling inputs' DOM state
        // with it — otherwise unrelated in-flight label edits made just
        // before tapping Remove would be lost on the next render.
        syncLabelsFromInputs();
        const ri = Number(el.dataset.ri);
        draftRoutes.splice(ri, 1);
        render();
      });
    });
    document.getElementById('ar-add-route').addEventListener('click', () => {
      syncLabelsFromInputs();
      draftRoutes.push({ id: `route-${Date.now()}`, label: '', legs: [] });
      render();
    });

    document.getElementById('ar-save').addEventListener('click', async () => {
      syncLabelsFromInputs();
      // A route with no legs, or a leg missing a from/to, can't ever be
      // checked — drop those rather than saving something the Emergency
      // tab would just fail to make sense of later.
      alternativeRoutes = draftRoutes
        .map(r => ({ ...r, legs: r.legs.filter(l => l.from && l.to) }))
        .filter(r => r.legs.length > 0);
      await saveAlternativeRoutes();
      overlay.remove();
      if (cameFromSettings) openSettingsMenu();
    });
    document.getElementById('ar-close').addEventListener('click', () => {
      overlay.remove();
      if (cameFromSettings) openSettingsMenu();
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay){
        overlay.remove();
        if (cameFromSettings) openSettingsMenu();
      }
    });
  }

  function syncLabelsFromInputs(){
    overlay.querySelectorAll('.ar-label-input').forEach(input => {
      const route = draftRoutes[Number(input.dataset.ri)];
      if (route) route.label = input.value;
    });
  }

  document.body.appendChild(overlay);
  render();
  // Kick off the load once, in the background — render() above already
  // showed a usable screen (bare codes work immediately), and this
  // re-renders on completion so name matching starts working without
  // needing to close and reopen the screen.
  if (!stationIndexCache){
    loadStationIndex(false).then(() => { if (overlay.isConnected) render(); }).catch(() => { if (overlay.isConnected) render(); });
  }
}

// Lists every day with a delay repay claim on record, most recent first,
// each with a checkbox to mark it as genuinely submitted/confirmed —
// separated out from the day-detail views so those stay simple and this
// stays a proper focused screen for managing claims.
function openDelayClaimsManager(){
  const entries = [];
  for (const dateKey in delayClaims){
    for (const dir in delayClaims[dateKey]){
      const claim = delayClaims[dateKey][dir];
      if (!claim) continue;
      const confirmedKey = (confirmedTrains[dateKey] || {})[dir];
      const train = railTrains.find(t => t.key === confirmedKey);
      entries.push({ dateKey, dir, claim, label: train ? train.label : dir });
    }
  }
  entries.sort((a, b) => b.dateKey < a.dateKey ? -1 : (b.dateKey > a.dateKey ? 1 : 0));

  const rowsHtml = entries.length ? entries.map(e => `
    <div class="rail-detail-row" style="align-items:flex-start; padding:10px 0;">
      <div>
        <div style="font-weight:600;">${dateLabel(parseKey(e.dateKey))}</div>
        <div style="font-size:12px; color:var(--ink-dim); margin-top:2px;">${e.label} (${e.dir}) — ${e.claim.minutesLate} min late — £${(e.claim.amount || 0).toFixed(2)}</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        ${e.claim.status === 'expired' ? `
        <span style="font-size:12px; color:var(--danger); font-weight:600; white-space:nowrap;">Expired</span>
        ` : `
        <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:${e.claim.status==='confirmed' ? 'var(--good)' : 'var(--ink-dim)'}; cursor:pointer; white-space:nowrap;">
          <input type="checkbox" class="claim-confirm-checkbox" data-claim-date="${e.dateKey}" data-claim-direction="${e.dir}" ${e.claim.status==='confirmed'?'checked':''} style="width:15px; height:15px;" />
          Confirmed
        </label>
        <span class="claim-undo-link" data-claim-date="${e.dateKey}" data-claim-direction="${e.dir}" style="font-size:11px; color:var(--ink-dim); text-decoration:underline; cursor:pointer;">Undo</span>
        `}
      </div>
    </div>
  `).join('') : `<div class="sub" style="margin-top:0;">No claims started yet — tap a red delay entry on any day to begin one.</div>`;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Delay repay claims</h3>
      <div class="sub">Tick a claim off once you've actually submitted and it's been accepted — not just when you've opened the link.</div>
      ${rowsHtml}
      <div class="modal-close" id="delay-claims-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.claim-confirm-checkbox').forEach(cb => {
    cb.addEventListener('change', async () => {
      const dateKey = cb.dataset.claimDate;
      const dir = cb.dataset.claimDirection;
      if (!delayClaims[dateKey] || !delayClaims[dateKey][dir]) return;
      delayClaims[dateKey][dir].status = cb.checked ? 'confirmed' : 'started';
      await saveDelayClaims();
      document.body.removeChild(overlay);
      openDelayClaimsManager();
    });
  });
  overlay.querySelectorAll('.claim-undo-link').forEach(link => {
    link.addEventListener('click', async () => {
      const dateKey = link.dataset.claimDate;
      const dir = link.dataset.claimDirection;
      if (delayClaims[dateKey]){
        delete delayClaims[dateKey][dir];
        if (Object.keys(delayClaims[dateKey]).length === 0) delete delayClaims[dateKey];
      }
      await saveDelayClaims();
      document.body.removeChild(overlay);
      openDelayClaimsManager();
    });
  });
  document.getElementById('delay-claims-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openPassPhotoManager(cameFromSettings){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Smartcard pass</h3>
      <div class="sub">Photo and smartcard number, kept together — everything needed to start a delay repay claim.</div>
      <div id="pass-photo-preview-wrap" style="margin:14px 0; text-align:center;"></div>

        <span id="pass-photo-remove-link" style="font-size:12px; color:#ff8b7e; text-decoration:underline; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation;">Remove saved photo</span>
      </div>
      <div class="sub" style="margin-top:20px; margin-bottom:4px;">Smartcard number</div>
      <input type="text" id="smartcard-number-input" value="${escapeHtml(smartcardNumber)}" maxlength="${SMARTCARD_NUMBER_MAX_LENGTH}" placeholder="e.g. 302012345678901234" style="font-family:monospace;" />
      <button class="save-btn" id="smartcard-number-save-btn" style="margin-top:10px;">Save number</button>
      <div class="modal-close" id="pass-photo-close-btn" style="margin-top:16px;">${cameFromSettings ? '← Back to Settings' : 'Close'}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  const previewWrap = document.getElementById('pass-photo-preview-wrap');
  const removeWrap = document.getElementById('pass-photo-remove-wrap');

  async function refreshPreview(){
    previewWrap.innerHTML = `<div class="sub" style="margin-top:0;">Loading…</div>`;
    try{
      const record = await getPassPhoto();
      if (!overlay.isConnected) return;
      if (record && record.blob){
        const url = URL.createObjectURL(record.blob);
        const uploadedDate = record.uploadedAt ? new Date(record.uploadedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '';
        previewWrap.innerHTML = `
          <img src="${url}" style="max-width:100%; max-height:220px; border-radius:8px; border:1px solid var(--line);" />
          <div class="sub" style="margin-top:8px;">Saved ${uploadedDate}</div>
        `;
        removeWrap.style.display = 'block';
      } else {
        previewWrap.innerHTML = `<div class="sub" style="margin-top:0;">No photo saved yet.</div>`;
        removeWrap.style.display = 'none';
      }
    }catch(e){
      if (!overlay.isConnected) return;
      previewWrap.innerHTML = `<div class="sub" style="margin-top:0; color:#ff8b7e;">Couldn't load the saved photo (${escapeHtml(e.message)}).</div>`;
    }
  }
  refreshPreview();

  document.getElementById('pass-photo-choose-btn').addEventListener('click', () => {
    document.getElementById('pass-photo-input').click();
  });
  document.getElementById('pass-photo-input').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    previewWrap.innerHTML = `<div class="sub" style="margin-top:0;">Saving…</div>`;
    try{
      await savePassPhoto(file); // a File is already a Blob — stores directly, no conversion needed
      await refreshPreview();
    }catch(err){
      if (!overlay.isConnected) return;
      previewWrap.innerHTML = `<div class="sub" style="margin-top:0; color:#ff8b7e;">Couldn't save that photo (${escapeHtml(err.message)}).</div>`;
    }
  });
  document.getElementById('pass-photo-remove-link').addEventListener('click', async () => {
    try{ await deletePassPhoto(); }catch(e){ /* nothing meaningful to surface if this fails */ }
    await refreshPreview();
  });
  document.getElementById('smartcard-number-save-btn').addEventListener('click', async () => {
    const val = document.getElementById('smartcard-number-input').value.trim();
    smartcardNumber = val.slice(0, SMARTCARD_NUMBER_MAX_LENGTH);
    await saveSmartcardNumber();
    document.body.removeChild(overlay);
    if (cameFromSettings) openSettingsMenu(); else render();
  });

  document.getElementById('pass-photo-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
    if (cameFromSettings) openSettingsMenu();
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay){
      document.body.removeChild(overlay);
      if (cameFromSettings) openSettingsMenu();
    }
  });
}

// Full performance history — every day railPerfCache has ever recorded
// (it's kept permanently, not just the rolling window the day list
// shows), against every currently configured usual train, as a table:
// trains across the top (sticky), dates down the side (sticky), both
// axes scrollable since a few months of data with several trains
// configured won't fit either dimension on a phone screen. Tapping a
// delayed cell with a recorded reason code shows what it was.
// Renders (or re-renders, if called again on an already-open overlay)
// the Performance history modal's contents from whatever's currently in
// railPerfCache — kept as its own function, rather than inline in
// openPerformanceHistoryView, so it can be called a second time once
// railSyncFullHistory's background fetch resolves, to reflect the freshly
// backfilled data without closing and reopening the modal.
// A small trending-line glyph — same stroke-icon style used throughout
// (viewBox 24x24, currentColor stroke) — signalling "more statistics
// live behind this button" from the Performance history header.
const PERF_STATS_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l4-5 3 3 5-7"/><circle cx="7" cy="15" r="1.2" fill="currentColor" stroke="none"/><circle cx="11" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="14" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="19" cy="6" r="1.2" fill="currentColor" stroke="none"/></svg>';

function renderPerfHistoryInto(overlay, syncing){
  const amTrains = railTrains.filter(t => t.direction === 'AM').sort((a, b) => a.time.localeCompare(b.time));
  const pmTrains = railTrains.filter(t => t.direction === 'PM').sort((a, b) => a.time.localeCompare(b.time));
  const orderedTrains = [...amTrains, ...pmTrains];

  const dateKeys = Object.keys(railPerfCache).sort((a, b) => (a < b ? 1 : (a > b ? -1 : 0))); // most recent first

  // A train that ran early counts as 0 delay here rather than pulling
  // the average below zero — both averages below are meant to answer
  // "how late does my train usually run", not track signed deviation
  // from schedule. Cancelled entries (delayMinutes: null) are excluded
  // from both rather than counted as some assumed delay value, since
  // there's no single "right" number to stand in for a cancellation.
  function averageFor(trains){
    let total = 0, count = 0;
    for (const dateKey of dateKeys){
      const dayPerf = railPerfCache[dateKey];
      for (const t of trains){
        const perf = dayPerf[t.key];
        if (!perf || typeof perf.delayMinutes !== 'number') continue;
        total += Math.max(0, perf.delayMinutes);
        count++;
      }
    }
    return count > 0 ? total / count : null;
  }
  const amAvg = amTrains.length ? averageFor(amTrains) : null;
  const pmAvg = pmTrains.length ? averageFor(pmTrains) : null;
  const avgItemHtml = (label, avg) => `
    <div class="perf-history-avg-item">
      <div class="avg-label">${label} avg delay</div>
      <div class="avg-value">${avg === null ? '—' : `${avg.toFixed(1)} min`}</div>
    </div>`;

  // Per-train averages — same "clamp early trains to 0, exclude
  // cancellations" treatment as the AM/PM figures above, just computed
  // per train instead of per direction.
  const perTrainAvg = t => averageFor([t]);
  const trainChipHtml = t => `
    <div class="perf-history-train-chip">
      <div class="chip-label">${escapeHtml(t.label)} <span style="opacity:0.6;">${escapeHtml(t.direction)}</span></div>
      <div class="chip-value">${(() => { const a = perTrainAvg(t); return a === null ? '—' : `${a.toFixed(1)}m`; })()}</div>
    </div>`;

  function cellHtml(dateKey, train){
    const perf = (railPerfCache[dateKey] || {})[train.key];
    if (!perf){
      return `<td style="color:var(--ink-dim);">–</td>`;
    }
    if (perf.cancelled){
      const attrs = perf.reason ? ` data-perf-date="${dateKey}" data-perf-train="${escapeHtml(train.key)}"` : '';
      return `<td class="perf-history-cell delay-cancelled"${attrs}>Cancelled</td>`;
    }
    if (typeof perf.delayMinutes !== 'number'){
      return `<td style="color:var(--ink-dim);">–</td>`;
    }
    const mins = perf.delayMinutes;
    let cls = '';
    if (mins >= DELAY_REPAY_THRESHOLD_MINUTES) cls = 'delay-red';
    else if (mins > 0) cls = 'delay-amber';
    const text = mins <= 0 ? 'On time' : `${mins} min`;
    // Only wired up as tappable if there's actually a reason recorded
    // for it — an on-time row or one with no reason code just isn't
    // interactive, rather than showing an empty toast on tap.
    const tappable = mins > 0 && perf.reason;
    const attrs = tappable ? ` data-perf-date="${dateKey}" data-perf-train="${escapeHtml(train.key)}"` : '';
    return `<td class="perf-history-cell${cls ? ` ${cls}` : ''}"${attrs}>${text}</td>`;
  }

  const headerCellsHtml = orderedTrains.map(t =>
    `<th>${escapeHtml(t.label)}<br><span style="font-weight:400; opacity:0.7;">${escapeHtml(t.direction)}</span></th>`
  ).join('');
  const rowsHtml = dateKeys.map(dateKey => `
    <tr>
      <td>${escapeHtml(dateLabelShort(parseKey(dateKey)))}</td>
      ${orderedTrains.map(t => cellHtml(dateKey, t)).join('')}
    </tr>
  `).join('');

  const tableHtml = (orderedTrains.length === 0)
    ? `<div class="sub" style="padding:0 18px;">No usual trains configured yet — set them up under More → Settings first.</div>`
    : (dateKeys.length === 0
      ? `<div class="sub" style="padding:0 18px;">${syncing ? 'Fetching performance history…' : 'No performance data recorded yet.'}</div>`
      : `<div class="perf-history-scroll">
          <table class="perf-history-table">
            <thead><tr><th>Date</th>${headerCellsHtml}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`);

  const trainChipsHtml = orderedTrains.length > 1
    ? `<div class="perf-history-train-chips">${orderedTrains.map(trainChipHtml).join('')}</div>`
    : '';

  const canLoadMore = railHistoryDaysBack < RAIL_HISTORY_MAX_DAYS_BACK;

  overlay.querySelector('.modal').innerHTML = `
    <div style="padding:20px 18px 10px; flex-shrink:0; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div>
        <h3>Performance history</h3>
        <div class="sub" style="margin-bottom:0;">
          Tap a delayed or cancelled entry to see details
          ${syncing ? ' — backfilling more history in the background…' : ''}
        </div>
      </div>
      <div id="perf-history-stats-btn" class="perf-history-icon-btn" title="Statistics">${PERF_STATS_ICON}</div>
    </div>
    ${trainChipsHtml}
    ${tableHtml}
    <div class="perf-history-avg-bar">
      ${avgItemHtml('Morning', amAvg)}
      ${avgItemHtml('Evening', pmAvg)}
    </div>
    <div style="display:flex; gap:10px; margin:10px 18px; flex-shrink:0;">
      ${canLoadMore ? `<div class="day-nav-btn" id="perf-history-load-more" style="flex:1; margin:0;">Load more history</div>` : ''}
      <div class="modal-close" id="perf-history-close-btn" style="flex:1; margin:0; background:var(--board-2); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; align-items:center; justify-content:center;">Close</div>
    </div>
  `;

  const statsBtn = overlay.querySelector('#perf-history-stats-btn');
  if (statsBtn) statsBtn.addEventListener('click', () => openPerformanceStatsView());

  overlay.querySelectorAll('.perf-history-cell[data-perf-date]').forEach(cell => {
    cell.addEventListener('click', () => {
      const dateKey = cell.dataset.perfDate;
      const trainKey = cell.dataset.perfTrain;
      const perf = (railPerfCache[dateKey] || {})[trainKey];
      if (!perf) return;
      const text = describeReasonCode(perf.reason, !!perf.cancelled);
      if (text) showToast(text);
    });
  });

  const loadMoreBtn = overlay.querySelector('#perf-history-load-more');
  if (loadMoreBtn){
    loadMoreBtn.addEventListener('click', async () => {
      railHistoryDaysBack = Math.min(railHistoryDaysBack + RAIL_HISTORY_STEP_DAYS, RAIL_HISTORY_MAX_DAYS_BACK);
      await saveRailHistoryDaysBack();
      renderPerfHistoryInto(overlay, true);
      await railSyncFullHistory();
      if (document.body.contains(overlay)) renderPerfHistoryInto(overlay, false);
    });
  }

  const closeBtn = overlay.querySelector('#perf-history-close-btn');
  if (closeBtn) closeBtn.addEventListener('click', () => { document.body.removeChild(overlay); });
}

// Full performance history — every weekday within railHistoryDaysBack
// (backfilled regardless of whether it was a day you actually
// travelled — see railSyncFullHistory), against every currently
// configured usual train, as a table: trains across the top (sticky),
// dates down the side (sticky), both axes scrollable since a few months
// of data with several trains configured won't fit either dimension on
// a phone screen. Tapping a delayed or cancelled cell with a recorded
// reason code shows what it was. Opens immediately with whatever's
// already cached (fast), then backfills any gap in the background and
// re-renders in place once that resolves — a fresh device or a newly
// widened window can otherwise mean a genuinely long wait before there's
// anything to show at all.
function openPerformanceHistoryView(){
  // Best-effort refresh — a stale/missing table just means reason taps
  // fall back to "description not loaded yet" until this resolves.
  ensureReasonCodes();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-overlay-full';
  overlay.style.alignItems = 'stretch';
  overlay.innerHTML = `<div class="modal" style="display:flex; flex-direction:column; padding:0 0 calc(72px + env(safe-area-inset-bottom)) 0; border-radius:0; overflow:hidden;"></div>`;
  document.body.appendChild(overlay);

  renderPerfHistoryInto(overlay, true);
  railSyncFullHistory().then(() => {
    if (document.body.contains(overlay)) renderPerfHistoryInto(overlay, false);
  });
}

// Statistics behind the Performance history table — most common delay
// and cancellation reasons, and which weekday tends to run latest in the
// morning vs the evening. Scoped to whatever's currently backfilled
// (same railPerfCache dateKeys the table itself uses), not re-fetched or
// widened independently of it. Opens as its own overlay stacked on top
// of the history view, so Close just reveals that underneath again.
function openPerformanceStatsView(){
  const dateKeys = Object.keys(railPerfCache);
  const amTrains = railTrains.filter(t => t.direction === 'AM');
  const pmTrains = railTrains.filter(t => t.direction === 'PM');

  // Reason tallies — delays and cancellations kept separate since the
  // same code carries different text (and a different meaning) for
  // each. Only entries that actually got a reason from HSP count; a lot
  // of delays never do, so this is "most common reason, of the ones
  // that gave one" rather than a claim to cover every delay.
  const delayReasonCounts = {};
  const cancelReasonCounts = {};
  for (const dateKey of dateKeys){
    const dayPerf = railPerfCache[dateKey];
    for (const trainKey in dayPerf){
      const perf = dayPerf[trainKey];
      if (!perf || !perf.reason) continue;
      if (perf.cancelled){
        cancelReasonCounts[perf.reason] = (cancelReasonCounts[perf.reason] || 0) + 1;
      } else if (typeof perf.delayMinutes === 'number' && perf.delayMinutes > 0){
        delayReasonCounts[perf.reason] = (delayReasonCounts[perf.reason] || 0) + 1;
      }
    }
  }
  function topReasons(counts, cancelled){
    return Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5)
      .map(([code, count]) => ({ text: describeReasonCode(code, cancelled), count }));
  }
  const topDelayReasons = topReasons(delayReasonCounts, false);
  const topCancelReasons = topReasons(cancelReasonCounts, true);
  const reasonRowHtml = r => `
    <div class="perf-stats-reason-row">
      <div class="perf-stats-reason-text">${escapeHtml(r.text)}</div>
      <div class="perf-stats-reason-count">${r.count}×</div>
    </div>`;

  // Weekday rankings — average delay (same "clamp early trains to 0,
  // exclude cancellations" treatment used throughout this page) per
  // weekday, for AM and PM trains separately. Only Mon–Fri, since the
  // backfill itself is weekdays-only. Each row also carries wd (the
  // numeric weekday) and trains (the direction's own train list), so the
  // per-train breakdown can be computed lazily when a row's expanded
  // rather than for every weekday up front.
  const WEEKDAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function weekdayAverages(trains){
    const totals = {}, counts = {};
    for (const dateKey of dateKeys){
      const wd = parseKey(dateKey).getDay();
      if (wd === 0 || wd === 6) continue;
      const dayPerf = railPerfCache[dateKey];
      for (const t of trains){
        const perf = dayPerf[t.key];
        if (!perf || typeof perf.delayMinutes !== 'number') continue;
        totals[wd] = (totals[wd] || 0) + Math.max(0, perf.delayMinutes);
        counts[wd] = (counts[wd] || 0) + 1;
      }
    }
    return [1, 2, 3, 4, 5]
      .filter(wd => counts[wd] > 0)
      .map(wd => ({ wd, day: WEEKDAY_NAMES[wd], avg: totals[wd] / counts[wd], trains }))
      .sort((a, b) => b.avg - a.avg);
  }
  // Same clamp/exclude treatment, narrowed to one specific train and
  // weekday — what a row's detail expands into.
  function trainAverageForWeekday(train, wd){
    let total = 0, count = 0;
    for (const dateKey of dateKeys){
      if (parseKey(dateKey).getDay() !== wd) continue;
      const perf = (railPerfCache[dateKey] || {})[train.key];
      if (!perf || typeof perf.delayMinutes !== 'number') continue;
      total += Math.max(0, perf.delayMinutes);
      count++;
    }
    return count > 0 ? total / count : null;
  }
  const amByWeekday = amTrains.length ? weekdayAverages(amTrains) : [];
  const pmByWeekday = pmTrains.length ? weekdayAverages(pmTrains) : [];
  function weekdayRowsHtml(rows){
    if (rows.length === 0) return `<div class="sub" style="margin:0;">Not enough data yet.</div>`;
    const maxAvg = Math.max(...rows.map(r => r.avg), 0.1); // guard against div-by-zero when every average is 0
    return rows.map(r => {
      const detailRows = r.trains.map(t => {
        const a = trainAverageForWeekday(t, r.wd);
        return `<div class="perf-stats-weekday-detail-row"><span class="train-label">${escapeHtml(t.label)}</span><span>${a === null ? '—' : `${a.toFixed(1)}m`}</span></div>`;
      }).join('');
      return `
        <div class="perf-stats-weekday-row">
          <div class="perf-stats-weekday-name">${r.day}</div>
          <div class="perf-stats-weekday-bar-track"><div class="perf-stats-weekday-bar-fill" style="width:${Math.max(4, (r.avg / maxAvg) * 100)}%;"></div></div>
          <div class="perf-stats-weekday-value">${r.avg.toFixed(1)}m</div>
          <div class="perf-stats-weekday-chevron">&#8250;</div>
        </div>
        <div class="perf-stats-weekday-detail" hidden>${detailRows}</div>`;
    }).join('');
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-overlay-full';
  overlay.style.alignItems = 'stretch';
  overlay.innerHTML = `
    <div class="modal" style="display:flex; flex-direction:column; padding:0 0 calc(72px + env(safe-area-inset-bottom)) 0; border-radius:0; overflow:hidden;">
      <div style="padding:20px 18px 10px; flex-shrink:0;">
        <h3>Performance statistics</h3>
        <div class="sub" style="margin-bottom:0;">Based on the history currently backfilled below.</div>
      </div>
      <div style="flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch;">
        <div class="perf-stats-section">
          <h4>Worst days — morning</h4>
          ${weekdayRowsHtml(amByWeekday)}
        </div>
        <div class="perf-stats-section">
          <h4>Worst days — evening</h4>
          ${weekdayRowsHtml(pmByWeekday)}
        </div>
        <div class="perf-stats-section">
          <h4>Most common delay reasons</h4>
          ${topDelayReasons.length ? topDelayReasons.map(reasonRowHtml).join('') : `<div class="sub" style="margin:0;">No delay reasons recorded yet.</div>`}
        </div>
        ${topCancelReasons.length ? `
        <div class="perf-stats-section">
          <h4>Most common cancellation reasons</h4>
          ${topCancelReasons.map(reasonRowHtml).join('')}
        </div>` : ''}
      </div>
      <div class="modal-close" id="perf-stats-close-btn" style="margin:10px 18px; background:var(--board-2); border:1px solid var(--line); border-radius:10px; padding:10px; flex-shrink:0;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Each weekday row toggles the detail block immediately following it
  // (its next sibling in the DOM — see weekdayRowsHtml, which always
  // emits them as a pair) — no per-row click handler wiring needed
  // beyond a single delegated-by-class loop, and no ids to keep in sync
  // between the two.
  overlay.querySelectorAll('.perf-stats-weekday-row').forEach(row => {
    row.addEventListener('click', () => {
      const detail = row.nextElementSibling;
      if (!detail || !detail.classList.contains('perf-stats-weekday-detail')) return;
      const isHidden = detail.hasAttribute('hidden');
      if (isHidden) detail.removeAttribute('hidden'); else detail.setAttribute('hidden', '');
      row.classList.toggle('expanded', isHidden);
    });
  });

  overlay.querySelector('#perf-stats-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
}

function openCalendarView(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay cal-overlay';
  overlay.innerHTML = `
    <div class="modal cal-modal">
      <div class="cal-nav">
        <div class="cal-nav-btn" id="cal-prev">&#8249;</div>
        <div class="cal-nav-title" id="cal-title"></div>
        <div class="cal-nav-btn" id="cal-next">&#8250;</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="modal-close" id="cal-close-btn" style="margin-top:16px;">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  const realToday = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const todayKeyLocal = fmtKey(realToday);
  let viewYear = realToday.getFullYear();
  let viewMonth = realToday.getMonth(); // 0-indexed

  const weekdayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function drawMonth(){
    const title = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    document.getElementById('cal-title').textContent = title;

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    // Monday-first offset: JS getDay() is 0=Sun..6=Sat, shift so Mon=0..Sun=6
    const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;

    let cells = weekdayLabels.map(w => `<div class="cal-weekday">${w}</div>`).join('');
    for (let i = 0; i < leadingBlanks; i++){
      cells += `<div class="cal-day empty"></div>`;
    }
    for (let day = 1; day <= daysInMonth; day++){
      const d = new Date(viewYear, viewMonth, day);
      const key = fmtKey(d);
      const weekend = isWeekend(d);
      const isToday = key === todayKeyLocal;
      const hasEntry = !!(comments[key] || '').trim();
      let delayStatus = null;
      if (isEligibleRailDay(d, todayKeyLocal)){
        delayStatus = getDelayStatus(key);
      }
      const delayDotHtml = delayStatus === 'confirmed' ? '<span class="cal-dot-confirmed"></span>'
        : delayStatus === 'maybe' ? '<span class="cal-dot-delay"></span>'
        : '';
      const dots = (hasEntry || delayStatus)
        ? `<span class="cal-dot-row">${hasEntry ? '<span class="cal-dot"></span>' : ''}${delayDotHtml}</span>`
        : '';
      cells += `<div class="cal-day ${weekend ? 'weekend' : ''} ${isToday ? 'today' : ''}" data-key="${key}">
        <span>${day}</span>${dots}
      </div>`;
    }
    document.getElementById('cal-grid').innerHTML = cells;

    document.querySelectorAll('#cal-grid .cal-day[data-key]').forEach(cell => {
      cell.style.cursor = 'pointer';
      cell.addEventListener('click', () => openCalendarDayDetail(cell.dataset.key));
    });
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    viewMonth -= 1;
    if (viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
    drawMonth();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    viewMonth += 1;
    if (viewMonth > 11){ viewMonth = 0; viewYear += 1; }
    drawMonth();
  });
  document.getElementById('cal-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });

  drawMonth();
}

  overlay.innerHTML = `

      <label style="display:block; font-size:13px; color:var(--ink-dim); margin:16px 0 6px;">Or bulk-import as JSON</label>
      <textarea id="purchases-import-textarea" rows="4" style="width:100%; background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:'Courier New',monospace; font-size:13px; margin-bottom:8px;" placeholder='[{"date":"2026-01-13","cost":153.60}, ...]'></textarea>
      <div id="purchases-import-status" style="font-size:13px; color:var(--ink-dim); margin-bottom:10px;"></div>
      <button class="save-btn" id="purchases-import-btn">Import list</button>

      <div class="modal-close" id="purchases-close-btn">Close</div>
    </div>
  `;
  document.body.appendChild(overlay);

  function refreshList(){
    document.getElementById('purchases-list').innerHTML = buildListHtml();
    overlay.querySelectorAll('[data-del-date]').forEach(el => {
      el.addEventListener('click', async () => {
        const delType = el.dataset.delType === 'single' ? 'single' : undefined;
        purchases = purchases.filter(p => !(p.date === el.dataset.delDate && (p.type || undefined) === delType));
        await savePurchases();
        refreshList();
        render();
      });
    });
  }
  refreshList();

  document.getElementById('backfill-add-btn').addEventListener('click', async () => {
    const dateVal = document.getElementById('backfill-date-input').value;
    const costVal = parseFloat(document.getElementById('backfill-cost-input').value);
    if (dateVal && !isNaN(costVal) && costVal >= 0){
      purchases = purchases.filter(p => !(p.date === dateVal && (p.type || undefined) !== 'single'));
      purchases.push({ date: dateVal, cost: costVal });
      purchases.sort((a, b) => a.date < b.date ? -1 : 1);
      await savePurchases();
      document.getElementById('backfill-date-input').value = '';
      refreshList();
      render();
    }
  });

  document.getElementById('purchases-import-btn').addEventListener('click', async () => {
    const raw = document.getElementById('purchases-import-textarea').value.trim();
    const status = document.getElementById('purchases-import-status');
    if (!raw){ status.textContent = 'Paste some JSON first.'; return; }
    let parsed;
    try{ parsed = JSON.parse(raw); }
    catch(e){ status.textContent = 'That is not valid JSON.'; return; }
    if (!Array.isArray(parsed)){ status.textContent = 'Expected a JSON array of {date, cost} entries.'; return; }
    let added = 0;
    for (const entry of parsed){
      if (entry && typeof entry.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(entry.date) && typeof entry.cost === 'number'){
        purchases = purchases.filter(p => p.date !== entry.date);
        purchases.push({ date: entry.date, cost: entry.cost });
        added++;
      }
    }
    purchases.sort((a, b) => a.date < b.date ? -1 : 1);
    if (added > 0){
      lastKnownPrice = purchases[purchases.length - 1].cost;
      await savePurchases();
      await saveLastKnownPrice();
    }
    status.textContent = `Imported ${added} purchase${added===1?'':'s'}.`;
    refreshList();
    render();
  });

  document.getElementById('purchases-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

// Stats registry — each entry is self-contained: an id, a section it
// belongs to, and a compute() function returning a display string. New
// features should add their own entry here rather than the stats screen
// itself needing to change shape as the app grows.
const STAT_DEFINITIONS = [
  {
    id: 'lifetime-spent', section: 'Tickets', label: 'Total spent (all time)',
    compute: () => `£${purchases.reduce((sum, p) => sum + p.cost, 0).toFixed(2)}`
  },
  {
    id: 'tickets-bought', section: 'Tickets', label: 'Tickets bought',
    compute: () => String(purchases.length)
  },
  {
    id: 'avg-ticket-cost', section: 'Tickets', label: 'Average ticket cost',
    compute: () => purchases.length ? `£${(purchases.reduce((s,p)=>s+p.cost,0)/purchases.length).toFixed(2)}` : '—'
  },
  {
    id: 'ticket-wastage', section: 'Tickets', label: 'Average unused journeys per ticket',
    compute: () => {
      if (purchases.length < 2) return 'Not enough history yet';
      const sorted = purchases.filter(p => (p.type || undefined) !== 'single').sort((a,b) => a.date < b.date ? -1 : 1);
      const todayKeyLocal = fmtKey(new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate()));
      let totalUnused = 0, periodsCounted = 0;
      for (let i = 0; i < sorted.length - 1; i++){
        const start = sorted[i].date;
        const nextStart = sorted[i+1].date;
        const gapDays = Math.round((parseKey(nextStart) - parseKey(start)) / 86400000);
        const windowLen = Math.min(28, gapDays);
        if (nextStart > todayKeyLocal) continue; // period not fully elapsed yet
        const used = Math.min(8, estimateTravelDaysInWindow(start, windowLen));
        totalUnused += Math.max(0, 8 - used);
        periodsCounted++;
      }
      if (periodsCounted === 0) return 'Not enough history yet';
      return (totalUnused / periodsCounted).toFixed(1);
    }
  },
  {
    id: 'wfh-days', section: 'Working patterns', label: 'WFH days logged (all time)',
    compute: () => String(Object.values(comments).filter(c => (c||'').trim().toUpperCase() === 'WFH').length)
  },
  {
    id: 'holiday-days', section: 'Working patterns', label: 'Holiday days logged (all time)',
    compute: () => String(Object.values(comments).filter(c => (c||'').trim().toUpperCase() === 'HOLIDAY').length)
  },
  {
    id: 'bank-holidays', section: 'Working patterns', label: 'Bank holidays auto-tagged',
    compute: () => String(Object.values(comments).filter(c => (c||'').trim().toUpperCase() === 'BANK HOLIDAY').length)
  },
  {
    id: 'delay-days', section: 'Delay repay', label: 'Possible claim days found',
    compute: () => {
      let count = 0;
      for (const date in railPerfCache){
        const dayPerf = railPerfCache[date];
        if (railTrains.some(t => dayPerf[t.key] && dayPerf[t.key].delayMinutes >= DELAY_REPAY_THRESHOLD_MINUTES)) count++;
      }
      return String(count);
    }
  },
  {
    id: 'worst-delay', section: 'Delay repay', label: 'Worst single delay recorded',
    compute: () => {
      let worst = 0;
      for (const date in railPerfCache){
        for (const trainKey in railPerfCache[date]){
          const dm = railPerfCache[date][trainKey].delayMinutes;
          if (dm > worst) worst = dm;
        }
      }
      return worst > 0 ? `${worst} minutes` : 'None recorded yet';
    }
  },
  {
    id: 'delay-repay-total', section: 'Delay repay', label: 'Claimed total (started + confirmed)',
    compute: () => {
      let total = 0;
      for (const date in delayClaims){
        for (const dir in delayClaims[date]){
          total += delayClaims[date][dir].amount || 0;
        }
      }
      return `£${total.toFixed(2)}`;
    }
  },
  {
    id: 'delay-repay-confirmed', section: 'Delay repay', label: 'Confirmed & paid total',
    compute: () => {
      let total = 0;
      for (const date in delayClaims){
        for (const dir in delayClaims[date]){
          if (delayClaims[date][dir].status === 'confirmed') total += delayClaims[date][dir].amount || 0;
        }
      }
      return `£${total.toFixed(2)}`;
    }
  },
];

function estimateTravelDaysInWindow(startDateStr, windowLength){
  const start = parseKey(startDateStr);
  let count = 0;
  for (let i = 0; i < windowLength; i++){
    const d = addDays(start, i);
    if (isWeekend(d)) continue;
    const key = fmtKey(d);
    const comment = (comments[key] || '').trim();
    if (comment === '' || travelOverrides[key]) count++;
  }
  return count;
}

// Once-a-year live price check (see backlog discussion): only ever
// called on the first Buy screen open on/after the current year's first
// Sunday of March, and only once that year hasn't already been checked
// — so the "no longer instant" network cost lands only at the one
// moment it's actually worth paying for it. Returns the two prices in
// pounds (converting from the Worker's pence figures) or throws.
async function fetchFaresUpdate(){
  const resp = await fetch(FARES_WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ orig: FARE_CHECK_ORIG, dest: FARE_CHECK_DEST })
  });
  if (!resp.ok) throw new Error(`Fares request failed: ${resp.status}`);
  const data = await resp.json();
  if (!data.ok) throw new Error(data.reason || 'Fares API returned no usable price');
  return {
    seasonPrice: data.season.pricePence / 100,
    dayReturnPrice: data.dayReturn.pricePence / 100,
  };
}

function openBuyScreen(defaultType){
  const today = new Date(state.today.getFullYear(), state.today.getMonth(), state.today.getDate());
  const suggested = fmtKey(addDays(today, 1));

  // Work out the recommendation up front, using the default suggested
  // date/price, so the screen can open on whichever tab it actually
  // recommends — unless the caller explicitly asked for a specific tab
  // (e.g. the renewal banner asking for 'season' directly), in which
  // case that explicit intent wins over the suggestion.
  function computeAdvisorInfo(startDate, cost){
    const estDays = estimateTravelDaysInWindow(startDate, 28);
    const singlesCost = estDays * dayReturnPrice;
    return { estDays, singlesCost, recommendSingles: singlesCost < cost && estDays < 8 };
  }
  const initialInfo = computeAdvisorInfo(suggested, lastKnownPrice);
  let buyType = defaultType || (initialInfo.recommendSingles ? 'single' : 'season');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `

      <div id="fare-update-banner" style="display:none; font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px; background:rgba(90,140,224,0.12); border:1px solid rgba(90,140,224,0.35);">

        <div style="display:flex; gap:8px;">
          <div class="chip" id="fare-update-accept" style="flex:1; text-align:center;">Use these prices</div>
          <div class="chip" id="fare-update-decline" style="flex:1; text-align:center;">Keep mine</div>
        </div>
      </div>

      <div id="buy-season-fields" style="${buyType==='season'?'':'display:none;'}">
        <div class="sub" style="margin-top:0;">Every time you buy a new ticket, set the date it starts. Your 8 uses and 28-day window will be tracked fresh from that date.</div>
        <label style="display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px;">Start date</label>
        <input type="date" id="season-date-input" value="${suggested}" style="margin-bottom:12px;" />
        <label style="display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px;">Cost of this ticket (£)</label>
        <input type="number" id="season-cost-input" value="${lastKnownPrice.toFixed(2)}" step="0.01" min="0" style="margin-bottom:12px;" />
      </div>

      <div id="buy-single-fields" style="${buyType==='single'?'':'display:none;'}">
        <div class="sub" style="margin-top:0;">For a day return bought instead of using your season ticket — doesn't affect your 8-use/28-day tracking, just logs the cost and marks that day as covered.</div>

  `;
  document.body.appendChild(overlay);

  // Always reflects the season-vs-singles comparison, regardless of which

  // answering "which of these two should I be doing", not a season-only
  // detail. Reads from the season fields even while that block is hidden;
  // the inputs still exist in the DOM and keep their values.
  function updateAdvisor(){
    const startVal = document.getElementById('season-date-input').value;

    const note = document.getElementById('advisor-note');
    if (!startVal || isNaN(costVal)){ note.style.display = 'none'; return; }

    }
  }

  function switchType(newType){
    buyType = newType;
    overlay.querySelectorAll('[data-buy-type]').forEach(chip => {
      chip.classList.toggle('active', chip.dataset.buyType === buyType);
    });
    document.getElementById('buy-season-fields').style.display = buyType === 'season' ? '' : 'none';
    document.getElementById('buy-single-fields').style.display = buyType === 'single' ? '' : 'none';
    document.getElementById('buy-save-btn').textContent = buyType === 'season' ? 'Set as new ticket start' : 'Log this ticket';
  }

  overlay.querySelectorAll('[data-buy-type]').forEach(chip => {
    chip.addEventListener('click', () => { switchType(chip.dataset.buyType); updateAdvisor(); });
  });

  document.getElementById('season-date-input').addEventListener('change', updateAdvisor);
  document.getElementById('season-cost-input').addEventListener('input', updateAdvisor);
  updateAdvisor();

  // Once-a-year live price check — see fetchFaresUpdate() above. Fires
  // in the background; the screen itself has already opened instantly
  // either way, so there's nothing to wait on here.
  if (shouldFetchFreshFares(today)){
    fetchFaresUpdate().then(({ seasonPrice, dayReturnPrice: freshDayReturnPrice }) => {
      if (!overlay.isConnected) return; // screen closed before this resolved
      // A successful check — regardless of whether the person ends up
      // accepting the new figures — is what "checked" means here, so
      // this year won't be re-queried on the next Buy screen open.
      fareCheckedYear = today.getFullYear();
      saveFareCheckedYear();
      const seasonChanged = Math.abs(seasonPrice - lastKnownPrice) >= 0.005;
      const dayReturnChanged = Math.abs(freshDayReturnPrice - dayReturnPrice) >= 0.005;
      if (!seasonChanged && !dayReturnChanged) return; // nothing to surface
      const banner = document.getElementById('fare-update-banner');
      document.getElementById('fare-update-text').innerHTML =
        `This year's regulated fares are in. Season ticket: £${seasonPrice.toFixed(2)}` +
        `${seasonChanged ? ` (currently £${lastKnownPrice.toFixed(2)})` : ''}` +
        ` · Day return: £${freshDayReturnPrice.toFixed(2)}` +
        `${dayReturnChanged ? ` (currently £${dayReturnPrice.toFixed(2)})` : ''}. Use the new prices?`;
      banner.style.display = 'block';
      document.getElementById('fare-update-accept').addEventListener('click', () => {
        document.getElementById('season-cost-input').value = seasonPrice.toFixed(2);
        document.getElementById('single-cost-input').value = freshDayReturnPrice.toFixed(2);
        banner.style.display = 'none';
        updateAdvisor();
      });
      document.getElementById('fare-update-decline').addEventListener('click', () => {
        banner.style.display = 'none';
      });
    }).catch(e => {
      // Left unchecked so the next Buy screen open tries again — a
      // transient network failure shouldn't leave this year's price
      // check permanently skipped. Logged rather than surfaced; the
      // screen still works exactly as it always has either way.
      console.error(`Fares update check failed: ${e.message}`);
    });
  }

  document.getElementById('buy-save-btn').addEventListener('click', async () => {
    if (buyType === 'season'){
      const val = document.getElementById('season-date-input').value;
      const costVal = parseFloat(document.getElementById('season-cost-input').value);
      if (!val) return;
      periodStart = val;
      await savePeriodStart();
      if (!isNaN(costVal) && costVal >= 0){
        purchases = purchases.filter(p => !(p.date === val && (p.type || undefined) !== 'single'));
        purchases.push({ date: val, cost: costVal });
        purchases.sort((a, b) => a.date < b.date ? -1 : 1);
        lastKnownPrice = costVal;
        await savePurchases();
        await saveLastKnownPrice();
      }
    } else {
      const dateVal = document.getElementById('single-date-input').value;
      const costVal = parseFloat(document.getElementById('single-cost-input').value);
      if (!dateVal || isNaN(costVal) || costVal < 0) return;
      purchases = purchases.filter(p => !(p.date === dateVal && p.type === 'single'));
      purchases.push({ date: dateVal, cost: costVal, type: 'single' });
      purchases.sort((a, b) => a.date < b.date ? -1 : 1);
      dayReturnPrice = costVal;
      await savePurchases();
      await saveDayReturnPrice();
    }
    document.body.removeChild(overlay);
    state.activeTab = 'today';
    render();
  });
  document.getElementById('buy-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

function openImportHistory(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Bulk import comments</h3>
      <div class="sub">Paste a JSON object of date → comment entries — WFH, holidays, or anything else — e.g. from an old spreadsheet export. Existing entries for the same date are kept as-is; only blank dates get filled in.</div>
      <textarea id="import-textarea" rows="8" style="width:100%; background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:'Courier New',monospace; font-size:13px; margin-bottom:12px;" placeholder='{"2025-09-26": "WFH", "2025-11-10": "HOLIDAY"}'></textarea>
      <div id="import-status" style="font-size:13px; color:var(--ink-dim); margin-bottom:10px;"></div>
      <button class="save-btn" id="import-save-btn">Import</button>
      <div class="modal-close" id="import-close-btn">Cancel</div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('import-save-btn').addEventListener('click', async () => {
    const raw = document.getElementById('import-textarea').value.trim();
    const status = document.getElementById('import-status');
    if (!raw){
      status.textContent = 'Paste some JSON first.';
      status.style.color = 'var(--danger)';
      return;
    }
    let parsed;
    try{
      parsed = JSON.parse(raw);
    }catch(e){
      status.textContent = 'That is not valid JSON — check for missing quotes or commas.';
      status.style.color = 'var(--danger)';
      return;
    }
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)){
      status.textContent = 'Expected a JSON object of "YYYY-MM-DD": "comment" pairs.';
      status.style.color = 'var(--danger)';
      return;
    }
    let added = 0;
    for (const key in parsed){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
      if (!comments[key]){
        comments[key] = String(parsed[key]);
        added++;
      }
    }
    await saveComments();
    document.body.removeChild(overlay);
    render();
  });

  document.getElementById('import-close-btn').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) document.body.removeChild(overlay); });
}

// ---- Silent-confirm banner ----
// Lives entirely outside the normal render() cycle, as its own
// fixed-position element appended once at startup — render() rebuilds
// #app wholesale on every call, and this needs to stay visible and
// stable across that (including while a full-screen modal like train
// progress is open), not get wiped out and rebuilt with it. Mounted
// once in init(); after that, only mountSilentConfirmBanner()'s own
// dismiss handler and renderSilentConfirmBanner() (called whenever
// silentConfirmBanner changes) ever touch it again.
function mountSilentConfirmBanner(){
  const el = document.createElement('div');
  el.id = 'silent-confirm-banner';
  el.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:200; display:none; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); background:rgba(111,191,138,0.92); color:#0f2a1a; font-size:13.5px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,0.25);';
  el.innerHTML = `
    <span id="silent-confirm-banner-text"></span>
    <span id="silent-confirm-banner-dismiss" style="cursor:pointer; font-weight:800; font-size:16px; line-height:1; padding:6px 8px; margin:-6px -6px -6px 0; -webkit-user-select:none; user-select:none; touch-action:manipulation;">×</span>
  `;
  document.body.appendChild(el);
  document.getElementById('silent-confirm-banner-dismiss').addEventListener('click', () => {
    silentConfirmBanner = null;
    saveSilentConfirmBanner();
    renderSilentConfirmBanner();
  });
  renderSilentConfirmBanner(); // reflect whatever was loaded from storage
}
function renderSilentConfirmBanner(){
  const el = document.getElementById('silent-confirm-banner');
  const textEl = document.getElementById('silent-confirm-banner-text');
  if (!el || !textEl) return;
  if (silentConfirmBanner){
    textEl.textContent = `Confirmed: your usual ${silentConfirmBanner.label}`;
    el.style.display = 'flex';
  } else {
    el.style.display = 'none';
  }
}

// One-off transient toast, e.g. for showing a decoded delay reason after
// tapping a delay cell. Stacks harmlessly if called again before the
// previous one has faded — each call owns its own element and timer —
// though callers should generally avoid firing several in a row.
let toastDismissTimer = null;
function showToast(text){
  const existing = document.getElementById('app-toast');
  if (existing){
    existing.remove();
    if (toastDismissTimer){ clearTimeout(toastDismissTimer); toastDismissTimer = null; }
  }
  const el = document.createElement('div');
  el.id = 'app-toast';
  el.className = 'app-toast';
  el.textContent = text;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('visible'));
  const dismiss = () => {
    el.classList.remove('visible');
    setTimeout(() => { if (el.isConnected) el.remove(); }, 200);
  };
  el.addEventListener('click', dismiss, { once: true });
  toastDismissTimer = setTimeout(dismiss, 4500);
}

(async function init(){
  await loadData();
  render();
  mountSilentConfirmBanner();

  // Check for bank holidays after the initial render so startup isn't
  // delayed by a network call. Re-render only if new dates were filled in.
  syncBankHolidays().then((changed) => { if (changed) render(); });
  railSyncMissingDates();
  ensureReasonCodes();

  // Backgrounding (switching away, locking the phone, or closing) is a
  // far more reliable signal on mobile than "unload" events, which the OS
  // can skip entirely when killing an app's process. This is the one
  // moment a Drive backup gets attempted — see attemptDriveBackup() for
  // the dirty-flag and throttle checks that decide whether it actually does anything.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden'){
      attemptDriveBackup();
      stopLikelyTrainChecks(); // no point polling while backgrounded — nothing can act on it anyway
    } else {
      startLikelyTrainChecks();
    }
  });
  startLikelyTrainChecks();
})();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      /* offline support just won't be available; app still works online */
    });
  });
}
</script>
